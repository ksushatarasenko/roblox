id: 5
title: "🧩 МОДУЛЬ 5: Интерфейс игры (UI)"
description: "Ребёнок научится делать экранные кнопки, меню, надписи, подсказки и игровой HUD. Это важный шаг к созданию красивой, удобной и настоящей игры."

lessons:

# ============================================================
# Урок 48. Что такое интерфейс и зачем он нужен
# ============================================================
  - id: 48
    title: "⭐ УРОК 48 — Что такое интерфейс и зачем он нужен"
    shortDescription: "Разбираемся, что такое интерфейс (UI), зачем он нужен и какие виды интерфейса бывают в играх."
    

    content:

      - type: "text"
        text: |
          Представь игру, которая ничего тебе не говорит.<br><br>

          ❌ нет кнопки «Играть»  <br>
          ❌ нет подсказок  <br>
          ❌ ты не знаешь, сколько у тебя здоровья  <br>
          ❌ непонятно, что происходит  <br><br>

          Даже самая красивая игра станет неудобной 😕<br><br>

          👉 Чтобы этого не было, в играх существует **интерфейс**.
      
      - type: "text"
        text: |
          <b>Интерфейс</b> — это <em>👉 способ общения между двумя сторонами.</em>
          <ul>
            <li>🔌 розетка — интерфейс между электричеством и прибором</li>
            <li>🎮 геймпад — интерфейс между игроком и игрой</li>
            <li>🖱️ мышка и экран — интерфейс между человеком и компьютером</li>
          </ul>
          <h5>🖥️ А теперь UI</h5>
          <b>UI</b> = <em>User Interface</em><br>
          <b>User</b> — пользователь (игрок)<br>
          <b>Interface</b> — интерфейс (способ общения)<br><br>

          <b>👉 UI = интерфейс пользователя</b><br><br>

          UI — это <b>всё, через что ИГРОК общается с игрой.</b>


      - type: "note"
        text: |
          🧠 Интерфейс (UI) — это способ, которым игра **разговаривает с игроком**.<br>

          Интерфейс не живёт в мире, он живёт на экране.
      
      - type: "text"
        title: "❓ Что такое интерфейс?"
        text: |
          Интерфейс — это всё, что ты видишь НА ЭКРАНЕ,
          а не в игровом мире.<br>

          Это не кубики и не персонажи, а элементы, которые помогают тебе играть.
      
      - type: "text"
        title: "🧩 Основные элементы интерфейса"
        text: |
          В играх Roblox чаще всего используются:<br><br>

          🎯 HUD — информация во время игры  <br>
          📋 Меню — начало и настройки  <br>
          💡 Подсказки — помощь игроку  <br>
          🔔 Уведомления — сообщения от игры  
      
      - type: "text"
        title: "🎯 HUD (игровая панель)"
        text: |
          HUD — это то, что игрок видит ВСЕГДА, пока играет.<br><br>

          Примеры HUD:<br>
          ❤️ здоровье  <br>
          🪙 монеты  <br>
          ⏱️ таймер  <br>
          🧭 подсказка задания  <br><br>

          👉 HUD помогает игроку понимать,<br>
          **что с ним происходит прямо сейчас**.
      - type: "oneImage"
        title: "🎯 HUD (игровая панель)"
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module5/lesson48-50/HUD%20%E2%80%94%20%D0%B8%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D1%8F%20%D0%B2%D0%BE%20%D0%B2%D1%80%D0%B5%D0%BC%D1%8F%20%D0%B8%D0%B3%D1%80%D1%8B.png?raw=true"
            width: 100%
            maxWidth: "100%"
            align: center
      
      
      - type: "oneImage"
        title: "📋 Меню"
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module5/lesson48-50/%D0%9C%D0%B5%D0%BD%D1%8E.png?raw=true"
            width: 100%
            maxWidth: "100%"
            align: center

      
      - type: "oneImage"
        title: "💡 Подсказки"
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module5/lesson48-50/%D0%9F%D0%BE%D0%B4%D1%81%D0%BA%D0%B0%D0%B7%D0%BA%D0%B8.png?raw=true"
            width: 100%
            maxWidth: "100%"
            align: center
      
      
      - type: "oneImage"
        title: "🔔 Уведомления"
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module5/lesson48-50/%D0%A3%D0%B2%D0%B5%D0%B4%D0%BE%D0%BC%D0%BB%D0%B5%D0%BD%D0%B8%D1%8F.png?raw=true"
            width: 100%
            maxWidth: "100%"
            align: center
      
      - type: "note"
        text: |
          🧠 Интерфейс — это не украшение.<br><br>

          Он нужен, чтобы:<br>
          ✅ объяснять правила  <br>
          ✅ подсказывать игроку  <br>
          ✅ показывать результат действий <br> 
          ✅ делать игру удобной 
      
      - type: "text"
        title: "🧪 Мини-практика: подумай как гейм-дизайнер"
        text: |
          Представь свою игру и ответь:<br><br>

          1️⃣ Что игрок должен видеть ВСЕГДА? (HUD)  <br>
          2️⃣ Что он должен увидеть в начале игры? (Меню) <br> 
          3️⃣ Какие подсказки помогут ему не потеряться?  <br>
          4️⃣ Какие уведомления скажут, что он молодец?  <br><br>

          ✏️ Можно просто проговорить или записать идеи.

    quiz:
      - question: "Что такое интерфейс (UI) в игре?"
        answers:
          - "Украшения и красивые цвета"
          - "Способ, которым игра разговаривает с игроком"
          - "Только кнопки на экране"
        correct: 1

      - question: "Что из этого относится к интерфейсу, а не к игровому миру?"
        answers:
          - "Платформы Obby"
          - "Персонаж игрока"
          - "Полоска здоровья и счётчик монет"
        correct: 2

      - question: "Что такое HUD?"
        answers:
          - "Меню в начале игры"
          - "Информация, которую игрок видит во время игры"
          - "Секретная комната"
        correct: 1

      - question: "Зачем в игре нужны подсказки?"
        answers:
          - "Чтобы усложнить игру"
          - "Чтобы игра помогала игроку понять, что делать"
          - "Только для красоты"
        correct: 1

      - question: "Когда чаще всего появляются уведомления?"
        answers:
          - "Постоянно, даже без событий"
          - "Когда в игре что-то произошло"
          - "Только в меню"
        correct: 1

    
    end:
      - type: "text"
        title: "🎉 Итог урока"
        text: |
          Теперь ты знаешь:<br><br>

          ✅ что такое интерфейс (UI)  <br>
          ✅ зачем он нужен в игре  <br>
          ✅ какие бывают элементы интерфейса  <br>
          ✅ чем HUD отличается от меню  <br>
          ✅ что интерфейс — это разговор игры с игроком <br><br> 

          👉 В следующем уроке мы начнём<br>
          СОЗДАВАТЬ интерфейс и выведем<br>
          первый текст на экран игрока.

# ============================================================
# Урок 49. Текст на экране (TextLabel)
# ============================================================
  - id: 49
    title: "⭐ Урок 49. Текст на экране: приветствия, подсказки и сообщения"
    shortDescription: "Учимся выводить текст на экран игрока с помощью TextLabel."


    content:

      - type: "text"
        text: |
          В прошлом уроке мы поняли: интерфейс — это язык игры.

          Сегодня мы сделаем первый шаг:<br>
          👉 **игра заговорит с игроком текстом**.<br><br>

          Мы научимся выводить:<br>
          👋 приветствие  <br>
          💡 подсказку  <br>
          ❌ сообщение об ошибке  

      - type: "text"
        title: "🧠 Что такое TextLabel?"
        text: |
          TextLabel — это элемент интерфейса, который показывает текст на экране игрока.<br><br>

          Он:<br>
          ✅ не находится в мире  <br>
          ✅ всегда на экране  <br>
          ✅ виден только игроку  <br><br>

          👉 TextLabel — это «голос» игры.


      
      - type: "oneImage"
        title: "TextLabel"
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module5/lesson48-50/TextLabel.png?raw=true"
            width: 100%
            maxWidth: "100%"
            align: center


      - type: "text"
        title: "🧱 Шаг 1. Создаём текст на экране"
        text:
          - "1. Открой Player → StarterGui"
          - "2. Добавь ScreenGui"
          - "3. Внутрь ScreenGui добавь TextLabel"
          - "4. Измени текст (Text)"
          - "5. Увеличь размер (TextScaled = true)"

      - type: "text"
        title: "👋 Приветствие"
        text: |
          Первое, что может сказать игра:<br>

          💬 «Добро пожаловать!»<br><br>

          Такой текст появляется,
          когда игрок заходит в игру.


      - type: "note"
        text: "✨ Идея:<br>
          Приветствие делает игру дружелюбной
          и понятной с первых секунд."

      - type: "text"
        title: "💡 Подсказка игроку"
        text: |
          Часто в играх мы видим подсказки:<br><br>

          💬 «Нажми E, чтобы открыть дверь»<br><br>

          Такие подсказки:<br>
          ✔️ помогают понять управление <br> 
          ✔️ появляются в нужный момент  
      
      - type: "note"
        text: |
          📌 Сейчас подсказка просто висит на экране.<br> 

          В следующих уроках мы научимся
          показывать и скрывать её по событиям.

      - type: "text"
        title: "❌ Сообщение об ошибке"
        text: |
          Иногда игрок делает что-то не так.<br><br>

          Например:<br>
          ❌ «Сначала найди ключ»<br>
          ❌ «Недостаточно монет»<br>

          👉 Такие сообщения объясняют,
          почему действие не сработало.
      - type: "text"
        title: "🎨 Как сделать текст красивым"
        text: |
          У TextLabel есть важные свойства:<br><br>

          🔠 Text — сам текст  <br>
          📏 Size — размер блока <br> 
          🎯 Position — где он на экране  <br>
          🎨 TextColor3 — цвет текста  <br>
          🔍 TextScaled — автоматический размер  
      
      - type: "text"
        title: "🧪 Мини-практика"
        text: |
          Попробуй сделать:<br><br>

          1️⃣ TextLabel с текстом «Привет, игрок!»  <br>
          2️⃣ Второй TextLabel с подсказкой «Нажми E» <br> 
          3️⃣ Третий TextLabel с сообщением «Ошибка!» <br><br> 

          ✨ Размести их в разных местах экрана.
      
      - type: "note"
        text: |
          TextLabel — это не просто текст.<br> <br> 

          Это:<br> 
          🗣️ сообщение от игры <br>   
          💡 помощь игроку  <br> 
          🔔 реакция на действия  

    quiz:
      - question: "Для чего в игре используется TextLabel?"
        answers:
          - "Чтобы создавать объекты в мире"
          - "Чтобы показывать текст на экране игрока"
          - "Чтобы двигать персонажа"
        correct: 1

      - question: "Где должен находиться TextLabel, чтобы он был интерфейсом?"
        answers:
          - "В Workspace"
          - "В Model персонажа"
          - "В ScreenGui внутри PlayerGui"
        correct: 2

      - question: "Какой текст лучше всего подойдёт для приветствия игрока?"
        answers:
          - "Ошибка! Доступ запрещён"
          - "Добро пожаловать в игру!"
          - "Ты проиграл"
        correct: 1

      - question: "Для чего нужны подсказки вроде «Нажми E»?"
        answers:
          - "Чтобы украсить экран"
          - "Чтобы помочь игроку понять, что делать"
          - "Чтобы усложнить игру"
        correct: 1

      - question: "Зачем игре сообщения об ошибке?"
        answers:
          - "Чтобы игрок расстроился"
          - "Чтобы объяснить, почему действие не сработало"
          - "Чтобы закрыть игру"
        correct: 1


    end:
      - type: "text"
        title: "🎉 Итог урока"
        text: |
          Теперь ты умеешь:<br><br>

          ✅ создавать TextLabel  <br>
          ✅ выводить текст на экран <br> 
          ✅ делать приветствия  <br>
          ✅ добавлять подсказки <br> 
          ✅ показывать сообщения об ошибке  <br><br>

          👉 В следующем уроке мы научимся
          делать **кнопки на экране** и
          реагировать на нажатия.

# ============================================================
# Урок 50. Кнопки и действия
# ============================================================
  - id: 50
    title: "⭐ Урок 50. Кнопки и действия: TextButton"
    shortDescription: "Учимся создавать кнопки на экране и запускать действия в игре."


    content:

      - type: "text"
        text: |
          В прошлых уроках игра уже умела говорить:<br>
          👋 приветствовать  <br>
          💡 подсказывать <br> 
          ❌ показывать ошибки  <br><br>

          Но теперь важный шаг:<br>
          👉 **игрок сможет отвечать игре**.<br><br>

          Для этого нам нужны кнопки.

      - type: "text"
        title: "🧠 Что такое TextButton?"
        text: |
          TextButton — это элемент интерфейса,
          на который игрок может нажать.<br><br>

          Он:<br>
          ✅ выглядит как кнопка  <br>
          ✅ находится на экране  <br>
          ✅ реагирует на нажатие  <br><br>

          👉 TextButton — это действие по нажатию.
      
      - type: "note"
        text: |
          Как и TextLabel, кнопка НЕ живёт в мире.<br><br>

          Правильный путь:<br>
          PlayerGui → ScreenGui → TextButton<br><br>

          📌 Всё, что внутри ScreenGui —
          это интерфейс.

      - type: "oneImage"
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module5/lesson48-50/Zielony%20przycisk%20%22%D0%98%D0%B3%D1%80%D0%B0%D1%82%D1%8C%22%20na%20tle%20gry.png?raw=true"
            width: 100%
            maxWidth: "100%"
            align: center

      - type: "text"
        title: "🧱 Шаг 1. Создание кнопки"
        text:
          - "1. Открой StarterGui"
          - "2. Добавь ScreenGui (если его ещё нет)"
          - "3. Внутрь ScreenGui добавь TextButton"
          - "4. Измени текст кнопки (Text)"
          - "5. Увеличь кнопку и включи TextScaled"

      - type: "text"
        title: "🖱️ Как игра понимает, что кнопку нажали?"
        text: |
          У кнопки есть событие:<br><br>

          👉 MouseButton1Click<br><br>

          Оно срабатывает,
          когда игрок нажимает на кнопку.
      
      - type: "code"
        title: "▶️ Кнопка «Играть»"
        text: |
          Самая популярная кнопка в играх — «Играть».<br><br>

          Когда игрок нажимает её:<br>
          ▶️ игра начинается  <br>
          ▶️ меню исчезает 
        code: |
          -- Script внутри TextButton
          local button = script.Parent

          button.MouseButton1Click:Connect(function()
              print("Игра началась!")
          end)
      - type: "hint"
        text: |
          📌 Пока мы просто выводим сообщение.<br>
          В следующих уроках кнопка будет
          включать и выключать интерфейс.

      - type: "code"
        title: "💡 Кнопка-подсказка"
        text: |
          Кнопка может показывать подсказку.<br><br>

          Например:<br>
          ℹ️ «Что делать?»  
        code: |
          button.MouseButton1Click:Connect(function()
              print("Попробуй собрать все монеты!")
          end)

      - type: "text"
        title: "❌ Кнопка с сообщением об ошибке"
        text: |
          Иногда кнопка может сказать:<br>
          ❌ «Ты ещё не готов»
        code: |
          button.MouseButton1Click:Connect(function()
              print("Сначала найди ключ!")
          end)
      
      - type: "text"
        title: "🎨 Настройка внешнего вида кнопки"
        text: |
          У TextButton есть важные свойства:<br><br>

          🔤 Text — текст кнопки  <br>
          🎨 BackgroundColor3 — цвет кнопки  <br>
          📏 Size — размер <br> 
          🎯 Position — положение  <br>
          🔍 TextScaled — масштаб текста  
      
      - type: "text"
        title: "🧪 Мини-практика"
        text: |
          Попробуй сделать:<br><br>

          1️⃣ Кнопку «Играть» <br> 
          2️⃣ Кнопку «Подсказка» <br> 
          3️⃣ Кнопку «Ошибка» <br><br> 

          И при нажатии выводи разные сообщения в Output.
      
      - type: "note"
        text: |
          Кнопка — это не украшение.<br><br>

          Это:<br>
          👉 действие игрока  <br>
          👉 сигнал для игры  <br>
          👉 начало логики  

    quiz:
      - question: "Для чего в игре используется TextButton?"
        answers:
          - "Чтобы показывать текст без действий"
          - "Чтобы игрок мог нажать и вызвать действие"
          - "Чтобы создавать объекты в мире"
        correct: 1

      - question: "Где должен находиться TextButton, чтобы быть интерфейсом?"
        answers:
          - "В Workspace"
          - "В Character игрока"
          - "В ScreenGui внутри PlayerGui"
        correct: 2

      - question: "Что происходит, когда игрок нажимает на кнопку?"
        answers:
          - "Игра закрывается"
          - "Срабатывает событие нажатия"
          - "Персонаж автоматически прыгает"
        correct: 1

      - question: "Какое действие чаще всего выполняет кнопка «Играть»?"
        answers:
          - "Показывает ошибку"
          - "Начинает игру или закрывает меню"
          - "Удаляет персонажа"
        correct: 1

      - question: "Почему кнопки важны для игры?"
        answers:
          - "Только для красоты"
          - "Они позволяют игроку управлять игрой"
          - "Они нужны только разработчику"
        correct: 1
 

    end:
      - type: "text"
        title: "🎉 Итог урока"
        text: |
          Теперь ты умеешь:<br><br>

          ✅ создавать TextButton  <br>
          ✅ понимать, как работает нажатие  <br>
          ✅ запускать действия по кнопке <br> 
          ✅ управлять интерфейсом  <br><br>

          👉 В следующем уроке мы создадим
          **настоящее стартовое меню игры**.
       
# ============================================================
# ⭐ УРОК 51 — Стартовое меню игры
# ============================================================
  - id: 51
    title: "⭐ Урок 51. Стартовое меню: Play и Exit"
    shortDescription: "Создаём стартовое меню игры: кнопка Play, кнопка Exit и управление интерфейсом."

    content:
      - type: "text"
        text: |
          Почти в каждой игре есть момент,
          когда она ещё НЕ началась.<br><br>

          На экране:<br>
          ▶️ кнопка «Играть»  <br>
          ❌ кнопка «Выход»<br><br>  

          Это и есть **стартовое меню**.<br>

          Сегодня мы сделаем своё первое
          настоящее меню игры.

      - type: "note"
        text: |
          Стартовое меню нужно, чтобы:<br>

          ✅ игрок понял, что это за игра<br>  
          ✅ начал игру, когда готов<br>  
          ✅ мог закрыть меню  <br>
          ✅ чувствовал контроль  
      
      - type: "text"
        title: "🧩 Элементы стартового меню"
        text: |
          Наше меню будет состоять из:<br>

          🖼️ ScreenGui — контейнер интерфейса  <br>
          🏷️ TextLabel — название игры  <br>
          ▶️ TextButton — кнопка Play <br> 
          ❌ TextButton — кнопка Exit  
      
      - type: "text"
        title: "🧱 Шаг 1. Создание меню"
        text:
          - "1. Открой StarterGui"
          - "2. Добавь ScreenGui → назови MenuGui"
          - "3. Добавь TextLabel (название игры)"
          - "4. Добавь кнопку Play"
          - "5. Добавь кнопку Exit"
      
      - type: "code"
        title: "▶️ Кнопка Play"
        text: |
          Когда игрок нажимает Play:<br><br>

          ▶️ меню исчезает  <br>
          ▶️ игра начинается <br><br> 

          Самый простой способ —
          **выключить интерфейс меню**.
        code: |
          -- Script внутри кнопки Play
          local button = script.Parent
          local menu = button.Parent.Parent  -- MenuGui

          button.MouseButton1Click:Connect(function()
              menu.Enabled = false
              print("Игра началась")
          end)
      
      - type: "code"
        title: "❌ Кнопка Exit / Close"
        text: |
          Кнопка Exit может:<br><br>

          ❌ закрывать меню  <br>
          ❌ скрывать интерфейс  <br>
          ❌ или просто говорить «Пока!» <br><br> 

          В Roblox нельзя закрыть игру,
          но можно закрыть меню.
        code: |
          -- Script внутри кнопки Exit
          local button = script.Parent
          local menu = button.Parent.Parent

          button.MouseButton1Click:Connect(function()
              menu.Enabled = false
              print("Меню закрыто")
          end)

      - type: "text"
        title: "🔁 Как включать и выключать интерфейс"
        text: |
          У любого ScreenGui есть свойство:<br><br>

          👉 Enabled<br>

          • true — интерфейс виден<br>  
          • false — интерфейс скрыт <br><br> 

          Именно так мы управляем меню.
      
      - type: "note"
        text: |
          Меню — это не отдельная игра.<br><br>

          Это:<br>
          🖥️ интерфейс <br> 
          🎮 часть управления игрой <br> 
          🔁 включается и выключается 
      
      - type: "text"
        title: "🧪 Мини-практика"
        text: |
          Попробуй сделать:<br><br>

          1️⃣ Название игры вверху экрана <br> 
          2️⃣ Кнопку Play — скрывает меню  <br>
          3️⃣ Кнопку Exit — тоже скрывает меню <br><br> 

          ✨ Сделай кнопки разного цвета.
      
    
    
    quiz:
      - question: "Зачем в игре нужно стартовое меню?"
        answers:
          - "Чтобы украсить экран"
          - "Чтобы игрок мог начать игру и управлять интерфейсом"
          - "Чтобы персонаж быстрее бегал"
        correct: 1

      - question: "Какие кнопки чаще всего есть в стартовом меню?"
        answers:
          - "Jump и Run"
          - "Play и Exit"
          - "Left и Right"
        correct: 1

      - question: "Что обычно происходит, когда игрок нажимает кнопку Play?"
        answers:
          - "Игра закрывается"
          - "Меню исчезает и игра начинается"
          - "Игрок теряет здоровье"
        correct: 1

      - question: "Какой объект отвечает за включение и выключение всего интерфейса меню?"
        answers:
          - "TextButton"
          - "TextLabel"
          - "ScreenGui"
        correct: 2

      - question: "Что делает свойство Enabled у ScreenGui?"
        answers:
          - "Меняет цвет интерфейса"
          - "Показывает или скрывает интерфейс"
          - "Удаляет интерфейс навсегда"
        correct: 1

    
    end:
      - type: "text"
        title: "🎉 Итог урока"
        text: |
          Теперь ты умеешь:<br><br>

          ✅ создавать стартовое меню <br> 
          ✅ делать кнопки Play и Exit <br> 
          ✅ включать и выключать интерфейс <br> 
          ✅ управлять началом игры  <br><br>

          👉 В следующем уроке мы добавим
          **HUD: здоровье, монеты и подсказки**.


# ============================================================
# ⭐ УРОК 52 — HUD игрока
# ============================================================
  - id: 52
    title: "⭐ Урок 52. HUD игрока: здоровье, монеты и подсказки"
    shortDescription: "Создаём игровой HUD: панель здоровья, счётчик монет и подсказки для игрока."


    content:

      - type: "text"
        text: |
          Представь игру, где ты бегаешь,
          но не знаешь:

          ❓ сколько у тебя здоровья  
          ❓ сколько монет ты собрал  
          ❓ что делать дальше  

          Такая игра быстро надоедает 😕

          👉 Поэтому в играх существует **HUD** —
          игровая панель информации.
      
      - type: "note"
        text: |
          🎯 HUD (Head-Up Display) —
          это интерфейс, который игрок видит
          **всё время, пока играет**.

          HUD помогает игроку понимать,
          что происходит прямо сейчас.

      - type: "note"
        text: |
          🎯 HUD (Head-Up Display) —
          это интерфейс, который игрок видит
          **всё время, пока играет**.

          HUD помогает игроку понимать,
          что происходит прямо сейчас.
        
      - type: "text"
        title: "🧩 Элементы HUD"
        text: |
          В нашем HUD будут:

          ❤️ здоровье игрока  
          🪙 количество монет  
          🧭 подсказка задания
      
      - type: "steps"
        title: "🧱 Шаг 1. Создание HUD"
        items:
          - "1. Открой StarterGui"
          - "2. Добавь ScreenGui → назови HUDGui"
          - "3. Этот ScreenGui будет всегда включён (Enabled = true)"
      
      - type: "text"
        title: "❤️ Здоровье"
        text: |
          Здоровье показывает,
          насколько игрок близок к поражению.

          Обычно здоровье отображают:
          ❤️ сердечками  
          ❤️ полоской  
          ❤️ числом  

          👉 Даже простой текст «Health: 100»
          уже помогает игроку.
      
      - type: "hint"
        text: |
          📌 Сейчас здоровье — это просто текст.

          В следующих уроках мы научимся
          обновлять его автоматически.
      
      - type: "text"
        title: "🪙 Монеты"
        text: |
          Монеты показывают прогресс игрока.

          Например:
          🪙 Coins: 0  
          🪙 Coins: 5  

          👉 Счётчик мотивирует игрока
          двигаться дальше.
      
      - type: "text"
        title: "🧭 Подсказка задания"
        text: |
          Подсказка говорит игроку,
          что делать дальше.

          Примеры:
          💬 «Собери 3 монеты»  
          💬 «Найди выход»  
          💬 «Остерегайся ловушек»  

          👉 Подсказка делает игру дружелюбной.
      
      - type: "text"
        title: "🖥️ Где размещать элементы HUD"
        text: |
          Обычно в играх:

          ↖️ здоровье — сверху слева  
          ↗️ монеты — сверху справа  
          ⬇️ подсказка — внизу экрана  

          📌 HUD не должен мешать игре.

      - type: "note"
        text: |
          HUD — это не декор.

          Это:
          🧠 информация  
          🎮 помощь игроку  
          🗺️ ориентация в игре  
      
      - type: "text"
        title: "🧪 Мини-практика"
        text: |
          Попробуй создать HUD:

          1️⃣ TextLabel «Health: 100»  
          2️⃣ TextLabel «Coins: 0»  
          3️⃣ TextLabel с подсказкой задания  

          ✨ Размести их в разных частях экрана.
      
      - type: "note"
        text: |
          🧩 Что мы объединили:

          • TextLabel (урок 49)  
          • ScreenGui (урок 48)  
          • включение/выключение интерфейса (урок 51)  

          👉 HUD — это система, а не один элемент.
    
    quiz:
      - question: "Что такое HUD в игре?"
        answers:
          - "Меню в начале игры"
          - "Интерфейс, который игрок видит во время игры"
          - "Объекты в игровом мире"
        correct: 1

      - question: "Зачем игроку нужен HUD?"
        answers:
          - "Только для красоты"
          - "Чтобы понимать, что происходит в игре"
          - "Чтобы игра работала быстрее"
        correct: 1

      - question: "Что обычно показывает элемент здоровья в HUD?"
        answers:
          - "Количество монет"
          - "Насколько игрок близок к поражению"
          - "Название уровня"
        correct: 1

      - question: "Какой элемент HUD чаще всего показывает прогресс игрока?"
        answers:
          - "Подсказка задания"
          - "Счётчик монет"
          - "Кнопка Play"
        correct: 1

      - question: "Где обычно размещают подсказку задания в HUD?"
        answers:
          - "В игровом мире"
          - "Внизу экрана"
          - "В Character игрока"
        correct: 1


    end:
      - type: "text"
        title: "🎉 Итог урока"
        text: |
          Теперь ты умеешь:

          ✅ понимать, что такое HUD  
          ✅ создавать HUD игрока  
          ✅ показывать здоровье  
          ✅ отображать монеты  
          ✅ добавлять подсказки  

          👉 В следующем уроке мы научимся
          **обновлять HUD по событиям игры**.
