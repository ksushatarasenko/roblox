# ⭐ УРОК 42. Красота и поведение ловушек
# ===============================
  - id: 42
    title: "⭐ УРОК 42. Мини-практика, попробуй сам - Ловушки"
    shortDescription: "Мы учимся управлять поведением ловушек (ВАУ-ЭФФЕКТЫ + ВРЕМЯ)."
    # video: "https://www.youtube.com/embed/LAVATRAP022"

    content:

     

      - type: "text"
        title: "Мини-практика, попробуй сам"
        text: "📦 Тебе нужно создать 3 разные ловушки"

      - type: "text"
        title: "🎮 Как объединить ловушки в одну полосу испытаний"
        text: |
          <h4>🧠 Главная идея (самое важное)</h4>
          <ul>
            <li><b>Полоса ловушек — это не один скрипт.</b></li>
            <li>Это <b>последовательность разных зон</b>, где каждая ловушка проверяет <em>другое умение игрока.</em></li>
          </ul>
      
      - type: "text"
        title: "🧩 1. Думаем как дизайнер игры (а не программист)"
        text: |
          <h4>Полоса = ритм:</h4>
          <ol>
            <li>игрок бежит</li>
            <li>пугается</li>
            <li>ждёт</li>
            <li>ускоряется</li>
            <li>ошибается или побеждает</li>
          </ol>


      - type: "code"
        title: "🗺 Пример простой полосы"
        code: |
          START
            ↓
          🧱 Падающий пол (обман)
            ↓
          🎵 Ритмичные шипы (тайминг)
            ↓
          🔥 Поднимающаяся лава (паника)
            ↓
          🏁 Финиш / чекпоинт
        afterText: |
          <p>Каждая ловушка:</p>
          <ul>
            <li>отдельный Part</li>
            <li>отдельный Script</li>
            <li>простая логика</li>
          </ul>
          <p>❗ НЕ нужно один огромный скрипт</p>

      - type: "code"
        title: "🧱 2. Как это выглядит в Explorer"
        code: |
          Workspace
          ├── Trap_1_FallingFloor
          │   └── Script
          ├── Trap_2_Spikes
          │   └── Script
          ├── Trap_3_Lava
          │   └── Script
          ├── Checkpoint
        afterText: |          
          <ul>
            <li>👉 Это нормально</li>
            <li>👉 Это правильно</li>
            <li>👉 Так делают настоящие игры</li>
          </ul>


      - type: "text"
        title: "🔥 3. Почему ловушки НЕ мешают друг другу"
        text: |
          <p>Потому что:</p>
          <ul>
            <li>каждая ловушка <b></b></li>
            <li><span style="font-family: monospace;">Touched</span> срабатываеследит только за собойт <b>локально</b></li>
            <li><span style="font-family: monospace;">while true do</span> работает <b>только внутри объекта</b></li>
          </ul>
          <p>🧠 Игрок = один</p>
          <p>🧱 Ловушки = много маленьких систем</p>

      - type: "code"
        title: "⏰ 4. Как сделать ощущение одной «живой» полосы"
        text: |
          <h5>✅ Одинаковый ритм</h5>
        code: |
          wait(1)  -- у всех ловушек похожие паузы
        afterText: |    
          <h5>✅ Нарастающая сложность</h5>      
          <ul>
            <li>сначала медленно</li>
            <li>потом быстрее</li>
            <li>потом паника 😄</li>
          </ul>
          <h5>✅ Логика зон</h5>      
          <p><b>Каждая ловушка = новый вызов</b></p>


      - type: "text"
        title: "🚫 Типичные ошибки при создании полос ловушек"
        text: |
          <h5>❌ Ошибка 1. «Всё убивает сразу»</h5>
          <p>Как выглядит</p>
          <ul>
            <li>лава</li>
            <li>шипы</li>
            <li>падающий пол</li>
          </ul>
          <p><b>➡️ всё = мгновенная смерть</b></p>
          <p><b>Почему это плохо: </b>Игрок не понимает, где ошибся не учится быстро злится 😠</p>
          <p><b>✅ Как правильно</b> - сначала предупреждение (цвет / звук), потом урон, иногда — шанс спастись.</p>
          <h5>❌ Ошибка 2. Слишком много ловушек подряд</h5>
          <p>Как выглядит</p>
          <ul>
            <li>лава → шипы → лава → шипы → лава</li>
            <li>без пауз и передышек</li>
          </ul>
          <p><b>Почему это плохо: </b>Игрок устает путается перестаёт получать удовольствие</p>
          <p><b>✅ Как правильно</b> - платформа без урона место отдышаться потом следующий вызов</p>
          <h5>❌ Ошибка 3. Нет чекпоинтов</h5>
          <p>Как выглядит</p>
          <ul>
            <li>длинная полоса</li>
            <li>один Spawn в начале</li>
            <li>упал в конце → начинай сначала 😭</li>
          </ul>
          <p><b>Почему это плохо: </b>Игрок теряет мотивацию не хочет продолжать</p>
          <p><b>✅ Как правильно</b> - Каждые 2–3 ловушки → чекпоинт. <em>«Ты продвинулся. Молодец.»</em></p>
          <h5>❌ Ошибка 4. Ловушки не видно и не слышно</h5>
          <p>Как выглядит</p>
          <ul>
            <li>шипы без предупреждения</li>
            <li>пол падает сразу</li>
            <li>урон «из ниоткуда»</li>
          </ul>
          <p><b>Почему это плохо: </b>Это кажется нечестным.</p>
          <p><b>✅ Как правильно</b> - Используй: цвет, задержку (wait), звук, частицы</p>
          <h5>❌ Ошибка 5. Один огромный скрипт на всё</h5>
          <p>Как выглядит</p>
          <ul>
            <li>один Script</li>
            <li>200 строк кода</li>
            <li>всё внутри</li>
          </ul>
          <p><b>Почему это плохо: </b>сложно читать, сложно исправлять, одна ошибка ломает всё</p>
          <p><b>✅ Как правильно</b> - Одна ловушка = один Script. (просто, понятно, удобно менять) </p>
          <h5>❌ Ошибка 6. Нет ритма</h5>
          <p>Как выглядит</p>
          <ul>
            <li>всё работает хаотично</li>
            <li>ловушки не связаны</li>
            <li>нет ощущения уровня</li>
          </ul>
          <p><b>Почему это плохо: </b>Игра не чувствуется как единое целое.</p>
          <p><b>✅ Как правильно</b> - Ритм = повтор + ожидание. (одинаковые wait(), нарастающая сложность, логика зон) </p>
      - type: "code"
        title: "🧠 Золотое правило полосы ловушек"
        code: |
          Игрок должен:
          понять → испугаться → подумать → действовать
        afterText: |
          <p>Если это есть — ты сделал хороший уровень.</p>  
          


# Приактика


      - type: "oneImage"
        title: "Практическое задание"
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module4/lesson40-43/%D0%9C%D0%B8%D0%BD%D0%B8-%D0%BF%D1%80%D0%B0%D0%BA%D1%82%D0%B8%D0%BA%D0%B0,%20%D0%BF%D0%BE%D0%BF%D1%80%D0%BE%D0%B1%D1%83%D0%B8%CC%86%20%D1%81%D0%B0%D0%BC.png?raw=true"
            width: 100%
            maxWidth: "100%"
            align: center
      

      - type: "text"
        title: "🎯 Практическое задание"
        text: |
          <h4>Сделай три разные ловушки</h4>
          <h5>🔥 1. Движущаяся лава</h5>
          <p>Идея: лава медленно поднимается вверх.</p>
          <p>Игрок должен:</p>
          <ul>
            <li>заметить опасность</li>
            <li>ускориться</li>
            <li>убежать вовремя</li>
          </ul>
          <p>👉 Подсказка: используй Position + wait() или TweenService</p>
          <h6>📦 Что нужно</h6>
          <p>Lava (Part) ── Script</p>
          <h5>🧱 2. Падающий пол</h5>
          <p>Идея: пол не исчезает сразу.</p>
          <p>Последовательность:</p>
          <ul>
            <li>игрок наступил</li>
            <li>прошло немного времени</li>
            <li>пол пропал или упал</li>
          </ul>
          <p>👉 Подсказка: Touched → wait() → Anchored = false</p>
          <h6>📦 Что нужно</h6>
          <p>FallingFloor (Part) ── Script</p>
          <h5>🎵 3. Ловушка с ритмом (как музыка)</h5>
          <p>Идея: ловушка работает по циклу.</p>
          <p>Например:</p>
          <ul>
            <li>шипы появляются</li>
            <li>затем исчезают</li>
            <li>и так снова и снова</li>
          </ul>
          <p>👉 Подсказка: while true do → wait() → действие</p>
          <h6>📦 Что нужно</h6>
          <p>Spikes (Part) ── Script</p>

      - type: hint
        title: "🔥 1. Движущаяся лава 🔑"
        code: |
          -- Берём лаву
          local lava = script.Parent

          -- Насколько лава поднимается каждый раз
          local step = 1

          -- Как часто она поднимается
          local delayTime = 1

          -- Лава поднимается бесконечно
          while true do
            wait(delayTime)

            -- Поднимаем лаву вверх
            lava.Position = lava.Position + Vector3.new(0, step, 0)
          end

      
      - type: hint
        title: "🧱 2. Падающий пол 🔑"
        code: |
          -- Берём пол
          local floor = script.Parent

          -- Чтобы пол сработал только один раз
          local activated = false

          floor.Touched:Connect(function(hit)
            -- Если уже падал — ничего не делаем
            if activated then return end

            -- Проверяем: это игрок?
            local humanoid = hit.Parent:FindFirstChild("Humanoid")

            if humanoid then
              activated = true

              -- Ждём перед падением
              wait(2)

              -- Пол падает
              floor.Anchored = false
            end
          end)

      
      - type: hint
        title: "🎵 3. Ловушка с ритмом 🔑"
        code: |
          -- Берём шипы
          local spikes = script.Parent

          -- Начальное состояние — спрятаны
          spikes.Transparency = 1
          spikes.CanCollide = false

          while true do
            -- Шипы появляются
            spikes.Transparency = 0
            spikes.CanCollide = true

            wait(1) -- опасно

            -- Шипы исчезают
            spikes.Transparency = 1
            spikes.CanCollide = false

            wait(1) -- безопасно
          end
  
      
    end:
      - type: "text"
        title: "🎉 Итог: Теперь ты умеешь:"
        text: |
          <ul>
            <li>делать разные виды урона</li>
            <li>управлять здоровьем игрока</li>
            <li>создавать честные и понятные ловушки</li>
            <li>использовать Touched и TouchEnded</li>
          </ul>
          <h4>💬 Ты уже создаёшь настоящие игровые механики, а не просто блоки.</h4>



# ============================================================
# 🌀 УРОК 43 — ПЕРЕХОДЫ И НАВИГАЦИЯ
