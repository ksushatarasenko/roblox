# ============================================================
# ⭐ УРОК 44 — Зоны: опасность и безопасность
# ============================================================
  - id: 44
    title: "⭐ Урок 44. Зоны: опасность и безопасность"
    shortDescription: "Учимся создавать зоны, которые наносят урон, лечат, замедляют или защищают игрока."


    content:
    
      - type: "text"
        text: |
          <p>Сегодня мы научимся создавать зоны — это обычные Part,
          которые реагируют на игрока и изменяют его состояние.</p>

          🔥 лава — убивает  <br>
          ☠️ опасная зона — наносит урон   <br>
          🐌 замедляющая зона — замедляет   <br>
          💚 безопасная зона — лечит   <br><br>
          <p>👉 Почти ВСЕ Obby строятся именно на зонах.</p>
      
      - type: "note"
        text: |
          🧠 Одна формула на весь урок: <br>

          Part + Touched → Humanoid → меняем свойства игрока



      - type: "steps"
        title: "1. 🔥 Зона мгновенной смерти (лава)"
        items:
          - "Создай Part → назови Lava"
          - "Anchored = true"
          - "Material = Neon"
          - "Цвет: красный или оранжевый"
          - "Добавь Script"

      - type: "code"
        title: "🔥 Код лавы"
        code: |
          local lava = script.Parent

          lava.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")
              if humanoid then
                  humanoid.Health = 0
              end
          end)

      - type: "note"
        text: "Коснулся → умер → респаун на чекпоинте."

    # 2. Опасная зона (урон, но не смерть)
      - type: "steps"
        title: "2. ⚔️ Опасная зона (урон)"
        items:
          - "Part → DamageZone"
          - "Anchored = true"
          - "Добавь Script"

      - type: "code"
        title: "⚔️ Код зоны урона"
        code: |
          local zone = script.Parent

          zone.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")
              if humanoid then
                  humanoid.Health -= 20
              end
          end)
        
      - type: "tip"
        text: "Так делают шипы, электричество, кислоту."
    # 3. Ядовитая зона (постепенный урон)

      - type: "text"
        title: "3. ☠️ Ядовитая зона (урон со временем)"
        text: |
          Пока игрок стоит в зоне — здоровье уменьшается.

      - type: "code"
        title: "☠️ Код ядовитой зоны"
        code: |
          local poison = script.Parent
          local touching = false

          poison.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")
              if humanoid then
                  touching = true
                  while touching do
                      humanoid.Health -= 5
                      task.wait(0.5)
                  end
              end
          end)

          poison.TouchEnded:Connect(function()
              touching = false
          end)

  # 4. Зона замедления
      - type: "steps"
        title: "🐌 4. Зона замедления"
        items:
          - "Part → SlowZone"
          - "Добавь Script"
      
      - type: "code"
        title: "🐌 Код замедления"
        code: |
          local zone = script.Parent

          zone.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")
              if humanoid then
                  humanoid.WalkSpeed = 8
              end
          end)

          zone.TouchEnded:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")
              if humanoid then
                  humanoid.WalkSpeed = 16
              end
          end)

      - type: "warning"
        text: "Всегда возвращай скорость обратно!"
  
  # 💚 5. Безопасная зона (лечение)


      - type: "steps"
        title: "💚 Безопасная зона"
        items:
          - "Part → SafeZone"
          - "Цвет: зелёный"
          - "Anchored = true"
    

      - type: "code"
        title: "💚 Код безопасной зоны"
        code: |
          local zone = script.Parent

          zone.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")
              if humanoid then
                  humanoid.Health += 5
              end
          end)

# 🧩 Мини-квест

      - type: "text"
        title: "🧪 Мини-квест"
        text: |
          Попробуй сделать:
          <ol>
            <li>зону, которая лечит ТОЛЬКО если здоровье < 50</li>
            <li>зону, которая замедляет на 1 секунду </li>
            <li>зону, которая сначала зелёная, а потом становится опасной</li>
          </ol>
      
      - type: "oneImage"
        title: " Мини-квест"
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module4/lesson44-47/%20%D0%9C%D0%B8%D0%BD%D0%B8-%D0%BA%D0%B2%D0%B5%D1%81%D1%82_lesson44.png?raw=true"
            width: 100%
            maxWidth: "100%"
            align: center

      - type: hint
        title: "1️⃣ ЗОНА ЛЕЧЕНИЯ 🔑"          
        text: 
          - "💚 Лечит ТОЛЬКО если здоровье < 50"
          - "Part: HealZone"
        code: |
          -- 💚 ЗОНА ЛЕЧЕНИЯ
          -- Лечит игрока ТОЛЬКО если здоровье меньше 50

          local zone = script.Parent

          zone.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              -- Проверяем: это игрок?
              if humanoid then

                  -- Проверяем здоровье
                  if humanoid.Health < 50 then
                      humanoid.Health += 10
                      print("Лечение! Здоровье было меньше 50.")
                  else
                      print("Здоровье и так достаточно высокое.")
                  end

              end
          end)


      - type: hint
        title: "2️⃣ ЗОНА ЗАМЕДЛЕНИЯ 🔑"
        text: 
          - "🐌 Замедляет игрока на 1 секунду"
          - "Part: SlowZone"
        code: |

      - type: hint
        title: "3️⃣ ЗОНА-ЛОВУШКА 🔑"
        text: 
          - "🟢 → 🔴 Сначала безопасная, потом опасная"
          - "Part: SwitchZone"
        code: |
          -- 🟢➡️🔴 ЗОНА С ПЕРЕКЛЮЧЕНИЕМ
          -- Сначала безопасная (зелёная)
          -- Через время становится опасной (красной)

          local zone = script.Parent
          local dangerous = false  -- флаг: опасна или нет

          -- ЦИКЛ: меняем состояние зоны
          task.spawn(function()
              while true do
                  -- 🟢 Безопасная
                  zone.Color = Color3.fromRGB(0, 255, 0)
                  dangerous = false
                  print("Зона безопасная")
                  task.wait(2)

                  -- 🔴 Опасная
                  zone.Color = Color3.fromRGB(255, 0, 0)
                  dangerous = true
                  print("Зона стала опасной!")
                  task.wait(2)
              end
          end)

          -- Реакция на касание
          zone.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              if humanoid and dangerous then
                  humanoid.Health -= 15
                  print("Урон! Зона была красной.")
              end
          end)

      - type: "note"
        text: "💡 Одна и та же зона может вести себя по-разному — всё зависит от условий и состояния."
# ✨ Дополнительное задание (по желанию)

      - type: "text"
        title: "✨ Дополнительное задание: звук и эффекты"
        text: |
          Хочешь сделать зоны более «живыми» и эффектными? 😎  
          <p>Добавь **звук и частицы** — как в настоящих играх Roblox.</p><br>
          ⭐ Это задание НЕ обязательно, но очень круто прокачивает уровень!
      
      - type: "text"
        title: "🔊 Часть 1 — Добавляем звук"
        text: |
          <h5>📦 Подготовка</h5>
          <ol>
            <li>Выбери Part (HealZone / SlowZone / SwitchZone)</li>
            <li>Добавь внутрь объект Sound</li>
            <li>Вставь любой звук (heal / click / danger / magic)</li>
          </ol>
      
      - type: hint
        title: "💚 Пример: звук при лечении 🔑"
        code: |
          -- 💚 Звук лечения

          local zone = script.Parent
          local sound = zone:FindFirstChild("Sound") -- звук внутри зоны

          zone.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              if humanoid and humanoid.Health < 50 then
                  humanoid.Health += 10

                  if sound then
                      sound:Play()
                  end

                  print("Лечение со звуком!")
              end
          end)

      - type: "text"
        title: "✨ Часть 2 — Добавляем частицы"
        text: |
          <h5>📦 Подготовка</h5>
          <ol>
            <li>Внутрь Part добавь ParticleEmitter</li>
            <li>Настрой: Color, Rate (например 10–20), Lifetime (0.5–1)</li>
          </ol>
      
      - type: hint
        title: "💚 Пример: частицы при лечении 🔑"
        code: |
          -- ✨ Частицы при лечении

          local zone = script.Parent
          local particles = zone:FindFirstChild("ParticleEmitter")

          zone.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              if humanoid and humanoid.Health < 50 then
                  humanoid.Health += 10

                  if particles then
                      particles.Enabled = true
                      task.delay(1, function()
                          particles.Enabled = false
                      end)
                  end

                  print("Лечение с эффектами!")
              end
          end)

      - type: "text"
        title: "🟢🔴 Часть 3 — Эффекты для опасной зоны"
        text: |
          <h5>💥 Эффект + звук ТОЛЬКО когда зона опасна</h5>

      - type: hint
        title: "🔴 Эффекты для опасной зоны 🔑"
        code: |
          -- 🔴 Эффекты для опасной зоны

          local zone = script.Parent
          local dangerous = false

          local sound = zone:FindFirstChild("Sound")
          local particles = zone:FindFirstChild("ParticleEmitter")

          -- Переключение состояния
          task.spawn(function()
              while true do
                  -- 🟢 безопасно
                  zone.Color = Color3.fromRGB(0,255,0)
                  dangerous = false
                  if particles then particles.Enabled = false end
                  task.wait(2)

                  -- 🔴 опасно
                  zone.Color = Color3.fromRGB(255,0,0)
                  dangerous = true
                  if particles then particles.Enabled = true end
                  task.wait(2)
              end
          end)

          zone.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              if humanoid and dangerous then
                  humanoid.Health -= 15

                  if sound then
                      sound:Play()
                  end

                  print("Урон + звук + частицы!")
              end
          end)


      - type: "text"
        title: "🧠 Челлендж"
        text: |
          Попробуй сам:
          <ol>
            <li>сделать разный звук для безопасной и опасной зоны</li>
            <li>включать частицы ТОЛЬКО при касании  </li>
            <li>сделать зону, которая сначала светится, а потом взрывается ✨💥</li>
          </ol>



    quiz:
      - question: "Что такое зона в Roblox?"
        answers:
          - "Любой Part, который меняет правила игры при касании"
          - "Только лава"
          - "Место, где игрок сохраняется"
        correct: 0

      - question: "Какой объект мы используем, чтобы изменить здоровье игрока?"
        answers:
          - "Player"
          - "Humanoid"
          - "HumanoidRootPart"
        correct: 1

      - question: "Что делает код humanoid.Health -= 20?"
        answers:
          - "Увеличивает здоровье игрока"
          - "Уменьшает здоровье игрока"
          - "Телепортирует игрока"
        correct: 1

      - question: "Почему в зоне замедления важно использовать TouchEnded?"
        answers:
          - "Чтобы игрок умер"
          - "Чтобы вернуть скорость обратно"
          - "Чтобы телепортировать игрока"
        correct: 1

      - question: "Какая зона считается безопасной?"
        answers:
          - "Та, которая наносит урон"
          - "Та, которая лечит или защищает игрока"
          - "Та, которая убивает игрока"
        correct: 1

    end:
      - type: "text"
        title: "🎉 Итог урока"
        text: |
          Теперь ты умеешь:

          ✅ создавать опасные зоны  
          ✅ наносить мгновенный и постепенный урон  
          ✅ замедлять и лечить игрока  
          ✅ управлять Humanoid  

          👉 В следующем уроке мы начнём объединять зоны
          и превращать их в НАСТОЯЩИЕ ЛОВУШКИ.

# ============================================================
# УРОК 45 — Зоны урона и безопасные зоны
# ============================================================
  - id: 45
    title: "🌟 Урок 45. Зоны урона и безопасные зоны"
    shortDescription: "Создаём лаву, шипы, яд, зоны замедления и безопасные платформы."
    # video: "https://www.youtube.com/embed/DAMAGE27"

    content:
      - type: "text"
        text: "Сегодня мы научимся создавать разные «зоны действия» — опасные и добрые. Это основа для Obby, мини-игр, паркуров и приключений!"
      - type: "text"
        title: "🎮 Что такое зона?"
        text:
          - "Зона — это обычный Part, который вызывает эффект при касании."
          - "Зона — это любой блок, который реагирует на прикосновение игрока:"
          - "🔥 Лава — наносит урон"
          - "☠️ убивает"
          - "🧪 отравляет"
          - "🐌 замедляет"
          - "💚 защищает / лечит"
          - "🛡 восстанавливает здоровье"
          - "Можно представить, что игрок идёт по карте, а земля под ним меняет правила игры."

      - type: "text"
        title: "🧒 Ассоциация"
        text: |
          Представь пол в игре как <em>шахматную доску</em>:
          <ul>
            <li>красные клетки — опасность</li>
            <li>зелёные — защита</li>
            <li>жёлтые — замедление</li>
            <li>синие — ускорение</li>
          </ul>
          Игрок вступает на клетку → происходят изменения.


      - type: "steps"
        title: "🟧 Шаг 1. Создаём лаву (мгновенная смерть)"
        items:
          - "Создай Part → назови Lava"
          - "Покрась в красный или оранжевый"
          - "Material = Neon"
          - "Anchored = true"
          - "Добавь Script"

      - type: "code"
        title: "🔥 Код лавы"
        code: |
          local lava = script.Parent

          lava.Touched:Connect(function(hit)
              local char = hit.Parent
              local humanoid = char:FindFirstChild("Humanoid")

              if humanoid then
                  humanoid.Health = 0 -- убиваем игрока
                  print("Игрок упал в лаву!")
              end
          end)
        afterText: "Просто и понятно: коснулся — умер."

      - type: "code"
        title: "🟥 Шаг 2. Шипы (урон, но не смерть сразу)"
        text: 
          - "1. Создай Part → назови Spikes"
          - "2. Material = Metal"
          - "Добавь Script"
          - "<h4>⚔️ Код шипов:</h4>"
        code: |
          local spikes = script.Parent

          spikes.Touched:Connect(function(hit)
              local char = hit.Parent
              local humanoid = char:FindFirstChild("Humanoid")

              if humanoid then
                  humanoid.Health -= 20 -- снимаем здоровье
                  print("Игрок получил урон от шипов!")
              end
          end)

      - type: "code"
        title: "🧪 Шаг 3. Ядовитая зона (урон постепенно)"
        text: 
          - "Это как если игрок стоит в зелёном токсичном дыму."
          - "<h4>☠️ Код яда:</h4>"
        code: |
          local poison = script.Parent
          local touching = false

          poison.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              if humanoid then
                  touching = true

                  while touching do
                      humanoid.Health -= 5
                      print("Отравление!")
                      task.wait(0.5) -- урон каждые полсекунды
                  end
              end
          end)

          poison.TouchEnded:Connect(function(hit)
              touching = false
          end)
        afterText: "Пока игрок стоит в облаке → здоровье уменьшается."

      - type: "code"
        title: "🐌 Шаг 4. Зона замедления (слизь, ледяная поляна)"
        text:
          - "Представь, что игрок зашёл в болотистую воду."
          - "<h4>🐢 Код зоны замедления:</h4>"
        code: |
          local slowZone = script.Parent

          slowZone.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              if humanoid then
                  humanoid.WalkSpeed = 8 -- медленный шаг
                  print("Игрок замедлен!")
              end
          end)

          slowZone.TouchEnded:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

