              <li>Создай Part → назови LaunchPad</li>
              <li>Вставь Script</li>
            </ul>
          <h5>🧾 Код подбрасывающей ловушки</h5>
        code: |
          local pad = script.Parent

          pad.Touched:Connect(function(hit)
              local character = hit.Parent
              local root = character:FindFirstChild("HumanoidRootPart")
              local humanoid = character:FindFirstChild("Humanoid")

              if root and humanoid then

                  local force = Instance.new("BodyVelocity")
                  force.Parent = root

                  -- подбрасываем вверх (Y = 120)
                  force.Velocity = Vector3.new(0, 120, 0)
                  force.MaxForce = Vector3.new(10000, 10000, 10000)

                  print("Игрок подброшен!")

                  task.wait(0.3)
                  force:Destroy()
              end
          end)
        afterText: 
          - "✔️ Создаёт эффект прыжка или взрыва 💥"
          - "✔️ Очень нравится детям — много смеха 😄"

      - type: "text" 
        title: "🎨 Улучшение ловушек (по желанию)"
