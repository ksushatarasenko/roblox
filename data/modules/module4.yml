      # MEGA-TRAP
      - type: "text"
        title: "💀 MEGA-TRAP"
        text: |
          <b>Платформа, которая:</b>
            <ul>
              <li>✨ мигает (TweenService)</li>
              <li>🔥 наносит урон, когда красная</li>
              <li>💥 подбрасывает игрока</li>
              <li>🧨 падает вниз</li>
