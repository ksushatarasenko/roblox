          - "https://i.ytimg.com/vi/qWDm784rUjU/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLAaZ6MgwKtedzVdO94F2XZAkeBquw"

      - type: "tip"
        title: "🧠 Напоминание: кого мы телепортируем?"
        text: |
          - "Игрок = Character → у него есть HumanoidRootPart"
