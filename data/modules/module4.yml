          <p>👉 награда 🎁 чекпоинт становится <b>приятным</b></p>
          <h5>🔹 7. Суперскорость</h5>
          <ul>
            <li><span style="font-family: monospace;">humanoid.WalkSpeed = speedBonus</span></li>
