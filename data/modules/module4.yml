  - id: 43
    title: "🌀 УРОК 43 — ПЕРЕХОДЫ И НАВИГАЦИЯ"
    shortDescription: "Учимся перемещать игрока между зонами уровня: порталы, двери, двусторонние переходы и телепорт-гейты."
    

    content:
      - type: "text"
        text: |
            Представь игру без телепортов.
            <p>Один длинный путь, всё на одном месте… скучно 😴</p>
            <br>
            Телепорты делают игру:<br>
            🚪 многоуровневой  <br>
            🗺️ похожей на настоящий мир <br> 
            🎮 интересной и динамичной  <br><br>

            В этом уроке мы научимся **перемещать игрока между зонами** :<br>
            комнатами, локациями, секретами и домами.
      
      - type: "note"
        text: |
          🧠 Любой телепорт в Roblox — это всегда одно и то же:<br><br>

          1️⃣ игрок касается объекта  <br>
          2️⃣ мы находим HumanoidRootPart  <br>
          3️⃣ переносим его в другую точку  <br><br>

          Меняется только МЕСТО, куда мы телепортируем.

      - type: "text"
        title: "🎒 Сегодня ты научишься:"
        text:
          - "🌀 делать обычные порталы"
          - "🔁 создавать двусторонние телепорты"
          - "🚪 делать переходы между комнатами"
          - "🏡 телепортировать игрока в дом или секретную зону"
          - "🏰 создавать телепорт-гейты с условием"
      
      - type: "tip"
        title: "🧠 Кого мы перемещаем?"
        text: |
          Игрок — это Character.
          У Character есть HumanoidRootPart — центр игрока.

          ❗ Мы всегда перемещаем HumanoidRootPart,
          а не голову, не ноги и не всю модель целиком.
# 🌀 Часть 1 — Обычный портал (A → B)

      - type: "steps"
        title: "🌀 Обычный портал (A → B)"
        items:
          - "Создай Part → PortalA"
          - "Создай Part → ExitPoint"
          - "Вставь Script внутрь PortalA"
    
      - type: "code"
        title: "✨ Код обычного телепорта"
        code: |
          local portal = script.Parent
          local exitPoint = workspace:WaitForChild("ExitPoint")

          portal.Touched:Connect(function(hit)
              local root = hit.Parent:FindFirstChild("HumanoidRootPart")
              if root then
                  root.CFrame = exitPoint.CFrame + Vector3.new(0, 3, 0)
              end
          end)
    
      - type: "note"
        text: "Игрок зашёл → ФШУХ! → появился в другой зоне."
# 🔁 Часть 2 — Двусторонний телепорт (A ↔ B)
      - type: "text"
        title: "🔁 Двусторонний телепорт"
        text: |
            Это как двери:<br>
            зашёл в одну — вышел в другую.<br>
            А потом можно вернуться обратно.<br>
      
      - type: "code"
        title: "PortalA → PortalB"
        code: |
            local portal = script.Parent
            local target = workspace:WaitForChild("PortalB")

            portal.Touched:Connect(function(hit)
                local root = hit.Parent:FindFirstChild("HumanoidRootPart")
                if root then
                    root.CFrame = target.CFrame + Vector3.new(0, 3, 0)
                end
            end)
      
      - type: "code"
        title: "PortalB → PortalA"
        code: |
            local portal = script.Parent
            local target = workspace:WaitForChild("PortalA")

            portal.Touched:Connect(function(hit)
                local root = hit.Parent:FindFirstChild("HumanoidRootPart")
                if root then
                    root.CFrame = target.CFrame + Vector3.new(0, 3, 0)
                end
            end)
      
      - type: "warning"
        text: "Не ставь порталы слишком близко — игрок может застрять."
# 🚪 Часть 3 — Переход между комнатами

      - type: "text"
        title: "🚪 Переход между комнатами"
        text: |
          Как в торговом центре:<br>
          вошёл в дверь — оказался в другом помещении.
      
      - type: "code"
        title: "Код двери"
        code: |
          local door = script.Parent
          local targetDoor = workspace:WaitForChild("Door2")

          door.Touched:Connect(function(hit)
              local root = hit.Parent:FindFirstChild("HumanoidRootPart")
              if root then
                  root.CFrame = targetDoor.CFrame + Vector3.new(0, 3, 0)
              end
          end)
# 🏡 Часть 4 — Телепорт в дом или секретную зону

      - type: "text"
        title: "🏡 Телепорт в дом"
        text: |
          Одна из самых любимых механик:<br>
          игрок заходит в куст, дверь или люк<br>
          и попадает в дом, бункер или тайник.

      - type: "code"
        title: "Телепорт в дом"
        code: |
          local portal = script.Parent
          local insideHouse = workspace:WaitForChild("InsideHouse")

          portal.Touched:Connect(function(hit)
              local root = hit.Parent:FindFirstChild("HumanoidRootPart")
              if root then
                  root.CFrame = insideHouse.CFrame + Vector3.new(0, 3, 0)
              end
          end)
# 🧪 Часть 5 — Телепорт-гейт (с условием)

      - type: "text"
        title: "🧪 Телепорт-гейт"
        text: |
          Этот телепорт работает ТОЛЬКО<br>
          если игрок выполнил условие:<br>
          нашёл ключ, нажал кнопку, активировал рычаг.

      - type: "code"
        title: "Код телепорт-гейта"
        code: |
          local gate = script.Parent
          local target = workspace:WaitForChild("SecretRoom")
          local activated = gate:WaitForChild("Activated")

          gate.Touched:Connect(function(hit)
              local root = hit.Parent:FindFirstChild("HumanoidRootPart")
              if root and activated.Value == true then
                  root.CFrame = target.CFrame + Vector3.new(0, 3, 0)
              end
          end)
      
      - type: "text"
        title: "🧪 Практика"
        text: |
          Попробуй сделать сам:<br><br>

          1️⃣ двусторонний телепорт между двумя платформами  <br>
          2️⃣ дверь, ведущую в секретную комнату  <br>
          3️⃣ телепорт-гейт, который работает только после нажатия кнопки  


    quiz:
