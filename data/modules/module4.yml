      - question: "Что делает портал игровым, а не техническим?"
        answers:
          - "MoveTo"
          - "Эффекты"
          - "Идея и применение"
        correct: 2

    end:
      - type: "text"
        title: "🎉 Итог: Теперь ты умеешь:"
        text: |
          <ul>
            <li>создавать настоящие игровые порталы</li>
            <li>телепортировать игрока по касанию</li>
            <li>использовать HumanoidRootPart правильно</li>
            <li>добавлять звук, цвет и эффекты</li>
            <li>превращать код в игровую механику</li>
          </ul>
          <h4>Теперь ты не просто пишешь код — ты создаёшь игру 🎮</h4>
          <p>В следующем уроке мы сделаем <b>чекпоинты и респаун</b> — основу уровней и прогресса.</p>


# ===============================
# 👉 Урок 36 — Чекпоинты и точки возрождения
# ===============================
  - id: 36
    title: "👉 Урок 36: Чекпоинты и точки возрождения"
    shortDescription: "Учимся создавать чекпоинты — точки, где игрок сохраняет прогресс."
    # video: "https://www.youtube.com/embed/CHECKPOINT021"

    content:

      - type: "text"
        title: "🧠 Что такое чекпоинт?"
        text:
          - "<b>Чекпоинт</b> — это специальная платформа, которая запоминает, что игрок до неё дошёл. Чекпоинт = момент сохранения прогресса"
          - "Если игрок падает в лаву или проигрывает — он появляется на последнем чекпоинте."
          - "Когда игрок умирает → он возрождается возле чекпоинта, а не сначала."
          - "Checkpoint — это блок, которого касается игрок. (игрок до него дошёл, игра поняла: «он молодец», прогресс можно сохранить)"
          - "👉 Checkpoint <b>ничего не возрождает</b>."

      - type: "text"
        title: "🟦 Что такое точка возрождения?"
        text: 
          - "Это объект <b>SpawnLocation</b> — место, где игрок появляется после смерти, это <b>специальный объект Roblox</b>, он уже умеет возрождать игроков, мы не пишем для этого код"
          - "Roblox сначала спавнит игрока на стандартном SpawnLocation."
          - "Но мы можем дать игроку <b>свой персональный спавн</b>, когда он активирует чекпоинт."
          - "👉 Roblox <b>сам знает</b>, что делать со SpawnLocation."

      - type: "text"
        title: "❗ Очень важно понять"
        text: |
          <p>В Roblox чекпоинт состоит из двух частей:</p>
          <h4>Checkpoint ≠ SpawnLocation</h4>
          <ul>
            <li>🟦 <b>Checkpoint</b> — блок, которого касается игрок</li>
            <li>🟩 <b>SpawnLocation</b> — место, где игрок появится после смерти</li>
          </ul>
          <p>❗ Это <b>разные объекты</b>, но они работают вместе.</p>

      
      - type: "oneImage"
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module4/lesson36-38/module4_36_4.png?raw=true"
            width: 100%
            maxWidth: "100%"
            align: center      

      - type: "text"
        title: "🧱 Почему SpawnLocation особенный"
        text: |
          <h4>🧱 Part</h4>
          <ul>
            <li>просто блок</li>
            <li>Roblox не считает его важным</li>
            <li>он ничего не умеет</li>
          </ul>
          <h4>🟩 SpawnLocation</h4>
          <ul>
            <li>специальный объект Roblox</li>
            <li>движок следит за ним</li>
            <li>Roblox спрашивает: <em>«Здесь можно возрождать игрока?»</em></li>
          </ul>
          <p>👉 Это не магия.</p>    
          <p>👉 Это <b>встроенная функция Roblox.</b></p>          
     
      
      - type: "text"
        title: "📁 Где что находится в Studio"
        text: |
          <p>В Roblox чекпоинт состоит из двух частей:</p>
          <ul>
            <li><b>Checkpoint (Part)</b><p>👉 обычный Part в Workspace</p></li>
            <li><b>SpawnLocation</b>
              <ul>
                <li>👉 специальный объект Roblox</li>
                <li>👉 тоже находится в Workspace</li>
              </ul>

            </li>
          </ul>
          <p>❗ Это <b>разные объекты</b>, но они работают вместе.</p>

      - type: "oneImage"
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module4/lesson36-38/module4_36_2.png?raw=true"
            width: 100%
            maxWidth: "100%"
            align: center

      # ================================
      # СОЗДАЁМ ЧЕКПОИНТ
      # ================================
      - type: "text"
        title: "🟦 Шаг 1. Создаём чекпоинт"
        text:
          - "1. Создай Part → назови его <b>Checkpoint1</b>."
          - "2. Размер: 3×1×3"
          - "3. Сделай его плоским и яркого цвета."
          - "4. Поставь по центру пути."
          - "5. Установи <b>Anchored = true</b>."
          - "5. Вставь внутрь <b>Script</b>."
          - "👉 Это место касания, а не возрождения."

      - type: "text"
        title: "🟩 Шаг 2. Создаём точку возрождения. Создаём SpawnLocation"
        text:
          - "1. Вставь в игру объект <b>SpawnLocation</b> (Insert Object → SpawnLocation)."
          - "2. Переименуй его в <b>Spawn1</b>."
          - "3. Отключи <b>AllowTeamChangeOnTouch</b>."
          - "4. Спрячь его галочкой <b>Enabled = false</b> (но оставь в игре)."
          - "5. Поставь так, чтобы игрок появлялся над полом"
          - "👉 Именно SpawnLocation отвечает за возрождение."

      

      - type: "text"
        title: "Как это работает?"
        text:
          - "Когда игрок касается чекпоинта, мы запоминаем его номер."
          - "Потом, если он погибает, точка возрождения меняется на нужную."
      - type: "oneImage"
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module4/lesson36-38/module4_36_1.png?raw=true"
            width: 100%
            maxWidth: "100%"
            align: center
      

      - type: "text"
        title: "🧠 Как связать чекпоинт и SpawnLocation"
        text:
          - "Когда игрок касается чекпоинта, мы говорим игре:"
          - "«Если он умрёт — возроди его вот тут»"
      
      - type: "code"
        title: "💻 Код (с пояснениями)"
        code: |
          local checkpoint = script.Parent
          local spawn = workspace.Spawn1

          checkpoint.Touched:Connect(function(hit)
              local character = hit.Parent
              local player = game.Players:GetPlayerFromCharacter(character)

              if player then
                  player.RespawnLocation = spawn
              end
          end)
        afterText: |
          <h5>🧩 Пояснение</h5>
          <ul>
            <li><span style="font-family: monospace;">checkpoint</span> — наш блок-чекпоинт</li>
            <li><span style="font-family: monospace;">spawn</span> — точка возрождения</li>
            <li><span style="font-family: monospace;">Touched</span> — момент касания</li>
            <li><span style="font-family: monospace;">hit.Parent</span> — тело игрока</li>
            <li><span style="font-family: monospace;">GetPlayerFromCharacter</span> — находим игрока</li>
            <li><span style="font-family: monospace;">RespawnLocation</span> — <b>запоминаем, где возрождаться</b></li>
          </ul>
          <p>👉 Мы <b>не телепортируем</b> игрока сразу.</p>
          <p>👉 Мы <b>меняем место его будущего появления</b>.</p>
      - type: "oneImage"
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module4/lesson36-38/module4_36_3.png?raw=true"
            width: 100%
            maxWidth: "100%"
            align: center

      - type: "text"
        title: "🟢 Вопросы для размышления"
        text:
          - "1. Почему мы используем SpawnLocation, а не Part?"
          - "2. Почему чекпоинт и Spawn — разные объекты?"
          - "3. Что будет, если игрок умрёт без чекпоинта?"

      - type: hint
        title: "Подсказка 🔑 "
        text:
          - "1. Потому что <b>SpawnLocation умеет возрождать игрока автоматически</b>. Обычный Part — нет, он просто блок."
          - "2. Чекпоинт — это что <b>игрок трогает</b>, <br> Spawn — это где <b>он потом появится</b>. <br> Они делают <b>разные задачи</b>, поэтому разделены."
          - "3. Он появится на <b>стартовой SpawnLocation</b> (самой первой). <br>Прогресс не сохранится."
            

    quiz:
      
      - question: "Что делает чекпоинт?"
        answers:
          - "Меняет цвет игрока"
          - "Сохраняет место появления игрока"
