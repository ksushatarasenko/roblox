        afterText: "👉 Игрок может бегать туда-сюда, как через магические врата."

      - type: "warning"
        text: 
         - "Следи, чтобы порталы не стояли слишком близко, иначе игрок может «застрять»."

      - type: "code"
        title: "🚪 Часть 3 — Переход между комнатами (например, в другой зал)"    
        text: |
          Это похоже на двери в торговом центре:
          <p>зашёл — и сразу оказался в другом помещении.</p>
          <h4>📦 Подготовка:</h4>
            <ul>
              <li>Сделай комнату <b>Room1</b></li>
              <li>Сделай комнату <b>Room2</b></li>
              <li>В Room1 поставь Part → Door1</li>
              <li>В Room2 поставь Part → Door2</li>
              <li>Все двери Anchored = true</li>
