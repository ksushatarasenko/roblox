      - type: "hint"
        title: "Подсказка 🟢 2. Кислота — постепенный урон 🔑"
        text: |
          <p>📍 Скрипт внутри блока Acid (Part)</p>
        code: |
          -- КИСЛОТА: наносит урон со временем

          local acid = script.Parent
          local damagePerSecond = 10
          -- Сколько здоровья отнимается за один раз

          acid.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")

              if humanoid then
                  -- Пока игрок жив и стоит в кислоте
                  while humanoid.Health > 0 do
                      humanoid.Health = humanoid.Health - damagePerSecond
                      -- Отнимаем часть здоровья

                      wait(1)
                      -- Ждём 1 секунду
                  end
              end
          end)
        afterText: | 
          <p>🧠 Идея: Кислота опасна, но даёт время убежать.</p>
          <h5>⚠️ Важно</h5>
          <p><span style="font-family: monospace;">while + wait = урон со временем</span></p>

