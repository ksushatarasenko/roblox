    content:
      - type: "text"
        title: "🧨 Падающие платформы, яд и подбрасывание"
        text: |
          <b>Учимся создавать продвинутые ловушки</b>
          Сегодня мы делаем серьёзные ловушки, которые уже похожи на механики из настоящих Roblox-игр:
          <ul>
            <li><b>🟥 Падающие платформы</b></li>
            <li><b>🧪 Ядовитые зоны,</b> которые убивают постепенно</li>
            <li><b>🚀 Подбрасывающие ловушки</b>, как пружины или взрывы</li>
          </ul>

      - type: "text"
        title: "🎮 Почему эти ловушки важны?"
        text: |
          Они делают игру:
          <ul>
            <li>интереснее</li>
            <li>разнообразнее</li>
            <li>динамичнее</li>
            <li>вызывают эмоцию: «Ой! Чуть не упал!» 😄 </li>
          </ul>

      - type: "code"
        title: "🧱 Ловушка №1 — Падающая платформа"
        text:
          - "Платформа — это как печенька, которая начинает крошиться, если на неё наступить 🍪🤣"
          - "<h4>📦 Что делаем:</h4>"
          - "<ol><li>Создаём Part → называем FallPlatform</li><li>Anchored = true</li><li>Вставляем в неё Script</li></ol>"
          - "<h5>🧾 Код падающей платформы (понятный и простой)</h5>"
        code: |
          local platform = script.Parent

          platform.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              if humanoid then
                  print("Ох-ох, платформа трескается!")

                  task.wait(0.4)              -- задержка → оживляет механику
                  platform.Anchored = false   -- платформа падает!
                  platform.Transparency = 0.5 -- делает полу-прозрачной

                  task.wait(2)                -- время на восстановление
                  platform.Anchored = true    -- возвращаем на место
                  platform.Transparency = 0   -- снова нормальная
                  platform.Position = platform.Position + Vector3.new(0, 10, 0)
              end
          end)
        afterText: "🎉 Эффект: наступил → платформа падает → потом возвращается."

      - type: "code"
        title: "Платформа падает через 1 секунду"
        code: |
          local platform = script.Parent

          platform.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  task.wait(1)
                  platform.Anchored = false
              end
          end)

      - type: "code"
        title: "🧪 Ловушка №2 — Ядовитая зона"
        text: |
          <h5>Ассоциация:</h5>
          Представь, что игрок зашёл в токсичное болото, где воздух вредный 🫤☠️
          <h4>📦 Что делаем:</h4>
            <ul>
              <li>Создай зелёный Part → PoisonZone</li>
              <li>Добавь Script</li>
            </ul>
          <h5>🧾 Код «ядовитой зоны» (урон постепенно)</h5>
        code: |
          local zone = script.Parent
          local touching = false

          zone.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              if humanoid then
                  touching = true
                  print("Игрок в ядовитой зоне!")

                  while touching do
                      humanoid.Health -= 5
                      task.wait(0.5)
                  end
              end
          end)

          zone.TouchEnded:Connect(function(hit)
              touching = false
              print("Игрок покинул ядовитую зону.")
          end)
        afterText: 
          - "✔️ Игрок получает урон, пока стоит в зоне."
          - "✔️ Отличная ловушка для настоящего испытания."

      - type: "code"
        title: "🚀 Ловушка №3 — Подбрасывание (как взрыв или пружина)"
        text: |
          <h5>Ассоциация:</h5>
          Это как если в полу спрятана супер-пружина, которая БУХ! и подбрасывает игрока вверх 🎯🤸
          <p>Мы будем использовать <b>BodyVelocity</b>.</p>
          <h4>📦 Что делаем:</h4>
            <ul>
              <li>Создай Part → назови LaunchPad</li>
              <li>Вставь Script</li>
            </ul>
          <h5>🧾 Код подбрасывающей ловушки</h5>
        code: |
          local pad = script.Parent

          pad.Touched:Connect(function(hit)
              local character = hit.Parent
              local root = character:FindFirstChild("HumanoidRootPart")
              local humanoid = character:FindFirstChild("Humanoid")

              if root and humanoid then

                  local force = Instance.new("BodyVelocity")
                  force.Parent = root

                  -- подбрасываем вверх (Y = 120)
                  force.Velocity = Vector3.new(0, 120, 0)
                  force.MaxForce = Vector3.new(10000, 10000, 10000)

                  print("Игрок подброшен!")

                  task.wait(0.3)
                  force:Destroy()
              end
          end)
        afterText: 
          - "✔️ Создаёт эффект прыжка или взрыва 💥"
          - "✔️ Очень нравится детям — много смеха 😄"

      - type: "text" 
        title: "🎨 Улучшение ловушек (по желанию)"
        text: |
          Можно добавить:
          <h4>✨ Частицы</h4>
            <ul>
              <li>дым</li>
              <li>искры</li>
              <li>зелёную отраву</li>
              <li>огонь</li>
            </ul>
          <h4>🔊 Звуки</h4>
            <ul>
              <li>«кряк» для падения</li>
              <li>«пшшш» для яда</li>
              <li>«ух!» для подбрасывания</li>
            </ul>
          <h4>🌈 TweenService</h4>
            <ul>
              <li>плавное мигание платформы</li>
              <li>свечение ловушки при активации</li>
            </ul>
      #  Mini kwest
      - type: "text" 
        title: "🎁 Мини-квест (для ребёнка)"
        text: |
