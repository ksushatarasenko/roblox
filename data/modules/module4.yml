  - id: 39
    title: "⭐ УРОК 39. Опасные зоны — базовая идея"
    shortDescription: "Учимся создавать опасные зоны, (ПОНИМАНИЕ БЕЗ КОДОВОГО ХАОСА)."
    # video: "https://www.youtube.com/embed/LAVATRAP022"

    content:

      - type: "text"
        title: "🎯 Цель урока"
        text: |
          Понять, что в игре есть опасные объекты, которые могут навредить игроку, и как игра понимает, что игроку больно.
          <ul>
            <li>👉 В этом уроке мы <b>НЕ делаем сложных ловушек</b></li>
            <li>👉 Мы <b>НЕ используем эффекты</b></li>
            <li>👉 Мы учимся <b>самой идее урона</b></li>
          </ul>
      
      - type: "text"
        title: "🧠 Большая идея урока"
        text: |
          <p><em>В игре есть предметы, которые опасны.</em></p>
          <p><em>Если игрок их касается — ему становится плохо.</em></p>
          <ul>
            <li>Игрок в Roblox — <b>живой</b>, потому что у него есть <b>Humanoid</b>.</li>
            <li>А у Humanoid есть <b>жизни (Health)</b>.</li>
          </ul>
      
      - type: "text"
        title: "🔥 Что такое опасная зона?"
        text: |
          <p><b>Опасная зона</b> — это обычный <span style="font-family: monospace;">Part</span>, который <b>вредит игроку при касании</b>.</p>  
          Примеры:        
          <ul>
            <li>лава</li>
            <li>шипы</li>
            <li>яд</li>
            <li>огонь</li>
          </ul>
          <h5>📌 Важно:</h5>
          <p>Опасная зона — это <b>НЕ особый объект</b>, а <b>обычный Part + код</b>.</p>

      - type: "text"
        title: "❤️ Что такое Humanoid.Health"
        text: |
          <p>Humanoid — это «жизнь» игрока.</p>  
          <p>Health — это <bсколько жизней у него осталось></bсколько>.</p>  
          Примеры:        
          <ul>
            <li><span style="font-family: monospace;">Health = 100</span> → игрок жив</li>
            <li><span style="font-family: monospace;">Health = 0</span> → игрок умер</li>
          </ul>
          <p>👉 Если мы изменим <span style="font-family: monospace;">Health</span>, мы <b>влияем на состояние игрока</b>.</p>


      - type: "gallery"
        title: "Примеры ловушек"
        images:
          - src: "https://i.ytimg.com/vi/KZT0i_UHWDk/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLCyZY0xN_4WPbiNIY90PFHquaTOhA"
          - src: "https://egamersworld.com/cdn-cgi/image/width=690,quality=75,format=webp/uploads/content/1/17/1755705427704_resized.png"
          - src: "https://tr.rbxcdn.com/180DAY-c6b6eaf4129c73c41a4d71bc9a309365/768/432/Image/Webp/noFilter"
      # ================================
      # СОЗДАЁМ блок-ловушку
      # ================================
      - type: "text"
        title: "🧩 Простой пример: лава (мгновенная смерть)"
        text: |
          Если игрок коснулся лавы — он сразу погибает.

      - type: "text"
        title: "🧪 Практика: сделаем опасную лаву"
        text:
          - "🛠 Шаги"
          - "Создай Part"
          - "Назови его Lava"
          - "Сделай его: красным, Anchored = true"
          - "Добавь внутрь Script"
      - type: "hint"
        title: "💻 Код (ПОДСКАЗКА)"
        code: |
          script.Parent.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")

              if humanoid then
                  humanoid.Health = 0
              end
          end)
        afterText: |
          <h4>🧠 Объяснение простыми словами</h4>
          <p><span style="font-family: monospace;">script.Parent.Touched:Connect(function(hit)</span></p>
          <p>👉 Мы говорим игре: «Когда кто-то коснётся этого блока…»</p>
          <br>
          <p><span style="font-family: monospace;">local character = hit.Parent</span></p>
          <p>👉 Узнаём, к какому телу принадлежит эта часть</p>
          <br>
          <p><span style="font-family: monospace;">local humanoid = character:FindFirstChild("Humanoid")</span></p>
          <p>👉 Проверяем: «Это живой игрок?»</p>
          <br>
          <p><span style="font-family: monospace;">if humanoid then</span></p>
          <p>👉 Если это правда игрок…</p>
          <br>
          <p><span style="font-family: monospace;">humanoid.Health = 0</span></p>
          <p>👉 Убираем все жизни → игрок погибает</p>


      - type: "text"
        title: "🟢 Подумай"
        text: 
          - "1. Почему лава — это просто Part?"
          - "2. Почему мы работаем с Humanoid, а не с Player?"
          - "3. Что будет, если этот блок коснётся NPC?"

      - type: "code"
        title: "❗ Частая ошибка"
        text: "❌ Пытаться писать:"
        code: |
          player.Health = 0
        afterText: | 
          <p>✔ Правильно: Работать только с Humanoid</p>
        

      - type: "text"
        title: "🧪 Мини-задание"
        text: |
          Попробуй:
          <ul>
            <li>изменить цвет лавы</li>
            <li>сделать несколько опасных блоков</li>
            <li>разместить лаву под платформой</li>
          </ul>
        afterText: "👉 Код менять НЕ нужно"

      - type: hint
        title: "Подсказка  🔑"
        text: "📌 Один и тот же код можно использовать для ЛЮБОГО опасного блока (лавы, шипов, яда и т.д.)"
        code: |
          -- Этот скрипт лежит ВНУТРИ опасного блока (Part)

          local lava = script.Parent
          -- script.Parent — это сам блок, в который мы вставили скрипт

          lava.Touched:Connect(function(hit)
              -- Этот код срабатывает, когда кто-то касается блока

              local character = hit.Parent
              -- hit — это часть тела (например, нога)
              -- hit.Parent — всё тело игрока (Character)

              local humanoid = character:FindFirstChild("Humanoid")
              -- Проверяем: есть ли у этого тела Humanoid
              -- Если есть — значит это живой игрок (или NPC)

              if humanoid then
                  -- Если это действительно игрок…

                  humanoid.Health = 0
                  -- Убираем все жизни
                  -- Игрок сразу умирает
              end
          end)
        afterText: |
          <h4>🧠 Почему код менять НЕ нужно</h4>
          <h5>🔴 1. Изменить цвет лавы</h5>
          <p>👉 Это внешний вид, а не логика.</p>
          <p>Ты просто:</p>
          <ul>
            <li>выбираешь блок</li>
            <li>меняешь Color в Properties</li>
          </ul>
          <p>🧠 Код отвечает за поведение, цвет — за красоту.</p>
          <h5>🔴 2. Сделать несколько опасных блоков</h5>
          <p>👉 Просто скопируй блок вместе со скриптом.</p>
          <p>Каждый блок:</p>
          <ul>
            <li>имеет свой скрипт</li>
            <li>работает одинаково</li>
            <li>убивает игрока при касании</li>
          </ul>
          <p>🧠 Один код → много опасностей.</p>
          <h5>🔴 3. Разместить лаву под платформой</h5>
          <p>👉 Это дизайн уровня, а не код.</p>
          <ul>
            <li>игрок упал</li>
            <li>коснулся лавы</li>
            <li>код сработал</li>
          </ul>
          <p>🧠 Код не знает, где стоит блок. <br>Он знает только: коснулись или нет.</p>






    quiz:
      - question: "Что такое опасная зона?"
        answers:
          - "Особый объект Roblox"
          - "Обычный Part с кодом"
          - "Настройка игрока"
        correct: 1

      - question: "Где находится здоровье игрока?"
        answers:
          - "В Player"
          - "В Character"
          - "В Humanoid"
        correct: 2

      - question: "Что делает humanoid.Health = 0?"
        answers:
          - "Телепортирует игрока"
          - "Убивает игрока"
          - "Останавливает движение"
        correct: 1

      - question: "Когда срабатывает Touched?"
        answers:
          - "Когда игрок нажимает кнопку"
          - "Когда игрок касается объекта"
          - "Когда игрок умирает"
        correct: 1

      - question: "Можно ли сделать опасную зону без кода?"
        answers:
          - "Да"
          - "Нет"
          - "Только с эффектами"
        correct: 1

    end:
      - type: "text"
        title: "🎉 Итог: Теперь ты знаешь:"
        text: |
          <ul>
            <li>что такое опасная зона</li>
            <li>где находятся жизни игрока</li>
            <li>как игра понимает, что игроку больно</li>
            <li>как сделать первую опасность в игре</li>
          </ul>
          <h4>🔥 Ты только что сделал свою первую игровую угрозу. Это первый шаг к настоящим уровням и Obby!</h4>

# ===============================
# ⭐ УРОК 40. Опасные зоны — базовая идея
# ===============================
  - id: 40
    title: "⭐ УРОК 40. Разные виды урона"
    shortDescription: "Мы учимся управлять здоровьем игрока по-разному."
    # video: "https://www.youtube.com/embed/LAVATRAP022"

    content:

      - type: "text"
        title: "🎯 Цель урока"
        text: |
          <p>В игре урон бывает разным.</p>
          <p>Иногда игрок умирает сразу, а иногда — теряет здоровье постепенно.</p>
          
      
      - type: "text"
        title: "🧠 Большая идея урока"
        text: |
          <p><span style="font-family: monospace;">Humanoid.Health — это число</span>.</p>
          <ul>
            <li>Если сделать 0 → смерть</li>
            <li>Если уменьшать понемногу → постепенный урон</li>
          </ul>
      
      - type: "code"
        title: "🔥 Виды урона в игре"
        text: |
          <h5>1️⃣ Мгновенная смерть (лава)</h5>
          <ul>
            <li>игрок коснулся</li>
            <li>здоровье сразу = 0</li>
            <li>игрок умер</li>
          </ul>
        code: |  
          humanoid.Health = 0
        afterText: |
          <p>📌 Используется для:</p>
          <ul>
            <li>лавы</li>
            <li>пропасти</li>
            <li>смертельных ловушек</li>
          </ul>


      - type: "text"
        title: "2️⃣ Постепенный урон (кислота)"
        text: |                
          <ul>
            <li>игрок стоит в зоне</li>
            <li>здоровье уменьшается по чуть-чуть</li>
            <li>если уйдёт — урон прекратится</li>
          </ul>
          <p>🧠 Тут важно:</p>
          <ul>
            <li><span style="font-family: monospace;">Touched</span></li>
            <li><span style="font-family: monospace;">TouchEnded</span></li>
            <li><span style="font-family: monospace;">while</span></li>
            <li><span style="font-family: monospace;">wait()</span></li>
          </ul>


      - type: "oneImage"
        title: "Pułapki śmierci na wyspie"
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module4/lesson40-43/Pu%C5%82apki%20s%CC%81mierci%20na%20wyspie.png?raw=true"
            width: 100%
            maxWidth: "100%"
            align: center
      
      - type: "code"
        title: "🧪 Пример: кислота (постепенный урон)"
        code: |
          -- Скрипт внутри кислотного блока

          local acid = script.Parent  
          local damaging = {}

          acid.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")

              if humanoid and not damaging[humanoid] then
                  damaging[humanoid] = true

                  -- Пока игрок в кислоте
                  while damaging[humanoid] do
                      humanoid.Health -= 5
                      wait(1)
                  end
              end
          end)

          acid.TouchEnded:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")

              if humanoid then
                  damaging[humanoid] = nil
              end
          end)
        afterText: |
          <h5>🧠 Объяснение простыми словами</h5>
          <ul>
            <li><span style="font-family: monospace;">damaging</span> — таблица, которая запоминает, кто сейчас получает урон</li>
            <li><span style="font-family: monospace;">while</span> — повторяет урон, пока игрок в зоне</li>
            <li><span style="font-family: monospace;">TouchEnded </span>— говорит игре: «игрок ушёл»</li>
          </ul>
          <p>👉 Игрок сам контролирует урон:</p>
          <p>стоит — больно, ушёл — безопасно.</p>


      
      - type: "code"
        title: "🌵 3️⃣ Шипы (не сразу убивают)"
        text: |
          <ul>
            <li>игрок наступил</li>
            <li>получил немного урона</li>
            <li>может успеть убежать</li>
          </ul>
        code: |
          humanoid.Health -= 20
        afterText: |          
          <p>📌 Используется для:</p>
          <ul>
            <li>шипов</li>
            <li>ловушек</li>
            <li>наказания за ошибку</li>
          </ul>


      - type: "text"
        title: "🛠 Практическое задание"
        text: |
          <p>Создай 3 опасных блока:</p>
          <ul>
            <li>🔥 Лава — мгновенная смерть</li>
            <li>🟢 Кислота — постепенный урон</li>
            <li>🌵 Шипы — урон, но не смерть</li>
          </ul>
          <h5>✅ Условия</h5>
          <ul>
            <li>код менять МОЖНО</li>
            <li>эффекты НЕ использовать</li>
            <li>главное — логика</li>
          </ul>
          <h5>💡 Подсказка</h5>
          <ul>
            <li>Если урон повторяется → нужен while</li>
            <li>Если урон один раз → достаточно Touched</li>
          </ul>


      - type: "hint"
        title: "Подсказка 🔥 1. Лава — мгновенная смерть🔑"
        text: |
          <p>📍 Скрипт внутри блока Lava (Part)</p>
        code: |
          -- ЛАВА: убивает сразу

          local lava = script.Parent
          -- script.Parent — это сам блок лавы

          lava.Touched:Connect(function(hit)
              -- Срабатывает, когда кто-то касается лавы

              local character = hit.Parent
              -- Получаем тело игрока

              local humanoid = character:FindFirstChild("Humanoid")
              -- Проверяем: есть ли Humanoid (значит это игрок)

              if humanoid then
                  humanoid.Health = 0
                  -- Сразу убираем все здоровье
                  -- Игрок мгновенно умирает
              end
          end)
        afterText: | 
          <p>🧠 Идея: Лава не даёт шансов — коснулся → умер.</p>

      - type: "oneImage"
        title: "Лава"
        textTop: ""
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module4/lesson40-43/1.%20%D0%9B%D0%B0%D0%B2%D0%B0%20%E2%80%94%20%D0%BC%D0%B3%D0%BD%D0%BE%D0%B2%D0%B5%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%81%D0%BC%D0%B5%D1%80%D1%82%D1%8C.png?raw=true"
            width: 100%
