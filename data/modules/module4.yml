      - type: "text"
        title: "🟠 4. Нестандартные формы чекпоинтов 🎨"
        text: |
          <h4>Идея</h4>
          <p>Чекпоинт — это не обязательно флаг.</p>
          <h5>Он может быть:</h5>
          <ul>
            <li>кольцом</li>
            <li>кнопкой</li>
            <li>плиткой</li>
            <li>шаром</li>
            <li>кристаллом</li>
            <li>светящейся зоной</li>
          </ul>
          <h5>Важная мысль</h5>
          <ul>
            <li>Форма — любая.</li>
            <li>Логика — внутри.</li>
          </ul>
       
      - type: "oneImage"
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module4/lesson36-38/%D0%9D%D0%B5%D1%81%D1%82%D0%B0%D0%BD%D0%B4%D0%B0%D1%80%D1%82%D0%BD%D1%8B%D0%B5%20%D1%84%D0%BE%D1%80%D0%BC%D1%8B%20%D1%87%D0%B5%D0%BA%D0%BF%D0%BE%D0%B8%D0%BD%D1%82%D0%BE%D0%B2.png?raw=true"
            width: 100%
            maxWidth: "100%"
            align: center  
      
      - type: "text"
        title: "🔴 5. Чекпоинт как мини-квест 🧩"
        text: |
          <h4>Идея</h4>
          <p>Чекпоинт активируется не сразу.</p>
          <h5>Игрок должен:</h5>
          <ul>
            <li>нажать кнопку</li>
            <li>собрать предмет</li>
            <li>пройти испытание</li>
            <li>выбрать правильный путь</li>
          </ul>
          <h5>Пример</h5>
          <p><em>«Если ты дошёл сюда и выполнил задание — игра тебя запомнит»</em></p>

      - type: "oneImage"
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module4/lesson36-38/%D0%A7%D0%B5%D0%BA%D0%BF%D0%BE%D0%B8%D0%BD%D1%82%20%D0%BA%D0%B0%D0%BA%20%D0%BC%D0%B8%D0%BD%D0%B8-%D0%BA%D0%B2%D0%B5%D1%81%D1%82.png?raw=true"
            width: 100%
            maxWidth: "100%"
            align: center    
      
      
      - type: "text"
        title: "🛠 Практика: Система игровых чекпоинтов"
        text: |
          <h4>🎯 Задача</h4>
          <p>Собрать систему чекпоинтов, где каждый чекпоинт — это игровая механика, а не просто сохранение.</p>
          <h4>✅ Что нужно сделать</h4>
          <h5>1️⃣ Подготовь сцену</h5>
          <ul>
            <li>Создай мини-уровень (Obby)</li>
            <li>Добавь:
              <ul>
                <li>стартовую платформу</li>
                <li>2–3 препятствия</li>
                <li>финишную платформу</li>
              </ul>
            </li>            
          </ul>
          <h5>2️⃣ Создай чекпоинты</h5>
          <p>Для каждого чекпоинта:</p>
          <ul>
            <li>Part (любой формы)</li>
            <li>Назови: Checkpoint1, Checkpoint2, Checkpoint3</li>
          </ul>
          <h53️⃣ Создай точки возрождения</h5>
          <ul>
            <li>Добавь SpawnLocation для каждого чекпоинта</li>
            <li>Назови: Spawn1, Spawn2, Spawn3</li>
            <li>Отключи Neutral, если нужно</li>
          </ul>
          <h54️⃣ Свяжи чекпоинт и Spawn</h5>
          <p>Для каждого чекпоинта:</p>
          <ul>
            <li>При касании:
               <ul>
                  <li>сохрани прогресс (player.RespawnLocation)</li>
                  <li>активируй игровую механику</li>
                </ul>
            </li>            
          </ul>
          <h5>5️⃣ Добавь игровые эффекты (выбери минимум 2)</h5>
          <p>Каждый чекпоинт должен что-то делать:</p>
          <ul>
            <li>🎁 Чекпоинт с бонусом
               <p>(+очки / +монеты)</p>
            </li>   
            <li>⚡ Чекпоинт с суперскоростью
               <p>(увеличь WalkSpeed)</p>
            </li> 
            <li>🚪 Секретный чекпоинт
               <p>(телепорт в скрытое место)</p>
            </li> 
            <li>🎨 Визуальный эффект
               <p>(цвет, прозрачность, частицы)</p>
            </li>    
            <li>🔊 Звук активации</li>       
          </ul>
       
      - type: "text"
        title: "🧪 Самопроверка"
        text: |
          <p>Ты всё сделал правильно, если:</p>
          <ul>
            <li>✅ игрок возрождается на последнем чекпоинте</li>
            <li>✅ каждый чекпоинт делает что-то особенное</li>
            <li>✅ прогресс не теряется</li>
            <li>✅ уровень ощущается как ИГРА</li>
          </ul>
     
      - type: hint
        title: "Подсказка с кодом 🔑"
        text: |
          <p>Этот чекпоинт:</p>
          <ul>
            <li>сохраняет точку возрождения</li>
            <li>даёт бонус (монеты)</li>
            <li>даёт суперскорость</li>
            <li>проигрывает звук</li>
            <li>меняет цвет</li>
            <li>работает один раз</li>
          </ul>
        code: |
          -- Скрипт лежит ВНУТРИ чекпоинта (Part)
          -- === НАСТРОЙКИ ЧЕКПОИНТА ===

          local checkpoint = script.Parent          -- сам чекпоинт (Part)
          local spawnPoint = workspace.Spawn1       -- точка возрождения

          local bonusCoins = 10                     -- сколько монет дать
          local speedBonus = 32                     -- скорость после чекпоинта
          local normalSpeed = 16                    -- обычная скорость
          local speedTime = 5                       -- сколько секунд действует ускорение

          local used = false                        -- чтобы чекпоинт сработал один раз

          -- === ЗВУК ===
          local sound = Instance.new("Sound")
          sound.SoundId = "rbxassetid://9118828565"  -- пример звука
          sound.Volume = 1
          sound.Parent = checkpoint


          -- === ОСНОВНАЯ ЛОГИКА ===

          checkpoint.Touched:Connect(function(hit)

            -- 1. Проверяем: чекпоинт уже использовали?
            if used then return end

            -- 2. Находим тело игрока
            local character = hit.Parent
            local humanoid = character:FindFirstChild("Humanoid")
            if not humanoid then return end

            -- 3. Находим игрока (Player)
            local player = game.Players:GetPlayerFromCharacter(character)
            if not player then return end

            used = true -- помечаем чекпоинт как использованный

            -- === СОХРАНЕНИЕ ПРОГРЕССА ===
            player.RespawnLocation = spawnPoint

            -- === БОНУС (МОНЕТЫ) ===
            local leaderstats = player:FindFirstChild("leaderstats")
            if leaderstats then
              local coins = leaderstats:FindFirstChild("Coins")
              if coins then
                coins.Value += bonusCoins
              end
            end

            -- === СУПЕРСКОРОСТЬ ===
            humanoid.WalkSpeed = speedBonus

            task.delay(speedTime, function()
              if humanoid then
                humanoid.WalkSpeed = normalSpeed
              end
            end)

            -- === ЭФФЕКТЫ ===
            sound:Play()                             -- звук
            checkpoint.Color = Color3.fromRGB(0, 255, 0) -- меняем цвет
            checkpoint.Transparency = 0.3           -- делаем полупрозрачным

          end)

        afterText: |
          <h5>🧠 Пояснение</h5>
          <h5>🔹 1. Настройки</h5>
          <ul>
            <li><span style="font-family: monospace;">local bonusCoins = 10</span></li>
