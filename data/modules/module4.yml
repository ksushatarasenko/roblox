# ============================================================
# УРОК 31 — Чекпоинты
# ============================================================
  - id: 31
    title: "⭐ Урок 31. Чекпоинты и респаун игрока"
    shortDescription: "Учимся делать точки сохранения: игрок умирает — появляется там же. (сохранять прогресс и правильно возрождать игрока)"
    video: "https://www.youtube.com/embed/HQQdsMtRg7k?si=OA1rgOVylS-PKlTT"

    content:

      - type: "text"
        title: "🎮 Что такое чекпоинт?"
        text: |
          Представь, что твой персонаж бежит по длинному опасному пути.
          <p><em>Лава, прыжки, ловушки</em> — ошибка → смерть → снова сначала… ой 😭</p>
          Чтобы так не мучиться, игре нужны чекпоинты.
          <p><b>Чекпоинт</b> — это место, куда игрок вернётся после смерти.</p>
          - "Игрок коснулся чекпоинта → и он запомнился."

      - type: "gallery"
        title: "Примеры чекпоинтов"
        images:
          - src: "https://i.ytimg.com/vi/EYgZZxwIvro/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLBfANeAL5icEqkrDu4rfXJ7JkipJQ"
          - src: "https://i.ytimg.com/vi/H87g7jrVuT4/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLAek0Dj95j8Z6yLK8oFCkQtDKG5xQ"

      - type: "code"
        title: "⭐ Что такое точка респауна (RespawnLocation)?"
        text: |
          Каждый игрок появляется в мире Roblox на SpawnLocation — это стартовая точка.
          <p>Но!</p>
          Мы можем сделать так, чтобы каждый игрок имел СВОЮ личную точку респауна.
          <p>Для этого у игрока есть свойство:</p>          
        code: |
          player.RespawnLocation = какой_то_SpawnLocation

      - type: "steps"
        title: "🧱 Шаг 1. Создаём чекпоинт"
        items:
          - "1. Создай Part → назови <b>Checkpoint</b>"
          - "2. Покрась в яркий цвет"
          - "3. Установи <b>Anchored = true</b>"
          - "4. Добавь <b>Script</b>"
          - "Можно даже сделать платформу светящейся или с эффектами."
      - type: "steps"
        title: "📍 Шаг 2. Создаём точку респауна"
        items:
          - "1. Добавь  <b>SpawnLocation</b>"
          - "2. Назови его <b>Respawn1</b>"
          - "3. Выключи галочку <b>Enabled </b> (иначе игрок будет сразу спавниться на нём)"
          - "4. Перемести его туда, где игрок должен оживать"
          - "Можно даже сделать платформу светящейся или с эффектами."

      - type: "code"
        title: "🧠 Шаг 3. Ловим прикосновение к чекпоинту"
        text: "⚠ Важно: игроков можно поймать по Humanoid."
        code: |
          -- Получаем сам чекпоинт (платформа)
          local checkpoint = script.Parent

          -- Точка появления, куда будем возрождать игрока
          local respawnPoint = workspace:WaitForChild("Respawn1")

          -- Когда кто-то касается чекпоинта
          checkpoint.Touched:Connect(function(hit)

              -- hit.Parent — это модель игрока
              local character = hit.Parent 

              -- ищем Humanoid, чтобы понять, что это именно игрок
              local humanoid = character:FindFirstChild("Humanoid")
              if humanoid then
                  
                  -- Достаём Player по модели персонажа
                  local player = game.Players:GetPlayerFromCharacter(character)

                  if player then
                      -- Устанавливаем чекпоинт:
                      -- теперь игрок будет возрождаться на Respawn1
                      player.RespawnLocation = respawnPoint

                      print("Чекпоинт активирован!")

                      -------------------------------------------------
                      -- ЭФФЕКТЫ ДЛЯ КРАСОТЫ
                      -------------------------------------------------

                      -- меняем цвет чекпоинта (радостный эффект)
                      checkpoint.Color = Color3.fromRGB(0, 255, 0)

                      -- делаем лёгкую анимацию "подскока"
                      local oldSize = checkpoint.Size
                      checkpoint.Size = oldSize + Vector3.new(0, 1, 0)
                      task.wait(0.2)
                      checkpoint.Size = oldSize

                      -- можно добавить звук, если есть:
                      -- checkpoint.Sound:Play()
                  end
              end
          end)

      - type: "note"
        text: "Чекпоинты работают через свойство <b>RespawnLocation</b>."
      - type: "text"
        title: "🎉 Что теперь умеет игрок?"
        text: |
          <ol>
            <li>Встаёт на чекпоинт</li>
            <li>Игра это запоминает</li>
            <li>Если игрок умирает (падает в лаву/пропасть/шипы),</li>
            <li>Он возрождается на Respawn1, а не на старте!</li>
          </ol>
      # mini-kwest
      - type: "text"
        title: "🧪 Хочешь мини-квест?"
        text: |
          <p><b>📍 Чекпоинт, который НЕ срабатывает, если у игрока мало здоровья.</b><ul><li>(Использовать humanoid.Health)</li></ul></p>
          <p><b>📍 Чекпоинт, который играет звук победы.</b><ul><li>(Sound:Play())</li></ul></p>
          <p><b>📍 Чекпоинт, который светится через TweenService.</b><ul><li>(например, плавное изменение цвета)</li></ul></p>
          <p><b>📍 Два чекпоинта — первый красный, второй зелёный, и игрок должен активировать их по порядку.</b><ul><li></li></ul></p>

      - type: "hint"
        title: "⭐ КОД-ПОДСКАЗКА №1 — Чекпоинт, который срабатывает только если здоровье > 50"
        code: |
          local checkpoint = script.Parent
          local respawnPoint = workspace.Respawn1

          checkpoint.Touched:Connect(function(hit)
              local char = hit.Parent
              local humanoid = char:FindFirstChild("Humanoid")

              if humanoid and humanoid.Health > 50 then
                  local player = game.Players:GetPlayerFromCharacter(char)
                  if player then
                      player.RespawnLocation = respawnPoint
                      print("Чекпоинт активирован! Здоровье достаточно высокое.")
                  end
              end
          end)
        afterText: "✔️ можно делать условия с Health."

      - type: "hint"
        title: "⭐ КОД-ПОДСКАЗКА №2 — Чекпоинт, который проигрывает звук"
        code: |
          local checkpoint = script.Parent
          local respawnPoint = workspace.Respawn1
          local sound = checkpoint:FindFirstChild("Sound")  -- звук должен быть внутри чекпоинта

          checkpoint.Touched:Connect(function(hit)
              local char = hit.Parent
              local humanoid = char:FindFirstChild("Humanoid")

              if humanoid then
                  local player = game.Players:GetPlayerFromCharacter(char)
                  if player then
                      player.RespawnLocation = respawnPoint
                      if sound then sound:Play() end
                      print("Чекпоинт активирован со звуком!")
                  end
              end
          end)

        afterText: "✔️ ✔ Дети любят звук — код мотивирует их добавлять эффекты."

      - type: "hint"
        title: "⭐ КОД-ПОДСКАЗКА №3 — Чекпоинт, который загорается через TweenService"
        code: |
          local checkpoint = script.Parent
          local respawnPoint = workspace.Respawn1
          local TweenService = game:GetService("TweenService")

          checkpoint.Touched:Connect(function(hit)
              local char = hit.Parent
              local humanoid = char:FindFirstChild("Humanoid")

              if humanoid then
                  local player = game.Players:GetPlayerFromCharacter(char)
                  if player then
                      player.RespawnLocation = respawnPoint

                      -- Плавное свечение
                      local tweenInfo = TweenInfo.new(0.5)
                      local tween = TweenService:Create(checkpoint, tweenInfo, {
                          Color = Color3.fromRGB(0, 255, 0)
                      })
                      tween:Play()

                      print("Чекпоинт красиво активирован!")
                  end
              end
          end)
        afterText: 
          - "✔️ Тут вспоминается Урок 18 — TweenService."
          - "✔️ Короткий и красивый пример."

      - type: "hint"
        title: "⭐ КОД-ПОДСКАЗКА №4 — Два чекпоинта: активировать можно только по порядку"
        text: "РЕБЁНОК видит, что можно хранить состояние."
        code: |
          -- Первым должен быть активирован Checkpoint1
          local checkpoint = script.Parent
          local respawnPoint = workspace.Respawn2
          local playerStage = workspace:FindFirstChild("PlayerStage")  -- NumberValue

          checkpoint.Touched:Connect(function(hit)
              local char = hit.Parent
              local humanoid = char:FindFirstChild("Humanoid")

              if humanoid then
                  local player = game.Players:GetPlayerFromCharacter(char)
                  if player then
                      
                      -- Проверяем: активирован ли первый чекпоинт?
                      if playerStage.Value == 1 then
                          player.RespawnLocation = respawnPoint
                          playerStage.Value = 2  -- поднимаем уровень прогресса
                          print("Активация чекпоинта 2!")
                      else
                          print("Сначала активируй чекпоинт 1!")
                      end
                  end
              end
          end)
        afterText: 
          - "✔️ Это отличный мостик к системам прогресса и уровней."
          - "✔️ Ребёнок увидит, как можно проверять порядок действий."



    quiz:
      - question: "Что делает RespawnLocation?"
        answers:
          - "Меняет скорость игрока"
          - "Указывает, где игрок появится после смерти"
          - "Убивает игрока"
        correct: 1
    end:
      - type: "text"
        title: "🎉 Итог: Теперь ты умеешь: 🧠"
        text: |
          <ul>
            <li>что такое чекпоинт</li>
            <li>что такое респаун</li>
            <li>как сделать сохранение прогресса</li>
            <li>как настроить RespawnLocation</li>
            <li>как красиво оформить чекпоинт</li>
          </ul>
          <h4>Это фундамент для любых Obby, адвенчур, уровней и мини-игр! 🎮</h4>


# ============================================================
# УРОК 32 — Зоны урона и безопасные зоны
# ============================================================
  - id: 32
    title: "🌟 Урок 32. Зоны урона и безопасные зоны"
    shortDescription: "Создаём лаву, шипы, яд, зоны замедления и безопасные платформы."
    # video: "https://www.youtube.com/embed/DAMAGE27"

    content:
      - type: "text"
        text: "Сегодня мы научимся создавать разные «зоны действия» — опасные и добрые. Это основа для Obby, мини-игр, паркуров и приключений!"
      - type: "text"
        title: "🎮 Что такое зона?"
        text:
          - "Зона — это обычный Part, который вызывает эффект при касании."
          - "Зона — это любой блок, который реагирует на прикосновение игрока:"
          - "🔥 Лава — наносит урон"
          - "☠️ убивает"
          - "🧪 отравляет"
          - "🐌 замедляет"
          - "💚 защищает / лечит"
          - "🛡 восстанавливает здоровье"
          - "Можно представить, что игрок идёт по карте, а земля под ним меняет правила игры."

      - type: "text"
        title: "🧒 Ассоциация"
        text: |
          Представь пол в игре как <em>шахматную доску</em>:
          <ul>
            <li>красные клетки — опасность</li>
            <li>зелёные — защита</li>
            <li>жёлтые — замедление</li>
            <li>синие — ускорение</li>
          </ul>
          Игрок вступает на клетку → происходят изменения.


      - type: "steps"
        title: "🟧 Шаг 1. Создаём лаву (мгновенная смерть)"
        items:
          - "Создай Part → назови Lava"
          - "Покрась в красный или оранжевый"
          - "Material = Neon"
          - "Anchored = true"
          - "Добавь Script"

      - type: "code"
        title: "🔥 Код лавы"
        code: |
          local lava = script.Parent

          lava.Touched:Connect(function(hit)
              local char = hit.Parent
              local humanoid = char:FindFirstChild("Humanoid")

              if humanoid then
                  humanoid.Health = 0 -- убиваем игрока
                  print("Игрок упал в лаву!")
              end
          end)
        afterText: "Просто и понятно: коснулся — умер."

      - type: "code"
        title: "🟥 Шаг 2. Шипы (урон, но не смерть сразу)"
        text: 
          - "1. Создай Part → назови Spikes"
          - "2. Material = Metal"
          - "Добавь Script"
          - "<h4>⚔️ Код шипов:</h4>"
        code: |
          local spikes = script.Parent

          spikes.Touched:Connect(function(hit)
              local char = hit.Parent
              local humanoid = char:FindFirstChild("Humanoid")

              if humanoid then
                  humanoid.Health -= 20 -- снимаем здоровье
                  print("Игрок получил урон от шипов!")
              end
          end)

      - type: "code"
        title: "🧪 Шаг 3. Ядовитая зона (урон постепенно)"
        text: 
          - "Это как если игрок стоит в зелёном токсичном дыму."
          - "<h4>☠️ Код яда:</h4>"
        code: |
          local poison = script.Parent
          local touching = false

          poison.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              if humanoid then
                  touching = true

                  while touching do
                      humanoid.Health -= 5
                      print("Отравление!")
                      task.wait(0.5) -- урон каждые полсекунды
                  end
              end
          end)

          poison.TouchEnded:Connect(function(hit)
              touching = false
          end)
        afterText: "Пока игрок стоит в облаке → здоровье уменьшается."

      - type: "code"
        title: "🐌 Шаг 4. Зона замедления (слизь, ледяная поляна)"
        text:
          - "Представь, что игрок зашёл в болотистую воду."
          - "<h4>🐢 Код зоны замедления:</h4>"
        code: |
          local slowZone = script.Parent

          slowZone.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              if humanoid then
                  humanoid.WalkSpeed = 8 -- медленный шаг
                  print("Игрок замедлен!")
              end
          end)

          slowZone.TouchEnded:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              if humanoid then
                  humanoid.WalkSpeed = 16 -- нормальная скорость
                  print("Скорость восстановлена")
              end
          end)
        afterText: "Удобный способ сделать болото, лед или паутину."

      - type: "warning"
        text: "Не забывай возвращать скорость обратно!"

      - type: "code"
        title: "💚 Шаг 5. Безопасная зона (восстановление здоровья)"
        text: 
          - "Это зелёная платформа, где игрок отдыхает."
          - "<h4>💚 Код безопасной платформы:</h4>"
        code: |
          local safe = script.Parent

          safe.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              if humanoid then
                  humanoid.Health += 5 -- по чуть-чуть лечим
                  print("Игрок в безопасной зоне!")
              end
          end)
        afterText: "Можно сделать эффект «подсветки» или «лечащего луча»."

      - type: "code"
        title: "✨ Шаг 6. Улучшаем зоны с эффектами"
        text: |
          Можно добавить:
          <h5>🔊 звук</h5>
          -(safe.Sound:Play())
          <h5>🌈 плавное свечение</h5>
          - (TweenService — урок 18)
          <h5>🔥 частицы</h5>
          - (ParticleEmitter внутри зоны)
          <h5>💡 смену цвета при активации</h5>
        code: |
          lava.Color = Color3.new(1, 0.2, 0)

      # mini-kwest
      - type: "text"
        title: "🧪 Мини-квест"
        text: |
          <p>📍 платформу, которая забирает скорость (WalkSpeed = 0) на 1 секунду</p>
          <p>📍 зону «прыг-скок» (JumpPower = 100)</p>
          <p>📍 опасную платформу, которая мигает и наносит урон только когда красная</p>
          <p>📍 зону «телепорт в безопасную комнату»</p>
          <p>📍 зону, которая отталкивает игрока (VectorForce или BodyVelocity)</p>


      - type: "hint"
        title: "⭐ 1. Платформа, которая забирает скорость (WalkSpeed = 0) на 1 секунду"
        code: |
          local pad = script.Parent

          pad.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              if humanoid then
                  humanoid.WalkSpeed = 0   -- остановить игрока
                  print("Стоп! Игрок заморожен.")

                  task.wait(1)             -- ждём 1 секунду

                  humanoid.WalkSpeed = 16  -- вернуть обычную скорость
                  print("Скорость восстановлена!")
              end
          end)
        afterText: 
          - "🎮 Эффект: игрок наступает → останавливается → через 1 сек возвращается скорость."
          - ЭОчень простой и понятный эффект «заморозки».

      - type: "hint"
        title: "⭐ 2. Зона «прыг-скок» — JumpPower = 100"
        code: |
          local jumpPad = script.Parent

          jumpPad.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              if humanoid then
                  humanoid.JumpPower = 100            -- супер прыжок
                  humanoid:ChangeState(Enum.HumanoidStateType.Jumping)
                  print("Прыг-скок! Суперпрыжок.")
                  
                  task.wait(1)
                  humanoid.JumpPower = 50             -- вернуть норму
              end
          end)
        afterText: 
          - "🎮 Эффект: игрок наступает → суперпрыжок!"
          - "✔️ Работает как трамплин 🎢"

      - type: "hint"
        title: "⭐ 3. Опасная платформа, которая мигает и наносит урон ТОЛЬКО когда красная"
        text: "📌 Код (нужен один Script внутри платформы)"
        code: |
          local platform = script.Parent
          local dangerous = false -- сейчас безопасная

          -- Мигаем цветами
          task.spawn(function()
              while true do
                  platform.Color = Color3.fromRGB(0, 255, 0) -- зелёная
                  dangerous = false
                  task.wait(1)

                  platform.Color = Color3.fromRGB(255, 0, 0) -- красная
                  dangerous = true
                  task.wait(1)
              end
          end)

          -- Наносим урон только если цвет красный
          platform.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              if humanoid and dangerous == true then
                  humanoid.Health -= 25
                  print("ОПАСНО! Платформа красная — урон!")
              end
          end)
        afterText: 
          - "🎮 Эффект: платформа мигает (зелёная — безопасно; красная — урон 😈)"
          - "✔️ Отличная механика для Obby — ребёнку очень нравится визуальная логика."

      - type: "hint"
        title: "⭐ 4. Зона «телепорт в безопасную комнату»"
        text: "📌 Подготовка: Создай Part → назови SafeRoomPoint (точка появления)."
        code: |
          local pad = script.Parent
          local target = workspace.SafeRoomPoint  -- куда телепортируем

          pad.Touched:Connect(function(hit)
              local root = hit.Parent:FindFirstChild("HumanoidRootPart")

              if root then
                  root.CFrame = target.CFrame + Vector3.new(0, 3, 0)
                  print("Телепорт в безопасную комнату!")
              end
          end)
        afterText: 
          - "🎮 Эффект: наступает → ФШУХ! → телепорт в комнату SafeRoomPoint."
          - "✔️ Работает как портал спасения 🏡💚"


      - type: "hint"
        title: "⭐ 5. Зона, которая отталкивает игрока (BodyVelocity)"
        code: |
          llocal zone = script.Parent

          zone.Touched:Connect(function(hit)
              local char = hit.Parent
              local root = char:FindFirstChild("HumanoidRootPart")
              local humanoid = char:FindFirstChild("Humanoid")

              if root and humanoid then

                  local force = Instance.new("BodyVelocity")
                  force.Parent = root

                  -- толкаем игрока вперёд и вверх
                  force.Velocity = Vector3.new(0, 40, 60)
                  force.MaxForce = Vector3.new(10000, 10000, 10000)

                  task.wait(0.3)
                  force:Destroy()
              end
          end)

        afterText: 
          - "🎮 Эффект: наступает → сильный толчок → игрок улетает вперёд."
          - "✔️ Очень весёлый эффект — игрок будто прыгнул на батут с турбонаддувом 🚀"

      - type: table
        title: "🎁 Всё вместе — краткие подсказки для повторения"
        headers: ["Механика", "Главное действие"]
        rows:
          - ["Забрать скорость", "WalkSpeed = 0"]
          - ["Прыг-скок", "JumpPower = 100"]
          - ["Мигающая опасная платформа", "dangerous = true / false"]
          - ["Телепорт в безопасную комнату", "root.CFrame = target.CFrame"]
          - ["Отталкивание", "BodyVelocity"]


    quiz:
      - question: "Что делает human.Health -= 20?"
        answers:
          - "Увеличивает здоровье"
          - "Уменьшает здоровье"
          - "Делает игрока быстрее"
        correct: 1
    end:
      - type: "text"
        title: "🎉 Итог: Теперь ты умеешь: 🧠"
        text: |
          <ul>
            <li>создавать разные типы опасных зон</li>
            <li>делать постепенный урон</li>
            <li>делать замедление и ускорение</li>
            <li>создавать безопасные зоны</li>
            <li>применять знания о Humanoid и событиях Touched</li>
          </ul>
          <h4>Эти навыки позволяют строить настоящие уровни Obby, мини-игры и испытания! 🎮</h4>


# ============================================================
# УРОК 33 — Ловушки-усложнения
# ============================================================
  - id: 33
    title: "🌟Урок 33. Ловушки: падающие платформы, яд и подбрасывание"
    shortDescription: "Учимся создавать продвинутые ловушки."
    # video: "https://www.youtube.com/embed/TRAPS28"

    content:
      - type: "text"
        title: "🧨 Падающие платформы, яд и подбрасывание"
        text: |
          <b>Учимся создавать продвинутые ловушки</b>
          Сегодня мы делаем серьёзные ловушки, которые уже похожи на механики из настоящих Roblox-игр:
          <ul>
            <li><b>🟥 Падающие платформы</b></li>
            <li><b>🧪 Ядовитые зоны,</b> которые убивают постепенно</li>
            <li><b>🚀 Подбрасывающие ловушки</b>, как пружины или взрывы</li>
          </ul>

      - type: "text"
        title: "🎮 Почему эти ловушки важны?"
        text: |
          Они делают игру:
          <ul>
            <li>интереснее</li>
            <li>разнообразнее</li>
            <li>динамичнее</li>
            <li>вызывают эмоцию: «Ой! Чуть не упал!» 😄 </li>
          </ul>

      - type: "code"
        title: "🧱 Ловушка №1 — Падающая платформа"
        text:
          - "Платформа — это как печенька, которая начинает крошиться, если на неё наступить 🍪🤣"
          - "<h4>📦 Что делаем:</h4>"
          - "<ol><li>Создаём Part → называем FallPlatform</li><li>Anchored = true</li><li>Вставляем в неё Script</li></ol>"
          - "<h5>🧾 Код падающей платформы (понятный и простой)</h5>"
        code: |
          local platform = script.Parent

          platform.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              if humanoid then
                  print("Ох-ох, платформа трескается!")

                  task.wait(0.4)              -- задержка → оживляет механику
                  platform.Anchored = false   -- платформа падает!
                  platform.Transparency = 0.5 -- делает полу-прозрачной

                  task.wait(2)                -- время на восстановление
                  platform.Anchored = true    -- возвращаем на место
                  platform.Transparency = 0   -- снова нормальная
                  platform.Position = platform.Position + Vector3.new(0, 10, 0)
              end
          end)
        afterText: "🎉 Эффект: наступил → платформа падает → потом возвращается."

      - type: "code"
