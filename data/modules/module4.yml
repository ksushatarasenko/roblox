# ============================================================
# УРОК 30 — Расширенные телепорты
# ============================================================
  - id: 30
    title: "⭐ Урок 30. Телепорты: портал, телепорт-гейт, переходы между комнатами"
    shortDescription: "Учимся создавать порталы, двусторонние телепорты и телепорты в дом."
    # video: "https://www.youtube.com/embed/TELEPORT25"

    content:
      - type: "text"
        text: "Сегодня мы научимся создавать по-настоящему крутые телепорты, не просто перемещение вверх-вниз, а целые переходы между зонами, комнатами и домами."

      - type: "text"
        title: "🎒 Что мы изучим?"
        text:
          - "<b>Телепорты</b> — это одна из самых популярных механик: порталы, входы в дом, переход на новую локацию."
          - "В этом уроке ты узнаешь:"
          - "<b>1)</b> 🌀 что такое портал"
          - "<b>2)</b> 🏰 что такое телепорт-гейт"
          - "<b>3)</b> 🚪 как делать переходы между комнатами"
          - "<b>4)</b> 🔁 как сделать двусторонний телепорт"
          - "<b>5)</b> 🏡 как сделать телепорт в дом"
          - "И самое главное — всё это будет работать через <b>HumanoidRootPart</b>, который мы изучили в Уроке 24."


      - type: "gallery"
        title: "Примеры порталов"
        images:
          - "https://i.ytimg.com/vi/Es_FlUi1kY8/sddefault.jpg?v=645ebf24"
          - "https://i.ytimg.com/vi/KBrTuJVGlcY/mqdefault.jpg"
          - "https://i.ytimg.com/vi/qWDm784rUjU/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLAaZ6MgwKtedzVdO94F2XZAkeBquw"

      - type: "tip"
        title: "🧠 Напоминание: кого мы телепортируем?"
        text: |
          - "Игрок = Character → у него есть HumanoidRootPart"
          - "И именно RootPart нужно перемещать, а не голову, ноги или всё тело по отдельности."



      - type: "text"
        title: "🌀 Часть 1 — Обычный портал (портал А → точка B)"
        textH4: "📦 Подготовка:"
        text:
          - "1. Создай Part → назови его <b>PortalA</b>"
          - "2. Создай другой Part → назови <b>ExitPoint</b>"
          - "3. Вставь <b>Script</b> внутрь PortalA"

      - type: "code"
        title: "✨ Код обычного телепорта:"
        code: |
          local portal = script.Parent
          local exit = workspace.ExitPoint

          portal.Touched:Connect(function(hit)
              local char = hit.Parent
              local root = char:FindFirstChild("HumanoidRootPart")

              if root then
                  -- переносим игрока в точку выхода
                  root.CFrame = exit.CFrame + Vector3.new(0, 3, 0)
                  print("Телепорт в другую зону!")
              end
          end)
        afterText: "👉 Игрок заходит → <em>ФШУУХ!</em> → появляется на новом месте."

      - type: "text"
        title: "🔁 Часть 2 — Двусторонний телепорт (A ↔ B)"
        text:
          - "Это как двери из мира Portal 🔵🔶"
          - "Заходишь в портал А → оказываешься в B."
          - "Заходишь в портал B → оказываешься снова в A."
          - "<h4> 📦 Подготовка:</h4>"
          - " <ul><li>PortalA</li>
            <li>PirtalB</li><li>В обоих одинаковый код (только цель отличается)</li></ul>"
      - type: "code"
        title: "✨ Код PortalA (ведёт в B):"
        code: |
          local portal = script.Parent
          local target = workspace.PortalB

          portal.Touched:Connect(function(hit)
              local char = hit.Parent
              local root = char:FindFirstChild("HumanoidRootPart")

              if root then
                  root.CFrame = target.CFrame + Vector3.new(0, 3, 0)
                  print("A → B")
              end
          end)
      - type: "code"
        title: "✨ Код PortalB (ведёт в A):"
        code: |
          local portal = script.Parent
          local target = workspace.PortalA

          portal.Touched:Connect(function(hit)
              local char = hit.Parent
              local root = char:FindFirstChild("HumanoidRootPart")

              if root then
                  root.CFrame = target.CFrame + Vector3.new(0, 3, 0)
                  print("B → A")
              end
          end)
        afterText: "👉 Игрок может бегать туда-сюда, как через магические врата."

      - type: "warning"
        text: 
         - "Следи, чтобы порталы не стояли слишком близко, иначе игрок может «застрять»."

      - type: "code"
        title: "🚪 Часть 3 — Переход между комнатами (например, в другой зал)"    
        text: |
          Это похоже на двери в торговом центре:
          <p>зашёл — и сразу оказался в другом помещении.</p>
          <h4>📦 Подготовка:</h4>
            <ul>
              <li>Сделай комнату <b>Room1</b></li>
              <li>Сделай комнату <b>Room2</b></li>
              <li>В Room1 поставь Part → Door1</li>
              <li>В Room2 поставь Part → Door2</li>
              <li>Все двери Anchored = true</li>
            </ul>
        code: |
          local door = script.Parent
          local targetRoomDoor = workspace.Door2  -- куда переносим

          door.Touched:Connect(function(hit)
              local character = hit.Parent
              local root = character:FindFirstChild("HumanoidRootPart")

              if root then
                  root.CFrame = targetRoomDoor.CFrame + Vector3.new(0, 3, 0)
                  print("Переход в другую комнату!")
              end
          end)
        afterText: "👉 Представь, что игрок резко «входит» в соседнюю комнату."
      

      - type: "code"
        title: "🏡 Часть 4 — Телепорт в дом (или в секретную комнату)"    
        text: |
          Ох, это любимая механика детей!
          <p>Игрок может войти в маленькую дверь, землю или куст,</p>
          <p>и попасть в дом, бункер, секретную базу.</p>
          <h4>📦 Подготовка:</h4>
            <ul>
              <li>Портал: <b>HousePortal</b></li>
              <li>Точка внутри дома: <b>InsideHouse</b></li>
            </ul>
        code: |
          local portal = script.Parent
          local housePoint = workspace.InsideHouse

          portal.Touched:Connect(function(hit)
              local char = hit.Parent
              local root = char:FindFirstChild("HumanoidRootPart")

              if root then
                  root.CFrame = housePoint.CFrame + Vector3.new(0, 3, 0)
                  print("Добро пожаловать в дом!")
              end
          end)


      - type: "code"
        title: "🧪 Часть 5 — Телепорт-гейт (требует действие)"    
        text: |
          Интересная механика: телепорт срабатывает только если игрок что-то сделал, например:
          <ul>
              <li>собрал ключ</li>
              <li>нажал кнопку</li>
              <li>активировал рычаг</li>
            </ul>
          <h4>📦 Подготовка:</h4>
            <ul>
              <li>Part → Gate</li>
              <li>BoolValue → <b>Activated = false</b></li>
            </ul>
        code: |
          local gate = script.Parent
          local exit = workspace.SecretRoom
          local activated = gate:FindFirstChild("Activated")

          gate.Touched:Connect(function(hit)
              local char = hit.Parent
              local root = char:FindFirstChild("HumanoidRootPart")

              if root and activated.Value == true then
                  root.CFrame = exit.CFrame + Vector3.new(0, 3, 0)
                  print("Гейт активирован → телепорт!")
              end
          end)
        afterText: "👉 Можно сделать квест «найди ключ», чтобы телепорт заработал."

      - type: "code"
        title: "🎨 Визуальные эффекты (по желанию)"    
        text: |
          Используй:
            <ul>
              <li><b>ParticleEmitter</b> — искры, дым, магия</li>
              <li><b>TweenService</b> — плавное свечение портала</li>
              <li><b>Sound</b> — звук портала</li>
              <li><b>BillboardGui</b> — надпись «ПОРТАЛ»</li>
            </ul>
          Например:
        code: |
          portal.Color = Color3.fromRGB(100, 0, 255)

          //Структура объекта Portal в Workspace должна быть такой:
          Portal (Part)
            ├── Script
            ├── Sound
            ├── ParticleEmitter

      - type: "hint"
        title: "🧙‍♂️ Подсказка - Полный код внутри Script 👁️"
        code: |
          -- Получаем сам портал
          local portal = script.Parent

          -- Частицы (искры, магия)
          local particles = portal:FindFirstChild("ParticleEmitter")

          -- Звук телепорта
          local sound = portal:FindFirstChild("Sound")

          -- Цель, куда будем переносить игрока
          local target = workspace:WaitForChild("ExitPoint")

          -- TweenService для плавного свечения
          local TweenService = game:GetService("TweenService")


          ----------------------------------------------------------
          -- 1. СОЗДАЁМ НАДПИСЬ "ПОРТАЛ" ЧЕРЕЗ BillboardGui
          ----------------------------------------------------------

          local billboard = Instance.new("BillboardGui")
          billboard.Parent = portal
          billboard.Adornee = portal
          billboard.Size = UDim2.new(0, 100, 0, 50)
          billboard.StudsOffset = Vector3.new(0, 3, 0) -- над порталом

          local label = Instance.new("TextLabel")
          label.Parent = billboard
          label.Size = UDim2.new(1, 0, 1, 0)
          label.BackgroundTransparency = 1
          label.Text = "ПОРТАЛ"
          label.TextScaled = true
          label.TextColor3 = Color3.fromRGB(255, 255, 0)
          label.Font = Enum.Font.FredokaOne


          ----------------------------------------------------------
          -- 2. ПЛАВНОЕ СВЕЧЕНИЕ ПОРТАЛА (TweenService)
          ----------------------------------------------------------

          local glowInfo = TweenInfo.new(
              1.5,                          -- длительность 1.5 сек
              Enum.EasingStyle.Sine,       -- плавная волна
              Enum.EasingDirection.InOut,
              -1,                          -- повторять бесконечно
              true                         -- реверс (туда-сюда)
          )

          -- Меняем цвет на магический
          local glowTween = TweenService:Create(portal, glowInfo, {
              Color = Color3.fromRGB(120, 0, 255) -- фиолетовое сияние
          })

          glowTween:Play()


          ----------------------------------------------------------
          -- 3. ОБРАБОТКА ТЕЛЕПОРТА
          ----------------------------------------------------------

          portal.Touched:Connect(function(hit)
              local char = hit.Parent
              local root = char:FindFirstChild("HumanoidRootPart")

              if root then
                  
                  -- Включаем частицы
                  if particles then
                      particles.Enabled = true
                  end
                  
                  -- Проигрываем звук телепорта
                  if sound then
                      sound:Play()
                  end
                  
                  -- Сам телепорт
                  root.CFrame = target.CFrame + Vector3.new(0, 3, 0)
                  print("Телепорт — в путь!")

                  -- Через 1 секунду выключаем частицы
                  task.delay(1, function()
                      if particles then
                          particles.Enabled = false
                      end
                  end)
              end
          end)


    quiz:
      - question: "Какой объект мы ищем, чтобы телепортировать игрока?"
        answers:
          - "Head"
          - "HumanoidRootPart"
          - "Torso"
        correct: 1

      - question: "Что делает Vector3.new(0,3,0) в телепорте?"
        answers:
          - "Поднимает игрока выше на 3 студии"
          - "Меняет скорость игрока"
          - "Добавляет урон"
        correct: 0

    end:
      - type: "text"
        title: "🎉 Итог: Теперь ты умеешь: 🧠"
        text: |
          <ul>
            <li>обычные телепорты</li>
            <li>двусторонние порталы</li>
            <li>переходы между комнатами</li>
            <li>телепорты в дом</li>
            <li>телепорт-гейты с условиями</li>
            <li>а также знаешь, что должен двигаться HumanoidRootPart</li>
          </ul>
          <h4>Это огромный шаг в создании настоящих уровней и приключений! 🎮</h4>


# ============================================================
# УРОК 31 — Чекпоинты
# ============================================================
  - id: 31
    title: "⭐ Урок 31. Чекпоинты и респаун игрока"
    shortDescription: "Учимся делать точки сохранения: игрок умирает — появляется там же. (сохранять прогресс и правильно возрождать игрока)"
    video: "https://www.youtube.com/embed/HQQdsMtRg7k?si=OA1rgOVylS-PKlTT"

    content:

      - type: "text"
        title: "🎮 Что такое чекпоинт?"
        text: |
          Представь, что твой персонаж бежит по длинному опасному пути.
          <p><em>Лава, прыжки, ловушки</em> — ошибка → смерть → снова сначала… ой 😭</p>
          Чтобы так не мучиться, игре нужны чекпоинты.
          <p><b>Чекпоинт</b> — это место, куда игрок вернётся после смерти.</p>
          - "Игрок коснулся чекпоинта → и он запомнился."

      - type: "gallery"
        title: "Примеры чекпоинтов"
        images:
          - src: "https://i.ytimg.com/vi/EYgZZxwIvro/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLBfANeAL5icEqkrDu4rfXJ7JkipJQ"
          - src: "https://i.ytimg.com/vi/H87g7jrVuT4/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLAek0Dj95j8Z6yLK8oFCkQtDKG5xQ"

      - type: "code"
        title: "⭐ Что такое точка респауна (RespawnLocation)?"
        text: |
          Каждый игрок появляется в мире Roblox на SpawnLocation — это стартовая точка.
          <p>Но!</p>
          Мы можем сделать так, чтобы каждый игрок имел СВОЮ личную точку респауна.
          <p>Для этого у игрока есть свойство:</p>          
        code: |
          player.RespawnLocation = какой_то_SpawnLocation

      - type: "steps"
        title: "🧱 Шаг 1. Создаём чекпоинт"
        items:
          - "1. Создай Part → назови <b>Checkpoint</b>"
          - "2. Покрась в яркий цвет"
          - "3. Установи <b>Anchored = true</b>"
          - "4. Добавь <b>Script</b>"
          - "Можно даже сделать платформу светящейся или с эффектами."
      - type: "steps"
        title: "📍 Шаг 2. Создаём точку респауна"
        items:
          - "1. Добавь  <b>SpawnLocation</b>"
          - "2. Назови его <b>Respawn1</b>"
          - "3. Выключи галочку <b>Enabled </b> (иначе игрок будет сразу спавниться на нём)"
          - "4. Перемести его туда, где игрок должен оживать"
          - "Можно даже сделать платформу светящейся или с эффектами."

      - type: "code"
        title: "🧠 Шаг 3. Ловим прикосновение к чекпоинту"
        text: "⚠ Важно: игроков можно поймать по Humanoid."
        code: |
          -- Получаем сам чекпоинт (платформа)
          local checkpoint = script.Parent

          -- Точка появления, куда будем возрождать игрока
          local respawnPoint = workspace:WaitForChild("Respawn1")

          -- Когда кто-то касается чекпоинта
          checkpoint.Touched:Connect(function(hit)

              -- hit.Parent — это модель игрока
              local character = hit.Parent 

              -- ищем Humanoid, чтобы понять, что это именно игрок
              local humanoid = character:FindFirstChild("Humanoid")
              if humanoid then
                  
                  -- Достаём Player по модели персонажа
                  local player = game.Players:GetPlayerFromCharacter(character)

                  if player then
                      -- Устанавливаем чекпоинт:
                      -- теперь игрок будет возрождаться на Respawn1
                      player.RespawnLocation = respawnPoint

                      print("Чекпоинт активирован!")

                      -------------------------------------------------
                      -- ЭФФЕКТЫ ДЛЯ КРАСОТЫ
                      -------------------------------------------------

                      -- меняем цвет чекпоинта (радостный эффект)
                      checkpoint.Color = Color3.fromRGB(0, 255, 0)

                      -- делаем лёгкую анимацию "подскока"
                      local oldSize = checkpoint.Size
                      checkpoint.Size = oldSize + Vector3.new(0, 1, 0)
                      task.wait(0.2)
                      checkpoint.Size = oldSize

                      -- можно добавить звук, если есть:
                      -- checkpoint.Sound:Play()
                  end
              end
          end)

      - type: "note"
        text: "Чекпоинты работают через свойство <b>RespawnLocation</b>."
      - type: "text"
        title: "🎉 Что теперь умеет игрок?"
        text: |
          <ol>
            <li>Встаёт на чекпоинт</li>
            <li>Игра это запоминает</li>
            <li>Если игрок умирает (падает в лаву/пропасть/шипы),</li>
            <li>Он возрождается на Respawn1, а не на старте!</li>
          </ol>
      # mini-kwest
      - type: "text"
        title: "🧪 Хочешь мини-квест?"
        text: |
          <p><b>📍 Чекпоинт, который НЕ срабатывает, если у игрока мало здоровья.</b><ul><li>(Использовать humanoid.Health)</li></ul></p>
          <p><b>📍 Чекпоинт, который играет звук победы.</b><ul><li>(Sound:Play())</li></ul></p>
          <p><b>📍 Чекпоинт, который светится через TweenService.</b><ul><li>(например, плавное изменение цвета)</li></ul></p>
          <p><b>📍 Два чекпоинта — первый красный, второй зелёный, и игрок должен активировать их по порядку.</b><ul><li></li></ul></p>

      - type: "hint"
        title: "⭐ КОД-ПОДСКАЗКА №1 — Чекпоинт, который срабатывает только если здоровье > 50"
        code: |
          local checkpoint = script.Parent
          local respawnPoint = workspace.Respawn1

          checkpoint.Touched:Connect(function(hit)
              local char = hit.Parent
              local humanoid = char:FindFirstChild("Humanoid")

              if humanoid and humanoid.Health > 50 then
                  local player = game.Players:GetPlayerFromCharacter(char)
                  if player then
                      player.RespawnLocation = respawnPoint
                      print("Чекпоинт активирован! Здоровье достаточно высокое.")
                  end
              end
          end)
        afterText: "✔️ можно делать условия с Health."

      - type: "hint"
        title: "⭐ КОД-ПОДСКАЗКА №2 — Чекпоинт, который проигрывает звук"
        code: |
          local checkpoint = script.Parent
          local respawnPoint = workspace.Respawn1
          local sound = checkpoint:FindFirstChild("Sound")  -- звук должен быть внутри чекпоинта

          checkpoint.Touched:Connect(function(hit)
              local char = hit.Parent
              local humanoid = char:FindFirstChild("Humanoid")

              if humanoid then
                  local player = game.Players:GetPlayerFromCharacter(char)
                  if player then
                      player.RespawnLocation = respawnPoint
                      if sound then sound:Play() end
                      print("Чекпоинт активирован со звуком!")
                  end
              end
          end)

        afterText: "✔️ ✔ Дети любят звук — код мотивирует их добавлять эффекты."

      - type: "hint"
        title: "⭐ КОД-ПОДСКАЗКА №3 — Чекпоинт, который загорается через TweenService"
        code: |
          local checkpoint = script.Parent
          local respawnPoint = workspace.Respawn1
          local TweenService = game:GetService("TweenService")

          checkpoint.Touched:Connect(function(hit)
              local char = hit.Parent
              local humanoid = char:FindFirstChild("Humanoid")

              if humanoid then
                  local player = game.Players:GetPlayerFromCharacter(char)
                  if player then
                      player.RespawnLocation = respawnPoint

                      -- Плавное свечение
                      local tweenInfo = TweenInfo.new(0.5)
                      local tween = TweenService:Create(checkpoint, tweenInfo, {
                          Color = Color3.fromRGB(0, 255, 0)
                      })
                      tween:Play()

                      print("Чекпоинт красиво активирован!")
                  end
              end
          end)
        afterText: 
          - "✔️ Тут вспоминается Урок 18 — TweenService."
          - "✔️ Короткий и красивый пример."

      - type: "hint"
        title: "⭐ КОД-ПОДСКАЗКА №4 — Два чекпоинта: активировать можно только по порядку"
        text: "РЕБЁНОК видит, что можно хранить состояние."
        code: |
          -- Первым должен быть активирован Checkpoint1
          local checkpoint = script.Parent
          local respawnPoint = workspace.Respawn2
          local playerStage = workspace:FindFirstChild("PlayerStage")  -- NumberValue

          checkpoint.Touched:Connect(function(hit)
              local char = hit.Parent
              local humanoid = char:FindFirstChild("Humanoid")

              if humanoid then
                  local player = game.Players:GetPlayerFromCharacter(char)
                  if player then
                      
                      -- Проверяем: активирован ли первый чекпоинт?
                      if playerStage.Value == 1 then
                          player.RespawnLocation = respawnPoint
                          playerStage.Value = 2  -- поднимаем уровень прогресса
                          print("Активация чекпоинта 2!")
                      else
                          print("Сначала активируй чекпоинт 1!")
                      end
                  end
              end
          end)
        afterText: 
          - "✔️ Это отличный мостик к системам прогресса и уровней."
          - "✔️ Ребёнок увидит, как можно проверять порядок действий."



    quiz:
      - question: "Что делает RespawnLocation?"
        answers:
          - "Меняет скорость игрока"
          - "Указывает, где игрок появится после смерти"
          - "Убивает игрока"
        correct: 1
    end:
      - type: "text"
        title: "🎉 Итог: Теперь ты умеешь: 🧠"
        text: |
          <ul>
            <li>что такое чекпоинт</li>
            <li>что такое респаун</li>
            <li>как сделать сохранение прогресса</li>
            <li>как настроить RespawnLocation</li>
            <li>как красиво оформить чекпоинт</li>
          </ul>
          <h4>Это фундамент для любых Obby, адвенчур, уровней и мини-игр! 🎮</h4>


# ============================================================
# УРОК 32 — Зоны урона и безопасные зоны
# ============================================================
  - id: 32
    title: "🌟 Урок 32. Зоны урона и безопасные зоны"
    shortDescription: "Создаём лаву, шипы, яд, зоны замедления и безопасные платформы."
    # video: "https://www.youtube.com/embed/DAMAGE27"

    content:
      - type: "text"
        text: "Сегодня мы научимся создавать разные «зоны действия» — опасные и добрые. Это основа для Obby, мини-игр, паркуров и приключений!"
      - type: "text"
        title: "🎮 Что такое зона?"
        text:
          - "Зона — это обычный Part, который вызывает эффект при касании."
          - "Зона — это любой блок, который реагирует на прикосновение игрока:"
          - "🔥 Лава — наносит урон"
          - "☠️ убивает"
          - "🧪 отравляет"
          - "🐌 замедляет"
          - "💚 защищает / лечит"
          - "🛡 восстанавливает здоровье"
          - "Можно представить, что игрок идёт по карте, а земля под ним меняет правила игры."

      - type: "text"
        title: "🧒 Ассоциация"
        text: |
          Представь пол в игре как <em>шахматную доску</em>:
          <ul>
            <li>красные клетки — опасность</li>
            <li>зелёные — защита</li>
            <li>жёлтые — замедление</li>
            <li>синие — ускорение</li>
          </ul>
          Игрок вступает на клетку → происходят изменения.


      - type: "steps"
        title: "🟧 Шаг 1. Создаём лаву (мгновенная смерть)"
        items:
          - "Создай Part → назови Lava"
          - "Покрась в красный или оранжевый"
          - "Material = Neon"
          - "Anchored = true"
          - "Добавь Script"

      - type: "code"
        title: "🔥 Код лавы"
        code: |
          local lava = script.Parent

          lava.Touched:Connect(function(hit)
              local char = hit.Parent
              local humanoid = char:FindFirstChild("Humanoid")

              if humanoid then
                  humanoid.Health = 0 -- убиваем игрока
                  print("Игрок упал в лаву!")
              end
          end)
        afterText: "Просто и понятно: коснулся — умер."

      - type: "code"
        title: "🟥 Шаг 2. Шипы (урон, но не смерть сразу)"
        text: 
          - "1. Создай Part → назови Spikes"
          - "2. Material = Metal"
          - "Добавь Script"
          - "<h4>⚔️ Код шипов:</h4>"
        code: |
          local spikes = script.Parent

