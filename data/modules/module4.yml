        title: "🧩 Теперь — коды-подсказки (все с подробными комментариями)"
        text:
          - "Каждый код — помещается в Script внутрь соответствующего Part/объекта. Комментарии объясняют логику."

      - type: "note"
        text: "<b>Совет:</b> делай расстояние между платформами чуть-чуть сложнее, чем удобно — так интереснее!"

      - type: "text"
        title: "🧩 Советы по связке всего проекта"
        text: |
          <ul>
            <li><b>Чекпоинт перед боссом</b> — обязательно (иначе игрок будет часто расстраиваться).</li>
            <li><b>Подсказки и GUI:</b> добавь TextLabel в PlayerGui (LocalScript), который пишет подсказку «Найди кнопку, чтобы вызвать лифт» или «Босс слаб к прыжкам».</li>
            <li><b>Производительность:</b> не ставь слишком много ParticleEmitter с большим EmissionRate — тестируй.</li>
            <li><b>Тестируй на разных скоростях:</b> WalkSpeed, JumpPower и сила BodyVelocity должны быть сбалансированы.</li>
            <li><b>CollisionGroups:</b> используй, если движущиеся объекты мешают друг другу.</li>
            <li><b>Режим «обновления» (Reset)</b>: при восстановлении платформы убедись, что её CFrame сохраняется и корректно сбрасывается.</li>
          </ul>

      - type: "text"
        title: "📚 Небольшие улучшения / идеи"
        text: |
          <ul>
            <li>Краб-платформы: вращающиеся платформы (CFrame旋转 в цикле).</li>
            <li>Секретные проходы: скрытые порталы, открывающиеся по нажатию кнопки.</li>
            <li>Лист достижений: давать бейдж за прохождение без смертей (нужно хранить data).</li>
            <li>Музыкальные зоны: короткий джингл при активации чекпоинта.</li>
            <li>Логика «один лифт на всех» → RemoteEvent для сетевого вызова (если несколько игроков).</li>
          </ul>

