            <li>сделай Exit выше / ниже</li>
            <li>попробуй отключить портал после первого использования</li>
            <li>использует логику:</li>
          </ul>
           <ul>
            <li>один раз</li>
            <li>туда-обратно</li>
            <li>ловушка</li>
          </ul>
      
    quiz:
      - question: "Зачем добавляют звук в портал?"
        answers:
          - "Чтобы игрок услышал действие"
