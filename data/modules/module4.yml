      # 1) Чекпоинт (RespawnLocation) — ставим прогресс
      - type: "hint"
        title: "1) Чекпоинт (RespawnLocation) — ставим прогресс"
        text: "Вставить в Part Checkpoint."
        code: |
          -- Checkpoint Script
          local checkpoint = script.Parent
          local respawnPoint = workspace:WaitForChild("Respawn_Point") -- SpawnLocation, созданный заранее

          checkpoint.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character and character:FindFirstChild("Humanoid")
              if humanoid then
                  local player = game.Players:GetPlayerFromCharacter(character)
                  if player then
                      player.RespawnLocation = respawnPoint   -- игрок будет респауниться здесь
                      print("Чекпоинт активирован для", player.Name)

                      -- визуальный эффект: мигнуть и поменять цвет
                      local oldColor = checkpoint.Color
                      checkpoint.Color = Color3.fromRGB(0,255,0)
                      task.delay(0.4, function() checkpoint.Color = oldColor end)
                  end
              end
          end)

