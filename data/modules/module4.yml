      # 9) Финиш — телепорт на платформу завершения / лобби
      - type: "hint"
        title: "8) Финиш — телепорт на платформу завершения / лобби"
        code: |
          -- HintSystem (LocalScript)

          -- Создаем интерфейс-подсказку
          local ScreenGui = Instance.new("ScreenGui", game.Players.LocalPlayer:WaitForChild("PlayerGui"))
          local Hint = Instance.new("TextLabel", ScreenGui)

          Hint.Size = UDim2.new(1, 0, 0, 50)
          Hint.Position = UDim2.new(0, 0, 0, 20)
          Hint.BackgroundTransparency = 1
          Hint.TextScaled = true
          Hint.Font = Enum.Font.FredokaOne
          Hint.TextColor3 = Color3.fromRGB(255,255,0)
          Hint.TextStrokeTransparency = 0.5
          Hint.Text = ""

          -- ФУНКЦИЯ: Показать подсказку на 3 сек
          local function showHint(text)
              Hint.Text = text
              task.wait(3)
              Hint.Text = ""
          end

          --------------------------------------------------
          -- ПОДСКАЗКА 1: когда игрок стоит на StartPlatform
          --------------------------------------------------
          local start = workspace:WaitForChild("StartPlatform")

          start.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  showHint("Добро пожаловать в Obby! Прыгай по платформам!")
              end
          end)

          --------------------------------------------------
          -- ПОДСКАЗКА 2: перед боссом MegaTrapBoss
          --------------------------------------------------
          local bossWarning = workspace:WaitForChild("BossWarningPart")

          bossWarning.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  showHint("ВНИМАНИЕ! Босс впереди! Он двигается за тобой!")
              end
          end)

          --------------------------------------------------
          -- ПОДСКАЗКА 3: портал
          --------------------------------------------------
          local portal = workspace:PortalRoom:WaitForChild("PortalA")

          portal.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  showHint("Портал активирован! Прыгни внутрь!")
              end
          end)

      # MegaTrapBoss 

      - type: "text"
        title: "⭐ MegaTrapBoss"
        text: |
          😈 БОСС, который:
          <ul>
            <li>движется за игроком</li>
            <li>мигает</li>
            <li>наносит урон</li>
            <li>подбрасывает</li>
            <li>🔥 стреляет ЛАЗЕРОМ</li>
            <li>🧨 прыгает</li>
            <li>👾 призывает мини-ловушки</li>
          </ul>

      - type: "code"
        title: "🔥 1. ЛАЗЕР-АТАКА босса"
        text: "Добавь в MegaTrapBoss модель объект:"
        code: |
          LaserBeam (Part)
          └── Beam (Beam)

      - type: "hint"
        title: "🔥 1. Код (добавить в скрипт босса):"
        text: "Добавь в MegaTrapBoss модель объект:"
        code: |
          -- ЛАЗЕРНАЯ АТАКА (стреляет каждые 6 секунд)
          task.spawn(function()
              while true do
                  task.wait(6)

                  local target = getClosest()
                  if not target then continue end

                  print("Босс заряжает лазер!")

                  -- Включаем Beam на 1 сек
                  local beam = boss:FindFirstChild("LaserBeam"):FindFirstChild("Beam")
                  beam.Enabled = true

                  -- Урон, если игрок в зоне лазера
                  local distance = (target.Position - boss.Body.Position).Magnitude
                  if distance <= 30 then
                      local humanoid = target.Parent:FindFirstChild("Humanoid")
                      if humanoid then humanoid.Health -= 20 end
                  end

                  task.wait(1)
                  beam.Enabled = false
              end
          end)

      - type: "hint"
        title: "🔥 2. ПРЫЖОК БОССА"
        text: "Добавить в основной цикл движения:"
        code: |
          -- Случайный прыжок
          if math.random(1,15) == 1 then
              body.AssemblyLinearVelocity = Vector3.new(0, 60, 0)
          end

      - type: "hint"
        title: "🔥 3. ПРИЗЫВ мини-ловушек"
        text: "В Workspace есть папка MiniTraps."
        code: |
          -- Призыв мини-ловушек каждые 10 секунд
          task.spawn(function()
              while true do
                  task.wait(10)
                  print("Босс призывает мини-ловушки!")

                  for _, trap in ipairs(workspace.MiniTraps:GetChildren()) do
                      trap.Position = boss.Body.Position + Vector3.new(math.random(-10,10), 5, math.random(-10,10))
                  end
              end
          end)


      


