            </ul>
          <h5>Одна ловушка = 5 механизмов одновременно!</h5>
          прям «босс среди платформ»

      - type: "hint"
        title: "⭐ ПОЛНЫЙ КОД МЕГА-ЛОВУШКИ"
        code: |
          -- Наша платформа
          local trap = script.Parent

          -- TweenService для плавного мигания
          local TweenService = game:GetService("TweenService")

          -- Флаг "опасности": если true → наносит урон
          local dangerous = false


          ------------------------------------------------------
          -- 1. ПЛАВНОЕ МИГАНИЕ ПЛАТФОРМЫ (красный ↔ зелёный)
          ------------------------------------------------------

          task.spawn(function()
              while true do
                  -- зелёная = безопасно
                  local tweenSafe = TweenService:Create(
                      trap,
                      TweenInfo.new(1),
                      { Color = Color3.fromRGB(0, 255, 0) }
                  )
                  dangerous = false
                  tweenSafe:Play()
                  task.wait(1)

                  -- красная = опасно
                  local tweenDanger = TweenService:Create(
                      trap,
                      TweenInfo.new(1),
                      { Color = Color3.fromRGB(255, 0, 0) }
                  )
                  dangerous = true
                  tweenDanger:Play()
                  task.wait(1)
              end
          end)


          ------------------------------------------------------
          -- 2. РЕАКЦИЯ НА КАСАНИЕ ИГРОКА
          ------------------------------------------------------

          trap.Touched:Connect(function(hit)
              local char = hit.Parent
              local humanoid = char:FindFirstChild("Humanoid")
              local root = char:FindFirstChild("HumanoidRootPart")

              if humanoid and root then

                  ------------------------------------------------------
                  -- 2.1 Если платформа красная — наносим урон
                  ------------------------------------------------------
                  if dangerous then
                      humanoid.Health -= 20
                      print("Опасность! Платформа красная → урон!")
                  end


                  ------------------------------------------------------
                  -- 2.2 Подбрасываем игрока вверх
                  ------------------------------------------------------
                  local force = Instance.new("BodyVelocity")
                  force.Parent = root
                  force.Velocity = Vector3.new(0, 90, 0)     -- подбрасывание вверх
                  force.MaxForce = Vector3.new(9000, 9000, 9000)

                  task.wait(0.2)
                  force:Destroy()


                  ------------------------------------------------------
                  -- 2.3 Платформа падает вниз
                  ------------------------------------------------------
                  task.wait(0.2)
                  trap.Anchored = false                     -- падает!
                  trap.Transparency = 0.6                   -- будто проваливается

                  print("Платформа рухнула!")


                  ------------------------------------------------------
                  -- 2.4 Восстанавливаем ловушку
                  ------------------------------------------------------
                  task.wait(2)

                  trap.Anchored = true
                  trap.Transparency = 0

                  -- немного поднимаем её обратно вверх
                  trap.Position = trap.Position + Vector3.new(0, 10, 0)

                  print("MegaTrap восстановлен!")
              end
          end)
      
      - type: "text"
        title: "🧙‍♂️ Как работает MEGA-TRAP?"
        text: |
          <ol>
            <li>Платформа мигает - она моргает: «опасно — не опасно»</li>
            <li>Если игрок наступает на красную — получает урон - когда ты к ней подошёл — она злится 🔥</li>
            <li>Игрок подбрасывается вверх - бьёт током (урон), взрывается из-под ног (подбрасывание 💥)</li>
            <li>Платформа резко падает вниз потом снова вылезает, чтобы поймать следующего игрока 😄 </li>
          </ol>
      
      # MEGA-TRAP V2
      - type: "code"
        title: "💀 M E G A T R A P — V2 ⭐ "
        text: |
          <h4>Плавное свечение + частицы + звук + мощный удар</h4>
          <h5>🕹️ Структура объекта</h5>
          Создай Part → назови MegaTrapV2
          <p>Внутрь добавь:</p>
        code: |
          MegaTrapV2
            │─ Script
            │─ Sound           (звук удара / взрыва)
            │─ ParticleEmitter (искры при активации)
            │─ ParticleEmitter2 (дым при падении) — необязательно
        afterText: |
          <em>Звук можно любой — «boom», «zap», «impact».</em>

      - type: table
        title: "🔥 Что умеет MegaTrap V2?"
        headers: ["Механика", "Описание"]
        rows:
          - ["✨ Плавно мигает", "Светится красивой анимацией"]
          - ["💀 Наносит урон", "Только когда красный"]
          - ["💥 Взрыв искр", "При активации"]
          - ["🔊 Реалистичный звук", "Бум! Трах! Вжух!"]
          - ["🚀 Подбрасывает вверх", "Сильнее, чем версия V1"]
          - ["🧨 Падает вниз", "Как collapsing floor"]
          - ["🌫 С дымом", "Выглядит очень эффектно"]
          - ["♻️ Возвращается", "И готова снова ловить"]


      - type: "hint"
        title: "💥 ПОЛНЫЙ КОД MEGA TRAP V2"
        code: |
          local trap = script.Parent
          local TweenService = game:GetService("TweenService")

          local boomSound = trap:FindFirstChild("Sound")           -- звук удара
          local sparkles = trap:FindFirstChild("ParticleEmitter")  -- искры
          local smoke = trap:FindFirstChild("ParticleEmitter2")    -- дым

          local dangerous = false   -- когда true → урон!


          ------------------------------------------------------
          -- 🔥 1. ПЛАВНОЕ МАГИЧЕСКОЕ СВЕЧЕНИЕ
          ------------------------------------------------------

          task.spawn(function()
              while true do
                  -- безопасный зелёный свет
                  dangerous = false
                  TweenService:Create(trap, TweenInfo.new(1), {
                      Color = Color3.fromRGB(0, 255, 0)
                  }):Play()
                  task.wait(1)

                  -- опасный красный свет
                  dangerous = true
                  TweenService:Create(trap, TweenInfo.new(0.5), {
                      Color = Color3.fromRGB(255, 0, 0)
                  }):Play()
                  task.wait(0.8)
              end
          end)


          ------------------------------------------------------
          -- ⚡ 2. ОСНОВНОЙ МЕХАНИЗМ ЛОВУШКИ
          ------------------------------------------------------

          trap.Touched:Connect(function(hit)
              local char = hit.Parent
              local humanoid = char:FindFirstChild("Humanoid")
              local root = char:FindFirstChild("HumanoidRootPart")

              if humanoid and root then

                  ------------------------------------------------------
                  -- 💀 УРОН ПРИ КРАСНОМ СВЕЧЕНИИ
                  ------------------------------------------------------
                  if dangerous then
                      humanoid.Health -= 30
                      print("Ловушка нанесла урон!")
                  end


                  ------------------------------------------------------
                  -- 💥 ВЗРЫВ ИСКРЫ + ЗВУК
                  ------------------------------------------------------
                  if sparkles then
                      sparkles:Emit(40)   -- 40 искр = взрыв!
                  end

                  if boomSound then
                      boomSound:Play()    -- звук удара
                  end


                  ------------------------------------------------------
                  -- 🚀 МОЩНОЕ ПОДБРАСЫВАНИЕ
                  ------------------------------------------------------
                  local force = Instance.new("BodyVelocity")
                  force.Parent = root
                  force.Velocity = Vector3.new(0, 120, 0)   -- выше, чем раньше
                  force.MaxForce = Vector3.new(20000, 20000, 20000)

                  task.wait(0.25)
                  force:Destroy()


                  ------------------------------------------------------
                  -- 🧨 ПЛАТФОРМА ПАДАЕТ ВНИЗ С ДЫМОМ
                  ------------------------------------------------------
                  if smoke then
                      smoke.Enabled = true
                  end

                  trap.Anchored = false           -- отключаем якорь → падает
                  trap.Transparency = 0.6         -- будто развалилась

                  print("MegaTrap упал вниз!")


                  ------------------------------------------------------
                  -- ♻️ ВОССТАНОВЛЕНИЕ ТРАПА
                  ------------------------------------------------------
                  task.wait(2)

                  trap.Anchored = true
                  trap.Transparency = 0
                  trap.Position = trap.Position + Vector3.new(0, 12, 0)

                  if smoke then
                      smoke.Enabled = false
                  end

                  print("MegaTrap восстановлен и готов ловить снова!")
              end
          end)



      - type: "text"
        title: "🧙‍♂️ Как работает MEGA-TRAP V2?"
        text: |
          <ol>
            <li>огромная сердитая платформа,</li>
            <li>которая моргает,</li>
            <li>злится,</li>
            <li>бьёт током,</li>
            <li>взрывается,</li>
            <li>бросает тебя в воздух,</li>
            <li>падает в пропасть,</li>
            <li>а потом снова вылезает 😄</li>
          </ol>
          Такая ловушка делает уровень очень запоминающимся.  

