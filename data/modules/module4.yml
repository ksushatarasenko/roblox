    content:

      - type: "text"
        title: "🎯 Главная идея урока"
        text: |
          <p>Ловушки могут не просто вредить, а двигаться, пугать, предупреждать и выглядеть живыми.</p>
          <p>👉 Игрок видит, слышит и понимает, что сейчас будет опасно.</p>
          
      
      - type: "text"
        title: "🧠 Большая мысль урока"
        text: |
          <p><span style="font-family: monospace;">Опасность = логика + внешний вид + время</span>.</p>
          <p>В прошлых уроках:</p>
          <ul>
            <li>мы делали что наносит урон</li>
