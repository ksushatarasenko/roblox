      # 1) Чекпоинт (RespawnLocation) — ставим прогресс
      - type: "hint"
        title: "1) Чекпоинт (RespawnLocation) — ставим прогресс"
        text: "Вставить в Part Checkpoint."
        code: |
          -- Checkpoint Script
          local checkpoint = script.Parent
          local respawnPoint = workspace:WaitForChild("Respawn_Point") -- SpawnLocation, созданный заранее

          checkpoint.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character and character:FindFirstChild("Humanoid")
              if humanoid then
                  local player = game.Players:GetPlayerFromCharacter(character)
                  if player then
                      player.RespawnLocation = respawnPoint   -- игрок будет респауниться здесь
                      print("Чекпоинт активирован для", player.Name)

                      -- визуальный эффект: мигнуть и поменять цвет
                      local oldColor = checkpoint.Color
                      checkpoint.Color = Color3.fromRGB(0,255,0)
                      task.delay(0.4, function() checkpoint.Color = oldColor end)
                  end
              end
          end)

      # 2) Лава — мгновенная смерть
      - type: "hint"
        title: "2) Лава — мгновенная смерть"
        text: "Вставить в Part Lava."
        code: |
          -- Lava Script
          local lava = script.Parent

          lava.Touched:Connect(function(hit)
              local humanoid = hit.Parent and hit.Parent:FindFirstChild("Humanoid")
              if humanoid then
                  humanoid.Health = 0 -- мгновенная смерть
                  print("Игрок упал в лаву!")
              end
          end)

      # 3) Падающая платформа (с восстановлением)
      - type: "hint"
        title: "3) Падающая платформа (с восстановлением)"
        text: "Вставить в Part Lava."
        code: |
          -- FallingPlatform Script
          local platform = script.Parent
          local originalCFrame = platform.CFrame
          local falling = false

          platform.Touched:Connect(function(hit)
              if falling then return end  -- если уже падает — игнорируем
              local humanoid = hit.Parent and hit.Parent:FindFirstChild("Humanoid")
              if humanoid then
                  falling = true
                  print("Платформа активирована - скоро рухнет")

                  task.wait(0.6)                 -- даём игроку шанс уйти
                  platform.Anchored = false      -- платформа падает
                  platform.CanCollide = false
                  platform.Transparency = 0.5

                  task.wait(2.5)                 -- время пока она лежит внизу

                  -- Восстанавливаем платформу в исходную позицию
                  platform.Anchored = true
                  platform.CanCollide = true
                  platform.Transparency = 0
                  platform.CFrame = originalCFrame
                  falling = false
                  print("Платформа восстановлена")
              end
          end)

      # 4) Мигающая опасная платформа (урон только когда красная)
      - type: "hint"
        title: "4) Мигающая опасная платформа (урон только когда красная)"
        text: "Вставить в Part BlinkDanger."
        code: |
          -- BlinkDanger Script
          local plat = script.Parent
          local dangerous = false

          -- фон: мигаем цветами в цикле
          task.spawn(function()
              while true do
                  plat.Color = Color3.fromRGB(0,200,0)  -- безопасно
                  dangerous = false
                  task.wait(1.2)
                  plat.Color = Color3.fromRGB(255,0,0)  -- опасно
                  dangerous = true
                  task.wait(0.9)
              end
          end)

          -- при касании, урон только если dangerous == true
          plat.Touched:Connect(function(hit)
              local humanoid = hit.Parent and hit.Parent:FindFirstChild("Humanoid")
              if humanoid and dangerous then
                  humanoid.Health -= 30
                  print("Платформа была красной — нанесён урон!")
              end
          end)
    
      # 5) Платформа-лифт с TweenService + кнопка вызова

      - type: "hint"
        title: "5) Платформа-лифт с TweenService + кнопка вызова"
        text: |
          <ul>
            <li>Part Lift + Script внутри Lift</li>
            <li>Part LiftButton + Script внутри кнопки</li>
          </ul>
          <b>Lift Script</b> (вставить в Lift):
        code: |
          local TweenService = game:GetService("TweenService")
          local lift = script.Parent
          local startPos = lift.Position
          local topPos = startPos + Vector3.new(0, 20, 0)

          local info = TweenInfo.new(2, Enum.EasingStyle.Sine, Enum.EasingDirection.Out)

          local up = TweenService:Create(lift, info, {Position = topPos})
          local down = TweenService:Create(lift, info, {Position = startPos})

          -- Функции для контроля
          function goUp()
              up:Play()
          end

          function goDown()
              down:Play()
          end

          -- можно вызывать из кнопки через RemoteEvent или простым установлением BoolValue
          -- для простоты: слушаем BoolValue "CallLift" внутри lift
          local call = lift:FindFirstChild("CallLift")
          if not call then
              call = Instance.new("BoolValue", lift)
              call.Name = "CallLift"
              call.Value = false
          end

          call.Changed:Connect(function(val)
              if val == true then
                  goUp()
                  task.wait(6) -- ждать пока игроки выйдут
                  goDown()
                  call.Value = false
              end
          end)
      - type: "code"
        title: "Button Script (в LiftButton):"
        code: |
          local button = script.Parent
          local lift = workspace:WaitForChild("Lift")  -- найдёт платформу

          button.Touched:Connect(function(hit)
              local humanoid = hit.Parent and hit.Parent:FindFirstChild("Humanoid")
              if humanoid then
                  local call = lift:FindFirstChild("CallLift")
                  if call then call.Value = true end
                  print("Кнопка нажата — лифт вызван")
              end
          end)

      # 6) Зона-отталкивание (BodyVelocity) — ветер/батут
      - type: "hint"
        title: "6) Зона-отталкивание (BodyVelocity) — ветер/батут"
        text: "Вставить в Part PushZone."
        code: |
          -- PushZone Script
          local zone = script.Parent

          zone.Touched:Connect(function(hit)
              local root = hit.Parent and hit.Parent:FindFirstChild("HumanoidRootPart")
              local humanoid = hit.Parent and hit.Parent:FindFirstChild("Humanoid")
              if root and humanoid then
                  local bv = Instance.new("BodyVelocity")
                  bv.Parent = root
                  bv.Velocity = Vector3.new(0, 80, 60) -- вверх и вперёд (настраивай по направлению)
                  bv.MaxForce = Vector3.new(20000,20000,20000)
                  task.wait(0.35)
                  bv:Destroy()
              end
          end)

        # 7) MegaTrapBoss — движущийся босс (упрощённая версия, затем можно улучшать)
      - type: "hint"
        title: "7) MegaTrapBoss — движущийся босс (упрощённая версия, затем можно улучшать)"
        text: "Model MegaTrapBoss с Part Body, внутри Script."
        code: |
          -- MegaTrapBoss Script (упрощённая)
          local boss = script.Parent
          local body = boss:WaitForChild("Body")
          local Players = game:GetService("Players")

          local attackSound = body:FindFirstChild("Sound")
          local sparks = body:FindFirstChild("ParticleEmitter")

          -- функция: найти ближайшего игрока (HumanoidRootPart)
          local function getClosest()
              local bestRoot, bestDist = nil, math.huge
              for _, p in pairs(Players:GetPlayers()) do
                  local c = p.Character
                  local r = c and c:FindFirstChild("HumanoidRootPart")
                  if r then
                      local d = (r.Position - body.Position).Magnitude
                      if d < bestDist then bestDist, bestRoot = d, r end
                  end
              end
              return bestRoot
          end

          -- движение к игроку (используем AssemblyLinearVelocity для постоянного движения)
          task.spawn(function()
              while true do
                  local target = getClosest()
                  if target then
                      local dir = (target.Position - body.Position).Unit
                      body.AssemblyLinearVelocity = dir * 20  -- скорость босса
                  else
                      body.AssemblyLinearVelocity = Vector3.new(0,0,0)
                  end
                  task.wait(0.12)
              end
          end)

          -- атака при касании
          body.Touched:Connect(function(hit)
              local char = hit.Parent
              local hum = char and char:FindFirstChild("Humanoid")
              local root = char and char:FindFirstChild("HumanoidRootPart")
              if hum and root then
                  hum.Health -= 15  -- урон
                  if sparks then sparks:Emit(20) end
                  if attackSound then attackSound:Play() end

                  -- лёгкое подбрасывание
                  local bv = Instance.new("BodyVelocity", root)
                  bv.Velocity = Vector3.new(0, 80, 0)
                  bv.MaxForce = Vector3.new(15000,15000,15000)
                  task.wait(0.25)
                  bv:Destroy()
              end
          end)
      - type: "note"
        text: "Совет: сделай Body массивным (Mass) и включи CollisionGroups, если хочешь, чтобы босс не застревал."

      # 8) Финиш — телепорт на платформу завершения / лобби
      - type: "hint"
        title: "8) Финиш — телепорт на платформу завершения / лобби"
        text: "В Finish Script:"
        code: |
          local finish = script.Parent
          local target = workspace:WaitForChild("Destination") -- Part, куда телепортируем

          finish.Touched:Connect(function(hit)
              local root = hit.Parent and hit.Parent:FindFirstChild("HumanoidRootPart")
              if root then
                  root.CFrame = target.CFrame + Vector3.new(0,3,0)
                  print("Поздравляем! Уровень пройден!")
                  -- можно дать награду: монету, сообщение, звук
              end
          end)

      
      # 9) Финиш — телепорт на платформу завершения / лобби
      - type: "hint"
        title: "8) Финиш — телепорт на платформу завершения / лобби"
        code: |
          -- HintSystem (LocalScript)

          -- Создаем интерфейс-подсказку
          local ScreenGui = Instance.new("ScreenGui", game.Players.LocalPlayer:WaitForChild("PlayerGui"))
          local Hint = Instance.new("TextLabel", ScreenGui)

          Hint.Size = UDim2.new(1, 0, 0, 50)
          Hint.Position = UDim2.new(0, 0, 0, 20)
          Hint.BackgroundTransparency = 1
          Hint.TextScaled = true
          Hint.Font = Enum.Font.FredokaOne
          Hint.TextColor3 = Color3.fromRGB(255,255,0)
          Hint.TextStrokeTransparency = 0.5
          Hint.Text = ""

          -- ФУНКЦИЯ: Показать подсказку на 3 сек
          local function showHint(text)
              Hint.Text = text
              task.wait(3)
              Hint.Text = ""
          end

          --------------------------------------------------
          -- ПОДСКАЗКА 1: когда игрок стоит на StartPlatform
          --------------------------------------------------
          local start = workspace:WaitForChild("StartPlatform")

          start.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  showHint("Добро пожаловать в Obby! Прыгай по платформам!")
              end
          end)

          --------------------------------------------------
          -- ПОДСКАЗКА 2: перед боссом MegaTrapBoss
          --------------------------------------------------
          local bossWarning = workspace:WaitForChild("BossWarningPart")

          bossWarning.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  showHint("ВНИМАНИЕ! Босс впереди! Он двигается за тобой!")
              end
          end)

          --------------------------------------------------
          -- ПОДСКАЗКА 3: портал
          --------------------------------------------------
          local portal = workspace:PortalRoom:WaitForChild("PortalA")

          portal.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  showHint("Портал активирован! Прыгни внутрь!")
              end
          end)

      # MegaTrapBoss 

      - type: "text"
        title: "⭐ MegaTrapBoss"
        text: |
          😈 БОСС, который:
          <ul>
            <li>движется за игроком</li>
            <li>мигает</li>
            <li>наносит урон</li>
            <li>подбрасывает</li>
            <li>🔥 стреляет ЛАЗЕРОМ</li>
            <li>🧨 прыгает</li>
            <li>👾 призывает мини-ловушки</li>
          </ul>

      - type: "code"
        title: "🔥 1. ЛАЗЕР-АТАКА босса"
        text: "Добавь в MegaTrapBoss модель объект:"
        code: |
          LaserBeam (Part)
          └── Beam (Beam)

      - type: "hint"
        title: "🔥 1. Код (добавить в скрипт босса):"
        text: "Добавь в MegaTrapBoss модель объект:"
        code: |
          -- ЛАЗЕРНАЯ АТАКА (стреляет каждые 6 секунд)
          task.spawn(function()
              while true do
                  task.wait(6)

                  local target = getClosest()
                  if not target then continue end

                  print("Босс заряжает лазер!")

                  -- Включаем Beam на 1 сек
                  local beam = boss:FindFirstChild("LaserBeam"):FindFirstChild("Beam")
                  beam.Enabled = true

                  -- Урон, если игрок в зоне лазера
                  local distance = (target.Position - boss.Body.Position).Magnitude
                  if distance <= 30 then
                      local humanoid = target.Parent:FindFirstChild("Humanoid")
                      if humanoid then humanoid.Health -= 20 end
                  end

                  task.wait(1)
                  beam.Enabled = false
              end
          end)

      - type: "hint"
        title: "🔥 2. ПРЫЖОК БОССА"
        text: "Добавить в основной цикл движения:"
        code: |
          -- Случайный прыжок
          if math.random(1,15) == 1 then
              body.AssemblyLinearVelocity = Vector3.new(0, 60, 0)
          end

      - type: "hint"
        title: "🔥 3. ПРИЗЫВ мини-ловушек"
        text: "В Workspace есть папка MiniTraps."
        code: |
          -- Призыв мини-ловушек каждые 10 секунд
          task.spawn(function()
              while true do
                  task.wait(10)
                  print("Босс призывает мини-ловушки!")

                  for _, trap in ipairs(workspace.MiniTraps:GetChildren()) do
                      trap.Position = boss.Body.Position + Vector3.new(math.random(-10,10), 5, math.random(-10,10))
                  end
              end
          end)


      


