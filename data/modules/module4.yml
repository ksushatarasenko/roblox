            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module4/lesson36-38/%D0%A1%D0%B5%D0%BA%D1%80%D0%B5%D1%82%D0%BD%D1%8B%D0%B8%CC%86%20%D1%87%D0%B5%D0%BA%D0%BF%D0%BE%D0%B8%D0%BD%D1%82%20%F0%9F%9A%AA%E2%9C%A8.png?raw=true"
            width: 100%
            maxWidth: "100%"
