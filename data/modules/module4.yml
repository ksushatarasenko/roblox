      # 3) Падающая платформа (с восстановлением)
      - type: "hint"
        title: "3) Падающая платформа (с восстановлением)"
        text: "Вставить в Part Lava."
        code: |
          -- FallingPlatform Script
          local platform = script.Parent
          local originalCFrame = platform.CFrame
          local falling = false

          platform.Touched:Connect(function(hit)
              if falling then return end  -- если уже падает — игнорируем
              local humanoid = hit.Parent and hit.Parent:FindFirstChild("Humanoid")
              if humanoid then
                  falling = true
                  print("Платформа активирована - скоро рухнет")

                  task.wait(0.6)                 -- даём игроку шанс уйти
                  platform.Anchored = false      -- платформа падает
                  platform.CanCollide = false
                  platform.Transparency = 0.5

                  task.wait(2.5)                 -- время пока она лежит внизу

                  -- Восстанавливаем платформу в исходную позицию
                  platform.Anchored = true
                  platform.CanCollide = true
                  platform.Transparency = 0
                  platform.CFrame = originalCFrame
                  falling = false
                  print("Платформа восстановлена")
              end
          end)

      # 4) Мигающая опасная платформа (урон только когда красная)
      - type: "hint"
        title: "4) Мигающая опасная платформа (урон только когда красная)"
        text: "Вставить в Part BlinkDanger."
        code: |
          -- BlinkDanger Script
          local plat = script.Parent
          local dangerous = false

          -- фон: мигаем цветами в цикле
          task.spawn(function()
              while true do
                  plat.Color = Color3.fromRGB(0,200,0)  -- безопасно
                  dangerous = false
                  task.wait(1.2)
                  plat.Color = Color3.fromRGB(255,0,0)  -- опасно
                  dangerous = true
                  task.wait(0.9)
              end
          end)

          -- при касании, урон только если dangerous == true
          plat.Touched:Connect(function(hit)
              local humanoid = hit.Parent and hit.Parent:FindFirstChild("Humanoid")
              if humanoid and dangerous then
                  humanoid.Health -= 30
                  print("Платформа была красной — нанесён урон!")
              end
          end)
    
      # 5) Платформа-лифт с TweenService + кнопка вызова

      - type: "hint"
        title: "5) Платформа-лифт с TweenService + кнопка вызова"
        text: |
          <ul>
            <li>Part Lift + Script внутри Lift</li>
            <li>Part LiftButton + Script внутри кнопки</li>
          </ul>
          <b>Lift Script</b> (вставить в Lift):
        code: |
          local TweenService = game:GetService("TweenService")
          local lift = script.Parent
          local startPos = lift.Position
          local topPos = startPos + Vector3.new(0, 20, 0)

          local info = TweenInfo.new(2, Enum.EasingStyle.Sine, Enum.EasingDirection.Out)

          local up = TweenService:Create(lift, info, {Position = topPos})
          local down = TweenService:Create(lift, info, {Position = startPos})

          -- Функции для контроля
          function goUp()
              up:Play()
          end

          function goDown()
              down:Play()
          end

          -- можно вызывать из кнопки через RemoteEvent или простым установлением BoolValue
          -- для простоты: слушаем BoolValue "CallLift" внутри lift
          local call = lift:FindFirstChild("CallLift")
          if not call then
              call = Instance.new("BoolValue", lift)
              call.Name = "CallLift"
              call.Value = false
          end

          call.Changed:Connect(function(val)
              if val == true then
                  goUp()
                  task.wait(6) -- ждать пока игроки выйдут
                  goDown()
                  call.Value = false
              end
          end)
      - type: "code"
        title: "Button Script (в LiftButton):"
        code: |
          local button = script.Parent
          local lift = workspace:WaitForChild("Lift")  -- найдёт платформу

          button.Touched:Connect(function(hit)
              local humanoid = hit.Parent and hit.Parent:FindFirstChild("Humanoid")
              if humanoid then
                  local call = lift:FindFirstChild("CallLift")
                  if call then call.Value = true end
                  print("Кнопка нажата — лифт вызван")
              end
          end)

      # 6) Зона-отталкивание (BodyVelocity) — ветер/батут
      - type: "hint"
        title: "6) Зона-отталкивание (BodyVelocity) — ветер/батут"
        text: "Вставить в Part PushZone."
        code: |
          -- PushZone Script
          local zone = script.Parent

          zone.Touched:Connect(function(hit)
              local root = hit.Parent and hit.Parent:FindFirstChild("HumanoidRootPart")
              local humanoid = hit.Parent and hit.Parent:FindFirstChild("Humanoid")
              if root and humanoid then
                  local bv = Instance.new("BodyVelocity")
                  bv.Parent = root
                  bv.Velocity = Vector3.new(0, 80, 60) -- вверх и вперёд (настраивай по направлению)
                  bv.MaxForce = Vector3.new(20000,20000,20000)
                  task.wait(0.35)
                  bv:Destroy()
              end
          end)

        # 7) MegaTrapBoss — движущийся босс (упрощённая версия, затем можно улучшать)
      - type: "hint"
        title: "7) MegaTrapBoss — движущийся босс (упрощённая версия, затем можно улучшать)"
        text: "Model MegaTrapBoss с Part Body, внутри Script."
        code: |
          -- MegaTrapBoss Script (упрощённая)
          local boss = script.Parent
          local body = boss:WaitForChild("Body")
          local Players = game:GetService("Players")

          local attackSound = body:FindFirstChild("Sound")
          local sparks = body:FindFirstChild("ParticleEmitter")

          -- функция: найти ближайшего игрока (HumanoidRootPart)
          local function getClosest()
              local bestRoot, bestDist = nil, math.huge
              for _, p in pairs(Players:GetPlayers()) do
                  local c = p.Character
                  local r = c and c:FindFirstChild("HumanoidRootPart")
                  if r then
                      local d = (r.Position - body.Position).Magnitude
                      if d < bestDist then bestDist, bestRoot = d, r end
                  end
              end
              return bestRoot
          end

          -- движение к игроку (используем AssemblyLinearVelocity для постоянного движения)
          task.spawn(function()
              while true do
                  local target = getClosest()
                  if target then
                      local dir = (target.Position - body.Position).Unit
                      body.AssemblyLinearVelocity = dir * 20  -- скорость босса
                  else
                      body.AssemblyLinearVelocity = Vector3.new(0,0,0)
                  end
                  task.wait(0.12)
              end
          end)

          -- атака при касании
          body.Touched:Connect(function(hit)
              local char = hit.Parent
              local hum = char and char:FindFirstChild("Humanoid")
              local root = char and char:FindFirstChild("HumanoidRootPart")
              if hum and root then
                  hum.Health -= 15  -- урон
                  if sparks then sparks:Emit(20) end
                  if attackSound then attackSound:Play() end

                  -- лёгкое подбрасывание
                  local bv = Instance.new("BodyVelocity", root)
                  bv.Velocity = Vector3.new(0, 80, 0)
                  bv.MaxForce = Vector3.new(15000,15000,15000)
                  task.wait(0.25)
                  bv:Destroy()
              end
          end)
      - type: "note"
        text: "Совет: сделай Body массивным (Mass) и включи CollisionGroups, если хочешь, чтобы босс не застревал."

