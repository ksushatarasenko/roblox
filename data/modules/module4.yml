id: 4
title: "🧩 МОДУЛЬ 4: Игрок, чекпоинты и телепорты"
description: "В этом модуле мы научимся управлять игроком, перемещать его, создавать чекпоинты, безопасные зоны, ловушки и сделаем своё Obby с правильным респауном."

lessons:

# ============================================================
# УРОК 29 — Кто такой игрок и где он живёт
# ============================================================
  - id: 29
    title: "⭐ Урок 29. Кто такой игрок и где он живёт"
    shortDescription: "Понимаем, как устроён игрок: его модель, здоровье, скорость и прыжки."
    # video: "https://www.youtube.com/embed/PLAYERINFO24"

    content:

      - type: "text"
        title: "🎯 Цель урока"
        text:
          - "Понять, что такое игрок в Roblox и почему он состоит из нескольких частей. Мы не создаём игрока — мы учимся его находить."

      - type: "text"
        title: "🧠 Большая идея урока"
        text: |
          Игрок — это не одна деталь. 
          <br><br>
          <p>Игрок в Roblox состоит из нескольких объектов:</p>
          <ul>
            <li>Player — профиль</li>
            <li>Character — тело</li>
            <li>Humanoid — жизнь</li>
            <li>HumanoidRootPart — центр тела</li>
          </ul><br>

          <p>Игрок появляется сам</p>
          <p>Roblox создаёт его автоматически.</p>
          <p>Мы его не создаём — мы его находим.</p>

      
      - type: "oneImage"
        title: "Из чего состоит игрок"
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module4/lesson29/%D0%98%D0%B7%20%D1%87%D0%B5%D0%B3%D0%BE%20%D1%81%D0%BE%D1%81%D1%82%D0%BE%D0%B8%D1%82%20%D0%B8%D0%B3%D1%80%D0%BE%D0%BA.png?raw=true"
            width: 100%
            maxWidth: "100%"
            align: center

      - type: "text"
        title: "🧩 Что происходит при входе в игру"
        text: |
          <p>Когда игрок нажимает «Play», Roblox автоматически:</p>
          <ul>
            <li>создаёт игрока (Player)</li>
            <li>создаёт ему тело (Character)</li>
            <li>добавляет жизнь (Humanoid)</li>
            <li>помещает тело в мир (Workspace)</li>
          </ul>
          <p>Мы не пишем код для этого — Roblox делает это сам.</p>
          <p>Нам не нужен ни один скрипт, чтобы игрок появился.</p>

      - type: "text"
        title: "🧩 Из чего состоит игрок"
        text: |
          <p>Когда игрок заходит в игру, Roblox создаёт НЕ ОДИН объект, а несколько..</p>
          <p>Давай разберёмся, кто есть кто.</p>

      - type: "text"
        text: |
          <ul>
            <li><b>🟦 Player</b> — это сам игрок.<p>Это его профиль: имя, настройки, статистика.</p></li>
            <li><b>🟩 Character</b> — это тело игрока, которое мы видим в мире.</li>
            <li><b>❤️ Humanoid</b> — это «жизнь» внутри тела: <p>здоровье, ходьба, прыжки.</p></li>
          </ul>
      
      - type: "text"
        title: "⚠️ Важно для понимания:"
        text: |
          <p>Игрок ≠ тело.</p>
          <p>Player — это НЕ модель в мире.</p>
          <p>Character — это только тело игрока.</p>

      - type: "text"
        title: "📁 Где живёт игрок в Roblox Studio"
        text: |
          <p>В Roblox есть два важных места:</p><br>
          <ul>
            <li><b>📂 Players</b> — здесь живёт Player (профиль игрока)</li>
            <li><b>🌍 Workspace</b> — здесь появляется тело игрока (Character)</li>
          </ul><br>
          <p>Player живёт в Players.</p>
          <p>Тело игрока появляется в Workspace.</p>
      - type: "oneImage"
        title: ""
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module4/lesson29/Struktura%20gracza%20w%20Roblox%20Studio.png?raw=true"
            width: 100%
            maxWidth: "100%"
            align: center


      - type: "code"
        text: "Он появляется в папке:"
        code: |
          game.Players

      - type: "text"
        title: "❤️ 1. Что такое Player?"
        text:
          - "<b>Player</b> — это аккаунт игрока в Roblox."
          - "Он хранит информацию:"
          - "<ul>
              <li>имя</li>
              <li>идентификатор (UserId)</li>
              <li>статистика (очки, деньги)</li>
              <li>настройки (звук, графика)</li>
            </ul>"
      
      - type: "note"
        text: |
          🔍 Если ты видишь игрока в мире —
          значит ты смотришь на его тело, а не на самого Player.

      
      - type: "steps"
        title: "🛠 Сделай так"
        items:
          - "Запусти игру (Play)."
          - "Открой Explorer."
          - "Найди папку Players."
          - "Найди своего игрока."
          - "Найди модель персонажа в Workspace."

      - type: "text"
        title: "🟢 Подумай"
        text: |
          <ul>
            <li>Почему игрок появляется без скриптов?</li>
            <li>Почему в Players и в Workspace — разные объекты?</li>
            <li>Что исчезнет, если игрок упадёт и умрёт?</li>
          </ul> 

     

      - type: hint
        text: |
          Подсказка 🔑
          <ul>
            <li>Игрок появляется без скриптов, потому что Roblox создаёт его автоматически.</li>
            <li>В Players хранится сам игрок (профиль), а в Workspace — только его тело.</li>
            <li>Когда игрок умирает, исчезает тело, но Player остаётся.</li>
          </ul>
      

      - type: "note"
        text: |
          ❗ Ошибка:<br>
          Игрок — это НЕ модель в Workspace.<br>
          Модель — это только тело.

      - type: "note"
        text: |
          ✔ Игрок создаётся автоматически <br>
          ✔ Player живёт в Players<br>
          ✔ Тело игрока появляется в Workspace

      - type: "text"
        title: "Что дальше?"
        text: |
          Мы разобрались:
          <ul>
            <li>где появляется игрок</li>
            <li>где находится его тело</li>
          </ul>
          <p>В следующем уроке мы подробно разберём <b>Player</b> — профиль игрока.</p>

    
    quiz:
        - question: "Что такое Player в Roblox?"
          answers:
            - "Тело игрока в мире"
            - "Профиль игрока (имя, настройки)"
            - "Часть карты"
          correct: 1

        - question: "Где находится Player в Roblox Studio?"
          answers:
            - "В Workspace"
            - "В ServerStorage"
            - "В папке Players"
          correct: 2

        - question: "Что такое Character?"
          answers:
            - "Аккаунт игрока"
            - "Тело игрока в мире"
            - "Скрипт управления"
          correct: 1

        - question: "Что исчезает, когда игрок умирает?"
          answers:
            - "Player"
            - "Character"
            - "Папка Players"
          correct: 1

        - question: "Кто создаёт игрока при нажатии Play?"
          answers:
            - "Мы в коде"
            - "Скрипт в Workspace"
            - "Roblox автоматически"
          correct: 2

    
    end:
        - type: "text"
          title: "🎯 Главная мысль урока"
          text: |
            <h4>Запомни:</h4>
            <p>Player остаётся всегда.</p>
            <p>Тело может исчезать и появляться снова.</p>

# ============================================================
# УРОК 30 — Player: профиль игрока
# ============================================================
  - id: 30
    title: "⭐ Урок 30. Player — профиль игрока"
    shortDescription: "Разбираемся, что такое Player, какую информацию он хранит и зачем он нужен."

    content:

      - type: "text"
        title: "🎯 Цель урока"
        text:
          - "Понять, что такое Player в Roblox."
          - "Узнать, какую информацию он хранит."
          - "Научиться отличать Player от тела игрока."

      - type: "codeBlock"
        title: "🧠 Большая идея урока"
        code: |
          Player — это НЕ тело игрока.
          Player — это профиль игрока.
          Player живёт в папке Players.
          Player остаётся, даже если тело исчезло.

      
      - type: "text"
        title: "🧩 Что такое Player"
        text: |
          <p><b>Player</b> — это профиль игрока в Roblox.</p>
          <p>Он создаётся автоматически, когда игрок заходит в игру.</p>

      - type: "text"
        title: "📦 Что хранит Player"
        text: |
          <ul>
            <li>имя игрока</li>
            <li>UserId (уникальный номер)</li>
            <li>статистику (очки, деньги)</li>
            <li>настройки игрока</li>
          </ul>

      - type: "oneImage"
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module4/lesson30/%D0%A7%D1%82%D0%BE%20%D1%85%D1%80%D0%B0%D0%BD%D0%B8%D1%82%20%D0%BF%D1%80%D0%BE%D1%84%D0%B8%D0%BB%D1%8C%20%D0%B8%D0%B3%D1%80%D0%BE%D0%BA%D0%B0.png?raw=true"
            width: 100%
            maxWidth: "100%"
            align: center

# 📁 Где находится Player
      - type: "text"
        title: "📁 Где находится Player"
        text: |
          <p>Все игроки находятся в специальной папке:</p>


      - type: "code"
        text: "Папка игроков:"
        code: |
          game.Players

      
      - type: "note"
        text: |
          В папке Players ты видишь игроков,
          даже если их тело ещё не появилось в мире.
      
      - type: "oneImage"
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module4/lesson30/%D0%98%D0%B3%D1%80%D0%BE%D0%BA.png?raw=true"
            width: 100%
            maxWidth: "100%"
            align: center
      
      - type: "text"
        title: "Коротко и строго по делу, по этой картинке 👇"
        text: |
          <h4>🔵 СЛЕВА — Explorer (структура игры)</h4>
          <h5>📂 Players</h5>
          <p>Здесь живут Player’ы (профили игроков).</p>
          <p><b>👤 kiruha_202202</b> Это Player, не тело.</p>
          <p>Внутри Player:</p>
          <ul>
            <li><b>🎒 Backpack</b> — инструменты игрока</li>
            <li><b>📜 PlayerScripts</b> — скрипты игрока (камера, управление и т.д.)</li>
          </ul>
          <p>❗ Здесь нет тела — только данные игрока.</p><br>
          <h4>🟣 СПРАВА — Properties (свойства Player)</h4>
          <p>Ты смотришь свойства Player kiruha_202202.</p>
          <p>Самое важное:</p>
          <ul>
            <li>Name → kiruha_202202 👉 имя Player</li>
            <li>UserId → 4492213667 👉 уникальный номер игрока (не меняется)</li>
            <li>Parent → Players 👉 подтверждение, что это Player</li>
            <li>Character 👉 ссылка на тело игрока в Workspace</li>
            <li>DisplayName → Venik 👉 отображаемое имя в игре</li>
          </ul>
      

# 🔁 Player и Character — не одно и то же
      - type: "text"
        title: "🔑 КЛЮЧЕВАЯ МЫСЛЬ"
        text: |
          <p>Слева в Players — Player (профиль).</p>
          <p>В центре в Workspace — Character (тело).</p>
          <p>Справа в Properties — данные Player.</p>


      - type: "text"
        title: "🔁 Player и Character — в чём разница?"
        text: |
          <ul>
            <li><b>Player</b> — это профиль игрока.</li>
            <li><b>Character</b> — это тело игрока.</li>
          </ul>

      - type: "note"
        text: |
          Player остаётся всегда.
          Character может исчезать и появляться снова.
# 🛠 Сделай так

      - type: "steps"
        title: "🛠 Сделай так"
        items:
          - "Запусти игру (Play)."
          - "Открой Explorer."
          - "Найди папку Players."
          - "Найди своего Player."
          - "Обрати внимание: это НЕ модель тела."


      - type: "text"
        title: "🟢 Подумай"
        text: |
          <ul>
            <li>Почему Player не находится в Workspace?</li>
            <li>Почему Player остаётся после смерти персонажа?</li>
            <li>Зачем хранить данные игрока отдельно от тела?</li>
          </ul>

     

      - type: hint
        title: "Подсказка 🔑"
        text: |
          
          <ul>
            <li>Player — это информация об игроке.</li>
            <li>Его нельзя увидеть в мире.</li>
            <li>Тело можно потерять, а Player — нет.</li>
          </ul>
      

      - type: "note"
        text: |
          ❗ Ошибка: <br>
          Пытаться управлять игроком через его модель в Workspace.

          ✔ Правильно:
          Player — профиль.
          Character — тело.


    
    quiz:
    - question: "Что такое Player?"
      answers:
        - "Тело игрока в мире"
        - "Профиль игрока"
        - "Часть карты"
      correct: 1

    - question: "Где находится Player?"
      answers:
        - "В Workspace"
        - "В папке Players"
        - "В ServerStorage"
      correct: 1

    - question: "Что происходит с Player, когда игрок умирает?"
      answers:
        - "Он исчезает"
        - "Он удаляется"
        - "Он остаётся"
      correct: 2

    - question: "Что хранит Player?"
      answers:
        - "Только модель тела"
        - "Имя, UserId, данные игрока"
        - "Только Humanoid"
      correct: 1
    
    end:
        - type: "text"
          title: "🧠 Что мы поняли"
          text: |
             <ul>
                <li>Player — это профиль игрока</li>
                <li>Он живёт в папке Players</li>
                <li>Он создаётся автоматически</li>
                <li>Он не является телом игрока</li>
              </ul>
              <p>Если игрок умрёт:</p>
              <ul>
                <li>❌ тело в Workspace исчезнет</li>
                <li>✅ Player в Players останется</li>
              </ul>
              <p><b>Player — это информация об игроке.</b></p>
              <p><b>Character — это его тело в мире.</b></p>

# ============================================================
# ⭐ Урок 31. Character — тело игрока
# ============================================================
  - id: 31
    title: "⭐ Урок 31. Character — тело игрока"
    shortDescription: "Разбираемся, что такое Character, где он находится и чем он отличается от Player."

    content:

      - type: "text"
        title: "🎯 Цель урока"
        text:
          - "Понять, что такое <b>Character</b>, где он находится и чем он отличается от Player."

      - type: "codeBlock"
        title: "🧠 Большая идея урока"
        code: |
          Player — это профиль игрока
          Character — это его тело в мире
        afterText: | 
          <p><b>👉 Player управляет данными</b></p>
          <p><b>👉 Character — это то, что мы видим и двигаем</b></p>
      
      - type: "text"
        title: "🧩 Что такое Character?"
        text: |
          <p><b>Character — это модель тела игрока, которая появляется в мире.</b></p>

      - type: "text"
        title: "У Character есть:"
        text: |
          <ul>
            <li>голова</li>
            <li>руки</li>
            <li>ноги</li>
            <li>тело</li>
            <li>Humanoid (жизнь)</li>
            <li>HumanoidRootPart (центр тела)</li>
          </ul>

      - type: "oneImage"
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module4/lesson30/%D1%82%D0%B5%D0%BB%D0%BE%D0%98%D0%B3%D1%80%D0%BE%D0%BA%D0%B0.png?raw=true"
            width: 100%
            maxWidth: "100%"
            align: center

# 📁 Где находится Player
      - type: "text"
        title: "📍 Где находится Character?"
        text: |
          <h4>✔ Character живёт в: <b style=\"color: rgb(255, 0, 64);\">Workspace</b></h4>
      


      - type: "code"
        text: "Папка игроков:"
        code: |
          Workspace
            └─ kiruha_202202   ← Character (тело)
        afterText: "⚠️ Имя Character часто такое же, как имя Player — это нормально."

      
      - type: "text"
        title: "🧩 Что происходит при входе в игру"
        text: |
          Когда игрок нажимает Play, Roblox автоматически:
          <ul>
            <li>создаёт Player</li>
            <li>создаёт Character</li>
            <li>помещает Character в Workspace</li>
          </ul>
          <p>👉 Мы <b>не создаём Character вручную.</b></p>
      
      
      
      - type: "codeBlock"
        title: "🔍 Из чего состоит Character"
        text: |
          <h4>Пример структуры:</h4>
        code: |
          Character
            ├─ Head
            ├─ Torso / UpperTorso / LowerTorso
            ├─ LeftHand
            ├─ RightHand
            ├─ LeftFoot
            ├─ RightFoot
            ├─ Humanoid
            └─ HumanoidRootPart
      


      - type: "text"
        title: "❤️ Самое важное внутри Character"
        text: |
          <h4> 🟢 Humanoid</h4>
          <p>Отвечает за:</p>
          <ul>
            <li>здоровье</li>
            <li>ходьбу</li>
            <li>прыжки</li>
            <li>смерть</li>
          </ul><br>
           <h4> 🔵 HumanoidRootPart</h4>
          <p>Это:</p>
          <ul>
            <li>центр тела</li>
            <li>точка телепортации</li>
            <li>точка поворота</li>
          </ul>
          <h5>👉 Если мы хотим переместить игрока — мы двигаем HumanoidRootPart</h5>

          
      - type: table
        title: "🧠 Важное отличие (очень важно)"
        headers: ["Player", "Character"]
        rows:
          - ["профиль", "тело"]
          - ["живёт в Players", "живёт в Workspace"]
          - ["не виден", "виден"]
          - ["не умирает", "может умереть"]



      - type: "text"
        title: "❌ Частая ошибка"
        text:
          - "❌ Character — это Player"
          - "❌ Player — это тело"
          - "<br>"
          - "<h4>✔ Правильно:</h4>"
          - "✅ Player — это аккаунт"
          - "✅ Character — это модель"


      - type: "text"
        title: "🟢 Подумай"
        text: |
          <ul>
            <li>Почему Character можно уничтожить, а Player — нет?</li>
            <li>Почему Character каждый раз создаётся заново?</li>
            <li>Почему у Character есть Humanoid?</li>
          </ul>

     

      - type: hint
        title: "Подсказка 🔑"
        text: |
          
          <ul>
            <li>Player живёт <b>всегда</b></li>
            <li>Character живёт <b>пока игрок жив</b></li>
            <li>После смерти Character создаётся <b>новый</b></li>
          </ul>
      

      - type: "text"
        title: "🛠 Сделай так (практика)"
        text: |
          <ol>
            <li>Нажми <b>Play</b></li>
            <li>Открой <b>Explorer</b></li>
            <li>Найди <b>Players → своего Player</b></li>
            <li>Найди <b>Workspace → модель с таким же именем</b></li>
            <li>Раскрой Character и найди:
              <ul>
                <li>Humanoid</li>
                <li>HumanoidRootPart</li>
              </ul>
            </li>
          </ol>

      - type: "text"
        title: "Очень простая формула"
        text: |
          <p>Хочешь изменить как выглядит игрок → работай с Character</p>
