          platform.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  task.wait(1)
                  platform.Anchored = false
              end
          end)

      - type: "code"
        title: "🧪 Ловушка №2 — Ядовитая зона"
        text: |
          <h5>Ассоциация:</h5>
          Представь, что игрок зашёл в токсичное болото, где воздух вредный 🫤☠️
          <h4>📦 Что делаем:</h4>
            <ul>
              <li>Создай зелёный Part → PoisonZone</li>
              <li>Добавь Script</li>
            </ul>
          <h5>🧾 Код «ядовитой зоны» (урон постепенно)</h5>
        code: |
          local zone = script.Parent
          local touching = false

          zone.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              if humanoid then
                  touching = true
                  print("Игрок в ядовитой зоне!")

                  while touching do
                      humanoid.Health -= 5
                      task.wait(0.5)
                  end
              end
          end)

          zone.TouchEnded:Connect(function(hit)
              touching = false
              print("Игрок покинул ядовитую зону.")
          end)
        afterText: 
          - "✔️ Игрок получает урон, пока стоит в зоне."
          - "✔️ Отличная ловушка для настоящего испытания."

      - type: "code"
        title: "🚀 Ловушка №3 — Подбрасывание (как взрыв или пружина)"
        text: |
