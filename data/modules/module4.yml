  - id: 47
    title: "🌟 Урок 47. Мини-проект: Obby с чекпоинтами"
    shortDescription: "Создаём полноценный уровень Obby."

    content:
      - type: "text"
        title: "🔎 Краткий анализ: чему ты уже научился и как это используется в проекте"
        text: |
          Мы уже проходили многие темы — ниже кратко, чтоб понять, чем опираемся:
            <ul>
              <li><b>События Touched, переменные, if/else</b> — для реакций платформ и зон.</li>
              <li><b>Переменные & функции</b> — упрощают и структурируют код (повторно вызываемые действия).</li>
              <li><b>Humanoid / HumanoidRootPart / Player / Character</b> — для телепортации, урона, изменения скорости, прыжка.</li>
              <li><b>wait(), таймеры, циклы (while/for)</b> — для мигания платформ и циклических механизмов.</li>
              <li><b>TweenService</b> — плавные анимации (свечение, подъём/опускание).</li>
              <li><b>ParticleEmitter, Sound, BillboardGui</b> — эффекты и подсказки игроку.</li>
              <li><b>BodyVelocity / VectorForce</b> — отталкивания и подбрасывания.</li>
              <li><b>SpawnLocation / RespawnLocation / Checkpoint</b> — сохранение прогресса.</li>
              <li><b>Структурирование: один скрипт на объект / переиспользуемые скрипты</b> — чистая архитектура.</li>
            </ul>
            Все эти навыки мы используем в Obby: чекпоинты, лавы, падающие платформы, лифт, портал, зона-отталкивания, MegaTrapBoss и финал.

      - type: "text"
        title: "🗺️ Идея уровня (что будет в Obby — расширение, «чтобы проект стал настоящим»)"
        text:
          Предлагаю 6–8 основных зон, каждая с «фишкой»
            <ol>
              <li><b>Старт</b> — стартовая платформа с BillboardGui «Старт» и небольшим туториалом (1–2 надписи).</li>
              <li><b>Прыжковая дорожка</b> — ряд платформ, среди них одна «падающая» и одна «мигающая опасная».</li>
              <li><b>Лава под секцией</b> — если промахнулся — респан на последнем чекпоинте.</li>
              <li><b>Платформа-лифт (TweenService)</b> — поднимается между этажами, кнопка вызывает лифт.</li>
              <li><b>Зона отталкивания + трамплины</b> — ветер / батуты (BodyVelocity).</li>
              <li><b>Комната с MegaTrapBoss</b> — босс движется за игроком, атакует, надо обежать/перепрыгнуть; рядом чекпоинт перед боссом.</li>
              <li><b>Портал/телепорт</b> — двусторонний портал между зоной с секретом и основным путём.</li>
              <li><b>Финиш</b> — платформа с телепортом в лобби/лодж (Destination), награда/монета.</li>
            </ol>
          Дополнительные «интересные добавки» - скрытые пути (секреты), альтернативные лёгкие/сложные маршруты, визуальная тема (например -  «вулкан» → лавовые эффекты), звуковые подсказки при успехе, лидерборд/очки.
         

