        text:
          - "Это как двери из мира Portal 🔵🔶"
          - "Заходишь в портал А → оказываешься в B."
          - "Заходишь в портал B → оказываешься снова в A."
          - "<h4> 📦 Подготовка:</h4>"
          - " <ul><li>PortalA</li>
            <li>PirtalB</li><li>В обоих одинаковый код (только цель отличается)</li></ul>"
      - type: "code"
        title: "✨ Код PortalA (ведёт в B):"
        code: |
          local portal = script.Parent
          local target = workspace.PortalB

          portal.Touched:Connect(function(hit)
              local char = hit.Parent
              local root = char:FindFirstChild("HumanoidRootPart")

              if root then
                  root.CFrame = target.CFrame + Vector3.new(0, 3, 0)
                  print("A → B")
              end
          end)
      - type: "code"
        title: "✨ Код PortalB (ведёт в A):"
        code: |
          local portal = script.Parent
          local target = workspace.PortalA

          portal.Touched:Connect(function(hit)
              local char = hit.Parent
              local root = char:FindFirstChild("HumanoidRootPart")

              if root then
                  root.CFrame = target.CFrame + Vector3.new(0, 3, 0)
