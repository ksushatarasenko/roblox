  - id: 24
    title: "⭐ Урок 24: Звук: как мир откликается на действия"
    shortDescription: "Учимся добавлять звуки как реакцию на события в игровом мире."
    

    content:

      # -------------------------
      # INTRO
      # -------------------------
      - type: "text"
        title: "🎯 Цель урока"
        text: |
          <p>Научиться добавлять звуки как реакцию на события в игровом мире.</p>
          <p>📌 В этом уроке:</p>
          <ul>
            <li>мы НЕ учим новую логику</li>
            <li>мы добавляем звук к уже знакомым механикам</li>
          </ul>


      - type: "codeBlock"
        title: "🧠 Большая идея урока."
        code: |
          Звук — это тоже реакция.
          Просто её слышно, а не видно.

        afterText: |
          <p>Сегодня мы научимся добавлять звуки как реакцию на события в игровом мире.</p> 
          <p>Мы создадим кнопку, которая воспроизводит звук при нажатии.</p>
        
      - type: "text"
        title: "🟢 Вступление"
        text: |
          <p>Представь игру без звуков.</p>
          <p>Кнопка нажалась — тишина.</p>
          <p>Дверь открылась — тишина.</p>
          <br>
          <p>Звук делает игру <b>живой</b>.</p>.

      - type: "text"
        title: "🔊 Что такое звук?"
        text:
          - "Звук — это объект <b>Sound</b>."
          - "Он живёт внутри других объектов."
          - "Мы можем сказать ему: <b>Play()</b> — и он зазвучит."

      - type: "text"
        title: "🔔 Примеры реакций"
        text:
          - "• кнопка — воспроизводит звук при нажатии"
          - "• плита — издаёт звук при наступлении"
          - "• лазер — сигналит при пересечении"
          - "По логике — это всё одно и то же."

      - type: "note"
        text: |
          🔑 <b>Звук — это тоже реакция.</b>  
          <p>Просто её слышно, а не видно.</p>

      - type: "text"
        title: "🎯 Цель реакции"  
        text: |
          <p>Цель реакции — <b>заставить мир меняться</b> в ответ на сигнал триггера.</p>
          <p>Например:</p>
          <ul>
            <li>Игрок нажал кнопку → воспроизошёл звук</li>
            <li>Игрок наступил на плиту → зазвучал сигнал</li>
            <li>Игрок пересёк лазер → включился звуковой эффект</li>
          </ul>
      # -------------------------
      # 🟦 Практика 1 — Самый простой звук
      # -------------------------
      - type: "text"
        title: "🟦 Практика 1 — Самый простой звук"
        text: |
          <h4>🎯 Задание</h4>
          <p>Сделать кнопку, которая <b>воспроизводит звук при нажатии.</b></
          <h4>💡 Подсказка</h4>
            <ul>
              <li>кнопка — триггер</li>
              <li>звук — реакция</li>
              <li>запуск по Touched</li>
            </ul>

      - type: "codeBlock"
        title: "🧠 Подготовка в Studio"
        text:
          - "Создай Part — кнопку."
          - "Добавь внутрь неё объект <b>Sound</b>."
          - "Вставь любой SoundId."
          - "Добавь <b>Script</b> в кнопку."
          - "📌 Код: кнопка со звуком"
        code: |
          local button = script.Parent
          local sound = button.Sound

          button.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  sound:Play() -- запускаем звук
              end
          end)
        afterText: |
          <ul>
            <li>✔️ <b>Touched</b> — триггер (что-то произошло)</li>
            <li>✔️ <b>if Humanoid</b> — проверка игрока</li>
            <li>✔️ <b>Play()</b> — реакция мира</li>
          </ul>
          <p>Поздравляю! Ты создал кнопку, которая воспроизводит звук! 🎉</p>


      - type: "text"
        title: "🟢 СТОП И ВОПРОС?"  
        text: |
            <ul>
              <li>Звук — это триггер или реакция?</li>
              <li>Что запускает звук?</li>
              <li>Будет ли звук играть сам по себе?</li>
            </ul>
      - type: "hint"
        title: "Подсказка 🔑 "
        text:
          - "🔑  Звук — это реакция."
          - "🔑  Он запускается событием Touched."
          - "🔑  Если никто не касается кнопки, звук не играет."

      
      - type: "note"
        text: |
          🔑 <b>Важно:</b> 
          <p>Кнопка — это триггер. </p>
          <p>Дверь — это реакция.</p>
          <p>Когда игрок касается кнопки, дверь меняет цвет.</p>

      
      # -------------------------
      # 🟨 Практика 2 — Звук + пауза
      # -------------------------
      - type: "text"
        title: "🟨 Практика 2 — Звук + пауза"
        text:  |
          <h4>Сначала звук, потом тишина</h4>
          <h5>🎯 Задание</h5>
          <p>Сделать так, чтобы звук:</p>
          <ul>
            <li>играл</li>
            <li>потом была пауза</li>
            <li>потом снова играл</li>
          </ul>
          <h5>💡 Подсказка</h5>
          <ul>
            <li>wait</li>
            <li>sound:Stop()</li>
          </ul>
          

      - type: "code"
        title: "📌 Код: звук с паузой"
        code: |
          local button = script.Parent
          local sound = button.Sound

          button.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  sound:Play()
                  wait(1)
                  sound:Stop()
              end
          end)
        afterText: |
          <ul>
            <li>✔️ Игрок коснулся кнопки</li>
            <li>✔️ Звук заиграл</li>
            <li>✔️ Через секунду звук остановился</li>
          </ul>

      - type: "note"
        text: |
          🔑 <b>Важно:</b> Мы добавили команду <b>Stop()</b>, чтобы остановить звук после паузы.
          <p>Теперь звук играет, потом делает паузу, а потом останавливается.</p>




      # -------------------------
      # 🟩 Практика 3 — СДЕЛАЙ САМ 💪
      # -------------------------
      - type: "steps"
        title: "🟩 Практика 3 — СДЕЛАЙ САМ 💪"
        
      - type: "text"
        title: "🧪 Практика 3 — Сделай сам"
        text: |
          Попробуй:
          <ol>
            <li>Добавить звук к опасной зоне (лава)</li>
            <li>Звук должен играть, когда игрок её касается</li>
          </ol>


      - type: "text"
        title: "Подумай:" 
        text: |
          <ul>  
            <li>где триггер?</li>
            <li>где уже есть реакция?</li>
            <li>как добавить звук в реакцию?</li>
          </ul>
      - type: "hint"
        title: "Подсказка 🔑"
        text:
          - "Лава — это триггер"
          - "Реакция — это уменьшение здоровья игрока"
          - "Добавь объект Sound внутрь лавы и запусти его в реакции"
        code: |
          local lava = script.Parent
          local sound = lava.Sound  
          lava.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")
              if humanoid then
                  humanoid.Health = humanoid.Health - 10
                  sound:Play() -- запускаем звук
              end
          end)
        afterText: |
          <ul>
            <li>✔️ Игрок коснулся лавы</li>      
            <li>✔️ Здоровье уменьшилось</li>   
            <li>✔️ Звук воспроизвелся</li>
          </ul>
          
      


    # -🟦 Практика 4 — 🧠 Мини-челлендж ⚡

      - type: "text"
        title: "🧠 Мини-челлендж ⚡"
        text: |
          Сделай кнопку, которая:
          <ul>
            <li>которая издаёт <b>один звук</b> при нажатии</li>
            <li>и <b>другой звук</b>, если нажать ещё раз</li>
          </ul>
          <p>📌 Подсказка:</p>
          <p>состояние объекта (isOn = true/false)</p>


      - type: "hint"
        title: "Подсказка 🔑"
        text:
          - "Используй переменную, чтобы отслеживать состояние (нажата/не нажата)"
          - "В зависимости от состояния воспроизводи разные звуки"
        code: |
          local button = script.Parent
          local soundOn = button.SoundOn
          local soundOff = button.SoundOff
          local isOn = false

          button.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  if not isOn then
                      soundOn:Play()
                      isOn = true
                  else
                      soundOff:Play()
                      isOn = false
                  end
              end
          end)
        afterText: |
          <ul>
            <li>✔️ Игрок коснулся кнопки</li>       
            <li>✔️ Воспроизвелся звук включения</li>
            <li>✔️ При повторном нажатии воспроизвелся звук выключения</li>
          </ul>

      - type: "note"
        text: |
          ✔️ Звук — это реакция  
          ✔️ Он запускается по событию  
          ✔️ Его можно сочетать с wait  
          ✔️ Звук делает мир живым
      - type: "text"
        text: |
          В мини-проекте Obby:
          <ul>
            <li>кнопки будут звучать</li>
            <li>ловушки будут предупреждать</li>
            <li>финиш будет праздновать победу</li>
          </ul>
            Ты научился добавлять звуки как реакцию на события в игровом мире! 🚀 🎮

        
    quiz:
      - question: "Звук в контексте триггера — это что?"
        answers:
