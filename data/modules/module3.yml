      # ============================
      # Формула урока
      # ============================
      - type: text
        title: "📋 Формула урока"
        text: |
          <ul>
            <li><b>🔍 if</b> — проверка (да/нет)</li>
            <li><b>➡️ then</b> — переход к действию (если да)</li>
