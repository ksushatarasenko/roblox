      - type: "hint"
        title: "Подсказка 🔑"
        text:
          - "Видимость объекта контролируется свойством Transparency"
          - "Значение 0 — полностью видимый, 1 — полностью невидимый"
          - "Используй wait(1) для задержки"
        code: |
