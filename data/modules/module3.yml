# ===============================
# Урок 21: Таймеры и задержки: учимся ждать в коде
# ===============================
 
  - id: 21
    title: "⏳⭐ Урок 21: Таймеры и задержки: учимся ждать в коде"
    shortDescription: "Сегодня мы научимся делать паузы в коде — ждать секунды и выполнять команды позже."
    

    content:

      # -------------------------
      # INTRO
      # -------------------------
      - type: "text"
        title: "⏳ Как научить Roblox «ждать» между действиями"
        text: |
          Представь, что ты говоришь роботу:
          <ul>
            <li>«Прыгай, но подожди 2 секунды!»</li>
            <li>«Меняй цвет каждые полсекунды!»</li>
            <li>«Через 5 секунд взорвись!»</li>
            <li>«Подожди немного и потом телепортируйся!»</li>
          </ul>
          <p class = "warzno">Чтобы робот умел ждать, в Roblox есть команда <b>wait()</b>.</p>
          Это как сказать:
          <em>«Стой тут и ничего не делай это время.»</em>

      - type: "text"
        title: "Что такое таймер?"
        text:
          - "Иногда нужно, чтобы что-то произошло не сразу."
          - "Например:"
          - "• дверь открывается через 3 секунды;"
          - "• платформа исчезает на пару секунд;"
          - "• сообщение появляется и пропадает;"
          - "• куб мигает раз в секунду."
          - "Для таких ситуаций в Roblox есть таймеры!"
      
      - type: "text"
        title: "🧩 Ключевое понятие: ожидание"
        text: |
          <p>Ожидание — это когда игра делает паузу перед следующим действием.</p>
          <p>Это полезно для создания эффектов, анимаций и управления временем в игре.</p>
          <p>Сегодня мы изучим две важные команды для работы с таймерами:</p>
          <ul>
            <li><b>wait()</b> — делает паузу в коде на заданное количество секунд.</li>
            <li><b>task.delay()</b> — выполняет действие через заданное время, не останавливая игру.</li>
          </ul>
         

      # -------------------------
      # wait()
      # -------------------------
      - type: "text"
        title: "Команда wait(seconds)"
        text:
          - "<b>wait()</b> — это пауза."
          - "Если написать: <code>wait(2)</code>, игра подождёт 2 секунды и продолжит выполнение кода."

      - type: "code"
        language: "lua"
        title: "Пример: выводим цифры с паузой"
        code: |
          print("1")
          wait(2)
          print("Прошло 2 секунды!")
        afterText: "Сначала появится 1, потом через 2 секунды — сообщение."

      

      # -------------------------
      # PRACTICE 1
      # -------------------------
      - type: code
        language: "lua"
        title: "🌈 Пример 1: куб меняет цвет каждые 2 секунды"
        text: |
          - "Создай Part."
          - "Добавь Script."
          - "Вставь код ниже."
        code: |
          local cube = game.Workspace.Cube

          cube.Color = Color3.new(1, 0, 0) -- красный
          wait(2)
          cube.Color = Color3.new(0, 1, 0) -- зелёный
          wait(2)
          cube.Color = Color3.new(0, 0, 1) -- синий
        afterText: "Куб как светофор! 🚦✨"

      - type: "code"
        language: "lua"
        title: "🟨 Пример 2: эффект «постепенного роста»"
        code: |
          local cube = game.Workspace.Cube

          cube.Size = Vector3.new(4, 4, 4)
          wait(1)
          cube.Size = Vector3.new(5, 5, 5)
          wait(1)
          cube.Size = Vector3.new(6, 6, 6)
        afterText: "Куб становится всё больше — как будто ест магические пончики 🍩😄"

      - type: "code"
        title: "💥 Пример 3: действие через 3 секунды"
        code:
          wait(3)
          print("Бам!")
        afterText: "Полезно для ловушек, сюрпризов, анимаций и таймеров ⏰"
      - type: code
        title: "🔁 Пример 4: мигающий куб с таймером (цикл + wait)"
        code: |
          local cube = game.Workspace.Cube

          while true do
              cube.Transparency = 0
              wait(0.3)
              cube.Transparency = 1
              wait(0.3)
          end
        afterText: "Куб мигает, как новогодняя гирлянда 🎄✨"
      - type: text
        title: "⚠️ Важный момент!"
        text: 
          - "Если ты делаешь <b>бесконечный цикл (while true do)</b>"
          - "— всегда используй <b>wait()</b>, иначе Roblox может зависнуть."

      # -------------------------
      # task.delay()
      # -------------------------
      - type: "text"
        title: "Команда task.delay(seconds, функция)"
        text:
          - "<b>task.delay()</b> — это команда «сделай позже, но не останавливай код»."
          - "Она говорит компьютеру: «через X секунд выполни это действие»."
          - ""
          - "<b>Чем отличается от wait?</b>"
          - "<b>wait()</b> — код останавливается и ждёт."
          - "<b>task.delay()</b> — код идёт дальше, а действие выполняется потом."
          - ""
          - "Это удобно, когда эффект должен закончиться позже, а игра не должна останавливаться."
          - "Например: вспышка, исчезающий объект, временный эффект."
          - ""
          - "<i>Пока не обязательно понимать, как это работает внутри — важно знать, что такая возможность есть.</i>"

      - type: "text"
        title: "Синтаксис task.delay"
        text:
          - "<b>task.delay(секунды, функция)</b>"
          - "• секунды — через сколько секунд выполнить действие;"
          - "• функция — блок кода, который нужно выполнить позже."
      - type: "text"
        title: "🧠 Зачем это надо и в чем разница с wait"
        text:
          - "<b>wait()</b> — это когда ты стоишь и ждёшь."
          - "<b>task.delay()</b> — это когда ты поставил таймер и пошёл дальше."
          - "Это полезно для создания отложенных эффектов и действий."


      - type: "code"
        language: "lua"
        title: "Пример: сообщение через 3 секунды"
        code: |
          task.delay(3, function()
                  -- этот код выполнится ПОТОМ
              print("Прошло 3 секунды!")
          end)

      - type: "note"
        text: "task.delay() не останавливает игру, в отличие от wait(). Она просто запускает действие позже."

      # -------------------------
      # PRACTICE 2 — исчезающая платформа
      # -------------------------
      - type: "steps"
        title: "Практика 2: исчезающая платформа"
        items:
          - "Создай Part → назови его Platform."
          - "Добавь Script внутрь."
          - "Вставь код:"

      - type: "code"
        language: "lua"
        title: "Платформа исчезает и появляется"
        code: |
          local platform = script.Parent

          while true do
              platform.Transparency = 0
              platform.CanCollide = true
              wait(2)

              platform.Transparency = 1
              platform.CanCollide = false
              wait(2)
          end

      - type: "text"
        text:
          - "Теперь платформа пропадает на 2 секунды, а потом возвращается!"

      # -------------------------
      # EXTRA — эффект с задержкой
      # -------------------------
      - type: "text"
        title: "Отложенный эффект (очень полезно!)"
        text:
          - "Мы можем включить эффект, а отключить его позже — автоматически."

      - type: "code"
        language: "lua"
        title: "Пример: эффект включается на 1 секунду"
        code: |
          local cube = script.Parent

          cube.Color = Color3.new(1, 0, 0) -- красный

          task.delay(1, function()
              cube.Color = Color3.new(1, 1, 1) -- обратно белый
          end)

      # -------------------------
