      - type: "hint"
        text: "Подсказка 🔑"
        code: |
          local TweenService = game:GetService("TweenService")
          local platform = script.Parent

          local startPos = platform.Position
          local endPos = startPos + Vector3.new(0, 12, 0)

          local info = TweenInfo.new(2)

          while true do
              TweenService:Create(platform, info, {Position = endPos}):Play()
              wait(2)
              TweenService:Create(platform, info, {Position = startPos}):Play()
              wait(2)
          end)

      # =======================================
      # 🟩 ЗАДАНИЕ 5. КНОПКА → МОСТ
      # =======================================
      - type: "text"
        title: "🟩 ЗАДАНИЕ 5. КНОПКА → МОСТ"
        text: |
          <h5>🎯 Что делаем</h5>
          <p>Кнопка включает мост.</p>
          <h5>💡 Подсказка</h5>
          <ul>
            <li>Part с именем Button</li>
            <li>Part с именем Bridge</li>
            <li>Script внутри кнопки</li>
            <li>При касании игрока: мост становится видимым и проходимым + звук</li>

      - type: "hint"
        text: "Подсказка 🔑"
        code: |
          local button = script.Parent
          local bridge = workspace.Bridge
          local sound = button.Sound
          local active = false

          button.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") and not active then
                  bridge.Transparency = 0
                  bridge.CanCollide = true
                  sound:Play()
                  active = true
              end
          end)

      # =======================================
      # ⚠️ ЗАДАНИЕ 6. ЛОВУШКА
      # =======================================
      - type: "text"
        title: "⚠️ ЗАДАНИЕ 6. ЛОВУШКА"
        text: |
          <p>Платформа исчезает через секунду, показывает эффект.</p>

      - type: "hint"
        text: "Подсказка 🔑"
        code: |
          local platform = script.Parent
          local effect = platform.Effect
          local used = false

          platform.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") and not used then
                  used = true
                  wait(1)
                  effect.Enabled = true
                  platform.CanCollide = false
                  platform.Transparency = 1
              end
          end)

      # =======================================
      # 🏁 ЗАДАНИЕ 7. ФИНИШ
      # =======================================
      - type: "text"
        title: "🏁 ЗАДАНИЕ 7. ФИНИШ"
        text: |
          <p>Финиш поздравляет игрока.</p>
          <p>играет победный звук + эффект.</p>

      - type: "hint"
        text: "Подсказка 🔑"
        code: |
          local finish = script.Parent
          local sound = finish.Sound
          local effect = finish.Effect

          finish.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  sound:Play()
                  effect.Enabled = true
                  print("Поздравляем! Вы прошли Obby!")
              end
          end)

      - type: "text"
        title: "Поздравляем!"
        text:
          - "Ты создал настоящий Obby."
          - "Мир реагирует на игрока, звучит и меняется."

    end:
      - type: "text"
        title: "Ты молодец!"
        text: "Это уже уровень настоящего Roblox-разработчика 🙌🔥"
