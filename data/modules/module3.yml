      # ============================
      # for — ПОВТОР ПО КОЛИЧЕСТВУ
      # ============================
      - type: "text"
        title: "🟠 5. for — ПОВТОР ПО КОЛИЧЕСТВУ"
        text: |
          <h4>«Делай это N раз»</h4>
          <p>for — это <b>повторение по количеству</b></p>
          <h5>Примеры из жизни:</h5>
            <ul>
              <li>Прыгай 5 раз 🤸‍♂️</li>
              <li>Мигай светом 10 раз 💡</li>
              <li>Считай от 1 до 10 🔢</li>
            </ul>
          <h5>Ключевая мысль:</h5>
            <ul>
              <li>for — когда знаем сколько раз нужно повторить</li>
              <li>Есть число → это for</li>
            </ul>      
      - type: "gallery"
        title: "Примеры for — ПОВТОР ПО КОЛИЧЕСТВУ"
        images:
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson20/module3_20_5_1.png?raw=true"
