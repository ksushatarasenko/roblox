id: 3
title: "🧩 МОДУЛЬ 3: Создание игрового мира и логики. Скрипты взаимодействия"
description: "Этот модуль формирует понимание: как создавать игровые механики, как объекты живут и взаимодействуют, что такое триггеры, порталы, кнопки, таймеры, эффекты и основы физики Roblox. 👉 Мир живой, и всё в нём работает по правилам, которые ты сам придумал." 
lessons:
  # ===============================
  # Урок 18
  # ===============================
  - id: 18
    title: "⭐ Урок 18: Script и LocalScript: кто за что отвечает"
    shortDescription: "Учимся понимать разницу между серверным Script и клиентским LocalScript."
    # video: "https://www.youtube.com/embed/jw9MFF-HEvw?si=9J9yGT9xm_iuZwLw"

    content:

      - type: "text"
        title: "О чём этот урок?"
        text:
          - "Представь, что Roblox — это большой парк аттракционов 🎡"
          - "А код — это правила и кнопки, которые заставляют всё работать. "
          - "<br>Сегодня мы узнаем, что в Roblox есть <b>два вида скриптов</b>: <b>Script</b> (сервер) и <b>LocalScript</b> (игрок)."
          - "Они похожи, но работают в разных местах. Это очень важно понимать, иначе код будет вести себя странно!"
          - "В конце урока ты точно будешь знать: какой скрипт куда ставить."
          - "Это похоже на двух сотрудников:"
          - "<ul><li><b>Script</b> — работает на сервере (как главный управляющий).</li><li><b>LocalScript</b> — работает у игрока на компьютере (как личный помощник игрока).</li></ul>"
          - "И каждый делает своё дело 🧠⚙️" 
          - "<br> 🎮 Пример: <ul><li>Кнопка на экране — LocalScript</li><li>Дверь в мире — Script</li></ul>"
          - "<br> 💡 Важная мысль: <ul><li><em>Сервер — это «мозг игры»,</em></li><li><em>игрок — это «глаза и руки».</em></li></ul>"

      - type: "gallery"
        title: "🟥 Script — работает на сервере"
        images:
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson14/script1.png?raw=true"
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson14/script2.png?raw=true"

      - type: "text"
        title: "🧑‍🤝‍🧑 Script — «главный взрослый»"
        text: |
          <h4>📌 Что делает Script:</h4>
            <ul>
              <li>Работает на сервере</li>
              <li>Видят все игроки</li>
              <li>Управляет важными вещами в игре</li>    
            </ul>
          <h4>🏫 Аналогия из жизни:</h4>
            <ul>
              <li>Представь школу 🏫</li>
              <li>Script — это директор школы, который следит за порядком для всех учеников.</li>
            </ul>
          <h5>👨‍🏫 Директор:</h5>
            <ul>
              <li>включает звонок 🔔 (его слышат ВСЕ)</li>
              <li>открывает ворота 🚪 (их видят ВСЕ)</li>
              <li>назначает уроки 📚 (все учатся по одним правилам)</li>
              <li>следит за правилами 📝 (все должны их соблюдать)</li>
            </ul>
          <h5>🎮 Пример в Roblox:</h5>
            <ul>
              <li>Игрок получил очки → все видят счёт</li>
              <li>Открывается дверь → все видят её открытой</li>
              <li>Телепортирует всех на арену</li>
              <li>Создаёт ловушки в мире</li>
              <li>Начался раунд → для всех игроков</li>
            </ul>
          <p>Script — это главный, он управляет всем миром игры для всех игроков.</p>
      
      - type: "gallery"
        title: "🟦 LocalScript — работает у игрока (клиент)"
        images:
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson14/localScript1.png?raw=true"
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson14/localScript2.png?raw=true"

      - type: "text"
        title: "🧍 LocalScript — «то, что видишь только ты»"
        text: |
          <h4>📌 Что делает LocalScript:</h4>
            <ul>
              <li>Работает только у одного игрока</li>
              <li>Никто другой этого не видит</li>
              <li>Часто связан с кнопками, камерой, интерфейсом</li>    
            </ul>
          <h4>🏫 Аналогия из жизни:</h4>
            <ul>
              <li>Теперь школа, но… 🏫</li>
              <li>LocalScript — это твои очки или наушники 😎🎧</li>
            </ul>
          <h5>👓 Только ТЫ:</h5>
            <ul>
              <li>видишь свой экран</li>
              <li>слышишь музыку</li>
              <li>нажимаешь кнопки</li>
            </ul>
          <h5>🎮 Пример в Roblox:</h5>
            <ul>
              <li>Ты нажал кнопку → у тебя открылось меню</li>
              <li>Камера повернулась → только у тебя</li>
              <li>Появилась подсказка → только для тебя</li>
            </ul>
          <p>📌 Если это лично для игрока, нужен LocalScript</p>


      
      
      - type: "text"
        title: "🤝 Самое главное:"
        text: |
          <b>Script влияет на игру для ВСЕХ игроков.</b>
          Если Script перекрасит куб — куб изменится у всех.
          Это общий мир.

      - type: "warning"
        text: "Если ты хочешь, чтобы действие <b>видели все игроки</b> — используй Script."

      # --------------------------
      #  КЛИЕНТСКИЙ LOCALSCRIPT
      # --------------------------
      
      - type: "warning"
        text: 
          - "💡 Самое главное:<b>LocalScript НЕ может управлять серверными объектами напрямую.</b>"
          - "Он работает только с тем, что относится к игроку."

      - type: table
        title: "⚔️ В чём разница? (Очень простое сравнение)"
        headers: ["Кто?", "Где работает?", "Что делает?", "Пример"]
        rows:
          - ["Script", "Сервер", "Изменяет мир игры", "Открывает двери для всех"]
          - ["LocalScript", "Клиент", "Управляет игроком", "Показывает GUI только игроку"]
        afterText: |
          <b>Script</b> — директор игры,  
          <b>LocalScript</b> — личный помощник игрока.
      
      - type: text
        title: "🧠 Как запомнить легко"
        text: |
          <p>🔊 Script — как громкоговоритель (слышат все)</p>
          <p>🎧 LocalScript — как наушники (слышишь только ты)</p>

      - type: code
        title: "🧪 Примеры кода"
        text: "🟥 Пример Script — меняет цвет куба для всех"
        code: |
          local cube = game.Workspace.Cube

          cube.Color = Color3.new(1, 0, 0) -- красный
        afterText: "Каждый игрок увидит красный куб."
      
      - type: code
        title: "🟦 Пример LocalScript — показывает сообщение игроку"
        text: "LocalScript помещаем в StarterPlayerScripts:"
        code: |
          print("Привет, игрок!") -- это увидит только тот, у кого запустился script
        afterText: "Если 10 игроков на сервере — каждый увидит ОТДЕЛЬНОЕ сообщение у себя."
      
      
      - type: text
        title: "🔐 Почему так сделано?"
        text: |
        Чтобы никто не мог:
          <ul>
            <li>читерить</li>
            <li>менять мир только у себя</li>
            <li>давать себе бессмертие</li>
            <li>телепортировать предметы у всех игроков</li>
          </ul>
          Сервер — главный судья.
          <p>LocalScript — помощник, который подчиняется правилам.</p>
      - type: text
        title: "💡 Как работает вместе Script + LocalScript?"
        text: |
          Обычно так:
          <h4>LocalScript:</h4>
          <ul>
            <li>ловит действия игрока (клик, кнопка, движение)</li>
            <li>отправляет сигнал серверу (через RemoteEvent)</li>            
          </ul>
          <h4>Script:</h4>
          <ul>
            <li>получает сигнал</li>
            <li>меняет мир</li>
            <li>отправляет ответ игроку</li>
          </ul>
          Это похоже на разговор:
           <ul>
            <li>Игрок: «Я нажал кнопку!»</li>
            <li>Сервер: «Окей, открываю дверь!»</li>
          </ul>
      
      - type: text
        title: "🎨 Визуальные подсказки"
        text: |
          <h4>Script → весь мир Roblox </h4>
          <h4>LocalScript → один игрок</h4>
          Если LocalScript попробует изменить мир — Roblox скажет:
      - type: quote
        text: "«Эй, ты этого не можешь! Это работа Script!»"


      - type: "steps"
        title: "Куда можно ставить LocalScript"
        items:
          - "StarterPlayerScripts"
          - "StarterCharacterScripts"
          - "StarterGui (для интерфейса)"

      # --------------------------
      #  ПРАКТИКА
      # --------------------------
      - type: "text"
        title: "Давай попробуем!"
        text:
          - "Мы сделаем простой Script и LocalScript, чтобы увидеть разницу."

      - type: "code"
        language: "lua"
        title: "Script (в ServerScriptService)"
        code: |
          print("Этот текст видят ВСЕ игроки!")

      - type: "code"
        language: "lua"
        title: "LocalScript (в StarterPlayerScripts)"
        code: |
          print("Этот текст видишь только ТЫ!")

      - type: "text"
        title: "Что произошло?"
        text:
          - "Script выполняется на сервере — поэтому сообщение появится у всех игроков."
          - "LocalScript работает только у тебя — другие его не увидят."

      # --------------------------
      #  МИНИ-ПРАКТИКА
      # --------------------------
      - type: "steps"
        title: "Практическое задание"
        items:
          - "Создай Part в Workspace."
          - "Внутри него создай Script."
          - "Напиши, чтобы при касании игрока Part менял цвет."
          - "Попробуй сделать то же самое в LocalScript — ты увидишь, что оно не сработает!"

      - type: "note"
        text: "И это правильно! LocalScript не может менять объекты в Workspace для всех игроков."

    quiz:
      - question: "Где работает Script?"
        answers:
          - "На стороне игрока"
          - "На сервере"
          - "Только в интерфейсе"
        correct: 1

      - question: "Что может делать LocalScript?"
        answers:
          - "Управлять камерой"
          - "Создавать объекты в Workspace"
          - "Изменять мир для всех игроков"
        correct: 0

      - question: "Где можно размещать LocalScript?"
        answers:
          - "Workspace"
          - "ServerScriptService"
          - "StarterPlayerScripts"
        correct: 2
    end: 
      - type: text
        text: "Ты стал ещё на шаг ближе к тому, чтобы писать настоящие игры 😎🔥"

  # ===============================
  # Урок 19
  # ===============================
  - id: 19
    title: "🤹 Урок 19: Циклы while и for — учимся повторять действия или как научить компьютер «делать что-то много раз»"
    shortDescription: "Сегодня мы научимся делать команды, которые повторяются сами!"

    content:
      - type: text
        text: |
          Представь, что ты говоришь роботу:
          <ul>
            <li>«Прыгни 5 раз!» </li>
            <li>«Мигай светом пока 5 раз» </li>
            <li>«Считай от 1 до 10!» </li>
          </ul>
          <p>Робот не может просто повторять сам — ему нужно постоянно объяснить как, и тут ты говоришь “прыгай, прыгай, прыгай…” или “мигай, мигай, мигай…”</p>
          <p>Или проще — “прыгай 5 раз”? “мигай 5 раз”? </p>
          <p>Сегодня мы научимся использовать <b>циклы</b> в Lua — команды, которые позволяют повторять действия много раз без лишнего кода!</p>
          <h4>❓ Ответь:</h4>
            <ul>
              <li>«Что удобнее — повторять команду или сказать “10 раз”?»</li>
              <li>«Как вы думаете, компьютеру тоже лень повторять?»</li>
            </ul>
     


      - type: "text"
        title: "Что такое цикл?"
        text: |
          <h4>Цикл — это правило: “Делай это снова и снова”</h4>
          <p>Циклы помогают компьютеру повторять действия без лишнего кода.</p>
          <h5>Примеры без кода:</h5>
            <ul>
              <li>шаги в игре 🚶‍♂️</li>
              <li>мигание света 💡</li>
              <li>таймер ⏱</li>
              <li>анимация персонажа 🕺</li>
              <li>счёт очков 📊</li>
            </ul>

      - type: text
        title: "🎯 Виды циклов"
        text: |
          Сегодня мы изучим два самых важных:
          <h4>🔁 1. Цикл while — повторяет, пока условие истинно</h4>
          <h4>🔢 2. Цикл for — повторяет определённое число раз</h4>
          Всё просто — сейчас увидишь 👇
      

      # ============================
      # WHILE LOOP
      # ============================
      - type: "text"
        title: "Цикл while — повторяй, пока условие истинно"
        text:
          - "Цикл <b>while</b> выполняет команды бесконечно или пока условие = true."
          - "Это самый часто используемый цикл в Roblox."
          - "<b>while — когда мы НЕ знаем, сколько раз, но знаем условие.</b>"
          - "🚦 Аналогия из жизни:"
          - "- Пока горит зелёный — идём 🚦"
          - "- Пока есть энергия — играем 🎮"
          - "- Пока здоровье больше 0 — живы ❤️"
          - "📌 Есть слово “пока” → это while"

      - type: "code"
        language: "lua"
        title: "Цикл while работает так:"
        code: |
          while УСЛОВИЕ do
              -- действия
          end
        afterText: "Он будет повторяться, пока условие равно <b>true</b> (истина)."

      - type: "note"
        text: "В играх цикл while часто работает всё время: он двигает платформы, мигает лампочками и проверяет события."

      # ============================
      # PRACTICE 1
      # ============================
      - type: code
        title: "🍩 Простой пример: мигающий куб"
        code: |
          local cube = game.Workspace.Cube

          while true do
              cube.Color = Color3.new(1, 0, 0) -- красный
              wait(0.5)
              cube.Color = Color3.new(0, 1, 0) -- зелёный
              wait(0.5)
          end
        afterText: "➡️ Куб мигает бесконечно, как светофор! 🚦"

      - type: "code"
        language: "lua"
        title: "🍪 Пример: куб прыгает вверх снова и снова"
        code: |
          local cube = game.Workspace.Cube

          while true do
              cube.Position += Vector3.new(0, 1, 0)
              wait(0.2)
          end
        afterText: "Куб медленно поднимается в небо 🌤️✨"
      
      - type: "text"
        title: "🔴 ВАЖНЫЙ МОМЕНТ: бесконечный цикл"
        text: |
          <h4>❓ Ответь:</h4>
            <ul>
              <li>Остановится ли этот код сам?</li>
              <li>Что будет, если “пока” никогда не закончится?</li>
            </ul>

      - type: hint
        title: "Подсказака 👇"
        text: 
          - "Если условие всегда true (истина), цикл будет бесконечным."
          - "Это значит, что код внутри будет выполняться снова и снова, пока игра работает."
          - “<b>Он будет работать вечно!</b>”         
          

      - type: "text"
        title: "⚠️ Важно!"
        text: |
          <p class = "warzno">Если ты пишешь <b>while true do</b>, обязательно делай <b>wait()</b>,иначе Roblox может зависнуть — слишком много повторений без паузы.</p>
          <p>Это как если бы ты пытался прыгать без остановки — ты устанешь очень быстро!</p>
          <p>📌 Это не страшно, но:</p>
          <ul>
            <li>Игра может тормозить</li>
            <li>Игроки могут вылетать</li>
            <li>игра может зависнуть</li>
            <li>Roblox может закрыть игру</li>
            <li>Roblox может сказать: “Слишком долго работает”</li>
          </ul>

      # ============================
      # FOR LOOP
      # ============================
      - type: "text"
        title: "Цикл for — повторяем N раз"
        text:
          - "Если нужно повторить что-то определённое количество раз (например 5 раз) — используем <b>for</b>."

      - type: "code"
        language: "lua"
        title: "Пример цикла for"
        code: |
          for i = 1, 5 do
              print("Шаг:", i)
          end
        afterText: "i = номер шага(счётчик) (1, 2, 3, 4, 5)"

     

      # ============================
      # PRACTICE 2
      # ============================
      - type: code
        language: "lua"
        title: "🎈 Пример: куб меняет цвет 10 раз"
        code: |
          local cube = game.Workspace.Cube

          for i = 1, 10 do
              cube.Color = Color3.new(math.random(), math.random(), math.random())
              wait(0.3)
          end
        afterText: "Куб станет супер-радужным 🌈✨"

      - type: "code"
        language: "lua"
        title: "📦 Пример: куб становится всё больше и больше"
        code: |
          local cube = script.Parent

          for i = 1, 5 do
              cube.Size = cube.Size + Vector3.new(1,1,1)
              wait(0.2)
          end
        afterText: "Куб растёт как дрожжевое тесто 🥯😄"

      - type: code
        language: "lua"
        title: "🧠 Пример: обратный отсчёт"
        code: |
          for i = 5, 1, -1 do
              print(i)
              wait(1)
          end

          print("Поехали!")
      - type: code
        text: "Роблокс напишет:"
        code: |
          5
          4
          3
          2
          1
          Поехали!

      # ============================
      # EXTRA SECTION
      # ============================
      

      - type: "text"
        title: "Где используются циклы в реальных играх?"
        text:
          - "• Движущиеся платформы"
          - "• Вентиляторы и ловушки"
          - "• Свет, который мигает"
          - "• Таймеры"
          - "• Анимации"

      - type: "text"
        title: "🧠 Как выбрать цикл?"
        text: |
          <ul>
            <li>Знаю сколько раз → <b>for</b></li>
            <li>Знаю условие → <b>while</b></li>
          </ul>
          <h5>угадай цикл</h5>
            <ol>
              <li>Пока здоровье > 0 </li>
              <li>Прыгай 3 раза </li>
              <li>Пока дверь закрыта </li>
              <li>Меняй цвет 7 раз </li>
              <li>5 прыжков </li>
              <li>Пока игрок жив </li>
              <li>10 секунд назад </li>
              <li>10 монет собрано </li>
            </ol>
      - type: hint
        title: "Подсказка 👇"
        text:
           <ol>
              <li>while</li>
              <li>for</li>
              <li>while</li>
              <li>for</li>
              <li>for</li>
              <li>while</li>
              <li>for</li>
              <li>for</li>
            </ol>


      # ============================
      # Мини-задание
      # ============================
      - type: text
        title: "🧪 Мини-игра-практика (квест!)"
        text: |
          Попробуй сделать:
          <h5>🎯 Задание:</h5>
          Сделай куб, который:
            <ol>
              <li>5 раз мигает разными цветами</li>
              <li>Потом 3 раза прыгает вверх</li>
              <li>Потом пишет в Output: "Финиш!"</li>
            </ol>

      - type: "hint"
        title: "Подсказка"
        code: |
          local cube = game.Workspace.Cube

          -- 1. Мигаем 5 раз
          for i = 1, 5 do
              cube.Color = Color3.new(math.random(), math.random(), math.random())
              wait(0.3)
          end

          -- 2. Прыгаем 3 раза
          for i = 1, 3 do
              cube.Position += Vector3.new(0, 3, 0)
              wait(0.3)
          end

          print("Финиш!")

    quiz:
      - question: "Что делает цикл while?"
        answers:
          - "Повторяет код до тех пор, пока условие истинно"
          - "Выполняет код только один раз"
          - "Удаляет объект"
        correct: 0

      - question: "Что делает цикл for?"
        answers:
          - "Повторяет код бесконечно"
          - "Повторяет код заданное количество раз"
          - "Тормозит игру"
        correct: 1

      - question: "Что обязательно нужно ставить внутри бесконечного while?"
        answers:
          - "print()"
          - "wait()"
          - "return"
        correct: 1
    end:
      - type: text
        text: |
          <h5>🎤 Фраза для запоминания:</h5>
            <ul>
              <li><b>for — “по количеству”</b></li>
              <li><b>while — “по условию”</b></li> 
          - "Ты стал на шаг ближе к настоящему разработчику Roblox! 😎🔥"

# ===============================
  # Урок 20
  # ===============================
  - id: 20
    title: "🤹 Урок 20: Как компьютер думает и решает, что делать"
    shortDescription: "Сегодня мы НЕ учим ничего нового. Мы собираем всё, что уже умеем, в одну понятную картинку."

    content:
      - type: text
        title: "🧠 Большая идея урока"
        text: |
          <p><b>Компьютер не думает сам.</b></p>
          <p><b>Мы даём ему правила.</b></p>
     


      - type: "text"
        title: "🟢 1. if — ПРОВЕРКА"
        text: |
          <h4>«А правда ли это?»</h4>
          <p>if — это <b>проверка</b></p>
          <p>Компьютер спрашивает: <b>да или нет?</b></p>
          <h5>Примеры из жизни:</h5>
            <ul>
              <li>Если идёт дождь ☔</li>
              <li>Если здоровье = 0 ❤️</li>
              <li>Если монет больше 10 🪙</li>
            </ul>

      - type: "gallery"
        title: "Примеры if — ПРОВЕРКА"
        images:
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson20/module3_20_2_1%D0%B0.png?raw=truee"
            caption: "Пример 1: Проверяем, есть ли игрок"
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson20/module3_20_2_2%D0%B0.png?raw=true"
            caption: "Пример 2: Проверяем, достаточно ли здоровья"
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson20/module3_20_3%D0%B0.png?raw=true"
            caption: "Пример 3: Проверяем, нажата ли кнопка"
        

# then — ПЕРЕХОД К ДЕЙСТВИЮ
      - type: text
        title: "🟡 2. then — ПЕРЕХОД К ДЕЙСТВИЮ"
        text: |
          <h4>«Если да, то делай это»</h4>
          <p>then — это <b>ТОГДА </b> - переход к действию</p>
          <h5>Примеры из жизни:</h5>
            <ul>
              <li>Если идёт дождь ☔, тогда возьми зонт</li>
              <li>Если здоровье = 0 ❤️, тогда игра окончена</li>
              <li>Если монет больше 10 🪙, тогда купи жизнь</li>
            </ul>
          <p>Не команда.</p>
          <p>Не магия.</p>
          <p>А <b>мостик</b> от проверки к действию.</p>
      
      - type: codeBlock
        title: "Читаем вслух:"
        code: |
          if дождь then
              взятьЗонт()
          end
        afterText: "👉 «Если дождь — тогда берём зонт»"

      - type: "gallery"
        title: "Примеры then — ПЕРЕХОД К ДЕЙСТВИЮ"
        images:
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson20/module3_20_2_1.png?raw=true"
            caption: "Пример 1: Если враг рядом — атакуем"
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson20/module3_20_2_2.png?raw=trueain/module3/lesson20/module3_20_4_2.png?raw=true"
            caption: "Пример 2: Если энергия полная — бежим быстрее"
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson20/module3_20_2_3.png?raw=true"
            caption: "Пример 3: Если уровень пройден — открываем следующий"
        
            

      # ============================
      # else — ЗАПАСНОЙ ПУТЬ
      # ============================
      - type: "text"
        title: "🔵 3. else — ЗАПАСНОЙ ПУТЬ"
        text: |
          <h4>«А если нет?»</h4>
          <p>else — это <b>иначе</b> - запасной путь</p>
          <h5>Примеры из жизни:</h5>
            <ul>
              <li>Если идёт дождь ☔, тогда возьми зонт, иначе иди без зонта</li>
              <li>Если здоровье = 0 ❤️, тогда игра окончена, иначе продолжай играть</li>
              <li>Если монет больше 10 🪙, тогда купи жизнь, иначе собирай дальше</li>
              <li>Если ты голоден 🍔, тогда ешь, иначе играй дальше</li>
            </ul>
          <h5>Важно закрепить:</h5>
            <ul>
              <li>else — это не команда, <b>не обязателен</b></li>
              <li>else — это запасной путь, <b>когда есть второй вариант</b></li>
            </ul>
      - type: "gallery"
        title: "Примеры else — ЗАПАСНОЙ ПУТЬ"
        images:
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson20/module3_20_3_1.png?raw=true"
            caption: "Если идёт дождь ☔, тогда возьми зонт, иначе иди без зонта"
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson20/module3_20_3_2.png?raw=true"
            caption: "Если здоровье = 0 ❤️, тогда игра окончена, иначе продолжай играть"
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson20/module3_20_3_3.png?raw=true"
            caption: "Если монет больше 10 🪙, тогда купи жизнь, иначе собирай дальше"


    # while — ПОВТОР ПО УСЛОВИЮ
          
      - type: text
        title: "🟣 4. while — ПОВТОР ПО УСЛОВИЮ"
        text: |
          <h4>«Делай, ПОКА это правда»</h4>
          <p>while — это <b>повторение по условию</b></p>
          <h5>Примеры из жизни:</h5>
            <ul>
              <li>Пока горит зелёный свет 🚦, иди</li>
              <li>Пока есть энергия ⚡, играй</li>
              <li>Пока здоровье > 0 ❤️, живи</li>
            </ul>
          <h5>Ключевая мысль:</h5>
            <ul>
              <li>while — когда НЕ знаем сколько раз, но знаем условие</li>
              <li>Есть слово “пока” → это while</li>
            </ul>
      - type: "gallery"
        title: "Примеры while — ПОВТОР ПО УСЛОВИЮ"
        images:
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson20/module3_20_4_1.png?raw=true"
            caption: "Пока горит зелёный свет 🚦, иди"
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson20/module3_20_4_2.png?raw=true"
            caption: "Пока есть энергия ⚡, играй"
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson20/module3_20_4_3.png?raw=true"
            caption: "Пока здоровье > 0 ❤️, живи"


      # ============================
      # for — ПОВТОР ПО КОЛИЧЕСТВУ
      # ============================
      - type: "text"
        title: "🟠 5. for — ПОВТОР ПО КОЛИЧЕСТВУ"
        text: |
          <h4>«Делай это N раз»</h4>
          <p>for — это <b>повторение по количеству</b></p>
          <h5>Примеры из жизни:</h5>
            <ul>
              <li>Прыгай 5 раз 🤸‍♂️</li>
              <li>Мигай светом 10 раз 💡</li>
              <li>Считай от 1 до 10 🔢</li>
            </ul>
          <h5>Ключевая мысль:</h5>
            <ul>
              <li>for — когда знаем сколько раз нужно повторить</li>
              <li>Есть число → это for</li>
            </ul>      
      - type: "gallery"
        title: "Примеры for — ПОВТОР ПО КОЛИЧЕСТВУ"
        images:
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson20/module3_20_5_1.png?raw=true"
            caption: "Считай от 1 до 10 🔢"
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson20/module3_20_5_2.png?raw=true"
            caption: "Прыгай 5 раз 🤸‍♂️"
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson20/module3_20_5_3.png?raw=true"
            caption: "Мигай светом 3 раза 💡"



      
      # ============================
      # Формула урока
      # ============================
      - type: text
        title: "📋 Формула урока"
        text: |
          <ul>
            <li><b>🔍 if</b> — проверка (да/нет)</li>
            <li><b>➡️ then</b> — переход к действию (если да)</li>
            <li><b>🔀 else</b> — запасной путь (если нет)</li>
            <li><b>🔁 while</b> — повтор по условию (пока)</li>
            <li><b>🔢 for</b> — повтор по количеству (N раз)</li>
          </ul>

      # 🎮 Мини-игра «Угадай правило»

      - type: text
        title: "🎮 Мини-игра «Угадай правило»"
