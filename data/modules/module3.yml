        title: "🟨 ЗАДАНИЕ 4. ДВИЖУЩАЯСЯ ПЛАТФОРМА"
        text: |
          <h5>🎯 Что делаем</h5>
          <p>Создаём платформу, которая ездит вверх и вниз.</p>
          <h5>💡 Подсказка</h5>
