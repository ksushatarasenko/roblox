          local door = workspace.Door
          button.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  door.Transparency = 1 -- невидимый
                  wait(1)
                  door.Transparency = 0 -- видимый
              end
