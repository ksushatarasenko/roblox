      - type: "note"
        text: "Нажми Play и смотри, как куб превращается в цветную радугу!"
      - type: text
        title: "🧪 Мини-квест!"
        text: |
          Сделай куб, который:
          <ol>
            <li>Меняет цвет</li>
            <li>Через 1 секунду увеличивается</li>
            <li>Через 2 секунды телепортируется</li>
            <li>Пишет «Готово!»</li>
          </ol>
      - type: "hint"
        title: "Подсказка 💰"
        code: |
          local cube = game.Workspace.Cube

          cube.Color = Color3.new(math.random(), math.random(), math.random())
