          <p>Если дверь уже открыта, повторные касания кнопки не изменяют её состояние.</p>




      # -------------------------
      # 🟩 Практика 3 — СДЕЛАЙ САМ 💪
      # -------------------------
      - type: "steps"
        title: "🟩 Практика 3 - СДЕЛАЙ САМ 💪"
        
