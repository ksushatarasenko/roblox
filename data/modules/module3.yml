# ===============================
# Урок 22: Триггеры: как объект понимает, что с ним взаимодействуют
# ===============================
  - id: 22
    title: "⭐ Урок 22: Триггеры: как объект понимает, что с ним взаимодействуют"
    shortDescription: "Учимся ловить момент взаимодействия,и отличать сигнал от действия."
    

    content:

      # -------------------------
      # INTRO
      # -------------------------
      - type: "text"
        title: "🎯 Цель урока"
        text: |
          <p> Понять, <b>что такое триггер</b>, научиться <b>ловить момент взаимодействия</b>, и <b>отличать сигнал от действия.</b></p>
          <p>Сегодня мы научимся создавать объекты, которые реагируют на действия игрока.</p>
          <p>Мы создадим кнопку, которая открывает дверь, когда игрок на неё нажимает.</p>

      - type: "text"
        title: "📌 ВАЖНО:"
        text:
          - "Мы НЕ открываем двери"
          - "Мы учимся <b>ловить момент нажатия кнопки</b> и <b>реагировать на это событие</b>."

      - type: "codeBlock"
        title: "🧠 Большая идея урока."
        code: |
          Триггер — это не действие.
          Триггер — это сигнал: «что-то произошло».
        afterText: |
          <p>Кнопка, плита, лазер, датчик — <b>по логике это одно и то же.</b></p>
          <p>Это объекты, которые <b>сообщают скрипту:</b> «Эй, со мной что-то сделали!»</p>
          <p>Скрипт <b>слушает сигнал</b> и <b>реагирует на него.</b></p> 
        
      - type: "text"
        title: "🟢 Вступление"
        text: |
          <p>В играх есть объекты, которые ничего не делают сами.</p>
          <p>Они просто сообщают: <b>«со мной что-то произошло»</b>.</p>
          <p>Такие объекты называются <b>триггеры</b>.</p>

      - type: "text"
        title: "🔔 Примеры триггеров"
        text:
          - "• кнопка — игрок нажал"
          - "• плита — игрок наступил"
          - "• лазер — кто-то пересёк"
          - "• датчик — игрок подошёл"
          - "По логике — это всё одно и то же."
      - type: "note"
        text: |
          🔑 <b>Триггер ничего не решает и ничего не делает.</b>
          Он только сообщает: «что-то произошло».   
      
      - type: "text"
        title: "🎯 Цель триггера"   
        text: |
          <p>Цель триггера — <b>сообщить скрипту</b>, что с ним <b>взаимодействовали</b>.</p>
          <p>Скрипт <b>слушает сигнал</b> и <b>реагирует на него</b>.</p>
          <p>Например:</p>
          <ul>
            <li>Игрок нажал кнопку → скрипт открыл дверь</li>
            <li>Игрок наступил на плиту → скрипт включил ловушку</li>
            <li>Игрок пересёк лазер → скрипт запустил сигнал тревоги</li>
          </ul>

      # -------------------------
      # 🟦 Практика 1
      # -------------------------
      - type: "steps"
        title: "Задача: "
        items:
          - "Сделать кнопку, которая реагирует на касание и просто сообщает об этом."
      
      - type: "text"
        title: "🟦 Практика 1. Создаём простой триггер"
        text:
          - "- Создай Part и назови его <b>Trigger</b>."
          - "- Сделай его небольшим и ярким."
          - "- Установи <b>Anchored = true</b>."
          - "- Добавь в него <b>Script</b>."
      - type: "code"
        title: "📌 Шаг 1. Ловим момент касания "
        text: "В Script напиши код, который реагирует на касание:"
        code: |
          local trigger = script.Parent

          trigger.Touched:Connect(function(hit)
              print("Триггер сработал!")
          end)
        afterText: |
          <ul>
            <li>✔️ Игрок коснулся триггера</li>
            <li>✔️ Появилось сообщение в консоли</li>
          </ul>
          <p>Поздравляю! Ты создал свой первый триггер! 🎉</p>

      - type: "text"
        title: "🟢 СТОП И ВОПРОС?"
        text: |
            <ul>
              <li>Это действие или сигнал?</li>
              <li>Что именно произошло?</li>
              <li>Что будет, если никто не касается триггера?</li>
            </ul>

      - type: "hint"
        title: "Подсказка 🔑  "
        text:
          - "🔑  Триггер — это сигнал."
          - "🔑 Он сообщает скрипту: «со мной что-то произошло»."
          - "🔑 Если никто не касается триггера, ничего не происходит."

      
      # -------------------------
      # STEP 2 — Практика 2
      # -------------------------
      - type: "text"
        title: "🟨 Практика 2 - Триггер понимает, что это игрок"
        text:  |
         <h5>Задача:</h5>
         <ul>
           <li>Модифицировать триггер так, чтобы он реагировал только на игрока.</li>
         </ul>
         

      - type: "code"
        title: "🧠 Проверка: это игрок?"
        code: |
          trigger.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  print("Это игрок!")
              end
          end)
        afterText: |
          <ul>
            <li>✔️ Игрок коснулся триггера</li>
            <li>✔️ Появилось сообщение в консоли</li>
            <li>✔️ Другие предметы не вызывают сообщение</li>
          </ul>
      - type: "note"
        text: |
          🔑 <b>Важно:</b> Мы проверяем, есть ли у объекта,
          <p>который коснулся триггера, компонент <b>Humanoid</b>.</p>
          <p>Если есть — значит это игрок.</p>
          <p>Если нет — значит это просто предмет.</p>    



      # -------------------------
      # STEP 3 — Практика 3 — СДЕЛАЙ САМ
      # -------------------------
      - type: "steps"
        title: "🟩 Практика 3 - СДЕЛАЙ САМ 💪"
        
      - type: "text"
        title: "🧪 Мини-задание: сделай сам"
        text: |
          Попробуй:
          <ol>
            <li>Сделать триггер, который меняет свой цвет при касании</li>
            <li>Через 1 секунду вернуть цвет обратно</li>
          </ol>

      - type: "text"
        title: "Подумай:" 
        text: |
          <ul>  
            <li>Как сохранить исходный цвет триггера?</li>
            <li>Как изменить цвет триггера?</li>
            <li>Как вернуть цвет обратно через секунду?</li>
            <li>Где можно использовать wait?</li>
          </ul>
      - type: "hint"
        title: "Подсказка 🔑 "
        text:
          - "Цвет объекта хранится в свойстве Color"
          - "Сохрани исходный цвет в переменную"
          - "Измени цвет через Color3.new(1, 0, 0) для красного"
          - "Используй wait(1) для задержки"
        code: |
          local trigger = script.Parent
          local originalColor = trigger.Color     
          trigger.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  trigger.Color = Color3.new(1, 0, 0) -- красный
                  wait(1)
                  trigger.Color = originalColor
              end
          end)
        afterText: |
          <ul>
            <li>✔️ Игрок коснулся триггера</li>       
            <li>✔️ Триггер стал красным</li>
            <li>✔️ Через секунду вернулся к исходному цвету</li>
          </ul>
          
      


    # - 🟨 Практика 4

      - type: "text"
        title: "🧪 Практика 4 — Измени сам"
        text: |
          Измени код:
          <ul>
            <li>Сделай цвет <b>синим</b> или <b>зелёным</b></li>
            <li>Поставь задержку <b>2 секунды</b></li>
            <li>Проверь, что цвет всё равно возвращается назад</li>
          </ul>

      - type: "hint"
        title: "Подсказка 🔑"
        text:
          - "Цвет задаётся через Color3.new(0-1, 0-1, 0-1)"
          - "Задержка — это wait(секунды)"
        code: |
          local trigger = script.Parent
          local originalColor = trigger.Color

          trigger.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  trigger.Color = Color3.new(0, 0, 1) -- синий
                  wait(2)
                  trigger.Color = originalColor
              end
          end)
        afterText: |
          <ul>
            <li>✔️ Игрок коснулся триггера</li>
            <li>✔️ Триггер стал синим</li>
            <li>✔️ Через 2 секунды вернулся к исходному цвету</li>
          </ul> 
# ПРАКТИКА 5
      
      
      - type: "text"
        title: "🧪 Практика 5 — Подумай и попробуй"
        text: |
          Попробуй изменить триггер так, чтобы:
          <ul>
            <li>он стал <b>прозрачным</b> при касании</li>
            <li>через секунду стал обычным</li>
          </ul>

      - type: "text"
        title: "👉 Цель:"
        text: |
          Понять, что триггер может менять не только цвет, но и другие свойства.
          Например: размер, позицию, прозрачность.

      - type: "text"
        title: "Подумай:"
        text: 
          - "• Какое свойство отвечает за прозрачность?"
          - "• Как задать значение прозрачности от 0 до 1?"
          - "• Где использовать wait?"
          
      - type: "hint"
        title: "Подсказка 🔑"
        text:
          - "Прозрачность задаётся через свойство Transparency"
          - "Значение от 0 (непрозрачный) до 1 (полностью прозрачный)"
        code: |
          local trigger = script.Parent
          local originalTransparency = trigger.Transparency 
          trigger.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  trigger.Transparency = 1 -- полностью прозрачный
                  wait(1)
                  trigger.Transparency = originalTransparency
              end
          end)
        afterText: |
          <ul>
            <li>✔️ Игрок коснулся триггера</li>
            <li>✔️ Триггер стал прозрачным</li>
            <li>✔️ Через секунду вернулся к исходной прозрачности</li>
          </ul>
        
    quiz:
      - question: "Что такое триггер?"
        answers:
          - "Объект, который выполняет действие"
          - "Объект, который сообщает скрипту о взаимодействии"
          - "Объект, который удаляется"     
        correct: 1
      - question: "Как триггер сообщает скрипту, что с ним взаимодействовали?"
        answers:
          - "С помощью события Touched"
          - "С помощью команды print"
          - "С помощью функции wait"     
        correct: 0
      - question: "Почему важно проверять, что коснулся триггера именно игрок?"
        answers:
          - "Чтобы триггер реагировал только на игрока, а не на случайные предметы"
          - "Чтобы триггер работал быстрее"
          - "Чтобы триггер менял цвет"     
        correct: 0
      - question: "Что делает команда hit.Parent:FindFirstChild('Humanoid')?"
        answers:
          - "Проверяет, есть ли у объекта компонент Humanoid, чтобы определить, что это игрок"
          - "Меняет цвет триггера"
          - "Останавливает игру"     
        correct: 0
      - question: "Когда именно меняется цвет?"
        answers:
          - "Когда игрок касается триггера"
          - "Когда игрок удаляет триггер"
          - "Когда игрок стоит рядом с триггером"     
        correct: 0
      - question: "Что произойдет, если никто не коснется триггера?"
        answers:
          - "Ничего не произойдет"
          - "Триггер изменит цвет сам по себе"
          - "Игра завершится"     
        correct: 0
      

    end:
      - type: "text"
        text: |
          Здесь мы использовали:
          <p>• триггер — чтобы поймать событие</p>
          <p>• if — чтобы проверить игрока</p>
          <p>• wait — чтобы сделать паузу</p>
          Это и есть основа игровых механик.
          <p>Теперь мы умеем ловить сигнал.</p>
          <p>В следующем уроке мы научимся <b>реагировать</b> на этот сигнал.</p>
          <p>Например — открывать дверь 🚪</p>
          <p>Ты научился создавать триггеры, которые реагируют на действия игрока! Теперь ты можешь создавать интерактивные объекты в своих играх Roblox. 🚀🎮</p>


# ===============================
# Урок 23: Реакции: как объект отвечает на триггер
# ===============================
  - id: 23
    title: "⭐ Урок 23: Реакции: как объект отвечает на триггер (кнопка → действие)"
    shortDescription: "Учимся реагировать на сигнал триггера и заставлять объекты мира меняться."
    

    content:

      # -------------------------
      # INTRO
      # -------------------------
      - type: "text"
        title: "🎯 Цель урока"
        text: |
          <p>Научиться реагировать на сигнал триггера и заставлять объекты мира меняться.</p>
          <p>📌 В этом уроке:</p>
          <ul>
            <li>Создадим кнопку-триггер</li>
            <li>Научимся реагировать на нажатие кнопки</li>
            <li>Заставим дверь открываться при нажатии кнопки</li>
          </ul>
      
      - type: "text"
        title: "🔁 Состояние объекта"
        text: |
          <p>Иногда объекту нужно <b>помнить</b>, что с ним уже произошло.</p>
          <p>Например:</p>
          <ul>
            <li>дверь уже открыта</li>
            <li>кнопка уже нажата</li>
            <li>мост уже появился</li>
          </ul>
          <p>Это называется <b>состояние объекта</b>.</p>



      - type: "codeBlock"
        title: "🧠 Большая идея урока."
        code: |
          Триггер — это не действие.
          Реакция — делает.
        afterText: |
          <p>Кнопка говорит: “что-то случилось”. А мы решаем, что с этим делать.</p> 
          <p>Сегодня мы научимся создавать объекты, которые не только сообщают о взаимодействии, но и реагируют на него.</p>
          <p>Мы создадим кнопку, которая открывает дверь, когда игрок на неё нажимает.</p>
      - type: "note"
        text: |
          🔑 Состояние — это память объекта.
          Оно помогает не делать одно и то же много раз.
        
      - type: "text"
        title: "🟢 Вступление"
        text: |
          В прошлом уроке мы научились ловить сигнал:
          <b>игрок коснулся объекта</b>.
          <br><br>
          Сегодня мы научимся <b>реагировать</b> на этот сигнал.

      - type: "codeBlock"
        title: "🧩 Логическая схема"
        code: |
          [Игрок коснулся кнопки]
              ↓
          (триггер)
              ↓
          [Проверка]
              ↓
          [Действие]
        afterText: |
          📌 Мир реагирует, а не просто сообщает.

      - type: "text"
        title: "🔔 Примеры реакций"
        text:
          - "• кнопка — открывает дверь"
          - "• плита — включает ловушку"
          - "• лазер — запускает сигнал тревоги"
          - "По логике — это всё одно и то же."
      - type: "note"
        text: |
          🔑 <b>Триггер сообщает, что произошло взаимодействие.</b>
          <p><em>Реакция — это когда мы решаем, что делать дальше.</em></p>    
      - type: "text"
        title: "🎯 Цель реакции"  
        text: |
          <p>Цель реакции — <b>заставить мир меняться</b> в ответ на сигнал триггера.</p>
          <p>Например:</p>
          <ul>
            <li>Игрок нажал кнопку → дверь открылась</li>
            <li>Игрок наступил на плиту → ловушка активировалась</li>
            <li>Игрок пересёк лазер → сигнал тревоги включился</li>
          </ul>

      # -------------------------
      # 🟦 Практика 1 — Простая реакция
      # -------------------------
      - type: "text"
        title: "🟦 Практика 1 — Простая реакция"
        text: |
          <h4>Сигнал → изменение объекта</h4>
          <h5>Задача:</h5>
          <p>Сделать кнопку, которая меняет цвет двери, когда игрок её касается.</p>
      
      - type: "text"
        title: "1. Создаём кнопку и дверь"
        text:
          - "Создай <b>Part</b> — кнопку."
          - "Создай рядом <b>Part</b> — дверь."
          - "Назови дверь <b>Door</b>."
          - "Добавь <b>Script</b> в кнопку."
      - type: "code"
        title: "📌 Шаг 1. Ловим момент касания и меняем цвет двери"
        text: "В Script напиши код, который реагирует на касание и меняет цвет двери:"
        code: |
          local trigger = script.Parent
          local door = game.Workspace.Door    
          trigger.Touched:Connect(function(hit)
              door.Color = Color3.new(0, 1, 0) -- зелёный
          end)
        afterText: |
          <ul>
            <li>✔️ Игрок коснулся кнопки</li>
