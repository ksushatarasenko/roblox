    quiz:
      - question: "Что делает команда then?"
        answers:
          - "Проверяет условие"
          - "Переходит к действию, если условие истинно"
          - "Повторяет действие"
        correct: 1      
      - question: "Когда используется цикл while?"
        answers:
          - "Когда нужно повторить действие определённое количество раз"
          - "Когда нужно повторять действие, пока условие истинно"      

          - "Когда нужно проверить условие"
        correct: 1
      - question: "Что делает команда else?"
        answers:
          - "Проверяет условие"
          - "Переходит к действию, если условие истинно"
          - "Предоставляет запасной путь, если условие ложно"
        correct: 2
    end:
      - type: text
        text: "Ты собрал все важные команды в одну картинку! Теперь ты понимаешь, как компьютер принимает решения 😎🔥"

# ===============================
# Урок 21: Таймеры и задержки: учимся ждать в коде
# ===============================
 
  - id: 21
    title: "⏳⭐ Урок 21: Таймеры и задержки: учимся ждать в коде"
    shortDescription: "Сегодня мы научимся делать паузы в коде — ждать секунды и выполнять команды позже."
    

    content:

      # -------------------------
      # INTRO
      # -------------------------
      - type: "text"
        title: "⏳ Как научить Roblox «ждать» между действиями"
        text: |
          Представь, что ты говоришь роботу:
          <ul>
            <li>«Прыгай, но подожди 2 секунды!»</li>
            <li>«Меняй цвет каждые полсекунды!»</li>
            <li>«Через 5 секунд взорвись!»</li>
            <li>«Подожди немного и потом телепортируйся!»</li>
          </ul>
          <p class = "warzno">Чтобы робот умел ждать, в Roblox есть команда <b>wait()</b>.</p>
          Это как сказать:
          <em>«Стой тут и ничего не делай это время.»</em>

      - type: "text"
        title: "Что такое таймер?"
        text:
          - "Иногда нужно, чтобы что-то произошло не сразу."
          - "Например:"
          - "• дверь открывается через 3 секунды;"
          - "• платформа исчезает на пару секунд;"
          - "• сообщение появляется и пропадает;"
          - "• куб мигает раз в секунду."
          - "Для таких ситуаций в Roblox есть таймеры!"
      
      - type: "text"
        title: "🧩 Ключевое понятие: ожидание"
        text: |
          <p>Ожидание — это когда игра делает паузу перед следующим действием.</p>
          <p>Это полезно для создания эффектов, анимаций и управления временем в игре.</p>
          <p>Сегодня мы изучим две важные команды для работы с таймерами:</p>
          <ul>
            <li><b>wait()</b> — делает паузу в коде на заданное количество секунд.</li>
            <li><b>task.delay()</b> — выполняет действие через заданное время, не останавливая игру.</li>
          </ul>
         

      # -------------------------
      # wait()
      # -------------------------
      - type: "text"
        title: "Команда wait(seconds)"
        text:
          - "<b>wait()</b> — это пауза."
          - "Если написать: <code>wait(2)</code>, игра подождёт 2 секунды и продолжит выполнение кода."

      - type: "code"
        language: "lua"
        title: "Пример: выводим цифры с паузой"
        code: |
          print("1")
          wait(2)
          print("Прошло 2 секунды!")
        afterText: "Сначала появится 1, потом через 2 секунды — сообщение."

      

      # -------------------------
      # PRACTICE 1
      # -------------------------
      - type: code
        language: "lua"
        title: "🌈 Пример 1: куб меняет цвет каждые 2 секунды"
        text: |
          - "Создай Part."
          - "Добавь Script."
          - "Вставь код ниже."
        code: |
          local cube = game.Workspace.Cube

          cube.Color = Color3.new(1, 0, 0) -- красный
          wait(2)
          cube.Color = Color3.new(0, 1, 0) -- зелёный
          wait(2)
          cube.Color = Color3.new(0, 0, 1) -- синий
        afterText: "Куб как светофор! 🚦✨"

      - type: "code"
        language: "lua"
        title: "🟨 Пример 2: эффект «постепенного роста»"
        code: |
          local cube = game.Workspace.Cube

          cube.Size = Vector3.new(4, 4, 4)
          wait(1)
          cube.Size = Vector3.new(5, 5, 5)
          wait(1)
          cube.Size = Vector3.new(6, 6, 6)
        afterText: "Куб становится всё больше — как будто ест магические пончики 🍩😄"

      - type: "code"
        title: "💥 Пример 3: действие через 3 секунды"
        code:
          wait(3)
          print("Бам!")
        afterText: "Полезно для ловушек, сюрпризов, анимаций и таймеров ⏰"
      - type: code
        title: "🔁 Пример 4: мигающий куб с таймером (цикл + wait)"
        code: |
          local cube = game.Workspace.Cube

          while true do
              cube.Transparency = 0
              wait(0.3)
              cube.Transparency = 1
              wait(0.3)
          end
        afterText: "Куб мигает, как новогодняя гирлянда 🎄✨"
      - type: text
        title: "⚠️ Важный момент!"
        text: 
          - "Если ты делаешь <b>бесконечный цикл (while true do)</b>"
          - "— всегда используй <b>wait()</b>, иначе Roblox может зависнуть."

      # -------------------------
      # task.delay()
      # -------------------------
      - type: "text"
        title: "Команда task.delay(seconds, функция)"
        text:
          - "Command <b>task.delay()</b> позволяет выполнить что-то позже."
          - "Это как 'сделай это через X секунд'."
          - "Очень удобно для анимаций, эффектов и исчезающих объектов."

      - type: "code"
        language: "lua"
        title: "Пример: сообщение через 3 секунды"
        code: |
          task.delay(3, function()
              print("Прошло 3 секунды!")
          end)

      - type: "note"
        text: "task.delay() не останавливает игру, в отличие от wait(). Она просто запускает действие позже."

      # -------------------------
      # PRACTICE 2 — исчезающая платформа
      # -------------------------
      - type: "steps"
        title: "Практика 2: исчезающая платформа"
        items:
          - "Создай Part → назови его Platform."
          - "Добавь Script внутрь."
          - "Вставь код:"

      - type: "code"
        language: "lua"
        title: "Платформа исчезает и появляется"
        code: |
          local platform = script.Parent

          while true do
              platform.Transparency = 0
              platform.CanCollide = true
              wait(2)

              platform.Transparency = 1
              platform.CanCollide = false
              wait(2)
          end

      - type: "text"
        text:
          - "Теперь платформа пропадает на 2 секунды, а потом возвращается!"

      # -------------------------
      # EXTRA — эффект с задержкой
      # -------------------------
      - type: "text"
        title: "Отложенный эффект (очень полезно!)"
        text:
          - "Мы можем включить эффект, а отключить его позже — автоматически."

      - type: "code"
        language: "lua"
        title: "Пример: эффект включается на 1 секунду"
        code: |
          local cube = script.Parent

          cube.Color = Color3.new(1, 0, 0) -- красный

          task.delay(1, function()
              cube.Color = Color3.new(1, 1, 1) -- обратно белый
          end)

      # -------------------------
      # Куда применяем таймеры?
      # -------------------------
      - type: "text"
        title: "Где используются таймеры?"
        text:
          - "• двери, которые закрываются через время;"
          - "• ловушки, которые включаются иногда;"
          - "• пропадающие платформы;"
          - "• анимации;"
          - "• включение/выключение эффектов."

      # -------------------------
      # MINI HOMEWORK
      # -------------------------
      - type: "steps"
        title: "Твоё задание"
        items:
          - "Создай куб."
          - "Сделай так, чтобы он становился случайного цвета каждые 0.5 секунды."
          - "Подсказка: Color3.new(math.random(), math.random(), math.random())"

      - type: "note"
        text: "Нажми Play и смотри, как куб превращается в цветную радугу!"
      - type: text
        title: "🧪 Мини-квест!"
        text: |
          Сделай куб, который:
          <ol>
            <li>Меняет цвет</li>
            <li>Через 1 секунду увеличивается</li>
            <li>Через 2 секунды телепортируется</li>
            <li>Пишет «Готово!»</li>
          </ol>
      - type: "hint"
        title: "Подсказка 💰"
        code: |
          local cube = game.Workspace.Cube

          cube.Color = Color3.new(math.random(), math.random(), math.random())
          wait(1)

          cube.Size += Vector3.new(1,1,1)
          wait(2)

          cube.Position += Vector3.new(0, 5, 0)
          print("Готово!")

    quiz:
      - question: "Что делает wait(1)?"
        answers:
          - "Ждёт 1 секунду"
          - "Удаляет куб"
          - "Останавливает игру полностью"
        correct: 0

      - question: "Что делает task.delay()?"
        answers:
          - "Повторяет код 100 раз"
          - "Выполняет функцию позже"
          - "Меняет цвет объекта"
        correct: 1

      - question: "Чем отличается wait от task.delay?"
        answers:
          - "wait останавливает скрипт, task.delay — нет"
          - "Они одинаковые"
          - "task.delay удаляет объект"
        correct: 0
    end:
      - type: "text"
        text: "маленький проект: бомба с таймером ⏰, телепорт с задержкой 🚪, анимация куба 🎲"

# ===============================
# Урок 22: Дверь, открывающаяся по кнопке
# ===============================
  - id: 22
    title: "⭐ Урок 22: Дверь, открывающаяся по кнопке"
    shortDescription: "Учимся делать кнопку, которая открывает дверь при прикосновении."
    

    content:

      # -------------------------
      # INTRO
      # -------------------------
      - type: "text"
        text: |
          учимся связывать кнопку, скрипт и движение объекта
          <p>Сегодня мы сделаем один из самых популярных игровых механизмов — дверь, которая открывается, когда игрок нажимает кнопку.</p>
          Да-да, как в секретных лабораториях и приключенческих играх! 😎🔓

      - type: "text"
        title: "🧱 Что будем делать?"
        text:
          - "Сегодня мы создадим настоящую дверь, которая открывается, когда игрок нажимает на кнопку."
          - "Это одна из самых популярных механик в Roblox — она встречается в обби, квестах, домах, мини-играх."
          - "Мы научимся:"
          - "• создавать кнопку;"
          - "• реагировать на прикосновение;"
          - "• менять свойства двери (прозрачность, столкновение)."
          - "Сейчас всё будет очень просто и понятно!"

      - type: "codeBlock"
        title: "🧩 Общая логика двери"
        code: |
          [Нажал кнопку]
                ↓
          [Проверка: дверь закрыта?]
                ↓ да
          [Открыть дверь]
                ↓
              wait
        afterText: |
          <p>💬 Проговорить вслух:</p>
          <p><em>Сначала событие, потом проверка, потом действие, потом ожидание. </em></p>
        
      - type: "text"
        title: "🔑 Важные моменты"
        text:
          - "1. Кнопка — это просто Part с Script внутри."
          - "2. Дверь — это тоже Part, который мы будем двигать."
          - "3. Скрипт в кнопке будет реагировать на прикосновение игрока и открывать дверь."
          - "4. Мы будем использовать событие <b>Touched</b> для кнопки."
          - "5. Для движения двери мы будем менять её позицию."
          - "Код должен начать работать, когда нажали кнопку"

      - type: "text"
        title: "🟢 СТОП И ВОПРОС?"
        text: |
            <ul>
              <li>Будет ли дверь открываться сама по себе?</li>
              <li>Что запускает код?</li>
              <li>Как скрипт в кнопке «видит» дверь?</li>
              <li>Как понять, что игрок коснулся кнопки?</li>
              <li>Как открыть и закрыть дверь?</li>
            </ul>
      
      - type: "hint"
        title: "Подсказка 👇"
        text: |
          <ul>
            <li>Нет. Дверь сама ничего не делает. Пока никто не нажал кнопку, код спит. Код не работает постоянно он ждёт события.</li>
            <li>Код запускается, когда игрок касается кнопки (событие Touched). «Кнопка говорит коду: “Эй, проснись!”»</li>
            <li>Скрипт находит дверь через game.Workspace. Мы показываем скрипту, где дверь. Скрипт не угадывает. Мы сами говорим ему: “Вот эта деталь — дверь.”</li>
            <li>Кнопка сообщает об этом через событие касания. Когда кто-то дотронулся до кнопки, она это замечает.</li>
            <li>Мы просто меняем позицию двери вверх, чтобы она «ушла» из прохода. Потом возвращаем её обратно.</li>
          </ul>
      - type: "text"
        title: "🚪 Готовы создать дверь?"
        text:
          - "Пошагово создадим кнопку и дверь, а потом напишем скрипт, который будет открывать дверь при нажатии на кнопку."
          - "Поехали!"
      

      # -------------------------
      # STEP 1 — BUTTON
      # -------------------------
      - type: "steps"
        title: "🟦 Шаг 1. Создаём кнопку"
        items:
          - "Создай Part и назови его <b>Button</b>."
          - "Сделай его плоским (Scale внизу)."
          - "Сделай маленьким (2×1×2)"
          - "Покрась в яркий цвет, например зелёный."
          - "Поставь на стену рядом с дверью"
          - "Установи свойство <b>Anchored = true</b>, чтобы кнопка не падала."
      
      - type: "gallery"
        title: "Пример кнопки"
        images:
          - src: "https://static.tildacdn.com/tild6335-3064-4165-b833-333533343436/image.png"
          - src: "https://i.ytimg.com/vi/cVshcFgv5CY/maxresdefault.jpg"
          - src: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSx2NBfXAapae-4umkgXHZevDZdqmKuyVww6w&s"

      # -------------------------
      # STEP 2 — DOOR
      # -------------------------
      - type: "steps"
        title: "🟥 Шаг 2. Создаём дверь"
        items:
          - "Создай Part и назови его <b>Door</b>."
          - "Размер: примерно 6×10×1"
          - "Поставь его в проход."
          - "Установи <b>Anchored = true</b>, чтобы она не падала."
          - "По желанию — сделай её больше и толще."
          - "(представь обычную прямоугольную дверцу)"

      - type: "gallery"
        title: "Пример двери"
        images:
          - src: "https://i.ytimg.com/vi/OMal8wM1ygQ/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLDSjhAICe5r6JXqjsRK0wCHC55zXA"
          - src: "https://i.ytimg.com/vi/MCcdOO2q7G8/sddefault.jpg"
          - src: "https://static.tildacdn.com/tild3061-3133-4632-a535-613638643364/300123___2.png"

      # -------------------------
      # STEP 3 — SCRIPT
      # -------------------------
      - type: "code"
        title: "📌 Шаг 3. Подготовка переменных"
        text: "Открой Script в кнопке и напиши:"
        code: |
          local button = script.Parent
          local door = game.Workspace.Door
        afterText: "Теперь скрипт «видит» кнопку и дверь."
      
      - type: "code"
        title: "🔺 Шаг 4. Функция открытия двери"
        code: |
          local function openDoor()
              door.Position = door.Position + Vector3.new(0, 10, 0)
          end
        afterText: "Дверь поднимается вверх на 10 студий — как лифт 🚪⬆️"
       
      - type: "code"
        title: "🔻 Шаг 5. Функция закрытия двери"
        code: |
          local function closeDoor()
              door.Position = door.Position - Vector3.new(0, 10, 0)
          end
        afterText: "Теперь дверь возвращается назад."
      
      - type: "code"
        title: "⏳ Шаг 6. Что происходит при нажатии на кнопку?"
        text: "Кнопка должна реагировать на прикосновение игрока:"
        code: |
          button.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  openDoor()
                  wait(3)
                  closeDoor()
              end
          end)
        afterText: |
          <ul>
            <li>✔️ Игрок коснулся кнопки</li>
            <li>✔️ Дверь открылась</li>
            <li>✔️ Подождали 3 секунды</li>
            <li>✔️ Дверь закрылась</li>
          </ul>

      - type: "code"
        title: "💡 Полный рабочий код"
        code: |
          local button = script.Parent
          local door = game.Workspace.Door

          local function openDoor()
              door.Position = door.Position + Vector3.new(0, 10, 0)
          end

          local function closeDoor()
              door.Position = door.Position - Vector3.new(0, 10, 0)
          end

          button.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  openDoor()
                  wait(3)
                  closeDoor()
              end
          end)

      - type: "text"
        title: "🌟 Что можно улучшить?"
        text: "Вот крутые идеи, чтобы дверь стала круче:"
      - type: "code"
        title: "🔊 1. Добавить звук"
        text: "Например, «пшшш» или «скрип двери»:"
        code: "door.Sound:Play()"
      - type: "text"
        title: "🌈 2. Подсветка кнопки"
        text: "Можешь менять её цвет при нажатии."
      - type: "code"
        title: "✨ 3. Плавное движение двери"
        text: "Сделать анимацию подъёма через цикл:"
        code: |
          for i = 1, 20 do
              door.Position += Vector3.new(0, 0.5, 0)
              wait(0.02)
          end
      - type: "code"
        title: "🔐 4. Дверь открывается только один раз"
        text: "Добавь переменную:"
        code: "isOpen = true/false"
      - type: "text"
        title: "🔘 5. Использовать ClickDetector (клик мышкой) вместо прикосновения."
          

      # -------------------------
      # PRACTICE TASK
      # -------------------------
     
      - type: "note"
        text: "Если делаешь мини-дом — двери становятся любимой механикой 🙂"
      - type: "text"
        title: "🧪 Мини-миссия!"
        text: |
          Попробуй:
          <ol>
            <li>Сделать кнопку красной, когда дверь закрыта</li>
            <li>Зелёной — когда открыта</li>
            <li>И вернуть цвет обратно после закрытия двери</li>
          </ol>
    quiz:
      - question: "Какое свойство делает дверь непроходимой?"
        answers:
          - "Anchored"
          - "CanCollide"
          - "Reflectance"
        correct: 1

      - question: "Что делает Transparency?"
        answers:
          - "Меняет размер объекта"
          - "Меняет цвет объекта"
          - "Меняет прозрачность объекта"
        correct: 2

      - question: "Как кнопка понимает, что её нажал игрок?"
        answers:
          - "Потому что она яркая"
          - "Через Touched и поиск Humanoid"
          - "Через событие ClickButton"
        correct: 1
    end:
      - type: "text"
        text: "Ты уже делаешь вещи, которые используют в настоящих играх Roblox! 🔥😎"

# ===============================
# ✅ Урок 23 — Плавное движение объектов (TweenService)
# ===============================
  - id: 23
    title: "✅ Урок 23: Плавное движение объектов — TweenService"
    shortDescription: "Учимся делать красивые анимации двери, платформ и любых объектов."
    # video: "https://www.youtube.com/embed/TWEEN018"

    content:

      # -----------------------
      # INTRO
      # -----------------------
      - type: "text"
        title: "Что мы сегодня узнаем?"
        text:
          - "Раньше мы изменяли объект сразу: он просто исчезал или становился прозрачным."
          - "Но в играх Roblox почти всегда используются **плавные анимации**."
          - "Сегодня мы научимся двигать, увеличивать, менять прозрачность и цвет объектов с помощью TweenService."
          - "<b>TweenService = плавная красивая анимация</b>."
      - type: "text"
        text: |
          Представь, что ты хочешь, чтобы:
            <ul>
              <li>дверь открывалась плавно, а не резко 🚪</li>
              <li>текст красиво появлялся ✨</li>
              <li>куб мягко менял цвет 🌈</li>
              <li>платформа медленно поднималась вверх ⬆️</li>
            </ul>
          Для этого в Roblox есть специальная «магия» под названием <b>TweenService</b>.

      - type: "gallery"
        title: "Где используется TweenService"
        images:
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson23/module3_23_1.png?raw=true"
            caption: "Пример 1: Плавное движение объектаю 📦 Платформа медленно едет в сторону"
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson23/module3_23_2.png?raw=true"
            caption: "Пример 2: Плавное появление / исчезновение. 👻 Объект медленно становится видимым"
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson23/module3_23_3.png?raw=true"
            caption: "Пример 3: Анимация UI (кнопки, меню). 🎮 Кнопка плавно увеличивается при наведении"

      # -----------------------
      # STEP 1 — Что такое Tween
      # -----------------------
      - type: "text"
        title: "✨ Что такое TweenService?"
        text:
          - "<b>TweenService</b> — это как аниматор."
          - "Tween — это инструкция: как объект должен измениться."
          - "Например: «двигаться вверх 2 секунды», «постепенно исчезнуть», «увеличиться в 2 раза»."
          - "Он умеет плавно менять любой параметр:"
          - "• позицию;"
          - "• размер;"
          - "• цвет;"
          - "• прозрачность;"
          - "• ориентацию;"
      - type: tip
        title: "Можешь думать так:"
        text: "«TweenService делает роблокс-объекты красивыми и плавными.»"
      # -----------------------
      # STEP 2 — Подключаем TweenService
      # -----------------------
      - type: "code"
        title: "🧩 Как использовать TweenService?"
        text: "Есть 3 шага:"
        code: |
          1️⃣ Создать TweenService:

            local TweenService = game:GetService("TweenService")

          2️⃣ Настроить параметры (сколько длится, насколько плавно):

            local info = TweenInfo.new(
                2,            -- длительность в секундах
                Enum.EasingStyle.Quad,   -- стиль движения
                Enum.EasingDirection.Out -- направление
            )
          
          3️⃣ Создать анимацию (tween) и запустить её:

            local tween = TweenService:Create(OBJECT, info,         {Property = Value})
            tween:Play()

      - type: "code"
        title: "🚪 Пример: плавное открытие двери"
        text: "Представим, что у нас есть дверь Door."
        code: |
          local TweenService = game:GetService("TweenService")
          local door = game.Workspace.Door

          local info = TweenInfo.new(2, Enum.EasingStyle.Quad, Enum.EasingDirection.Out)

          local open = TweenService:Create(door, info, {
              Position = door.Position + Vector3.new(0, 10, 0)
          })

          open:Play()
        afterText: "Теперь дверь поднимается красиво, как лифт 🚀✨"

      - type: "code"
        title: "🌈 Пример: плавная смена цвета куба"
        code: |
          local cube = game.Workspace.Cube
          local TweenService = game:GetService("TweenService")

          local info = TweenInfo.new(1)

          local colorTween = TweenService:Create(cube, info, {
              Color = Color3.fromRGB(0, 255, 0)
          })

          colorTween:Play()
        afterText: "Куб плавно станет зелёным 💚"


      - type: "code"
        title: "🔍 Пример: плавное увеличение размера"
        code: |
          local cube = game.Workspace.Cube
          local TweenService = game:GetService("TweenService")

          local info = TweenInfo.new(1)

          local grow = TweenService:Create(cube, info, {
              Size = Vector3.new(10, 10, 10)
          })

          grow:Play()
        afterText: "Куб «вырастает» как воздушный шар 🎈"
      
      - type: "code"
        title: "🧪 Пример: кнопка, открывающая дверь плавно"
        code: |
          local button = game.Workspace.Button
          local door = game.Workspace.Door
          local TweenService = game:GetService("TweenService")

          local info = TweenInfo.new(1)

          local openDoorTween = TweenService:Create(door, info, {
              Position = door.Position + Vector3.new(0, 8, 0)
          })

          button.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  openDoorTween:Play()
              end
          end)
        afterText: "Теперь дверь открывается красиво и мягко ✨"

      - type: "text"
        title: "🎨 Попробуй разные стили движения!"
        text: |
          Их много! Например:
            <ul>
              <li>Bounce — отскакивает 🏀</li>
              <li>Elastic — резиновый эффект 🌀</li>
              <li>Linear — ровное движение</li>
              <li>Quad, Cubic, Sine — мягкие анимации</li>
            </ul>
      - type: "code"
        text: "Пример:"
        code: "Enum.EasingStyle.Bounce"
        afterText: "— объект подпрыгивает в конце 😄"

      # -----------------------
      # STEP 5 — Ещё эффекты
      # -----------------------
      - type: "text"
        title: "Можно менять не только положение"
        text:
          - "Вот несколько вещей, которые легко анимировать:"
          - "• прозрачность;"
          - "• цвет;"
          - "• размер;"
          - "• вращение (через CFrame);"
          - "• одновременно несколько свойств."

      # Пример исчезновения
      - type: "code"
        language: "lua"
        title: "Пример: объект исчезает"
        code: |
          local goal = {
              Transparency = 1
          }

      # Пример смены цвета
      - type: "code"
        language: "lua"
        title: "Пример: плавная смена цвета"
        code: |
          local goal = {
              Color = Color3.fromRGB(255, 0, 0)
          }

      # Пример увеличения размера
      - type: "code"
        language: "lua"
        title: "Пример: увеличение размера"
        code: |
          local goal = {
              Size = Vector3.new(10, 10, 10)
          }

      # -----------------------
      # STEP 6 — Бесконечная анимация
      # -----------------------
      - type: "text"
        title: "Повторение анимации"
        text:
          - "Чтобы анимация повторялась снова и снова — подписываемся на завершение:"

      - type: "code"
        language: "lua"
        title: "Бесконечная анимация"
        code: |
          tween.Completed:Connect(function()
              tween:Play()
          end)

      # -----------------------
      # PRACTICE
      # -----------------------
      - type: "steps"
        title: "Попробуй сам!"
        items:
          - "Сделай дверь, которая плавно «уезжает» в сторону при нажатии кнопки."
          - "Создай куб, который увеличивается при касании."
          - "Сделай платформу, которая движется вверх-вниз бесконечно."
          - "Добавь плавное появление объекта (Transparency → 0)."
          - "Плавно падает вниз"
          - "Через 1 секунду плавно поднимается вверх"
          - "Пишет в Output: 'Готово!'"

      - type: "note"
        text: "Чем больше ты играешься с TweenService, тем красивее становятся игры!"

    quiz:
      - question: "Что делает TweenService?"
        answers:
          - "Создаёт кнопки"
          - "Делает плавные анимации"
          - "Открывает доступ к Humanoid"
        correct: 1

      - question: "Где мы задаём время анимации?"
        answers:
          - "TweenInfo.new()"
          - "Vector3.new()"
          - "Touched"
        correct: 0

      - question: "Как запустить анимацию?"
        answers:
          - "tween.Start()"
          - "tween.Play()"
          - "tween:Play()"
        correct: 2
    end:
      - type: "text"
        text: "Ты сделал огромный шаг к уровню «разработчик Roblox PRO»!"


# ===============================
# Урок 24: Движущаяся платформа (лифт)
# ===============================
  - id: 24
    title: "🎉 Урок 24: Движущаяся платформа (лифт)"
    shortDescription: "Учимся делать платформу, которая двигается вверх и вниз."
    # video: "https://www.youtube.com/embed/LIFT019"

    content:

      # INTRO
      - type: "text"
        title: "Что мы сегодня узнаем?"
        text:
          - "Сегодня мы сделаем настоящий лифт! Он будет плавно подниматься и опускаться."
          - "Сначала — простая версия через цикл."
          - "Потом — красивая анимация через TweenService."
          - "Это выглядит круто и часто используется в паркурах, приключениях и хоррор-играх!"

      - type: "gallery"
        title: "Как выглядит движущаяся платформа"
        images:
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson24/module3_24_1.png?raw=true"
            caption: |
              - "Пример 1: Платформа едет вперёд один раз. Используется для простых движущихся платформ"
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson24/module3_24_2.png?raw=true"
            caption: "Пример 2: Платформа ездит туда и обратно. Подходит для лифтов и маятников"
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson24/module3_24_3.png?raw=true"
            caption: "Начало Obby"
      - type: text
        title: "🧩 Большая идея урока"
        text: |
          <p><b>Лифт — это платформа, которая всё время повторяет движение: вверх → пауза → вниз → пауза</b></p>          
          <ul>
            <li>📌 Здесь нет кнопки (пока)</li>
            <li>📌 Лифт живёт сам по себе</li>
          </ul>
      - type: codeBlock
        title: "🧠 Логическая схема (очень важно)"
        code: |
          [Начало]
                ↓
          [Лифт едет вверх]
                ↓
          [Пауза (wait)]
                ↓
          [Лифт едет вниз]
                ↓
          [Пауза (wait)]
                ↓
          [Повторить]
        afterText: |
          <p>💬 Проговорить вслух:</p>
          <p><em>Лифт едет вверх, потом ждёт, потом едет вниз, потом ждёт, и повторяет это снова и снова.</em></p>
          ~<p>Он делает одно и то же снова и снова.</p>
    # Шаг 1. Платформа — что это?
      - type: "text"
        title: "🟦 Шаг 1. Платформа — что это?"
        text:
          - "Платформа — это просто <b>Part</b> (деталь) в Roblox."
          - "на нём стоит игрок и он едет вместе с платформой."
          - "Мы будем двигать эту деталь вверх и вниз."
          - "Важно: у платформы должно быть свойство <b>Anchored = true</b>, чтобы она не падала."
    # Шаг 2. Плавное движение (Tween)
      - type: "text"
        title: "🟨 Шаг 2. Плавное движение (Tween)"
        text:
          - "Чтобы платформа двигалась плавно, мы будем использовать <b>TweenService</b>."
          - "Это специальный сервис, который умеет делать красивые анимации."
          - "Мы уже изучали его в прошлом уроке."
          - "Лифт:"
          - "• едет вверх (имеет верхнюю точку);"
          - "• ждёт;"
          - "• едет вниз (имеет нижнюю точку);"
          - "• ждёт;"
          - "• повторяет это снова и снова."
          - "Tween:"
          - "• в tells, куда ехат;"
          - "• и за сколько секунд;"

      # -----------------------
      # PART 1 — SIMPLE LIFT
      # -----------------------
      - type: "text"
        title: "Версия 1. Простой лифт (цикл while)"
        text:
          - "Эта версия работает очень просто: каждые несколько секунд платформа меняет позицию."
          - "Подходит для движущихся блоков, ловушек и простых Obby."

      - type: "text"
        title: "🧱 Шаг 1. Создаём платформу"
        text: 
          - "<p>Вставь <b>Part → Block</b></p>"
          - "Назови его <b>Lift</b>"
          - "Сделай размер, например: <b>8×1×8</b>"
          - "Поставь на пол, где должен быть лифт"
          - "Добавь внутрь платформы <b>Script</b>"

      - type: "code"
        title: "🛠️ Шаг 2. Подключаем TweenService"
        text: "В Script пишем:"
        code: |
          local TweenService = game:GetService("TweenService")
          local lift = script.Parent
      - type: "code"
        title: "📍 Шаг 3. Задаём конечные позиции"
        text: |
          Мы сделаем две точки:
            <ul>
              <li>точка внизу — где лифт стоит изначально</li>
              <li>точка вверху — куда он поднимается</li>
            </ul>
        code: |
          local startPos = lift.Position
          local endPos = lift.Position + Vector3.new(0, 20, 0) -- вверх на 20
      - type: "code"
        title: "🎚️ Шаг 4. Настраиваем параметры движения"
        code: |
          local info = TweenInfo.new(
              3, -- 3 секунды
              Enum.EasingStyle.Quad,
              Enum.EasingDirection.Out
          )
      - type: "code"
        title: "🛗 Шаг 5. Создаём два твина: подъём и спуск"
        code: |
          local liftUp = TweenService:Create(lift, info, {Position = endPos})
          local liftDown = TweenService:Create(lift, info, {Position = startPos})
      - type: "code"
        title: "⭐ Шаг 6. Анимация лифта (цикл)"
        text: "Теперь сделаем, чтобы лифт ехал вверх — ждал — ехал вниз — ждал — и повторял."
        code: |
          while true do
              liftUp:Play()
              wait(3)      -- ждём пока доедет
              wait(2)      -- стоим на верхнем этаже

              liftDown:Play()
              wait(3)
              wait(2)      -- стоим на нижнем этаже
          end
      - type: "code"
        title: "🎉 Готовый код целиком"
        code: |
          local TweenService = game:GetService("TweenService")
          local lift = script.Parent

          local startPos = lift.Position
          local endPos = lift.Position + Vector3.new(0, 20, 0)

          local info = TweenInfo.new(
              3,
              Enum.EasingStyle.Quad,
              Enum.EasingDirection.Out
          )

          local liftUp = TweenService:Create(lift, info, {Position = endPos})
          local liftDown = TweenService:Create(lift, info, {Position = startPos})

          while true do
              liftUp:Play()
              wait(5)

              liftDown:Play()
              wait(5)
          end
        afterText: "Теперь платформа плавно ездит вверх-вниз — как настоящий игровой лифт! 🚀"

      - type: "note"
        text: "Важно: платформа должна быть Anchored = true, иначе физика начнёт её толкать."

      - type: "text"
        title: "🧠 Как объяснить?"
        text: |
          <ul>
            <li>TweenService = «движение красиво».</li>
            <li>Мы сказали платформе, куда ехать.</li>
            <li>Лифт просто повторяет маршрут: вверх → вниз → вверх → вниз.</li>
          </ul>
      # -----------------------
      # PART 2 — TWEEN LIFT
      # -----------------------
      - type: "text"
        title: "Версия 2. Красивый лифт (TweenService)"
        text:
          - "Эта версия движется плавно и красиво."
          - "Используем TweenService — сервис анимаций."

      - type: "steps"
        title: "Шаг 1. Подключаем TweenService"
        items:
          - "Внутри того же Lift создаём Script."
          - "Вставляем код ниже."

      - type: "code"
        language: "lua"
        title: "Готовый Tween-лифт"
        code: |
          local TweenService = game:GetService("TweenService")
          local lift = script.Parent

          local upPos = lift.Position + Vector3.new(0, 10, 0)
          local downPos = lift.Position

          local info = TweenInfo.new(2, Enum.EasingStyle.Sine, Enum.EasingDirection.InOut)

          local tweenUp = TweenService:Create(lift, info, {Position = upPos})
          local tweenDown = TweenService:Create(lift, info, {Position = downPos})

          -- бесконечный цикл
          while true do
              tweenUp:Play()
              tweenUp.Completed:Wait()

              tweenDown:Play()
              tweenDown.Completed:Wait()
          end

      - type: "text"
        title: "Что можно улучшить?"
        text:
          - "Сделать более высокое движение."
          - "Добавить звук движения лифта.(гул лифта, механические звуки)"
          - "Плавное изменение света. (Например, лампы лифта мигают, когда он едет.)"
          - "Сделать вызов лифта по кнопке. (игрок нажал кнопку → лифт приехал к нему.)"
          - "Двери лифта. (Можно добавить вторую часть, которая открывается через TweenService.)"
          - "Безопасность: лифт не должен придавить игрока. (Можно добавить проверку на касание.)"

      # PRACTICE
      - type: "steps"
        title: "Попробуй сам!"
        items:
          - "Создай боковую стенку лифта, чтобы игрок ощущал движение."
          - "Сделай платформу, которая движется не вверх/вниз, а вперёд/назад."
          - "Сделай трёхэтажный лифт — три точки движения вместо двух."
          - "Добавь кнопку, которая запускает анимацию лифта."
      #  1
      - type: "text"
        title: "1. Создай боковую стенку лифта, чтобы игрок ощущал движение"
        text: "Здесь просто: добавь Part (стенку) → привяжи её к платформе так, чтобы она двигалась вместе."
      - type: hint 
        text: "Подсказка 👇"
        code: |
          local TweenService = game:GetService("TweenService")
          local wall = script.Parent  -- боковая стенка
          local startPos = wall.Position
          local endPos = wall.Position + Vector3.new(0, 20, 0)

          local info = TweenInfo.new(3)

          local up = TweenService:Create(wall, info, {Position = endPos})
          local down = TweenService:Create(wall, info, {Position = startPos})

          while true do
              up:Play()
              wait(4)
              down:Play()
              wait(4)
          end
        afterText: "Теперь стенка плавно ездит вверх/вниз — игрок почувствует движение."
      
      # 2
      - type: "text"
        title: "🔹 2. Платформа движется вперёд/назад вместо вверх/вниз"
        text: "Меняем только Vector3 направление!"
      - type: hint 
        text: "Подсказка 👇"
        code: |
            local TweenService = game:GetService("TweenService")
            local lift = script.Parent

            local startPos = lift.Position
            local endPos = lift.Position + Vector3.new(20, 0, 0) -- вперёд на 20

            local info = TweenInfo.new(3)

            local forward = TweenService:Create(lift, info, {Position = endPos})
            local back = TweenService:Create(lift, info, {Position = startPos})

            while true do
                forward:Play()
                wait(4)
                back:Play()
                wait(4)
            end
        afterText: "Теперь платформа ездит как вагонетка 🚂✨"

      
       # 3
      - type: "text"
        title: "🔹 3. Сделай трёхэтажный лифт — три точки движения"
        text: "Здесь будет этаж 1 → этаж 2 → этаж 3 → обратно вниз."
      - type: hint 
        text: "Подсказка 👇"
        code: |
          local TweenService = game:GetService("TweenService")
          local lift = script.Parent

          local floor1 = lift.Position
          local floor2 = lift.Position + Vector3.new(0, 15, 0)
          local floor3 = lift.Position + Vector3.new(0, 30, 0)

          local info = TweenInfo.new(3)

          local to2 = TweenService:Create(lift, info, {Position = floor2})
          local to3 = TweenService:Create(lift, info, {Position = floor3})
          local down2 = TweenService:Create(lift, info, {Position = floor2})
          local down1 = TweenService:Create(lift, info, {Position = floor1})

          while true do
              to2:Play()  -- 1 → 2 этаж
              wait(4)
              to3:Play()  -- 2 → 3 этаж
              wait(4)
              down2:Play() -- 3 → 2
              wait(4)
              down1:Play() -- 2 → 1
              wait(4)
          end
        afterText: "Теперь лифт — настоящий многоэтажный! 🛗🌆"

      # 4
      - type: "text"
        title: "🔹 4. Добавь кнопку, которая запускает анимацию лифта"
        text: |
          Игрок касается кнопки → лифт поехал.
          <h4>Настройка:</h4>
            <ul>
              <li><b>Кнопка</b> → Part named: <b>Button</b></li>
              <li><b>Лифт</b> → Part named: <b>Lift</b></li>
              <li>Скрипт внутри кнопки.</li>
            </ul>
      - type: hint 
        text: "Подсказка 👇"
        code: |
          local TweenService = game:GetService("TweenService")

          local button = script.Parent
          local lift = game.Workspace.Lift

          local startPos = lift.Position
          local endPos = lift.Position + Vector3.new(0, 20, 0)

          local info = TweenInfo.new(3)

          local liftUp = TweenService:Create(lift, info, {Position = endPos})
          local liftDown = TweenService:Create(lift, info, {Position = startPos})

          local busy = false  -- чтобы не запускалось дважды

          button.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") and not busy then
                  busy = true
                  
                  liftUp:Play()
                  wait(4)
                  liftDown:Play()
                  wait(4)

                  busy = false
              end
          end)

        afterText: "Теперь игрок сам вызывает лифт ✨🔘"

      
    quiz:
        - question: "Что делает цикл while true do?"
          answers:
            - "Запускает код один раз"
            - "Повторяет код снова и снова"
            - "Удаляет скрипт"
          correct: 1

        - question: "Что делает TweenService?"
          answers:
            - "Плавно анимирует объект"
            - "Создаёт ловушки"
            - "Увеличивает Humanoid"
          correct: 0

        - question: "Зачем нужен tween.Completed:Wait()?"
          answers:
            - "Останавливает игру"
            - "Ждёт, пока анимация завершится"
            - "Выключает лифт"
          correct: 1

  
# ===============================
# ✅ Урок 25 — Телепортация игрока (создаём портал)
# ===============================
  - id: 25
    title: "✅ Урок 25: Телепортация игрока (создаём портал)"
    shortDescription: "Учимся создавать портал, который переносит игрока в другую точку карты."
    # video: "https://www.youtube.com/embed/PORTAL020"

    content:

      - type: "text"
        title: "Что мы узнаем?"
        text: |
          Сегодня мы сделаем портал, который:
          <ul>
            <li>телепортирует игрока в другое место 🧍➡️🌀➡️🧍</li>
            <li>может переносить на другой остров, этаж, комнату</li>
            <li>чувствует прикосновение игрока</li>
          </ul>
          Это уже прям магия ✨

      - type: "text"
        title: "🧩 Что такое телепортация в Roblox?"
        text: |
          Телепортация — это когда персонаж игрока мгновенно переезжает в другую точку карты.
          <p>В коде мы просто говорим:</p>
          <em>«Поставь игрока вот сюда!»</em>
          <p>Для этого нам нужно:</p>
          
          <ol>
            <li>Найти персонажа игрока🧍</li>
            <li>Найти его главную часть (HumanoidRootPart)</li>
            <li>Переместить её в новое место</li>
          </ol>

      - type: "gallery"
        title: "Как выглядят порталы"
        images:
          - "https://devforum-uploads.s3.dualstack.us-east-2.amazonaws.com/uploads/optimized/5X/6/5/c/6/65c6cfd38866908db10780891a9e16e45e99b46c_2_690x354.jpeg"
          - "https://devforum-uploads.s3.dualstack.us-east-2.amazonaws.com/uploads/original/4X/c/f/b/cfbdc7e858bf66b4e00da8f977d7143119d3663d.jpeg"
          - "https://devforum-uploads.s3.dualstack.us-east-2.amazonaws.com/uploads/original/4X/d/8/e/d8e9c835fcb878df221f9194c8a46d1264d6d93c.jpeg"

      # -----------------------------------------
      # СОЗДАЁМ ПОРТАЛ
      # -----------------------------------------
      - type: "text"
        title: "🟦 Шаг 1. Делаем портал и точку выхода"
        text: |
          Создай <b>Part</b> → назови его portal
            <ul>
              <li>Можно сделать красивым: синим, фиолетовым, прозрачным ✨</li>
            </ul>
          Создай ещё один <b>Part</b> → назови его Exit
            <ul>
              <li>Это место, куда будет попадать игрок</li>
            </ul>
          Поставь <b>Exit</b> там, где должна быть новая точка (другой остров, комната и т.п.)
          <p>Внутрь <b>Portal</b> добавь Script</p>

      - type: "code"
        title: "🟩 Шаг 2. Готовим переменные"
        text: "Открываем Script в Portal и пишем:"
        code: |
          local portal = script.Parent
          local exitPart = game.Workspace.Exit
        afterText: |
          Теперь скрипт знает:
          <ul>
            <li><b>portal</b> — это наш портал</li>
            <li><b>exitPart</b> — место, куда телепортируем игрока</li>
          </ul>
      - type: "code"
        title: "🚀 Шаг 3. Телепортируем игрока при прикосновении"
        text: "Мы будем ждать, пока кто-то коснётся портала, и проверять — это игрок или нет."
        code: |
          portal.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")

              if humanoid then
                  -- нашли игрока
              end
          end)

      - type: "code"
        title: "✨ Шаг 4. Переносим игрока в новую точку"
        text: "Самый простой способ — использовать MoveTo:"
        code: |
          portal.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")

              if humanoid then
                  character:MoveTo(exitPart.Position + Vector3.new(0, 3, 0))
              end
          end)
        afterText: |
          <p>🔹 <b>exitPart.Position</b> — позиция точки выхода</p>
          <p>🔹 <b>+ Vector3.new(0, 3, 0)</b> — чуть выше, чтобы игрок не застрял внутри блока</p>
          <p>Игрок: коснулся портала → <em>фьюить!</em> → появился у выхода 😄</p>
      - type: "code"
        title: "🧠 Другой способ: через HumanoidRootPart"
        text: "Чуть «правильнее», но можно объяснить простым языком:"
        code: |
          portal.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")
              local root = character:FindFirstChild("HumanoidRootPart")

              if humanoid and root then
                  root.CFrame = exitPart.CFrame + Vector3.new(0, 3, 0)
              end
          end)

        afterText: |
          <p>🔹 <b>CFrame</b> — это позиция + поворот.</p>
          <p>🔹 Тут мы переносим игрока туда же, куда смотрит .<b>Exit</b> </p>
      - type: "code"
        title: "🧪 Полный пример кода"
        code: |
          local portal = script.Parent
          local exitPart = game.Workspace.Exit

          portal.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")

              if humanoid then
                  character:MoveTo(exitPart.Position + Vector3.new(0, 3, 0))
                  print("Телепортирован!")
              end
          end)

      

      # -----------------------------------------
      # УЛУЧШАЕМ ПОРТАЛ
      # -----------------------------------------
      - type: "text"
        title: "🌟 Идеи, как сделать портал круче"
        text:
          - "Можно добавить:"

      - type: "code"
        title: "🔊 1. Звук портала"
        text: "Внутрь Portal добавь Sound, а в код:"
        code: |
          portal.Sound:Play()
      - type: "text"
        title: "🌈 2. Частицы (ParticleEmitter)"
        text: "Красивые эффекты: искры, дым, магия."

      - type: "code"
        title: "💡 3. Цвет портала меняется при телепорте"
        code: |
          portal.Color = Color3.fromRGB(0, 255, 255) -- бирюзовый
          wait(0.2)
          portal.Color = Color3.fromRGB(170, 0, 255) -- фиолетовый
      - type: "code"
        title: "🔒 4. Портал работает только один раз"
        text: "Можно добавить флаг:"
        code: |
          local used = false

          portal.Touched:Connect(function(hit)
              if used then return end

              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")

              if humanoid then
                  used = true
                  character:MoveTo(exitPart.Position + Vector3.new(0, 3, 0))
              end
          end)


      # -----------------------------------------
      # ПРАКТИКА
      # -----------------------------------------
      - type: "steps"
        title: "🧩 «Попробуй сам!» — мини-квест"
        items:
          - "Сделай два портала: вход A и вход B, чтобы игрок прыгал туда-сюда"
          - "Сделай портал, который переносит на высокую гору."
          - "Сделай портал-секрет, который появляется только после нажатия кнопки."
          - "Добавь надпись «ПОРТАЛ» с помощью BillboardGui над блоком"
          - "Сделай «опасный портал», который телепортирует игрока в «ловушку» 😈 (но добрую)"
      - type: "text"
        title: "1️⃣ ДВА ПОРТАЛА: A ↔ B"
        text: |
          <h4>📦 Настройка в Studio</h4>
          <ul>Сделай два блока:
            <li>PortalA</li>
            <li>PortalB</li>
          </ul>В каждый добавь по Script.
      
      - type: "code"
        title: "🔁 Скрипт для PortalA (телепорт в B)"
        code: |
          local portal = script.Parent               -- этот портал (A)
          local target = workspace.PortalB           -- куда телепортируем (B)

          portal.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")

              if humanoid then
                  -- телепортируем чуть выше портала B
                  character:MoveTo(target.Position + Vector3.new(0, 3, 0))
                  print("Телепорт из A в B")
              end
          end)

      - type: "code"
        title: "🔁 Скрипт для PortalB (телепорт в A)"
        code: |
          local portal = script.Parent               -- этот портал (B)
          local target = workspace.PortalA           -- куда телепортируем (A)

          portal.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")

              if humanoid then
                  character:MoveTo(target.Position + Vector3.new(0, 3, 0))
                  print("Телепорт из B в A")
              end
          end)
        afterText: "Подсказка: если игрок начинает «мигать» туда-сюда слишком быстро —можно после телепорта делать wait(0.5) и на это время портал отключать (portal.CanTouch = false → потом обратно true)."

      - type: "code"
        title: "2️⃣ Надпись «ПОРТАЛ» через BillboardGui"
        text: 
          - "Это уже чуть продвинутый уровень, но очень красиво 🤩"
          - "<b>Вариант: сразу создать через код</b>"
          - "Скрипт можно положить внутрь портала (например, PortalA):"
        code: |
          local portal = script.Parent

          -- создаём BillboardGui
          local billboard = Instance.new("BillboardGui")
          billboard.Parent = portal
          billboard.Adornee = portal
          billboard.Size = UDim2.new(0, 100, 0, 50)
          billboard.StudsOffset = Vector3.new(0, 3, 0)  -- над блоком

          -- создаём текст
          local label = Instance.new("TextLabel")
          label.Parent = billboard
          label.Size = UDim2.new(1, 0, 1, 0)
          label.BackgroundTransparency = 1
          label.Text = "ПОРТАЛ"
          label.TextColor3 = Color3.fromRGB(255, 255, 0)
          label.TextScaled = true
          label.Font = Enum.Font.FredokaOne
        afterText: "«Этот код просто создаёт надпись, которая висит над порталом, как 3D-табличка»."

      - type: "text"
        title: "3️⃣ «Опасный» (но добрый) портал в ловушку 😈"
        text: 
          - "Идея:"
          - "Портал телепортирует игрока в комнату-ловушку:"
          - "маленькая комнатка, из которой можно выбраться по паркуру, лестнице или секретному выходу."
      
      - type: "text"
        title: "🧱 В Studio"
        text: |
          <ul>
            <li>Сделай блок DangerPortal</li>
            <li>Сделай где-то на карте комнату-ловушку</li>
            <li>Поставь там блок TrapPoint — куда будет попадать игрок</li>
          </ul>
        

      - type: "hint"
        title: "Подсказка - 🧨 Скрипт в DangerPortal"
        code: |
          local portal = script.Parent
          local trapPoint = workspace.TrapPoint

          portal.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")

              if humanoid then
                  -- телепортируем в ловушку
                  character:MoveTo(trapPoint.Position + Vector3.new(0, 3, 0))
                  print("Попался в ловушку! 😈")

                  -- можно чуть напугать, но по-доброму:
                  -- уменьшаем яркость экрана, включаем звук, пишем подсказку
              end
          end)
      - type: "text"
        title: "🎯 Идеи, как сделать ловушку «доброй»:"
        text: |
          <ul>
            <li>вместо смерти — просто неудобное место: яма, лабиринт, паркур</li>
            <li>сверху надпись: НАЙДИ ВЫХОД!</li>
            <li>можно поставить портал назад, но спрятать его</li>
          </ul>





    quiz:
        - question: "Какой объект отвечает за перемещение игрока?"
          answers:
            - "Torso"
            - "HumanoidRootPart"
            - "LeftLeg"
          correct: 1

        - question: "Куда вставляется Script для портала?"
          answers:
            - "Внутрь Portal"
            - "В StarterGui"
            - "В ServerScriptService"
          correct: 0

        - question: "Что делает портальная зона?"
          answers:
            - "Меняет цвет игрока"
            - "Телепортирует игрока"
            - "Добавляет монеты"
          correct: 1


# ===============================
# 👉 Урок 26 — Чекпоинты и точки возрождения
# ===============================
  - id: 26
    title: "👉 Урок 26: Чекпоинты и точки возрождения"
    shortDescription: "Учимся создавать чекпоинты — точки, где игрок сохраняет прогресс."
    # video: "https://www.youtube.com/embed/CHECKPOINT021"

    content:

      - type: "text"
        title: "🧠 Что такое чекпоинт?"
        text:
          - "<b>Чекпоинт</b> — это специальная платформа, которая запоминает, что игрок до неё дошёл."
          - "Если игрок падает в лаву или проигрывает — он появляется на последнем чекпоинте."
          - "Когда игрок умирает → он возрождается возле чекпоинта, а не сначала."
          - "Сегодня мы сделаем простую систему чекпоинтов, как в настоящем Obby."
      - type: "text"
        title: "🟦 Что такое точка возрождения?"
        text: 
          - "Это объект <b>SpawnLocation</b> — место, где игрок появляется после смерти."
          - "Roblox сначала спавнит игрока на стандартном SpawnLocation."
          - "Но мы можем дать игроку <b>свой персональный спавн</b>, когда он активирует чекпоинт."

      - type: "gallery"
        title: "Как выглядят чекпоинты"
        images:
          - "https://i.ytimg.com/vi/EYgZZxwIvro/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLBfANeAL5icEqkrDu4rfXJ7JkipJQ"
          - "https://i.ytimg.com/vi/hU_de1gf7mA/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLBt_NEEYaDTeHBAvIFXVZmyyg1Ygg"
          - "https://i.redd.it/can-anyone-tell-me-how-to-make-an-obby-checkpoint-system-v0-pt58qv5x5vid1.jpg?width=1792&format=pjpg&auto=webp&s=88afea8eb8c597c7bda581e42f21ac0b351886a4"

      # ================================
      # СОЗДАЁМ ЧЕКПОИНТ
      # ================================
      - type: "steps"
        title: "🔷 Шаг 1. Создаём чекпоинт"
        items:
          - "Создай Part → назови его <b>Checkpoint1</b>."
          - "Размер: 3×1×3"
          - "Сделай его плоским и яркого цвета."
          - "Поставь по центру пути."
          - "Установи <b>Anchored = true</b>."
          - "Вставь внутрь <b>Script</b>."

      - type: "steps"
        title: "🟩 Шаг 2. Создаём точку возрождения"
        items:
          - "Вставь в игру объект <b>SpawnLocation</b>."
          - "Переименуй его в <b>CheckpointSpawn1</b>."
          - "Отключи <b>AllowTeamChangeOnTouch</b>."
          - "Спрячь его галочкой <b>Enabled = false</b> (но оставь в игре)."
          - "Поставь так, чтобы игрок появлялся над полом"

      - type: "text"
        title: "Как это работает?"
        text:
          - "Когда игрок касается чекпоинта, мы запоминаем его номер."
          - "Потом, если он погибает, точка возрождения меняется на нужную."
      - type: "code"
        title: "🧠 Шаг 3. Делаем переменную чекпоинта"
        text: "В Script напиши:"
        code: |
          local checkpoint = script.Parent
          local respawnPoint = game.Workspace.CheckpointSpawn

      - type: "code"
        title: "⭐ Шаг 4. Когда игрок касается чекпоинта — сохраняем его спавн"
        code: |
          checkpoint.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")

              if humanoid then
                  local player = game.Players:GetPlayerFromCharacter(character)

                  if player then
                      player.RespawnLocation = respawnPoint
                      print("Чекпоинт активирован!")
                  end
              end
          end)
        afterText: 
          - "Теперь — если игрок умрёт,"
          - "Roblox появит его именно на respawnPoint 🎉"

      - type: "code"
        title: "✨ Шаг 5. Добавляем эффект при активации"
        text: "Например, чекпоинт станет зелёным:"
        code: |
          checkpoint.Color = Color3.fromRGB(0, 255, 0)
      - type: "code"
        text: "Или увеличится:"
        code: |
          checkpoint.Size = Vector3.new(4, 1, 4)
          wait(0.3)
          checkpoint.Size = Vector3.new(3, 1, 3)
      - type: "code"
        text: "Или заиграет звук:"
        code: |
          checkpoint.Sound:Play()

      - type: "code"
        title: "🎯 Полный рабочий код чекпоинта"
        code: |
          local checkpoint = script.Parent
          local respawnPoint = game.Workspace.CheckpointSpawn

          checkpoint.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")

              if humanoid then
                  local player = game.Players:GetPlayerFromCharacter(character)

                  if player then
                      player.RespawnLocation = respawnPoint
                      print("Чекпоинт активирован!")
                      
                      -- эффект
                      checkpoint.Color = Color3.fromRGB(0, 255, 0)
                  end
              end
          end)       
      

      # ================================
      # ПРАКТИКА ДЛЯ РЕБЁНКА
      # ================================
      - type: "steps"
        title: "🧪 Мини-квест (самостоятельно)"
        items:
          - "цепочку из 3 чекпоинтов"
          - "kаждый должен загораться своим цветом."
          - "cделай бонусный чекпоинт, который телепортирует на секретный уровень."
          - "чекпоинты показывают «уровень» игрока в Output"
          - "Поменяй форму чекпоинта на круглый Cylinder."
      - type: hint
        title: "Подсказака 👇 - 📌 Скрипт для Checkpoint1"
        code: |
          -- Получаем сам чекпоинт
          local checkpoint = script.Parent

          -- Точка возрождения, куда появится игрок после смерти
          local respawnPoint = workspace.Spawn1  

          -- Срабатывает, когда что-то касается чекпоинта
          checkpoint.Touched:Connect(function(hit)

              -- Проверяем: это игрок?
              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")

              if humanoid then
                  -- Получаем Player из персонажа
                  local player = game.Players:GetPlayerFromCharacter(character)

                  if player then
                      -- Устанавливаем точку возрождения
                      player.RespawnLocation = respawnPoint
                      print("Чекпоинт 1 активирован!")

                      -- Эффект: меняем цвет чекпоинта
                      checkpoint.Color = Color3.fromRGB(0, 255, 0)
                  end
              end
          end)

      - type: hint
        title: "Подсказака 👇 - 📌 Скрипт для Checkpoint2"
        code: |
          local checkpoint = script.Parent
          local respawnPoint = workspace.Spawn2  -- точка второго чекпоинта

          checkpoint.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")

              if humanoid then
                  local player = game.Players:GetPlayerFromCharacter(character)

                  if player then
                      player.RespawnLocation = respawnPoint
                      print("Чекпоинт 2 активирован!")

                      -- Эффект: меняем цвет на синий
                      checkpoint.Color = Color3.fromRGB(0, 100, 255)
                  end
              end
          end)

      - type: hint
        title: "Подсказака 👇 - 📌 Скрипт для Checkpoint3 (даёт суперскорость ⚡)"
        code: |
          local checkpoint = script.Parent
          local respawnPoint = workspace.Spawn3  -- третья точка

          checkpoint.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")

              if humanoid then
                  local player = game.Players:GetPlayerFromCharacter(character)

                  if player then
                      -- Ставим точку появления
                      player.RespawnLocation = respawnPoint
                      print("Чекпоинт 3 активирован! Суперскорость включена!")

                      -- Даём игроку суперскорость
                      humanoid.WalkSpeed = 40   -- обычная скорость = 16
                      humanoid.JumpPower = 70   -- прыжок выше

                      -- Эффект: красим чекпоинт в золотой
                      checkpoint.Color = Color3.fromRGB(255, 200, 0)
                  end
              end
          end)
      - type: "code"
        title: "🎁 Как настроить перед запуском?"
        text: "Должно быть в Workspace:"
        code: |
          Checkpoint1
          Checkpoint2
          Checkpoint3
          Spawn1
          Spawn2
          Spawn3
        afterText: |
          Каждый респаун (Spawn1, Spawn2, Spawn3) должен быть SpawnLocation, у которых:
          <ul>
            <li>Enabled = false (чтобы игра не спавнила там сама)</li>
            <li>Поставлены на правильные позиции</li>
          </ul>

    quiz:
      - question: "Где обычно хранят скрипт возрождения?"
        answers:
          - "Внутри портала"
          - "В ServerScriptService"
          - "В StarterPlayerScripts"
        correct: 1

      - question: "Что делает чекпоинт?"
        answers:
          - "Меняет цвет игрока"
          - "Сохраняет место появления игрока"
          - "Увеличивает скорость"
        correct: 1

      - question: "Какой объект использует игрок для появления?"
        answers:
          - "Part"
          - "SpawnLocation"
          - "ParticleEmitter"
        correct: 1

    end:
      - type: "text" 
        text: "Ты огромный молодец — ты уже создаёшь настоящие игровые механики Roblox! 🚀🔥"

# ===============================
# 🔥 Урок 27 — Лава, шипы и урон игроку
# ===============================
  - id: 27
    title: "🔥 Урок 27: Лава и безопасные платформы"
    shortDescription: "Учимся создавать опасные зоны, которые наносят урон или убивают игрока."
    # video: "https://www.youtube.com/embed/LAVATRAP022"

    content:

      - type: "text"
        title: "В игре часто встречаются опасные зоны:"
        text:
          - "Это объект (обычно красная платформа), который наносит урон игроку."
          - "Если здоровье становится 0 — игрок возрождается на чекпоинте."
          - "<ul>
            <li>🟥 лава</li>
            <li>⚔️ шипы</li>
            <li>☠️ токсичный газ</li>
            <li>⚡ электрические платформы</li></ul>"


      - type: "gallery"
        title: "Примеры ловушек"
        images:
          - "https://i.ytimg.com/vi/KZT0i_UHWDk/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLCyZY0xN_4WPbiNIY90PFHquaTOhA"
          - "https://egamersworld.com/cdn-cgi/image/width=690,quality=75,format=webp/uploads/content/1/17/1755705427704_resized.png"
          - "https://tr.rbxcdn.com/180DAY-c6b6eaf4129c73c41a4d71bc9a309365/768/432/Image/Webp/noFilter"
      # ================================
      # СОЗДАЁМ блок-ловушку
      # ================================
      - type: "text"
        title: "🧱 Шаг 1. Создаём блок-ловушку"
        text:
          - "Вставь Part"
          - "Назови его: Lava (лава) или Spikes (шипы)"
          - "Покрась в <span style='color: red;'>красный</span> или оранжевый или чёрный."
          - "Измени Material: Lava → Neon или Cracked Spikes → Metal"
          - "Сделай <b>Anchored = true</b>."
          - "Добавь внутрь блока Script"
      - type: "code"
        title: "❤️ Что такое Humanoid.Health ?"
        text:
          - "У каждого игрока есть здоровье (Health)."
          - "Максимум — 100."
          - "Если Health падает до 0 → игрок умирает и возрождается."
          - "Мы можем уменьшать здоровье через код:"
        code: |
          humanoid.Health -= 20 -- отнять 20 HP

      # ================================
      # СОЗДАЁМ ЛАВУ
      # ================================
      - type: "code"
        title: "🔥 Шаг 2. Лава, которая мгновенно убивает игрока"
        text: "Внутри объекта Lava:"
        code: |
          local lava = script.Parent

          lava.Touched:Connect(function(hit)
              local char = hit.Parent
              local humanoid = char:FindFirstChild("Humanoid")

              if humanoid then
                  humanoid.Health = 0  -- моментальная смерть
                  print("Игрок упал в лаву!")
              end
          end)
        afterText: "💥 Любой, кто коснётся лавы → сразу погибает."


      # ================================
      # Шипы, которые наносят урон (не сразу убивают)
      # ================================
      - type: "code"
        title: "🩸 Шаг 3. Шипы, которые наносят урон (не сразу убивают)"
        text: "Скрипт внутри Spikes:"
        code: |
          local spikes = script.Parent

          spikes.Touched:Connect(function(hit)
              local char = hit.Parent
              local humanoid = char:FindFirstChild("Humanoid")

              if humanoid then
                  humanoid.Health -= 25  -- минус 25 HP
                  print("Игрок получил урон от шипов!")
              end
          end)
        afterText: "Игрок может пережить шипы, но будет ранен."

      - type: "note"
        text: "Humanoid отвечает за здоровье. Если Health падает до 0 — персонаж умирает."

      # ================================
      # Шаг 4. Опасная зона, наносящая урон ПОСТЕПЕННО
      # ================================
      - type: "code"
        title: "♨️ Шаг 4. Опасная зона, наносящая урон ПОСТЕПЕННО"
        text: "Например, игрок стоит на кислоте — здоровье уменьшается каждую секунду."
        code: |
          local acid = script.Parent
          local touching = false

          acid.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              if humanoid then
                  touching = true

                  while touching do
                      humanoid.Health -= 5
                      wait(0.5)
                  end
              end
          end)

          acid.TouchEnded:Connect(function(hit)
              touching = false
          end)

        afterText: 
          - "Пока игрок касается зоны → здоровье тает 💔"
          - "Ушёл — урон остановился."

      # ================================
      # Лава с эффектом «поджога» (красиво!)
      # ================================
      - type: "code"
        title: "🔥 Шаг 5. Лава с эффектом «поджога» (красиво!)"
        code: |
          local lava = script.Parent

          lava.Touched:Connect(function(hit)
              local char = hit.Parent
              local humanoid = char:FindFirstChild("Humanoid")
              local root = char:FindFirstChild("HumanoidRootPart")

              if humanoid and root then
                  humanoid.Health -= 40
                  root.BrickColor = BrickColor.new("Bright orange") -- игрок "горит"
                  wait(0.3)
                  root.BrickColor = BrickColor.new("White")
              end
          end)
        afterText: "Простой эффект огня 🔥"

      - type: "CanCollide"
        title: "Код мгновенного уничтожения"
        code: |
          local lava = script.Parent

          lava.Touched:Connect(function(hit)
              local human = hit.Parent:FindFirstChild("Humanoid")
              if human then
                  human.Health = 0   -- мгновенная смерть
              end
          end)

      # ================================
      # ПОСТЕПЕННЫЙ УРОН (каждую секунду)
      # ================================
     

      - type: "code"
        language: "lua"
        title: "Пошаговое уменьшение здоровья"
        code: |
          local lava = script.Parent
          local damaging = {}  -- список игроки, стоящие на лаве

          lava.Touched:Connect(function(hit)
              local character = hit.Parent
              local human = character:FindFirstChild("Humanoid")

              if human and not damaging[character] then
                  damaging[character] = true

                  while damaging[character] and human.Health > 0 do
                      human.Health -= 5
                      wait(0.5)
                  end
              end
          end)

          lava.TouchEnded:Connect(function(hit)
              damaging[hit.Parent] = nil
          end)

      - type: "warning"
        text: "Не делайте слишком быстрый урон — игрок может умереть раньше, чем поймёт, что произошло."

      # ================================
      # БЕЗОПАСНАЯ ПЛАТФОРМА
      # ================================
      - type: "steps"
        title: "Создаём безопасную платформу"
        items:
          - "Создай Part → SafePlatform."
          - "Покрась в зелёный."
          - "Anchored = true."
          - "На неё можно ставить чекпоинты или отдыхать."

      - type: "text"
        title: "Почему нужны безопасные зоны?"
        text:
          - "Чтобы игрок мог отдохнуть."
          - "Чтобы Obby было интереснее, а не слишком сложным."
          - "Чтобы логично разделить уровни."
      # ================================
      # ПРАКТИКА ДЛЯ РЕБЁНКА
      # ================================
      - type: "steps"
        title: "💡 Что можно добавить?"
        items:
          - "🌈 1. Частицы пламени (Добавь ParticleEmitter в лаву — выглядит круто!)"
          - "🔊 2. Звук шипения (Sound:Play() при касании.)"
          - "⚠️ 3. Безопасная зона (Сделай блок, который восстанавливает здоровье:(humanoid.Health += 5))"
          - "😈 4. Ловушка, открывающаяся через секунду (Время на реакцию!)"



      # ================================
      # ПРАКТИКА ДЛЯ РЕБЁНКА
      # ================================
      - type: "steps"
        title: "🧪 Мини-квест (попробуй сам!)"
        items:
          - "🧱 Блок «треснувший пол», который падает через 1 секунду после наступания (Игрок становится → 1 сек → пол падает вниз)"
          - "Лаву, которая поднимается вверх каждые 5 секунд (🔥 Лава медленно поднимается → ждёт → опускается → повторяет)"
          - "Добавь красные частицы — эффект жара."
          - "Шипы, которые прячутся и выезжают (через TweenService) (⚔️ Шипы поднимаются → ждут → опускаются → повторяют)"
      - type: hint
        title: "Подсказака 👇 - 🧱 Игрок становится → 1 сек → пол падает вниз"
        code: |
          -- Получаем наш блок пола
          local floor = script.Parent

          -- Флаг, чтобы пол не падал дважды
          local used = false

          -- Срабатывает, когда что-то касается блока
          floor.Touched:Connect(function(hit)

              -- Проверяем: это игрок?
              local char = hit.Parent
              local humanoid = char:FindFirstChild("Humanoid")

              if humanoid and not used then
                  used = true  -- блок уже был активирован
                  print("По полу наступили! Он трескается!")

                  -- Ждём 1 секунду перед падением
                  wait(1)

                  -- Пол «падает» вниз
                  floor.Position = floor.Position - Vector3.new(0, 20, 0)

                  -- Можно сделать его невидимым:
                  floor.Transparency = 1
                  floor.CanCollide = false
              end
          end)

      - type: hint
        title: "Подсказака 👇 - 🔥 Лава медленно поднимается → ждёт → опускается → повторяет"
        code: |
          -- TweenService для плавного движения
          local TweenService = game:GetService("TweenService")

          -- Наша лава (Part)
          local lava = script.Parent

          -- Запоминаем начальную позицию
          local startPos = lava.Position

          -- Конечная позиция — поднимаем лаву на 15 студий вверх
          local endPos = lava.Position + Vector3.new(0, 15, 0)

          -- Настройки плавности
          local info = TweenInfo.new(
              3,  -- длительность (3 сек)
              Enum.EasingStyle.Quad,
              Enum.EasingDirection.Out
          )

          -- Два твина: вверх и вниз
          local rise = TweenService:Create(lava, info, {Position = endPos})
          local fall = TweenService:Create(lava, info, {Position = startPos})

          -- Движение лавы по циклу
          while true do
              print("Лава поднимается!")
              rise:Play()
              wait(5)

              print("Лава опускается!")
              fall:Play()
              wait(5)
          end

      - type: hint
        title: "Подсказака 👇 - ⚔️ Шипы поднимаются → ждут → опускаются → повторяют"
        code: |
          -- TweenService — для плавных анимаций
          local TweenService = game:GetService("TweenService")

          local spikes = script.Parent

          -- Запоминаем нижнюю (спрятанную) позицию
          local hiddenPos = spikes.Position

          -- Позиция, куда шипы выезжают (поднимаются на 5 студий)
          local upPos = spikes.Position + Vector3.new(0, 5, 0)

          -- Настройки плавного движения
          local info = TweenInfo.new(
              0.8,  -- скорость появления
              Enum.EasingStyle.Bounce, -- стиль (отскок)
              Enum.EasingDirection.Out
          )

          -- Создаём два твина: вверх и вниз
          local showTween = TweenService:Create(spikes, info, {Position = upPos})
          local hideTween = TweenService:Create(spikes, info, {Position = hiddenPos})

          while true do
              print("Шипы выезжают!")
              showTween:Play()
              wait(2)               -- шипы торчат 2 секунды

              print("Шипы прячутся.")
              hideTween:Play()
              wait(3)               -- ждём перед следующей атакой
          end









