  - id: 25
    title: "⭐ Урок 25: Визуальные эффекты: как мир откликается на действия"
    shortDescription: "Учимся добавлять визуальные эффекты (изуальные эффекты) как реакцию на события в игровом мире."
    

    content:

      # -------------------------
      # INTRO
      # -------------------------
      - type: "text"
        title: "🎯 Цель урока"
        text: |
          <p>Научиться делать так, чтобы мир выглядел живым, используя эффекты как реакцию на событие.</p>
          <p>📌 В этом уроке:</p>
          <ul>
            <li>📌 Это НЕ новая логика</li>
            <li>📌 Это усиление реакции</li>
          </ul>


      - type: "codeBlock"
        title: "🧠 Большая идея урока."
        code: |
          Эффект — это такая же реакция, как цвет или движение.
          Просто её видно, а не слышно.

        afterText: |
          <p>Когда что-то происходит — мир может вспыхнуть, задымиться или заискриться.</p>
        
      - type: "text"
        title: "🟢 Вступление"
        text: |
          <p>Представь игру без звуков и эффектов.</p>
          <p>Кнопка нажалась — тишина и ничего не происходит.</p>
          <p>Дверь открылась — тишина и ничего не происходит.</p>
          <br>
          <p>Звук и эффекты делают игру <b>живой</b>.</p>.

      - type: "text"
        title: "🔊 Что такое визуальные эффекты?"
        text:
          - "Визуальные эффекты — это объекты <b>ParticleEmitter</b>, <b>Fire</b>, <b>Smoke</b> и другие."
          - "Они живут внутри других объектов."
          - "Он создаёт дым, искры, огонь и другие эффекты."
          - "Мы можем включать их, чтобы сделать мир ярче и интереснее."

      - type: "text"
        title: "🔔 Примеры реакций"
        text:
          - "• кнопка — воспроизводит эффект при нажатии"
          - "• плита — издаёт эффект при наступлении"
          - "• лазер — запускает эффект при пересечении"
          - "По логике — это всё одно и то же."

      - type: "note"
        text: |
          🔑 <b>Визуальный эффект — это тоже реакция.</b>  
          <p>Просто её видно, а не слышно.</p>

      - type: "text"
        title: "🎯 Цель реакции"  
        text: |
          <p>Цель реакции — <b>заставить мир меняться</b> в ответ на сигнал триггера.</p>
          <p>Например:</p>
          <ul>
            <li>Игрок нажал кнопку → воспроизошёл эффект</li>
            <li>Игрок наступил на плиту → заиграл эффект</li>
            <li>Игрок пересёк лазер → включился визуальный эффект</li>
          </ul>

      - type: "steps"
        title: "🛠 Подготовка"
        items:
          - "Выбери объект (кнопку, ловушку, лаву)."
          - "Добавь внутрь него <b>ParticleEmitter</b>."
          - "Назови его <b>Effect</b>."
          - "Поставь <b>Enabled = false</b>."
      # -------------------------
      # 🟦 Практика 1 — Эффект по триггеру
      # -------------------------
      - type: "text"
        title: "🟦 Практика 1 — Эффект по триггеру"
        text: |
          <h4>🎯 Задание</h4>
          <p>Сделать так, чтобы при касании включался эффект, а через секунду выключался.</b></
          <h4>💡 Подсказка</h4>
            <ul>
              <li>Touched</li>
              <li>Enabled</li>
              <li>wait</li>
            </ul>

      - type: "codeBlock"
        title: "📌 Код: включаем эффект"
        text:
          - "В Script напиши код, который реагирует на касание и включает эффект на секунду:" 
        code: |
          local trigger = script.Parent
          local effect = trigger.Effect

          trigger.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  effect.Enabled = true   -- включаем эффект
                  wait(1)
                  effect.Enabled = false  -- выключаем
              end
          end)
        afterText: |
          <ul>
            <li>✔️ Игрок коснулся кнопки</li>
            <li>✔️ Эффект включился</li>
            <li>✔️ Через секунду эффект выключился</li>
          </ul>
          <p>Поздравляю! Ты создал кнопку, которая воспроизводит эффект! 🎉</p>


      - type: "text"
        title: "🟢 СТОП И ВОПРОС?"  
        text: |
            <ul>
              <li>Эффект — это действие или реакция?</li>
              <li>Он появляется сам или по событию?</li>
              <li>Что будет, если не выключить эффект?</li>
            </ul>
      - type: "hint"
        title: "Подсказка 🔑 "
        text:
          - "🔑  Эффект — это реакция."
          - "🔑  Он запускается событием Touched."
          - "🔑  Если не выключить эффект, он будет продолжать работать."

      
      - type: "note"
        text: |
          🔑 <b>Важно:</b> 
          <p>Кнопка — это триггер. </p>
          <p>Эффект — это реакция.</p>
          <p>Когда игрок касается кнопки, эффект включается и выключается.</p>

      
      
      # -------------------------
      # 🟩 Практика 2 — СДЕЛАЙ САМ 💪
      # -------------------------
      - type: "steps"
        title: "🟩 Практика 2 — СДЕЛАЙ САМ 💪"
        
      - type: "text"
        title: "🧪 Сделай сам"
        text: |
          Попробуй:
          <ol>
            <li>Добавить эффект к лаве или ловушке</li>
            <li>Включать эффект, когда игрок рядом или касается объекта</li>
          </ol>



      - type: "text"
        title: "Подумай:" 
        text: |
          <ul>  
            <li>где триггер?</li>
            <li>какой эффект подойдёт (дым, огонь, искры)?</li>
          </ul>
      - type: "note"
        text: |
          ⚠️ Эффект — это украшение.
          Он не заменяет логику, а дополняет её.

      - type: "hint"
        title: "Подсказка 🔑"
        text:
          - "Лава или ловушка — это триггер"
          - "Реакция — это уменьшение здоровья игрока"
          - "Добавь объект ParticleEmitter внутрь лавы и запусти его в реакции"
        code: |
          local lava = script.Parent
          local effect = lava.Effect
          lava.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")
              if humanoid then
                  humanoid.Health = humanoid.Health - 10
                  effect.Enabled = true   -- включаем эффект
                  wait(1)
                  effect.Enabled = false  -- выключаем
              end
          end)
        afterText: |
          <ul>
            <li>✔️ Игрок коснулся лавы</li>      
            <li>✔️ Здоровье уменьшилось</li>   
            <li>✔️ Эффект воспроизвелся</li>
          </ul>
          <p>Звук — слышно.</p>
          <p>Эффект — видно.</p>
          <p>Оба — реакции на событие.</p>


    

      - type: "text"
        title: "🔜 Где это используется дальше"
        text: |
          В мини-проекте Obby:
          <ul>
            <li>ловушки будут дымить</li>
            <li>магические зоны будут искриться</li>
            <li>финиш будет сиять эффектами</li>
          </ul>
          Ты научился добавлять визуальные эффекты как реакцию на события в игровом мире! 🚀 🎮

      
    quiz:
      - question: "Визуальный эффект в контексте триггера — это что?"
        answers:
          - "Триггер"   
          - "Реакция"
          - "Команда для остановки игры"
        correct: 1
      - question: "Что запускает воспроизведение визуального эффекта?"
        answers:
          - "Событие Touched"
          - "Команда print"
          - "Функция wait"   
        correct: 0      
      - question: "Будет ли визуальный эффект появляться сам по себе, без взаимодействия?"
        answers:
          - "Нет, эффект появляется только при взаимодействии"
          - "Да, эффект появляется постоянно"
          - "Эффект меняет цвет"     
        correct: 0
      - question: "Что делает команда effect.Enabled = true?"
        answers:
          - "Включает визуальный эффект"
          - "Останавливает эффект"
          - "Меняет цвет триггера"     
        correct: 0
      - question: "Как можно выключить визуальный эффект после его включения?"
        answers:
          - "Используя команду effect.Enabled = false"
          - "Используя команду print"
          - "Используя функцию wait"     
        correct: 0
        
    
    end:
      - type: "text"
        text: |
          Здесь мы использовали:
          <p>• триггер — чтобы поймать событие</p>
          <p>• проверку — чтобы убедиться, что это игрок</p>
          <p>• реакцию — чтобы воспроизвести визуальный эффект в ответ на событие</p>
          Это и есть основа игровых механик.
          <p>Теперь мы умеем не только ловить сигнал и реагировать на него, но и добавлять визуальные эффекты.</p>
          <p>В следующем уроке мы научимся делать эти реакции плавными и красивыми с помощью TweenService.</p>
          <p>Ты научился создавать интерактивные объекты в своих играх Roblox! 🚀🎮</p>



# ===============================
# ✅ Урок 26 — Плавное движение объектов (TweenService)
# ===============================
  - id: 26
    title: "✅ Урок 26: Плавное движение объектов — TweenService"
    shortDescription: "Учимся делать красивые анимации двери, платформ и любых объектов."
    # video: "https://www.youtube.com/embed/TWEEN018"

    content:

      # -----------------------
      # INTRO
      # -----------------------
      - type: "text"
        title: "Что мы сегодня узнаем?"
        text:
          - "Раньше мы изменяли объект сразу: он просто исчезал или становился прозрачным."
          - "Но в играх Roblox почти всегда используются **плавные анимации**."
          - "Сегодня мы научимся двигать, увеличивать, менять прозрачность и цвет объектов с помощью TweenService."
          - "<b>TweenService = плавная красивая анимация</b>."
      - type: "text"
        text: |
          Представь, что ты хочешь, чтобы:
            <ul>
              <li>дверь открывалась плавно, а не резко 🚪</li>
              <li>текст красиво появлялся ✨</li>
              <li>куб мягко менял цвет 🌈</li>
              <li>платформа медленно поднималась вверх ⬆️</li>
            </ul>
          Для этого в Roblox есть специальная «магия» под названием <b>TweenService</b>.

      - type: "gallery"
        title: "Где используется TweenService"
        images:
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson23/module3_23_1.png?raw=true"
            caption: "Пример 1: Плавное движение объектаю 📦 Платформа медленно едет в сторону"
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson23/module3_23_2.png?raw=true"
            caption: "Пример 2: Плавное появление / исчезновение. 👻 Объект медленно становится видимым"
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson23/module3_23_3.png?raw=true"
            caption: "Пример 3: Анимация UI (кнопки, меню). 🎮 Кнопка плавно увеличивается при наведении"

      # -----------------------
      # STEP 1 — Что такое Tween
      # -----------------------
      - type: "text"
        title: "✨ Что такое TweenService?"
        text:
          - "<b>TweenService</b> — это как аниматор."
          - "Tween — это инструкция: как объект должен измениться."
          - "Например: «двигаться вверх 2 секунды», «постепенно исчезнуть», «увеличиться в 2 раза»."
          - "Он умеет плавно менять любой параметр:"
          - "• позицию;"
          - "• размер;"
          - "• цвет;"
          - "• прозрачность;"
          - "• ориентацию;"
      - type: tip
        title: "Можешь думать так:"
        text: "«TweenService делает роблокс-объекты красивыми и плавными.»"
      # -----------------------
      # STEP 2 — Подключаем TweenService
      # -----------------------
      - type: "code"
        title: "🧩 Как использовать TweenService?"
        text: "Есть 3 шага:"
        code: |
          1️⃣ Создать TweenService:

            local TweenService = game:GetService("TweenService")

          2️⃣ Настроить параметры (сколько длится, насколько плавно):

            local info = TweenInfo.new(
                2,            -- длительность в секундах
                Enum.EasingStyle.Quad,   -- стиль движения
                Enum.EasingDirection.Out -- направление
            )
          
          3️⃣ Создать анимацию (tween) и запустить её:

            local tween = TweenService:Create(OBJECT, info,         {Property = Value})
            tween:Play()

      - type: "code"
        title: "🚪 Пример: плавное открытие двери"
        text: "Представим, что у нас есть дверь Door."
        code: |
          local TweenService = game:GetService("TweenService")
          local door = game.Workspace.Door

          local info = TweenInfo.new(2, Enum.EasingStyle.Quad, Enum.EasingDirection.Out)

          local open = TweenService:Create(door, info, {
              Position = door.Position + Vector3.new(0, 10, 0)
          })

          open:Play()
        afterText: "Теперь дверь поднимается красиво, как лифт 🚀✨"

      - type: "code"
        title: "🌈 Пример: плавная смена цвета куба"
        code: |
          local cube = game.Workspace.Cube
          local TweenService = game:GetService("TweenService")

          local info = TweenInfo.new(1)

          local colorTween = TweenService:Create(cube, info, {
              Color = Color3.fromRGB(0, 255, 0)
          })

          colorTween:Play()
        afterText: "Куб плавно станет зелёным 💚"


      - type: "code"
        title: "🔍 Пример: плавное увеличение размера"
        code: |
          local cube = game.Workspace.Cube
          local TweenService = game:GetService("TweenService")

          local info = TweenInfo.new(1)

          local grow = TweenService:Create(cube, info, {
              Size = Vector3.new(10, 10, 10)
          })

          grow:Play()
        afterText: "Куб «вырастает» как воздушный шар 🎈"
      
      - type: "code"
        title: "🧪 Пример: кнопка, открывающая дверь плавно"
        code: |
          local button = game.Workspace.Button
          local door = game.Workspace.Door
          local TweenService = game:GetService("TweenService")

          local info = TweenInfo.new(1)

          local openDoorTween = TweenService:Create(door, info, {
              Position = door.Position + Vector3.new(0, 8, 0)
          })

          button.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  openDoorTween:Play()
              end
          end)
        afterText: "Теперь дверь открывается красиво и мягко ✨"

      - type: "text"
        title: "🎨 Попробуй разные стили движения!"
        text: |
          Их много! Например:
            <ul>
              <li>Bounce — отскакивает 🏀</li>
              <li>Elastic — резиновый эффект 🌀</li>
              <li>Linear — ровное движение</li>
              <li>Quad, Cubic, Sine — мягкие анимации</li>
            </ul>
      - type: "code"
        text: "Пример:"
        code: "Enum.EasingStyle.Bounce"
        afterText: "— объект подпрыгивает в конце 😄"

      # -----------------------
      # STEP 5 — Ещё эффекты
      # -----------------------
      - type: "text"
        title: "Можно менять не только положение"
        text:
          - "Вот несколько вещей, которые легко анимировать:"
          - "• прозрачность;"
          - "• цвет;"
          - "• размер;"
          - "• вращение (через CFrame);"
          - "• одновременно несколько свойств."

      # Пример исчезновения
      - type: "code"
        language: "lua"
        title: "Пример: объект исчезает"
        code: |
          local goal = {
              Transparency = 1
          }

      # Пример смены цвета
      - type: "code"
        language: "lua"
        title: "Пример: плавная смена цвета"
        code: |
          local goal = {
              Color = Color3.fromRGB(255, 0, 0)
          }

      # Пример увеличения размера
      - type: "code"
        language: "lua"
        title: "Пример: увеличение размера"
        code: |
          local goal = {
              Size = Vector3.new(10, 10, 10)
          }

      # -----------------------
      # STEP 6 — Бесконечная анимация
      # -----------------------
      - type: "text"
        title: "Повторение анимации"
        text:
          - "Чтобы анимация повторялась снова и снова — подписываемся на завершение:"

      - type: "code"
        language: "lua"
        title: "Бесконечная анимация"
        code: |
          tween.Completed:Connect(function()
              tween:Play()
          end)

      # -----------------------
      # PRACTICE
      # -----------------------
      - type: "steps"
        title: "Попробуй сам!"
        items:
          - "Сделай дверь, которая плавно «уезжает» в сторону при нажатии кнопки."
          - "Создай куб, который увеличивается при касании."
          - "Сделай платформу, которая движется вверх-вниз бесконечно."
          - "Добавь плавное появление объекта (Transparency → 0)."
          - "Плавно падает вниз"
          - "Через 1 секунду плавно поднимается вверх"
          - "Пишет в Output: 'Готово!'"

      - type: "note"
        text: "Чем больше ты играешься с TweenService, тем красивее становятся игры!"

    quiz:
      - question: "Что делает TweenService?"
        answers:
          - "Создаёт кнопки"
          - "Делает плавные анимации"
          - "Открывает доступ к Humanoid"
        correct: 1

      - question: "Где мы задаём время анимации?"
        answers:
          - "TweenInfo.new()"
          - "Vector3.new()"
          - "Touched"
        correct: 0

      - question: "Как запустить анимацию?"
        answers:
          - "tween.Start()"
          - "tween.Play()"
          - "tween:Play()"
        correct: 2
    end:
      - type: "text"
        text: "Ты сделал огромный шаг к уровню «разработчик Roblox PRO»!"


# ===============================
# Урок 27: Движущаяся платформа (лифт)
# ===============================
  - id: 27
    title: "🎉 Урок 27: Движущаяся платформа (лифт)"
    shortDescription: "Учимся делать платформу, которая двигается вверх и вниз."
    # video: "https://www.youtube.com/embed/LIFT019"

    content:

      # INTRO
      - type: "text"
        title: "Что мы сегодня узнаем?"
        text:
          - "Сегодня мы сделаем настоящий лифт! Он будет плавно подниматься и опускаться."
          - "Сначала — простая версия через цикл."
          - "Потом — красивая анимация через TweenService."
          - "Это выглядит круто и часто используется в паркурах, приключениях и хоррор-играх!"

      - type: "gallery"
        title: "Как выглядит движущаяся платформа"
        images:
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson24/module3_24_1.png?raw=true"
            caption: |
              - "Пример 1: Платформа едет вперёд один раз. Используется для простых движущихся платформ"
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson24/module3_24_2.png?raw=true"
            caption: "Пример 2: Платформа ездит туда и обратно. Подходит для лифтов и маятников"
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module3/lesson24/module3_24_3.png?raw=true"
            caption: "Начало Obby"
      - type: text
        title: "🧩 Большая идея урока"
        text: |
          <p><b>Лифт — это платформа, которая всё время повторяет движение: вверх → пауза → вниз → пауза</b></p>          
          <ul>
            <li>📌 Здесь нет кнопки (пока)</li>
            <li>📌 Лифт живёт сам по себе</li>
          </ul>
      - type: codeBlock
        title: "🧠 Логическая схема (очень важно)"
        code: |
          [Начало]
                ↓
          [Лифт едет вверх]
                ↓
          [Пауза (wait)]
                ↓
          [Лифт едет вниз]
                ↓
          [Пауза (wait)]
                ↓
          [Повторить]
        afterText: |
          <p>💬 Проговорить вслух:</p>
          <p><em>Лифт едет вверх, потом ждёт, потом едет вниз, потом ждёт, и повторяет это снова и снова.</em></p>
          ~<p>Он делает одно и то же снова и снова.</p>
    # Шаг 1. Платформа — что это?
      - type: "text"
        title: "🟦 Шаг 1. Платформа — что это?"
        text:
          - "Платформа — это просто <b>Part</b> (деталь) в Roblox."
          - "на нём стоит игрок и он едет вместе с платформой."
          - "Мы будем двигать эту деталь вверх и вниз."
          - "Важно: у платформы должно быть свойство <b>Anchored = true</b>, чтобы она не падала."
    # Шаг 2. Плавное движение (Tween)
      - type: "text"
        title: "🟨 Шаг 2. Плавное движение (Tween)"
        text:
          - "Чтобы платформа двигалась плавно, мы будем использовать <b>TweenService</b>."
          - "Это специальный сервис, который умеет делать красивые анимации."
          - "Мы уже изучали его в прошлом уроке."
          - "Лифт:"
          - "• едет вверх (имеет верхнюю точку);"
          - "• ждёт;"
          - "• едет вниз (имеет нижнюю точку);"
          - "• ждёт;"
          - "• повторяет это снова и снова."
          - "Tween:"
          - "• в tells, куда ехат;"
          - "• и за сколько секунд;"

      # -----------------------
      # PART 1 — SIMPLE LIFT
      # -----------------------
      - type: "text"
        title: "Версия 1. Простой лифт (цикл while)"
        text:
          - "Эта версия работает очень просто: каждые несколько секунд платформа меняет позицию."
          - "Подходит для движущихся блоков, ловушек и простых Obby."

      - type: "text"
        title: "🧱 Шаг 1. Создаём платформу"
        text: 
          - "<p>Вставь <b>Part → Block</b></p>"
          - "Назови его <b>Lift</b>"
          - "Сделай размер, например: <b>8×1×8</b>"
          - "Поставь на пол, где должен быть лифт"
          - "Добавь внутрь платформы <b>Script</b>"

      - type: "code"
        title: "🛠️ Шаг 2. Подключаем TweenService"
        text: "В Script пишем:"
        code: |
          local TweenService = game:GetService("TweenService")
          local lift = script.Parent
      - type: "code"
        title: "📍 Шаг 3. Задаём конечные позиции"
        text: |
          Мы сделаем две точки:
            <ul>
              <li>точка внизу — где лифт стоит изначально</li>
              <li>точка вверху — куда он поднимается</li>
            </ul>
        code: |
          local startPos = lift.Position
          local endPos = lift.Position + Vector3.new(0, 20, 0) -- вверх на 20
      - type: "code"
        title: "🎚️ Шаг 4. Настраиваем параметры движения"
        code: |
          local info = TweenInfo.new(
              3, -- 3 секунды
              Enum.EasingStyle.Quad,
              Enum.EasingDirection.Out
          )
      - type: "code"
        title: "🛗 Шаг 5. Создаём два твина: подъём и спуск"
        code: |
          local liftUp = TweenService:Create(lift, info, {Position = endPos})
          local liftDown = TweenService:Create(lift, info, {Position = startPos})
      - type: "code"
        title: "⭐ Шаг 6. Анимация лифта (цикл)"
        text: "Теперь сделаем, чтобы лифт ехал вверх — ждал — ехал вниз — ждал — и повторял."
        code: |
          while true do
              liftUp:Play()
              wait(3)      -- ждём пока доедет
              wait(2)      -- стоим на верхнем этаже

              liftDown:Play()
              wait(3)
              wait(2)      -- стоим на нижнем этаже
          end
      - type: "code"
        title: "🎉 Готовый код целиком"
        code: |
          local TweenService = game:GetService("TweenService")
          local lift = script.Parent

          local startPos = lift.Position
          local endPos = lift.Position + Vector3.new(0, 20, 0)

          local info = TweenInfo.new(
              3,
              Enum.EasingStyle.Quad,
              Enum.EasingDirection.Out
          )

          local liftUp = TweenService:Create(lift, info, {Position = endPos})
          local liftDown = TweenService:Create(lift, info, {Position = startPos})

          while true do
              liftUp:Play()
              wait(5)

              liftDown:Play()
              wait(5)
          end
        afterText: "Теперь платформа плавно ездит вверх-вниз — как настоящий игровой лифт! 🚀"

      - type: "note"
        text: "Важно: платформа должна быть Anchored = true, иначе физика начнёт её толкать."

      - type: "text"
        title: "🧠 Как объяснить?"
        text: |
          <ul>
            <li>TweenService = «движение красиво».</li>
            <li>Мы сказали платформе, куда ехать.</li>
            <li>Лифт просто повторяет маршрут: вверх → вниз → вверх → вниз.</li>
          </ul>
      # -----------------------
      # PART 2 — TWEEN LIFT
      # -----------------------
      - type: "text"
        title: "Версия 2. Красивый лифт (TweenService)"
        text:
          - "Эта версия движется плавно и красиво."
          - "Используем TweenService — сервис анимаций."

      - type: "steps"
        title: "Шаг 1. Подключаем TweenService"
        items:
          - "Внутри того же Lift создаём Script."
          - "Вставляем код ниже."

      - type: "code"
        language: "lua"
        title: "Готовый Tween-лифт"
        code: |
          local TweenService = game:GetService("TweenService")
          local lift = script.Parent

          local upPos = lift.Position + Vector3.new(0, 10, 0)
          local downPos = lift.Position

          local info = TweenInfo.new(2, Enum.EasingStyle.Sine, Enum.EasingDirection.InOut)

          local tweenUp = TweenService:Create(lift, info, {Position = upPos})
          local tweenDown = TweenService:Create(lift, info, {Position = downPos})

          -- бесконечный цикл
          while true do
              tweenUp:Play()
              tweenUp.Completed:Wait()

              tweenDown:Play()
              tweenDown.Completed:Wait()
          end

      - type: "text"
        title: "Что можно улучшить?"
        text:
          - "Сделать более высокое движение."
          - "Добавить звук движения лифта.(гул лифта, механические звуки)"
          - "Плавное изменение света. (Например, лампы лифта мигают, когда он едет.)"
          - "Сделать вызов лифта по кнопке. (игрок нажал кнопку → лифт приехал к нему.)"
          - "Двери лифта. (Можно добавить вторую часть, которая открывается через TweenService.)"
          - "Безопасность: лифт не должен придавить игрока. (Можно добавить проверку на касание.)"

      # PRACTICE
      - type: "steps"
        title: "Попробуй сам!"
        items:
          - "Создай боковую стенку лифта, чтобы игрок ощущал движение."
          - "Сделай платформу, которая движется не вверх/вниз, а вперёд/назад."
          - "Сделай трёхэтажный лифт — три точки движения вместо двух."
          - "Добавь кнопку, которая запускает анимацию лифта."
      #  1
      - type: "text"
        title: "1. Создай боковую стенку лифта, чтобы игрок ощущал движение"
        text: "Здесь просто: добавь Part (стенку) → привяжи её к платформе так, чтобы она двигалась вместе."
      - type: hint 
        text: "Подсказка 👇"
        code: |
          local TweenService = game:GetService("TweenService")
          local wall = script.Parent  -- боковая стенка
          local startPos = wall.Position
          local endPos = wall.Position + Vector3.new(0, 20, 0)

          local info = TweenInfo.new(3)

          local up = TweenService:Create(wall, info, {Position = endPos})
          local down = TweenService:Create(wall, info, {Position = startPos})

          while true do
              up:Play()
              wait(4)
              down:Play()
              wait(4)
          end
        afterText: "Теперь стенка плавно ездит вверх/вниз — игрок почувствует движение."
      
      # 2
      - type: "text"
        title: "🔹 2. Платформа движется вперёд/назад вместо вверх/вниз"
        text: "Меняем только Vector3 направление!"
      - type: hint 
        text: "Подсказка 👇"
        code: |
            local TweenService = game:GetService("TweenService")
            local lift = script.Parent

            local startPos = lift.Position
            local endPos = lift.Position + Vector3.new(20, 0, 0) -- вперёд на 20

            local info = TweenInfo.new(3)

            local forward = TweenService:Create(lift, info, {Position = endPos})
            local back = TweenService:Create(lift, info, {Position = startPos})

            while true do
                forward:Play()
                wait(4)
                back:Play()
                wait(4)
            end
        afterText: "Теперь платформа ездит как вагонетка 🚂✨"

      
       # 3
      - type: "text"
        title: "🔹 3. Сделай трёхэтажный лифт — три точки движения"
        text: "Здесь будет этаж 1 → этаж 2 → этаж 3 → обратно вниз."
      - type: hint 
        text: "Подсказка 👇"
        code: |
          local TweenService = game:GetService("TweenService")
          local lift = script.Parent

          local floor1 = lift.Position
          local floor2 = lift.Position + Vector3.new(0, 15, 0)
          local floor3 = lift.Position + Vector3.new(0, 30, 0)

          local info = TweenInfo.new(3)

          local to2 = TweenService:Create(lift, info, {Position = floor2})
          local to3 = TweenService:Create(lift, info, {Position = floor3})
          local down2 = TweenService:Create(lift, info, {Position = floor2})
          local down1 = TweenService:Create(lift, info, {Position = floor1})

          while true do
              to2:Play()  -- 1 → 2 этаж
              wait(4)
              to3:Play()  -- 2 → 3 этаж
              wait(4)
              down2:Play() -- 3 → 2
              wait(4)
              down1:Play() -- 2 → 1
              wait(4)
          end
        afterText: "Теперь лифт — настоящий многоэтажный! 🛗🌆"

      # 4
      - type: "text"
        title: "🔹 4. Добавь кнопку, которая запускает анимацию лифта"
        text: |
          Игрок касается кнопки → лифт поехал.
          <h4>Настройка:</h4>
            <ul>
              <li><b>Кнопка</b> → Part named: <b>Button</b></li>
              <li><b>Лифт</b> → Part named: <b>Lift</b></li>
              <li>Скрипт внутри кнопки.</li>
            </ul>
      - type: hint 
        text: "Подсказка 👇"
        code: |
          local TweenService = game:GetService("TweenService")

          local button = script.Parent
          local lift = game.Workspace.Lift

          local startPos = lift.Position
          local endPos = lift.Position + Vector3.new(0, 20, 0)

          local info = TweenInfo.new(3)

          local liftUp = TweenService:Create(lift, info, {Position = endPos})
          local liftDown = TweenService:Create(lift, info, {Position = startPos})

          local busy = false  -- чтобы не запускалось дважды

          button.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") and not busy then
                  busy = true
                  
                  liftUp:Play()
                  wait(4)
                  liftDown:Play()
                  wait(4)

                  busy = false
              end
          end)

        afterText: "Теперь игрок сам вызывает лифт ✨🔘"

      
    quiz:
        - question: "Что делает цикл while true do?"
          answers:
            - "Запускает код один раз"
            - "Повторяет код снова и снова"
            - "Удаляет скрипт"
          correct: 1

        - question: "Что делает TweenService?"
          answers:
            - "Плавно анимирует объект"
            - "Создаёт ловушки"
            - "Увеличивает Humanoid"
          correct: 0

        - question: "Зачем нужен tween.Completed:Wait()?"
          answers:
            - "Останавливает игру"
            - "Ждёт, пока анимация завершится"
            - "Выключает лифт"
          correct: 1

  

