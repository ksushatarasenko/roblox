          <p>Кнопка — это триггер. </p>
          <p>Дверь — это реакция.</p>
          <p>Когда игрок касается кнопки, дверь меняет цвет.</p>

      
      # -------------------------
      # 🟨 Практика 2 — Реакция с проверкой
      # -------------------------
      - type: "text"
        title: "🟨 Практика 2 — Реакция с проверкой"
        text:  |
          <h4>Чтобы не ломалось</h4>
          <h5>Задача:</h5>
          <ul>
            <li>Дверь должна реагировать только один раз.</li>
          </ul>
          <h5>Идея:</h5>
          <ul>
            <li>Если дверь закрыта — открыть её.</li>
            <li>Если дверь уже открыта — ничего не делаем.</li>
          </ul>
          

      - type: "code"
        title: "🧠 Проверка перед действием"
        code: |
          local button = script.Parent
          local door = workspace.Door
          local isOpen = false

          button.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") and not isOpen then
                  door.Transparency = 0.5
                  isOpen = true
              end
          end)
        afterText: |
          <ul>
            <li>✔️ Игрок коснулся кнопки</li>
            <li>✔️ Дверь стала прозрачной</li>
            <li>✔️ Повторные касания не влияют на дверь</li>
          </ul>

      - type: "note"
        text: |
