              <li>Что произошло, когда игрок коснулся кнопки?</li>
              <li>Как триггер и реакция связаны между собой?</li>
              <li>Что будет, если никто не касается кнопки?</li>
            </ul>
      - type: "hint"
        title: "Подсказка 🔑 "
        text:
