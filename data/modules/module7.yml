# УРОК 64 — Выбор ответа игрока (кнопки и логика)
# ============================================================
- id: 64
  title: "⭐ Урок 64. Выбор ответа игрока"
  shortDescription: "Учимся делать диалоги с вариантами ответов и реакцией NPC."
  # video: "https://www.youtube.com/embed/NPC64"

  content:
    - type: "text"
      text: |
        В прошлом уроке NPC научился говорить 💬<br><br>
        Но пока игрок только <b>читает</b>.<br><br>
        Теперь мы сделаем шаг дальше:<br>
        игрок сможет <b>выбирать ответ</b>.<br><br>
        Это делает диалог<br>
        по-настоящему <b>интерактивным</b> 🎮✨

    - type: "text"
      title: "🎯 Зачем нужен выбор ответа?"
      text: |
        Когда игрок выбирает ответ:<br><br>
        • он чувствует контроль<br>
        • диалог становится интереснее<br>
        • игра перестаёт быть линейной<br><br>
        Даже простой выбор «Да / Нет»<br>
        уже меняет ощущение от игры.

    - type: "text"
      title: "🧩 Из чего состоит диалог с выбором?"
      text: |
        Теперь в диалоге есть:<br><br>
        🏷️ TextLabel — текст NPC<br>
        ▶️ TextButton — вариант ответа 1<br>
        ▶️ TextButton — вариант ответа 2<br><br>
        Каждая кнопка — это <b>действие</b>.

    - type: "steps"
      title: "🧱 Шаг 1. Добавляем кнопки ответов"
      items:
        - "Открой <b>DialogGui</b>"
        - "Добавь <b>TextButton</b> → AnswerYes"
        - "Добавь <b>TextButton</b> → AnswerNo"
        - "Задай текст: «Да» и «Нет»"
        - "Размести кнопки под текстом NPC"

    - type: "text"
      title: "▶️ Ответ «Да» — соглашаемся"
      text: |
        Нажатие кнопки «Да»<br>
        означает согласие с NPC.<br><br>
        Например:<br>
        «Да, я помогу»<br>
        «Хорошо, я согласен»

    - type: "code"
      title: "✨ Код кнопки «Да»"
      code: |
        local button = script.Parent
        local dialogGui = button.Parent.Parent

        button.MouseButton1Click:Connect(function()
            print("Игрок согласился")
            dialogGui.Enabled = false
        end)

    - type: "text"
      title: "❌ Ответ «Нет» — отказываемся"
      text: |
        Ответ «Нет» — это тоже выбор.<br><br>
        Игрок может отказаться<br>
        или вернуться позже.

    - type: "code"
      title: "✨ Код кнопки «Нет»"
      code: |
        local button = script.Parent
        local dialogGui = button.Parent.Parent

        button.MouseButton1Click:Connect(function()
            print("Игрок отказался")
            dialogGui.Enabled = false
        end)

    - type: "text"
      title: "🧠 Что мы сделали на самом деле?"
      text: |
        Мы научились:<br><br>
        • ловить выбор игрока<br>
        • реагировать на кнопки<br>
        • менять поведение игры<br><br>
        В следующих уроках выбор<br>
        будет влиять на <b>квесты и награды</b>.

    - type: "text"
      title: "🧪 Мини-практика"
      text: |
        Попробуй улучшить диалог:<br><br>
        1️⃣ Сделай разные тексты после «Да» и «Нет»<br>
        2️⃣ Пусть одна кнопка закрывает диалог, а другая — нет<br>
        3️⃣ Сделай третью кнопку «Позже»<br>
        4️⃣ Измени текст NPC после выбора

  quiz:
    - question: "Зачем в диалоге нужен выбор ответа?"
      answers:
        - "Для красоты"
        - "Чтобы игрок мог влиять на игру"
        - "Чтобы ускорить диалог"
      correct: 1

    - question: "Какой объект используется для вариантов ответа?"
      answers:
        - "TextLabel"
        - "TextButton"
        - "ScreenGui"
      correct: 1

    - question: "Что происходит при нажатии кнопки ответа?"
      answers:
        - "Игра перезапускается"
        - "Срабатывает событие нажатия"
        - "NPC исчезает"
      correct: 1

    - question: "Может ли ответ «Нет» быть полезным?"
      answers:
        - "Нет, он бесполезен"
        - "Да, это тоже выбор игрока"
        - "Только если есть таймер"
      correct: 1

    - question: "Что станет следующим шагом после выбора ответа?"
      answers:
        - "Создание карты"
        - "Квест или награда"
        - "Удаление NPC"
      correct: 1

  end:
    - type: "text"
      title: "🎉 Итог урока"
      text: |
        Теперь ты умеешь:<br>
        <ul>
          <li>создавать диалоги с выбором</li>
          <li>использовать кнопки как ответы</li>
          <li>реагировать на решение игрока</li>
        </ul>
