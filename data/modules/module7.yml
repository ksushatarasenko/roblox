- id: 65
  title: "⭐ Урок 65. NPC даёт задание"
  shortDescription: "Учимся делать простые квесты: NPC ставит цель, игрок её выполняет."
  # video: "https://www.youtube.com/embed/NPC65"

  content:
    - type: "text"
      text: |
        Теперь NPC умеет говорить 💬<br>
        и игрок умеет отвечать 👍👎<br><br>
        Самое время сделать <b>настоящий квест</b> 🎯<br><br>
        <b>Квест</b> — это когда:<br>
        NPC говорит, что нужно сделать,<br>
        игрок выполняет задание,<br>
        а игра это <b>проверяет</b>.

    - type: "text"
      title: "🎮 Что такое квест?"
      text: |
        Простой квест состоит из трёх частей:<br><br>
        1️⃣ Задание — что нужно сделать<br>
        2️⃣ Условие — как понять, что выполнено<br>
        3️⃣ Результат — что произойдёт дальше<br><br>
        Например:<br>
        «Собери 5 монет — и я открою дверь»

    - type: "text"
      title: "🧩 Как NPC «помнит» задание?"
      text: |
        Чтобы игра знала, есть ли задание,<br>
        мы используем специальные значения:<br><br>
        🔘 BoolValue — да / нет<br>
        🔢 IntValue — число<br><br>
        Они хранят состояние квеста 🧠

    - type: "steps"
      title: "🧱 Шаг 1. Создаём состояние квеста"
      items:
        - "Выбери NPC (Model)"
        - "Добавь <b>BoolValue</b>"
        - "Назови его <b>QuestActive</b>"
        - "Установи <b>false</b>"

    - type: "text"
      title: "📜 Пример задания от NPC"
      text: |
        NPC говорит игроку:<br><br>
        «Принеси мне 5 монет 🪙»<br><br>
        Когда игрок нажимает «Да»,<br>
        задание становится активным.

    - type: "code"
      title: "✨ Код: NPC выдаёт задание"
      code: |
        local npc = script.Parent
        local questActive = npc:FindFirstChild("QuestActive")

        if questActive then
            questActive.Value = true
            print("Квест начался: собери 5 монет")
        end

    - type: "text"
      title: "🧠 Что происходит в игре?"
      text: |
        • игрок согласился на задание<br>
        • квест стал активным<br>
        • теперь игра может проверять прогресс<br><br>
        Это как флажок:<br>
        <b>Квест включён ✔️</b>

    - type: "text"
      title: "🔗 Связь с модулем 6"
      text: |
        В модуле 6 ты уже делал:<br><br>
        🪙 монеты<br>
        📊 счётчик монет<br><br>
        Теперь эти монеты —<br>
        <b>часть задания</b>, а не просто числа.

    - type: "text"
      title: "🧪 Мини-практика"
      text: |
        Попробуй сам:<br><br>
        1️⃣ Сделай задание «Собери 3 монеты»<br>
        2️⃣ Добавь второе BoolValue: <b>QuestDone</b><br>
        3️⃣ После согласия игрока включай QuestActive<br>
        4️⃣ Подумай: что должно произойти, когда квест выполнен?

  quiz:
    - question: "Что такое квест?"
      answers:
        - "Украшение карты"
        - "Задание для игрока"
        - "Случайное событие"
      correct: 1

    - question: "Из каких частей состоит простой квест?"
      answers:
        - "Карта, музыка, свет"
        - "Задание, условие, результат"
        - "NPC, игрок, кнопка"
      correct: 1

    - question: "Как мы храним состояние квеста?"
      answers:
        - "В Color объекта"
        - "С помощью Value (BoolValue / IntValue)"
        - "В названии NPC"
      correct: 1

    - question: "Что делает BoolValue?"
      answers:
        - "Хранит текст"
        - "Хранит да / нет"
        - "Телепортирует игрока"
      correct: 1

    - question: "Почему квест связан с монетами?"
      answers:
        - "Потому что монеты красивые"
        - "Чтобы задание имело цель"
        - "Случайно"
      correct: 1

  end:
    - type: "text"
      title: "🎉 Итог урока"
      text: |
        Теперь ты умеешь:<br>
        <ul>
          <li>понимать, что такое квест</li>
          <li>делать задание от NPC</li>
          <li>хранить состояние квеста</li>
          <li>связывать задания с монетами</li>
        </ul>
        <h4>В следующем уроке NPC проверит задание и даст награду 🏆</h4>

