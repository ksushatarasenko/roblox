title: "🧩 МОДУЛЬ 7: NPC, диалоги и простейший ИИ"
description: "Учимся создавать NPC, движение, обнаружение игрока, диалоги и мини-квесты. Модуль делает игру живой."

lessons:

  # ============================================================
# УРОК 60 — Кто такой NPC и зачем он нужен
# ============================================================
- id: 60
  title: "⭐ Урок 60. Кто такой NPC и зачем он нужен"
  shortDescription: "Знакомимся с NPC — персонажами, которые делают игру живой."
  # video: "https://www.youtube.com/embed/NPC60"

  content:
    - type: "text"
      text: |
        До этого момента в игре был только игрок.<br><br>
        Мир реагировал, но <b>не жил</b>.<br><br>
        Теперь появляется кое-кто новый 👀<br><br>
        <b>NPC</b> — персонажи, которые живут в игре,<br>
        говорят, охраняют, помогают и дают задания.<br><br>
        С этого урока твоя игра начинает напоминать<br>
        <b>настоящее приключение</b> 🎮✨

    - type: "text"
      title: "🧠 Что такое NPC?"
      text: |
        <b>NPC</b> — это <b>Non-Player Character</b>.<br>
        Это персонаж, которым <b>не управляет игрок</b>.<br><br>
        NPC живёт в игровом мире и делает то,<br>
        что ты для него запрограммировал.

    - type: "text"
      title: "👾 Чем NPC отличается от игрока?"
      text: |
        Игрок:<br>
        • управляется с клавиатуры<br>
        • имеет камеру<br>
        • проходит уровень<br><br>
        NPC:<br>
        • управляется кодом<br>
        • стоит, ходит или реагирует<br>
        • помогает или мешает игроку

    - type: "text"
      title: "🎭 Роли NPC в играх"
      text: |
        NPC может быть кем угодно:<br><br>
        🧙 помощник — подсказывает, что делать<br>
        🛡️ страж — не пускает без условия<br>
        🛒 торговец — обменивает монеты<br>
        🗝️ квестодатель — даёт задание<br>
        😈 враг — мешает пройти дальше<br><br>
        Один NPC = <b>часть истории игры</b>.

    - type: "text"
      title: "🗺️ Где ты уже видел NPC?"
      text: |
        NPC есть почти в каждой игре:<br><br>
        • жители деревень<br>
        • продавцы в магазинах<br>
        • охранники у дверей<br>
        • персонажи с диалогами<br><br>
        Без NPC мир кажется пустым.

    - type: "text"
      title: "🎯 Зачем мы изучаем NPC именно сейчас?"
      text: |
        Потому что ты уже умеешь:<br>
        • работать с игроком<br>
        • делать монеты и награды<br>
        • открывать двери по условиям<br>
        • создавать интерфейс<br><br>
        NPC поможет <b>связать всё это в квест</b>.

    - type: "text"
      title: "🧪 Мини-мышление (без кода)"
      text: |
        Представь NPC в своей игре:<br><br>
        1️⃣ Где он стоит?<br>
        2️⃣ Что он делает?<br>
        3️⃣ Что он говорит игроку?<br>
        4️⃣ Что игрок должен сделать в ответ?<br><br>
        👉 Это и есть основа квестов.

  quiz:
    - question: "Что означает NPC?"
      answers:
        - "New Player Character"
        - "Non-Player Character"
        - "Next Play Control"
      correct: 1

    - question: "Кто управляет NPC?"
      answers:
        - "Игрок"
        - "Клавиатура"
        - "Код"
      correct: 2

    - question: "Зачем NPC нужны в игре?"
      answers:
        - "Для украшения карты"
        - "Чтобы сделать мир живым и интересным"
        - "Чтобы увеличить размер игры"
      correct: 1

    - question: "Кем НЕ может быть NPC?"
      answers:
        - "Стражем"
        - "Торговцем"
        - "Игроком"
      correct: 2

    - question: "Что чаще всего делает NPC в играх?"
      answers:
        - "Даёт задания или информацию"
        - "Меняет управление камерой"
        - "Удаляет интерфейс"
      correct: 0

  end:
    - type: "text"
      title: "🎉 Итог урока"
      text: |
        Теперь ты знаешь:<br>
        <ul>
          <li>кто такой NPC</li>
          <li>чем он отличается от игрока</li>
          <li>какие роли он может выполнять</li>
          <li>зачем NPC делают игру живой</li>
        </ul>
        <h4>В следующем уроке мы создадим своего первого NPC 👾</h4>

# ============================================================
# УРОК 61 — Создание NPC (модель + Humanoid)
# ============================================================
- id: 61
  title: "⭐ Урок 61. Создание NPC: модель и Humanoid"
  shortDescription: "Создаём своего первого NPC и делаем его «живым»."
  # video: "https://www.youtube.com/embed/NPC61"

  content:
    - type: "text"
      text: |
        В прошлом уроке мы узнали,<br>
        <b>кто такой NPC</b> и зачем он нужен.<br><br>
        Теперь пора сделать его <b>по-настоящему</b> 👾<br><br>
        Сегодня ты создашь своего первого NPC —<br>
        персонажа, который стоит в мире и готов<br>
        взаимодействовать с игроком.

    - type: "text"
      title: "🧠 Из чего состоит NPC?"
      text: |
        NPC — это не просто кубик.<br><br>
        Минимально NPC должен состоять из:<br>
        • <b>Model</b> — чтобы объединить части<br>
        • <b>Part</b> — тело NPC<br>
        • <b>Humanoid</b> — чтобы NPC считался персонажем<br><br>
        Без Humanoid NPC — просто объект.

    - type: "steps"
      title: "🧱 Шаг 1. Создаём тело NPC"
      items:
        - "Создай <b>Part</b>"
        - "Назови его <b>Body</b>"
        - "Размер — как у персонажа"
        - "Anchored = true"
        - "CanCollide = true"

    - type: "steps"
      title: "📦 Шаг 2. Объединяем в модель"
      items:
        - "Выдели <b>Body</b>"
        - "Нажми <b>Model → Group</b>"
        - "Назови модель <b>NPC</b>"

    - type: "steps"
      title: "❤️ Шаг 3. Добавляем Humanoid"
      items:
        - "Открой модель <b>NPC</b>"
        - "Нажми <b>+</b>"
        - "Добавь <b>Humanoid</b>"

    - type: "text"
      title: "✨ Что изменилось?"
      text: |
        Теперь NPC:<br>
        • считается персонажем<br>
        • может иметь здоровье<br>
        • может реагировать как живой объект<br><br>
        Для Roblox это уже <b>настоящий персонаж</b>.

    - type: "text"
      title: "👀 NPC и игрок — теперь похожи"
      text: |
        И у игрока, и у NPC есть:<br>
        • Model<br>
        • Parts<br>
        • Humanoid<br><br>
        Разница в том, что:<br>
        👉 игрок управляется человеком<br>
        👉 NPC управляется кодом

    - type: "text"
      title: "🧪 Мини-практика"
      text: |
        Попробуй изменить NPC:<br><br>
        1️⃣ Поменяй цвет тела<br>
        2️⃣ Измени размер NPC (больше / меньше игрока)<br>
        3️⃣ Добавь NPC имя (Name у модели)<br>
        4️⃣ Поставь NPC рядом с дверью или путём

    - type: "text"
      title: "⚠️ Важно запомнить"
      text: |
        • Humanoid нужен, чтобы объект считался персонажем<br>
        • NPC пока <b>не говорит</b> и <b>не двигается</b><br>
        • Мы сделали только основу<br><br>
        В следующих уроках NPC научится<br>
        <b>реагировать и взаимодействовать</b>.

  quiz:
    - question: "Зачем NPC нужен Humanoid?"
      answers:
        - "Для красоты"
        - "Чтобы Roblox считал его персонажем"
        - "Чтобы он стал прозрачным"
      correct: 1

    - question: "В чём должен находиться Humanoid NPC?"
      answers:
        - "В Workspace"
        - "В Part"
        - "В Model NPC"
      correct: 2

    - question: "Что объединяет части NPC в одно целое?"
      answers:
        - "Script"
        - "Model"
        - "Folder"
      correct: 1

    - question: "Чем NPC пока отличается от игрока?"
      answers:
        - "У NPC нет Humanoid"
        - "NPC не управляется игроком"
        - "NPC не может быть в игре"
      correct: 1

    - question: "Что мы сделали в этом уроке?"
      answers:
        - "Создали диалог"
        - "Создали основу NPC"
        - "Сделали искусственный интеллект"
      correct: 1

  end:
    - type: "text"
      title: "🎉 Итог урока"
      text: |
        Теперь ты умеешь:<br>
        <ul>
          <li>создавать NPC как модель</li>
          <li>добавлять Humanoid</li>
          <li>понимать разницу между NPC и игроком</li>
        </ul>
        <h4>В следующем уроке NPC начнёт реагировать на игрока 👀</h4>
# ============================================================
# УРОК 62 — NPC реагирует на игрока
# ============================================================
- id: 62
  title: "⭐ Урок 62. NPC реагирует на игрока"
  shortDescription: "Учимся делать NPC, который замечает игрока и реагирует на его появление."
  # video: "https://www.youtube.com/embed/NPC62"

  content:
    - type: "text"
      text: |
        Теперь у нас есть NPC с телом и Humanoid 👾<br><br>
        Но пока он просто стоит.<br><br>
        В этом уроке мы научим NPC <b>замечать игрока</b>:<br>
        подходить, реагировать и показывать,<br>
        что он живой.

    - type: "text"
      title: "👀 Как NPC может «заметить» игрока?"
      text: |
        Есть несколько способов понять,<br>
        что игрок рядом:<br><br>
        • игрок коснулся NPC<br>
        • игрок подошёл на близкое расстояние<br>
        • игрок вошёл в зону<br><br>
        Сегодня мы начнём с <b>самого простого</b> — касания.

    - type: "steps"
      title: "🧱 Шаг 1. Где будет код NPC?"
      items:
        - "Открой модель <b>NPC</b>"
        - "Выбери <b>Body</b>"
        - "Добавь внутрь <b>Script</b>"

    - type: "text"
      title: "🧠 Что мы будем проверять?"
      text: |
        Когда кто-то касается NPC, нам нужно понять:<br><br>
        • это игрок или нет?<br>
        • нужно ли реагировать?<br><br>
        Как и раньше, мы проверяем наличие <b>Humanoid</b>.

    - type: "code"
      title: "✨ Код: NPC реагирует на игрока"
      code: |
        local npcBody = script.Parent

        npcBody.Touched:Connect(function(hit)
            local character = hit.Parent
            local humanoid = character:FindFirstChild("Humanoid")

            if humanoid then
                print("NPC заметил игрока!")
            end
        end)
      afterText: |
        👉 Теперь, когда игрок касается NPC,<br>
        в Output появляется сообщение.<br><br>
        Это первая форма «реакции».

    - type: "text"
      title: "🎭 Как NPC может реагировать?"
      text: |
        Реакция может быть любой:<br><br>
        • сообщение в консоли<br>
        • звук<br>
        • изменение цвета NPC<br>
        • начало диалога<br>
        • открытие двери<br><br>
        Сейчас мы тренируем <b>сам факт реакции</b>.

    - type: "code"
      title: "🎨 Пример: NPC меняет цвет при касании"
      code: |
        local npcBody = script.Parent

        npcBody.Touched:Connect(function(hit)
            local humanoid = hit.Parent:FindFirstChild("Humanoid")

            if humanoid then
                npcBody.Color = Color3.fromRGB(255, 255, 0)
                print("NPC реагирует на игрока!")
            end
        end)
      afterText: |
        👉 Игрок подошёл → NPC «ожил».

    - type: "text"
      title: "⚠️ Важно понимать"
      text: |
        • NPC пока <b>не говорит</b><br>
        • NPC пока <b>не думает</b><br>
        • NPC просто реагирует на событие<br><br>
        Это фундамент для диалогов и квестов.

    - type: "text"
      title: "🧪 Мини-практика"
      text: |
        Попробуй сам:<br><br>
        1️⃣ Сделай, чтобы NPC менял цвет обратно через 1 секунду<br>
        2️⃣ Добавь звук реакции<br>
        3️⃣ Сделай надпись над NPC («Привет!»)<br>
        4️⃣ Сделай реакцию только один раз

  quiz:
    - question: "Как NPC понимает, что рядом игрок?"
      answers:
        - "По имени объекта"
        - "По наличию Humanoid"
        - "По цвету персонажа"
      correct: 1

    - question: "Какое событие мы использовали в этом уроке?"
      answers:
        - "Changed"
        - "Touched"
        - "Clicked"
      correct: 1

    - question: "Где находится Script для реакции NPC?"
      answers:
        - "В Player"
        - "В Body NPC"
        - "В Workspace"
      correct: 1

    - question: "Что NPC делает в этом уроке?"
      answers:
        - "Даёт задание"
        - "Начинает диалог"
        - "Реагирует на игрока"
      correct: 2

    - question: "Зачем нужна реакция NPC?"
      answers:
        - "Для красоты"
        - "Чтобы игрок понял: NPC живой"
        - "Чтобы ускорить игру"
      correct: 1

  end:
    - type: "text"
      title: "🎉 Итог урока"
      text: |
        Теперь ты умеешь:<br>
        <ul>
          <li>делать NPC, который реагирует на игрока</li>
          <li>использовать событие Touched</li>
          <li>отличать игрока от других объектов</li>
        </ul>
        <h4>В следующем уроке NPC начнёт разговаривать 💬</h4>

