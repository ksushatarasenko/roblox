# УРОК 63 — Диалоги с NPC (окно и текст)
# ============================================================
- id: 63
  title: "⭐ Урок 63. Диалоги с NPC: окно и текст"
  shortDescription: "Создаём диалоговое окно и учим NPC разговаривать с игроком."
  # video: "https://www.youtube.com/embed/NPC63"

  content:
    - type: "text"
      text: |
        NPC уже умеет реагировать на игрока 👀<br><br>
        Но настоящая магия начинается,<br>
        когда NPC <b>говорит</b> 💬<br><br>
        В этом уроке мы создадим<br>
        <b>диалоговое окно</b>,<br>
        в котором NPC сможет общаться с игроком.

    - type: "text"
      title: "💬 Что такое диалог в игре?"
      text: |
        Диалог — это разговор между игроком и NPC.<br><br>
        Обычно диалог:<br>
        • появляется при подходе к NPC<br>
        • показывает текст<br>
        • исчезает после разговора<br><br>
        Диалоги делают игру<br>
        <b>понятной и живой</b>.

    - type: "text"
      title: "🧩 Из чего состоит диалоговое окно?"
      text: |
        Наш простой диалог будет состоять из:<br><br>
        🖼️ ScreenGui — окно диалога<br>
        🏷️ TextLabel — текст NPC<br>
        ▶️ TextButton — кнопка «Дальше» или «Закрыть»

    - type: "steps"
      title: "🧱 Шаг 1. Создаём интерфейс диалога"
      items:
        - "Открой <b>StarterGui</b>"
        - "Добавь <b>ScreenGui</b> → назови <b>DialogGui</b>"
        - "Добавь <b>TextLabel</b> → текст NPC"
        - "Добавь <b>TextButton</b> → кнопка «Закрыть»"
        - "DialogGui.Enabled = false"

    - type: "text"
      title: "👀 Когда должен появляться диалог?"
      text: |
        Диалог появляется,<br>
        когда игрок <b>взаимодействует с NPC</b>.<br><br>
        Например:<br>
        • игрок касается NPC<br>
        • игрок подходит близко<br><br>
        Сейчас используем <b>Touched</b>.

    - type: "code"
      title: "✨ Код: показать диалог при касании NPC"
      code: |
        local npcBody = script.Parent
        local dialogGui = game.Players.LocalPlayer.PlayerGui:WaitForChild("DialogGui")

        npcBody.Touched:Connect(function(hit)
            local humanoid = hit.Parent:FindFirstChild("Humanoid")

            if humanoid then
                dialogGui.Enabled = true
            end
        end)
      afterText: |
        👉 Игрок касается NPC → диалог появляется.

    - type: "text"
      title: "▶️ Закрываем диалог"
      text: |
        Диалог не должен висеть вечно.<br><br>
        Кнопка «Закрыть»<br>
        выключает интерфейс.

    - type: "code"
      title: "✨ Код кнопки «Закрыть»"
      code: |
        local button = script.Parent
        local dialogGui = button.Parent.Parent

        button.MouseButton1Click:Connect(function()
            dialogGui.Enabled = false
        end)

    - type: "text"
      title: "🧠 Важно запомнить"
      text: |
        • Диалог — это <b>интерфейс</b><br>
        • Он включается и выключается<br>
        • NPC и UI работают вместе<br><br>
        Это основа для выбора ответов и квестов.

    - type: "text"
      title: "🧪 Мини-практика"
      text: |
        Попробуй улучшить диалог:<br><br>
        1️⃣ Измени текст NPC («Привет, герой!»)<br>
        2️⃣ Сделай красивое окно (цвет, размер)<br>
        3️⃣ Сделай, чтобы диалог появлялся только один раз<br>
        4️⃣ Добавь имя NPC в TextLabel

  quiz:
    - question: "Зачем в игре нужны диалоги?"
      answers:
        - "Для украшения интерфейса"
        - "Чтобы NPC мог общаться с игроком"
        - "Чтобы ускорить игру"
      correct: 1

    - question: "Какой объект отвечает за окно диалога?"
      answers:
        - "TextLabel"
        - "ScreenGui"
        - "TextButton"
      correct: 1

    - question: "Когда в этом уроке появляется диалог?"
      answers:
        - "Когда игра запускается"
        - "Когда игрок касается NPC"
        - "Когда игрок прыгает"
      correct: 1

    - question: "Как мы закрываем диалог?"
      answers:
        - "Удаляем NPC"
        - "Выключаем ScreenGui"
        - "Телепортируем игрока"
      correct: 1

    - question: "Что связывает NPC и диалог?"
      answers:
        - "Интерфейс и событие"
        - "Цвет персонажа"
        - "Размер карты"
      correct: 0

  end:
    - type: "text"
      title: "🎉 Итог урока"
      text: |
        Теперь ты умеешь:<br>
        <ul>
          <li>создавать диалоговое окно</li>
          <li>показывать текст NPC</li>
          <li>включать и выключать диалог</li>
          <li>связывать NPC и интерфейс</li>
        </ul>
        <h4>В следующем уроке игрок сможет выбирать ответы 💬➡️</h4>

