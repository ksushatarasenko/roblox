# УРОК 66 — NPC проверяет задание и даёт награду
# ============================================================
- id: 66
  title: "⭐ Урок 66. NPC проверяет задание и даёт награду"
  shortDescription: "Учимся проверять выполнение квеста и награждать игрока."
  # video: "https://www.youtube.com/embed/NPC66"

  content:
    - type: "text"
      text: |
        У нас уже есть всё необходимое 👏<br><br>
        ✅ NPC дал задание<br>
        🪙 игрок собирает монеты<br>
        🧠 игра хранит состояние квеста<br><br>
        Теперь самое важное:<br>
        <b>NPC должен понять — выполнено ли задание</b><br>
        и <b>отреагировать</b> 🎉

    - type: "text"
      title: "🎯 Когда квест считается выполненным?"
      text: |
        Квест выполнен, если:<br><br>
        • задание было активировано<br>
        • игрок выполнил условие<br><br>
        В нашем случае:<br>
        <b>игрок собрал нужное количество монет</b> 🪙

    - type: "text"
      title: "🧩 Что проверяет NPC?"
      text: |
        NPC проверяет:<br><br>
        🔘 QuestActive — был ли взят квест<br>
        🔢 Coins — сколько монет у игрока<br><br>
        Если всё совпадает —<br>
        NPC говорит: «Отлично!» 🎉

    - type: "steps"
      title: "🧱 Шаг 1. Подготовка значений"
      items:
        - "У NPC есть <b>QuestActive (BoolValue)</b>"
        - "У игрока есть <b>Coins (IntValue)</b>"
        - "Определи нужное количество монет (например, 5)"

    - type: "code"
      title: "✨ Код: проверка выполнения квеста"
      code: |
        local npc = script.Parent
        local questActive = npc:FindFirstChild("QuestActive")

        local player = game.Players.LocalPlayer
        local coins = player:FindFirstChild("Coins")

        if questActive and questActive.Value == true then
            if coins and coins.Value >= 5 then
                print("Квест выполнен!")
            else
                print("Недостаточно монет")
            end
        end

    - type: "text"
      title: "🏆 Что такое награда?"
      text: |
        Награда — это то,<br>
        что игрок получает за старание 💪<br><br>
        Это может быть:<br>
        🚪 открытая дверь<br>
        🌀 телепорт дальше<br>
        🪙 бонусные монеты<br>
        💬 сообщение «Молодец!»<br><br>
        Даже маленькая награда —<br>
        это <b>радость и мотивация</b> 😊

    - type: "code"
      title: "✨ Код: выдаём награду"
      code: |
        local npc = script.Parent
        local questActive = npc:FindFirstChild("QuestActive")

        local door = workspace:FindFirstChild("RewardDoor")

        if questActive then
            questActive.Value = false
        end

        if door then
            door.CanCollide = false
            door.Transparency = 0.5
            print("Дверь открыта! Награда получена 🎉")
        end

    - type: "text"
      title: "🧠 Что мы сделали?"
      text: |
        Мы замкнули полный цикл:<br><br>
        NPC → задание → действия игрока → проверка → награда<br><br>
        Это основа:<br>
        • RPG<br>
        • квестов<br>
        • приключенческих игр<br>
        • сюжетных Obby

    - type: "text"
      title: "🧪 Мини-практика"
      text: |
        Попробуй сам:<br><br>
        1️⃣ Сделай награду — телепорт дальше<br>
        2️⃣ Добавь сообщение «Спасибо за помощь!»<br>
        3️⃣ Сделай второй квест у того же NPC<br>
        4️⃣ Попробуй награду в виде монет

  quiz:
    - question: "Когда NPC может выдать награду?"
      answers:
        - "Всегда"
        - "Когда квест выполнен"
        - "Когда игрок рядом"
      correct: 1

    - question: "Что NPC проверяет для квеста?"
      answers:
        - "Цвет игрока"
        - "Монеты и состояние квеста"
        - "Размер карты"
      correct: 1

    - question: "Что может быть наградой?"
      answers:
        - "Только монеты"
        - "Дверь, телепорт, сообщение"
        - "Только текст"
      correct: 1

    - question: "Почему награда важна?"
      answers:
        - "Для красоты"
        - "Она мотивирует игрока"
        - "Без причины"
      correct: 1

    - question: "Что мы построили в этом уроке?"
      answers:
        - "Просто диалог"
        - "Полный цикл квеста"
        - "Меню игры"
      correct: 1

  end:
    - type: "text"
      title: "🎉 Итог урока"
      text: |
        Теперь ты умеешь:<br>
        <ul>
          <li>проверять выполнение задания</li>
          <li>анализировать действия игрока</li>
          <li>давать награду</li>
          <li>строить полноценные квесты</li>
        </ul>
