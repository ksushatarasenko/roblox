- id: 67
  title: "⭐ Урок 67. Мини-проект: Страж охраняет сокровище"
  shortDescription: "Создаём полноценный квест с NPC, монетами, диалогами и наградой."
  # video: "https://www.youtube.com/embed/NPC67"

  content:
    - type: "text"
      text: |
        🎉 Поздравляем!<br><br>
        Ты дошёл до финального проекта модуля 7.<br><br>
        Сейчас мы соберём <b>настоящую игровую механику</b>,<br>
        как в RPG и приключенческих Obby 🎮✨<br><br>
        Это не отдельные куски кода —<br>
        это <b>цельная мини-игра</b>.

    - type: "text"
      title: "🏰 Идея проекта"
      text: |
        В игре есть сокровище 💎<br>
        Но путь к нему охраняет NPC — Страж 🛡️<br><br>
        Страж говорит:<br>
        «Я пропущу тебя, если ты принесёшь 5 монет»<br><br>
        Игрок:<br>
        • разговаривает со Стражем<br>
        • принимает задание<br>
        • собирает монеты<br>
        • возвращается<br>
        • получает награду 🎉

    - type: "text"
      title: "🧩 Что используется в проекте?"
      text: |
        В этом проекте используется ВСЁ, чему ты научился:<br><br>
        👾 NPC с Humanoid<br>
        💬 Диалоги и кнопки<br>
        🎯 Квест (QuestActive)<br>
        🪙 Монеты и счётчик<br>
        🚪 Дверь / проход<br>
        🧠 Проверка условий<br><br>
        Это настоящий игровой цикл 🔄

    - type: "steps"
      title: "🗺️ Структура проекта"
      items:
        - "NPC → <b>Guard</b> (Model + Humanoid)"
        - "BoolValue → <b>QuestActive</b> (в NPC)"
        - "IntValue → <b>Coins</b> (у игрока)"
        - "Дверь → <b>TreasureDoor</b>"
        - "Сокровище → <b>Treasure</b>"
        - "DialogGui с кнопками «Да / Нет»"

    - type: "text"
      title: "💬 Диалог со Стражем"
      text: |
        Пример диалога:<br><br>
        🛡️ Страж:<br>
        «Стой! Я охраняю сокровище.»<br><br>
        «Принеси мне 5 монет — и я открою путь.»<br><br>
        ▶️ Да — взять задание<br>
        ❌ Нет — уйти

    - type: "code"
      title: "✨ Код: выдача задания Стражем"
      code: |
        local guard = script.Parent
        local questActive = guard:FindFirstChild("QuestActive")

        if questActive then
            questActive.Value = true
            print("Квест начался: принеси 5 монет")
        end

    - type: "text"
      title: "🪙 Выполнение задания"
      text: |
        Игрок собирает монеты,<br>
        счётчик Coins увеличивается.<br><br>
        Когда монет достаточно,<br>
        игрок возвращается к Стражу.

    - type: "code"
      title: "✨ Код: проверка и награда"
      code: |
        local guard = script.Parent
        local questActive = guard:FindFirstChild("QuestActive")
        local door = workspace:FindFirstChild("TreasureDoor")

        local player = game.Players.LocalPlayer
        local coins = player:FindFirstChild("Coins")

        if questActive and questActive.Value == true then
            if coins and coins.Value >= 5 then
                questActive.Value = false

                if door then
                    door.CanCollide = false
                    door.Transparency = 0.5
                end

                print("Страж: Ты заслужил пройти!")
            end
        end

    - type: "text"
      title: "🏆 Награда"
      text: |
        После выполнения квеста:<br><br>
        🚪 дверь открывается<br>
        💎 игрок получает доступ к сокровищу<br>
        💬 NPC благодарит игрока<br><br>
        Это создаёт чувство победы 🎉

    - type: "text"
      title: "🧪 Идеи для улучшения"
      text: |
        Хочешь сделать проект круче?<br><br>
        1️⃣ Добавь звук открытия двери<br>
        2️⃣ Сделай анимацию NPC<br>
        3️⃣ Добавь второй квест<br>
        4️⃣ Сделай таймер на задание<br>
        5️⃣ Добавь награду в виде монет

  quiz:
    - question: "Кто охраняет сокровище в проекте?"
      answers:
        - "Игрок"
        - "NPC-Страж"
        - "Монета"
      correct: 1

