id: 2
title: "🧩 МОДУЛЬ 2: Первые шаги в Lua и скриптах"
description: "Учимся писать скрипты, работать с переменными, событиями и функциями."

lessons:
  # ============================================================
  # УРОК 6 — Первый скрипт. Команда print()
  # ============================================================
  - id: 6
    title: "📘 Урок 6: Что такое Script и как работает print()"
    shortDescription: "🟢 «Я написал код — он что-то вывел» (print)"
    # video: "https://www.youtube.com/embed/hyK2psZK1KY?si=Z2IFEE-kyW5NTIhY"
    content:
      - type: text
        title: "🎯 Цель урока"
        text:
          - "Понять, что такое Script, где он находится, и научиться выводить текст через print()."
      - type: text
        title: "⭐ Что такое Lua и почему он используется в Roblox?"
        text:
          - "Представь, что игры — это как большие лего-миры. Кубики — это модели, детали, персонажи. Но чтобы всё это <em>двигалось, разговаривало, телепортировалось</em> или <em>исчезало</em>, нужен «мозг»."
          - "Этим «мозгом» служит язык программирования <b>Lua</b>."

      - type: text
        title: "🧠 Что такое Lua?"
        text:
          - "<ul> <li>Lua — это язык программирования, похожий на язык, по которому робот понимает команды.</li><li>Он простой, лёгкий и очень дружелюбный для новичков.</li><li>На Lua пишутся почти все игровые механики в Roblox Studio.</li></ul>"
          - "Можно сказать так:"
          - "<b>Модели — это тело, а скрипты на Lua — это мозг игры.</b>"
          - "Kod to nie magia. Kod to <b>praca z pamięcią.</b> "
      - type: text
        title: "📘 Jak możemy o tym myśleć?"
        text:
          - "Wyobraź sobie, że świat ma:"
          - "<ul> <li><b>małe pudełka</b></li><li>do których może coś schować</li></ul>"
          - "W jednym pudełku: liczba"
          - "W innym: tekst"
          - "W jeszcze innym: kolor albo stan"
          - "Na razie nie musisz znać nazw. Ważne jest tylko jedno: <b>Świat musi mieć gdzie zapisywać informacje.</b>"

      - type: gallery
        title: ""
        images:
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module2/lesson6/%D0%B3%D0%BB%D0%B0%D0%B2%D0%B0%D0%B8%CC%86%202_1.png?raw=true"

      - type: text
        title: "⭐ Что такое Script в Roblox Studio?"
        text:
          - "В Roblox Studio есть разные объекты: детали, кнопки, персонажи и т. д."
          - "Но чтобы объект что-то делал, ему нужен Script."
          - "<b>Script</b> — это коробочка с кодом, которая оживляет игру."
          - "Внутри неё ты пишешь команды на языке Lua, и игра выполняет эти команды."
          - "Когда мы запускаем игру (Play), Script выполняет команды."
          - "Например, если положить Script внутрь куба, можно сказать кубу:"
          - "<ul><li>мигать,</li><li>менять цвет,</li><li>исчезать,</li><li>двигаться,</li><li>взрываться,</li><li>или что угодно ещё!</li></ul>"

      - type: gallery
        title: "Где создаётся Script в Explorer"
        images:
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module2/lesson6/%D0%B3%D0%BB%D0%B0%D0%B2%D0%B0%D0%B8%CC%86%202_1.png?raw=true"
          - src: "assets/images/module2/script-example-1_1.png"
          - src: "assets/images/module2/script-example-1_2.png"
          - src: "assets/images/module2/script-example-1_3.png"
          - src: "assets/images/module2/script-example-1_4.png"

      - type: gallery
        title: "Окно редактора кода Roblox Studio"
        images:
          - src: "assets/images/module2/code-window-1_1.png"
          - src: "assets/images/module2/code-window-1_2.png"
          - src: "assets/images/module2/code-window-1_3.png"

      - type: text
        title: "🛠️ Практика"
        text:
          - "Что делает print()?"
          - "<b style='color:#2196f3; padding:10px;'><em>print()</em></b> — это команда показать текст в консоли."
          - "Пока ты учишься программировать, нужно уметь проверять, работает ли код."
          - "Для этого используется команда print()."
          - "<b>📣 Представь:</b>"
          - "Ты говоришь компьютеру: <em>«Эй, напиши вот это в специальное окно, чтобы я видел, что всё работает!»</em>"
          - "Это как если бы у тебя был помощник-робот, и он бы отвечал тебе: <em>«Команда выполнена!»</em>"

      - type: text
        title: "🧪 Как работает print()?"
        images:
          - "Команда выглядит так:"

      - type: code
        language: lua
        title: "Первый код"
        code: |
          print("Привет, мир!")

      - type: code
        language: lua
        title: "Что произойдёт? "
        text: "В окне Output в Roblox Studio появится сообщение:"
        code: |
          Привет, мир!

      - type: steps
        title: "Шаг 1. Создаём первый Script"
        items:
          - "Открой Roblox Studio."
          - "В окне Explorer нажми правой кнопкой на Workspace."
          - "Выбери Insert Object → Script."
          - "Появится новый объект Script и окно редактора кода."

      - type: steps
        title: "Шаг 2. Пишем первую команду"
        items:
          - "В редакторе удали весь текст."
          - "Напиши команду:"
          - '`print("Hello, Roblox!")`'
          - "Команда print выводит текст в окно Output."

      - type: steps
        title: "Шаг 3. Запускаем игру"
        items:
          - "Нажми кнопку Play."
          - "Открой окно Output (View → Output)."
          - "Ты увидишь сообщение: `Hello, Roblox!`"

      - type: text
        title: "Что произойдёт?"
        text: "Когда нажмёшь Play, в окне Output появится текст. Это значит: скрипт работает!"

      - type: text
        title: "Что важно запомнить"
        text:
          - "Script запускается только во время Play."
          - "Команда print помогает понять, что происходит в программе."

      - type: text
        title: "🎉 Итог:"
        text: |
          <ul>
            <li>Roblox использует <b>язык Lua</b> — простой и мощный.</li>
            <li><b>Script</b> — коробка с командами.</li>
            <li><b>print()</b> — показывает сообщения.</li>
            <li>Это первый шаг к созданию игр!</li>
          </ul>"
          Ты молодец! Дальше будет ещё интереснее 🎮

      - type: text
        title: "Мини-задание"
        text: 'Попробуй написать свой текст в print(). Например: print("Я делаю свою игру!")'

    quiz:
      - question: "Что делает команда print()?"
        answers:
          - "Меняет цвет объекта"
          - "Выводит текст в окно Output"
          - "Создаёт новый блок"
        correct: 1

      - question: "Где создаётся Script?"
        answers:
          - "В окне Explorer"
          - "В окне Properties"
          - "В окне Toolbox"
        correct: 0

    end:
      - type: "text"
        title: "🧠 Kluczowa myśl rozdziału"
        text: |
          <ul>
            <li>Świat, który nie pamięta, nie może myśleć.</li>
            <li>Pamięć to pierwszy krok do prawdziwego programowania.</li>
          </ul>
          <h4>Это мощнейшая база для будущих проектов!</h4>

  # ============================================================
  # УРОК 7 — где они вообще хранятся
  # ============================================================
  - id: 7
    title: "📘 Урок 7: Что такое Script и где они вообще хранятся."
    shortDescription: "🟢 «А где вообще живёт код?»"
    
    content:
      - type: text
        title: "🎯 Цель урока"
        text:
          - "Понять, что такое Script. 🧠 Почему скрипты «где-то» и где они вообще хранятся?"



      - type: text
        title: "👉 Скрипты — это не объекты мира,"
        text:
          - "они не стоят в Workspace, потому что их не нужно видеть и трогать."
          - "Они живут в службах (Services) — специальных «комнатах для логики»."


      - type: "oneImage"
        title: "🌍 Представь игру как город"
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module2/lesson6/module2_lesson6_2_1.png?raw=true"
            width: 860
            maxWidth: "100%"
            align: center
       

      - type: "oneImage"
        title: "🧠 Где живут скрипты и зачем"
        textTop: |          
          <p><b>Roblox создал это место специально для серверных скриптов.</b></p>
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module2/lesson6/module2_lesson6_2_2.png?raw=true"
            width: 860
            maxWidth: "100%"
            align: center
        
          


      - type: text
        title: "🟨 2. Почему скрипты НЕ в Workspace?"
        text: |
          <p>Если положить скрипт в Workspace:</p>
          <ul>
            <li>игрок может его увидеть</li>
            <li>можно случайно сломать</li>
            <li>логика смешается с объектами</li>
          </ul>
          <p>💡 Поэтому:</p>
          <p><b>Мир — отдельно, мозг — отдельно</b></p>

      
      - type: "oneImage"
        title: "🧱 Где ЕЩЁ могут быть скрипты"
        textTop: |
          <p><b>🟩 StarterPlayer</b></p>
          <p>Скрипты для <b>каждого игрока:</b> <em>game.StarterPlayer.StarterCharacterScripts</em></p>
          <p>👉 управление персонажем, камера, кнопки</p><br>
          <p><b>🟪 ReplicatedStorage</b></p>
          <p>Общее хранилище: <em>game.ReplicatedStorage</em></p>
          <p>👉 сюда кладут:</p>
          <ul>
            <li>ModuleScript</li>
            <li>общие функции</li>
            <li>данные</li>
          </ul><br>
          <p><b>🟦 Workspace (редко, но бывает)</b></p>
          <p>Иногда скрипт привязывают к объекту:</b> <em>Part -> Script</em></p>
          <p>👉 тогда он работает <b>только с этим объектом</b></p>
        img:
            src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module2/lesson6/module2_lesson6_2_3.png?raw=true"
            width: 860
            maxWidth: "100%"
            align: center

      - type: text
        title: "👀 Как увидеть ВСЕ скрипты в игре (ВАЖНО)"
        text: |
          <h4>✅ Способ 1. Explorer (основной)</h4>
          <ul>
            <li>Открой Roblox Studio.</li>
            <li>Включи: 
              <ul>
                <li>View → Explorer</li>
                <li>View → Properties </li>
              </ul>
            </li>
            <li>В окне Explorer ты увидишь все объекты и скрипты.</li><br>
          </ul>
          <h4>✅ Способ 2. Поиск (быстрый)</h4>
          <ul>
            <li>Нажми Ctrl + F (Cmd + F на Mac).</li>
            <li>Введи «Script» в строку поиска.</li>
            <li>Roblox Studio покажет <b>все скрипты</b> в проекте.</li>
          </ul> 

    

      - type: text
        title: "🧠 Очень важная мысль"
        text: |
          <h4>Скрипты — это мозг игры, это невидимые работники игры</h4>
          <ul>
            <li>Они живут в специальных службах (Services), они не стоят в мире.</li>
            <li>Они не видны игрокам, они не рисуются.</li>
            <li>Они управляют всем, что происходит в игре, они думают и управляют.</li>
          </ul>
          <p>Когда ты будешь создавать свои игры, помни: <b>скрипты — это мозг твоей игры! А <b>Workspace</b> — это сцена,</b></p>
          
          


      - type: text
        title: "🎓 Как это объяснить одной фразой"
        text:
          <p><em>🏙️ Workspace — это город, <br> а скрипты — это диспетчеры и правила, <br>которые сидят в офисах и управляют городом.</em></p

      

    end:
      - type: "text"
        title: "🧠 Kluczowa myśl rozdziału"
        text: |
          <ul>
            <li>Świat, który nie pamięta, nie może myśleć.</li>
            <li>Pamięć to pierwszy krok do prawdziwego programowania.</li>
          </ul>
          <h4>Это мощнейшая база для будущих проектов!</h4>

  # ============================================================
  # УРОК 8 — «Почему код не всегда в кубике?»
  # ============================================================
  - id: 8
    title: "📘 Урок 8: 🧠 Где должен жить скрипт и как объект с ним «разговаривает»"
    shortDescription: "🟢 «Почему код не всегда в кубике?»"
    
    content:
      - type: text
        title: "🎯 Цель урока"
        text: |
          В этом уроке ты узнаешь
          <ul>
            <li>почему <b>не все скрипты живут в объектах</b></li>
            <li>когда <b>можно</b> класть скрипт в Part</li>
            <li>где скрипты живут <b>чаще всего</b></li>
            <li><b>как объект сообщает скрипту</b>, что что-то произошло</li>
          </ul>


      - type: text
        title: "🌍 Представь игру как живой мир"
        text: |
          <p>Вообрази игру как живое существо:</p>
          <ul>
            <li>есть <b>тело</b> (объекты)</li>
            <li>есть <b>мозг</b> (скрипты)</li>
            <li>есть <b>нервы</b> (сигналы)</li>
          </ul>


      - type: "text"
        title: "🧱 Часть 1. Почему кажется, что скрипт должен быть в объекте"
        text: |
          <p>Когда ты создаёшь игру, может показаться логичным класть скрипт прямо в объект (<em>🧠 Есть кубик → значит у кубика должен быть скрипт</em>):</p>
          <ul>
            <li>если у тебя есть кнопка, ты можешь положить скрипт внутрь кнопки (кнопка → скрипт);</li>
            <li>если у тебя есть дверь, ты можешь положить скрипт внутрь двери (дверь → скрипт).</li>
          </ul>
          <p>И правда, в начале <b>так можно делать</b>.</p>
          <p>Это работает, <b>но не всегда</b> это лучший способ.</p>
       

      - type: "text"
        title: "🟦 Когда скрипт живёт в объекте"
        text: |          
          <p>📦 Пример: <em>Part -> Script </em></p>
          <p><b>🤔 Что это значит</b></p>
          <ul>
            <li>скрипт <b>приклеен</b> к этому объекту</li>
            <li>он следит <b>только за ним</b></li>
            <li>он не думает про всю игру</li>
          </ul>
          <br>
          <h4>👍 Когда это хорошо</h4>
          <ul>
            <li>кнопка</li>
            <li>дверь</li>
            <li>исчезающая платформа</li>
            <li>ловушка</li>
            <li>учебные примеры</li>
          </ul>
          <p>👉 Это как <b>маленький мозг у одной вещи</b></p> <br>

        
          


      - type: text
        title: "❗ Проблема: а если объектов много?"
        text: |
          <p>Представь:</p>
          <ul>
            <li>50 дверей</li>
            <li>30 кнопок</li>
            <li>20 ловушек</li>
          </ul>
          <p>Если у каждой: <em>Door -> Script </em></p>
          <p>То:</p>
          <ul>
            <li>код повторяется</li>
            <li>трудно всё менять</li>
            <li>легко запутаться</li>
            <li>игра начинает тормозить 😵</li>
          </ul>

      
     
      - type: text
        title: "🧠 Часть 2. Где скрипты живут «по-взрослому»"
        text: |
          <h4>🏢 ServerScriptService — главный мозг</h4>
          <p> game ─> ServerScriptService</p>
          <p><b>📌 Что здесь хранится</b></p>
          <ul>
            <li>правила игры</li>
            <li>очки</li>
            <li>победа / поражение</li>
            <li>кто выиграл</li>
            <li>кто проиграл</li>
          </ul>
          <p><b>👉 Один скрипт управляет всей игрой</b></p>


    

      - type: text
        title: "🧠 Аналогия (очень понятная)"
        text: |          
          <ul>
            <li>объекты — это <b>рабочие</b></li>
            <li>ServerScriptService — это <b>директор</b></li>
          </ul>
          <p>Рабочие делают действия, директор решает что это значит.</p>
          
          


      - type: text
        title: "🧩 Часть 3. Тогда зачем вообще скрипт в объекте?"
        text: |
          Хороший вопрос 👍
          <h4>🟢 Правильная схема</h4>
          <ul>
            <li>объект — замечает событие</li>
            <li>большой скрипт — принимает решение</li>
          </ul>

      - type: text
        title: "🔌 Часть 4. Как объект «общается» со скриптом"
        text: |
          Объекты <b>не говорят словами</b>, они <b>посылают сигналы</b>.
          <h4>В Roblox эти сигналы называются события.</h4>

      - type: codeBlock
        title: "⚡ Пример 1. Кубик сообщает: «меня тронули»"
        code: |
          cube.Touched:Connect(function(hit)
              print("Меня тронули!")
          end)
        afterText: |
          <h4>🧠 Что происходит</h4>
          <ul>
            <li>когда <b>кто-то трогает</b> кубик,</li>
            <li>кубик <b>посылает сигнал</b> «Меня тронули!»</li>
            <li>скрипт <b>слушает сигна</b>л и <b>выполняет код</b> внутри функции</li>
          </ul>
          <p.>👉 Кубик не думает — он сообщает</p.

      - type: codeBlock
        title: "⚡ Пример 2. Кнопка сообщает: «на меня нажали»"
        code: |
          button.ClickDetector.MouseClick:Connect(function(player)
              print("Кнопку нажали")
          end)
        
      - type: text
        title: "🧪 Мини-пример"
        text: |
          <h4>❌ Плохо</h4>
          <p>Каждая дверь сама решает, когда открываться</p><br>
          <h4>✅ Хорошо</h4>
          <p>Одна дверь сообщает, что её открыли (<b>«В меня постучали»</b>), а большой скрипт решает (<b>«Можно ли открыть»</b>), что делать дальше</p>

    end:
      - type: "text"
        title: "🟢 Итог урока"
        text: |
          <ul>
            <li>да, <b>скрипты МОЖНО класть в объекты</b></li>
            <li>но <b>это не главный способ</b></li>
            <li>большие правила живут в <b>ServerScriptService</b></li>
            <li>объекты <b>общаются со скриптами через событи</b>я</li>
            <li>один мозг лучше, чем 100 маленьких</li>
          </ul>
          <h4>Кубик не умный — он просто говорит, а главный скрипт решает, что делать.</h4>
   
  # ============================================================
  # УРОК 9 — Как обратиться к объекту в Roblox
  # ============================================================
  - id: 9
    title: "📘 Урок 9: Как обратиться к объекту в Roblox"
    shortDescription: "🟢 «Как код находит нужный объект?»"

    content:
      - type: text
        title: "Цель урока"
        text:
          - "Как сказать игре, с каким объектом работать"
          - "Как игра находит объекты: game.Workspace.Part"
          - "Научиться понимать:"
          - " <ul>
                <li>что такое <b>game</b></li>
                <li>что такое <b>Workspace</b></li>               
                <li>почему пишут <b>game.Workspace.Part</b></li>                
                <li>как <b>самому находить путь к объекту</b></li>
              </ul>"

      - type: text
        title: "🧩 Часть 1. Где живут объекты в Roblox?"
        text:
          - "🏠 <b>Вся игра — это</b> game"
          - "В Roblox <b>всё находится внутри game.</b>"
          - "Это как <b>большой дом</b>, в котором есть комнаты."

      - type: text
        title: "🌍 Комната с миром — Workspace"
        text: |
          Workspace — это <b>главная комната игры</b>, где:
          <ul>
            <li>бегают игроки</li>
            <li>стоят кубики</li>
            <li>находятся дома и платформы</li>
          </ul>
      - type: text
        title: "🟦 Кубик — Part"
        text:
          - "Part — это обычный <bкубик></bкубик>, который стоит в мире."

      - type: "gallery"
        title: "👀 Как это выглядит в Roblox Studio"
        images:
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module2/lesson7_1/module2_lesson7_struktura.png?raw=true"
            caption: ""
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module2/lesson7_1/module2_lesson7_1.png?raw=true"
            caption: ""
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module2/lesson7_1/%D0%A1%D0%BD%D0%B8%D0%BC%D0%BE%D0%BA%20%D1%8D%D0%BA%D1%80%D0%B0%D0%BD%D0%B0%202025-12-27%20%D0%B2%2006.36.14.png?raw=true"
            caption: "👉 Это и есть путь к кубику."
          

      - type: text
        title: "🧠 Часть 2. Почему пишут game.Workspace.Part"
        text: |
          Roblox <b>не угадывает</b>, что ты имеешь в виду.
          <p>Ему нужен <b>точный адрес</b>.</p>
          <p>📬 Как адрес дома: <b>Страна → Город → Улица → Дом</b></p>
          <p>🎮 В Roblox: <b>game → Workspace → Part</b></p>
          <p>Это значит: «Возьми Part, который находится в Workspace, который находится в game». </p>

      - type: text
        title: "✋ Почему нельзя просто написать Part?"
        text: |
          Потому что:
          <ul>
            <li>кубиков может быть <b>много</b></li>
            <li>Roblox спросит: 🤔 «Какой именно Part?»</li>
          </ul>
          А путь говорит точно.

      - type: text
        title: "🧩 Часть 3. Зачем писать local cube = game.Workspace.Part"
        text: |
          <p>Полный путь — длинный.</p>
          <p>Поэтому мы делаем короткое имя. <em>local cube = game.Workspace.Part</em></p>
          <p>Это значит: «Я буду называть game.Workspace.Part словом cube»</p>
          <p>Теперь можно писать просто: <em>cube.Transparency = 1</em></p>
          <p>👍 Удобно и понятно.</p>

      - type: text
        title: "📦 Часть 4. Другие примеры путей"
        text: |
          <p><b>🟦 Кубик с другим именем</b></p>
          <p>Если ты переименовал <b>Part</b> в <b>MagicCube:</b> <em>game.Workspace.MagicCube</em></p>

