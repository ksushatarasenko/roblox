  # ============================================================
  # УРОК 13 — Событие Touched
  # ============================================================
  - id: 13
    title: "⭐ Урок 13: Событие Touched: объект реагирует на прикосновение"
    shortDescription: "🟢 «Как объект может что-то почувствовать?»"

    content:
      - type: text
        title: "Цель урока"
        text:
          - "Научиться делать объекты интерактивными — реагирующими на прикосновение игрока."

      - type: text
        title: "🧠 Что такое Touched?"
        text: |
          <p>✋ Touched — <b>это сигнал:</b></p>
          <p><b>- «Меня кто-то коснулся!»</b></p>
          <p>Этот сигнал появляется, когда:</p>
          <ul>
            <li>игрок касается объекта;</li>
            <li>другой объект сталкивается с ним.</li>
          </ul>
          Событие Touched срабатывает, когда что-то касается объекта. Например — игрок.

      - type: text
        title: "Событие Touched — когда объект чувствует прикосновение"
        text: |
          Представь, что в игре у тебя есть волшебный куб.
          Если игрок его коснётся — куб может:
          <ul>
            <li>исчезнуть ✨</li>
            <li>изменить цвет 🎨</li>
            <li>подбросить игрока вверх 🚀</li>
            <li>включить звук 🔊</li>
            <li>или даже телепортировать куда-нибудь!</li>
          </ul>
          Чтобы сделать такие «реакции» в Roblox, существует специальное событие: <b>Touched</b>.

      - type: text
        title: "🧱 Где работает Touched"
        text: |
          <p>Событие <b>Touched</b> работает с любым объектом типа <b>Part</b> (куб, сфера, плоскость и т. д.), <b>MeshPart</b></p>
          <p>Когда кто-то касается этого объекта — срабатывает событие Touched.</p>
          <p>📦 Чаще всего скрипт лежит прямо в объекте: <b>Part -> Script</b></p>

          

      - type: code
        title: "🎯 Идея кода с Touched. 🧪 Самый простой пример"
        code: |
          local part = script.Parent

          part.Touched:Connect(function(hit)
              print("Ко мне прикоснулись!")
          end)
        afterText: |
          <h4>🧠 Разбираем по шагам</h4>
          <p>1. <span style="font-family: monospace;">script.Parent</span></b></p>
          <p>Мы говорим: «<b>part</b> — это объект, внутри которого лежит скрипт», 👉 это объект, в котором лежит скрипт (наш кубик)</p><br>
          <p>2. <span style="font-family: monospace;">part.Touched:Connect(function(hit)</span></b></p>
          <p>Мы говорим: «Когда кто-то коснётся <b>part</b>, выполни код внутри функции»</p><br>
          <p>3. <span style="font-family: monospace;">function(hit)</span></b></p>
          <p>Это начало функции — блока кода, который выполнится при касании. <b>hit</b> — это объект, который коснулся нашего кубика (обычно часть игрока: игрок, нога, другой кубик).</p><br>
          <p>4. <span style="font-family: monospace;">print("Ко мне прикоснулись!")</span></b></p>
          <p>Это код, который выполнится, когда кто-то коснётся кубика. В нашем случае — просто выведет сообщение в консоль.</p>

      - type: text
        title: "🗣 Как это происходит на самом деле"
        text:
          - "1. Игрок подходит и касается кубика."
          - "2. Кубик «говорит» скрипту: «Эй, меня коснулись!»"
          - "3. Скрипт «слушает» кубик и выполняет код внутри функции."
          - "4. В консоли появляется сообщение: «Ко мне прикоснулись!»"

      - type: text
        title: "👆 Как работает Touched?"
        text:
          - "Каждый объект в Roblox может «слушать» события."
          - "Мы пишем код, который говорит:"

      - type: quote
        text: "«Когда тебя коснутся — сделай вот это!»"

      - type: codeBlock
        title: "🛠 Пример структуры кода:"
        code: |
          object.touczed1:Connect(function(hit)
              -- команды, которые выполнятся при касании
          end)
        afterText:
          - "<b>object</b> — это твой куб, кнопка, шар и т. д."
          - " <b>hit</b> — тот объект, который тебя коснулся (обычно часть игрока)."

      - type: text
        text:
          - "Пример структуры кода:"
          - "<ul>
            <li>дверь открывается, когда игрок к ней подходит;</li>
            <li>монетка исчезает при сборе;</li>
            <li>кнопка нажимается.</li>
            </ul>"
          - "<b>Touched</b> — это событие, которое срабатывает, когда любой объект касается другого."
          - "Чаще всего — когда игрок касается детали (<b>Part</b>)."

      - type: gallery
        title: "Примеры объектов с событием Touched: кнопка, портал, лава."
        images:
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module2/lesson9/touczed1.jpg?raw=true"
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module2/lesson9/tuoczed2.jpeg?raw=true"
          - src: "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module2/lesson9/touczed3.jpeg?raw=true"

      - type: text
        title: "⚠️ Очень важный момент (для понимания)"
        text: |
          <p>Когда объект касается другого объекта, событие <b>Touched</b> срабатывает у <b>обоих объектов</b>.</p>
          <p>Например, если игрок коснётся кубика:</p>
          <ul>
            <li>у кубика сработает событие <b>Touched</b>;</li>
            <li>у части игрока (например, ноги) тоже сработает событие <b>Touched</b>.</li>
          </ul>
          <p>Но чаще всего мы пишем код только для объекта, который должен реагировать на прикосновение (например, кубика).</p> 
          <p>👉 Поэтому в нашем примере код находится внутри скрипта, который лежит в кубике.</p >  <br>
          <h4>Touched может срабатывать:</h4>
          <ul>
            <li>много раз;</li>
            <li>очень быстро</li>
            <li>даже когда игрок просто стоит на кубике</li>
          </ul>
          

      - type: text
        title: "🧪 Простой пример: куб исчезает при касании"
        text:
          - "Допустим, в Workspace есть деталь Part."

      - type: codeBlock
        title: "🛠 Пример структуры кода:"
        code: |
          local cube = game.Workspace.Part
              
          cube.Touched:Connect(function(hit)
              cube.Transparency = 1   -- делаем куб прозрачным
              cube.CanCollide = false -- через него можно проходить
          end)
        afterText:
          - "Теперь, если игрок коснётся куба — он станет невидимым! 👻"

      - type: code
        language: lua
        title: "🎨 Пример: куб меняет цвет при касании"
        code: |
          local cube = game.Workspace.Part

          cube.Touched:Connect(function(hit)
              cube.Color = Color3.new(1, 0, 1) -- ярко-розовый!
          end)
        afterText:
          - "Теперь куб реагирует цветом — как хамелеон 🦎✨"
          - "<b>cube </b>— это объект, который мы меняем."
          - "<b>Color3.new(1, 0, 1)</b> — розовый цвет."

      - type: code
        language: lua
        title: "🧍 Пример: реагирует только на игрока"
        code: |
          local cube = game.Workspace.Part

          cube.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")

              if humanoid then
                  print("Игрок коснулся куба!")
                  cube.Color = Color3.new(0, 1, 0) -- зелёный
              end
          end)
        text:
          - "Иногда куб касается других объектов — например, падающей детали."
          - "Мы можем проверить: коснулся именно игрок?"
        afterText:
          - "<b>Humanoid</b> есть только у персонажа игрока,"
          - "значит это точно человек, а не случайная вещь."

      - type: code
        language: lua
        title: "🚀 Пример: подбрасываем игрока вверх!"
        code: |
          local cube = game.Workspace.Part

          cube.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoidRootPart = character:FindFirstChild("HumanoidRootPart")

              if humanoidRootPart then
                  humanoidRootPart.Velocity = Vector3.new(0, 100, 0) -- прыжок!
              end
          end)
        text:
          - "Очень весёлая механика 🤩?"
        afterText:
          - "Игрок коснулся — и его подкинуло вверх 🎉"

      - type: steps
        title: "Попробуй сам!"
        items:
          - "Создай блок TouchBlock."
          - "Поставь на платформу."
          - "Добавь внутрь Script."

      - type: code
        language: lua
        title: "Код реакции на касание"
        code: |
          local block = script.Parent

          block.Touched:Connect(function(hit)
              print("Кто-то коснулся куба!")
          end)
        afterText: |
          <h4>Проверяем работу</h4>
          <ul>
            <li>Запусти игру</li>
            <li>Коснись блоком игрока</li>
            <li>Посмотри в Output</li>
          </ul><br>
          <h4>Узнаём, кто коснулся блока</h4>
          <ul>
            <li>`print(hit.Name)`</li>
            <li>Посмотри в Output</li>
          </ul>   

      

      - type: text
        title: "Что важно запомнить"
        text:
          - "<b>Touched</b> — одно из самых важных событий."
          - "Даёт возможность делать <em>ловушки, порталы, кнопки и интерактивные объекты.</em>"

    quiz:
      - question: "Что делает Touched?"
        answers:
          - "Меняет цвет блока"
          - "Запускает код при прикосновении"
          - "Удаляет блок"
        correct: 1

      - question: "Что передаётся в переменной hit?"
        answers:
          - "Цвет блока"
          - "Объект, который прикоснулся"
          - "Название мира"
        correct: 1

    end:
      - type: "text"
        title: "🟢 Итог урока"
        text: |
          <ul>
            <li>событие <b>Touched</b> позволяет объектам реагировать на прикосновения;</li>
            <li>код внутри функции выполняется при касании;</li>
            <li>переменная <b>hit</b> содержит объект, который коснулся;</li>
            <li>объект <b>не думает</b>, он сообщает</li>
            <li>скрипт <b>реагирует</b></li>
          </ul> 
  # ============================================================
  # УРОК 14 — Условия if
  # ============================================================
  - id: 14
    title: "⭐ Урок 10: Условия if: разные реакции на прикосновения"
    shortDescription: "🟢 «Как код выбирает, что делать?»"

    content:
      - type: text
        title: "Цель урока"
        text:
          - "Научиться выполнять код только при определённых условиях."

      - type: text
        title: "Условия if — разные реакции на прикосновения"
        text: |
          В прошлом уроке мы узнали, что объект может реагировать на прикосновение с помощью события <b>Touched</b>.

          Но что, если нам нужно:

            <ul>
              <li>менять цвет <em>только</em> если игрок коснулся 🎨</li>
              <li>подбрасывать <em>только</em> если объект называется «JumpPad» 🦘</li>
              <li>давать очки <em>только</em> если игрок — правильный персонаж</li>
              <li>исчезать <em>только</em> если куб красный?</li>
            </ul>  
          Вот тут в дело входят <b>условия if</b>.

      - type: text
        title: "🎯 Что такое if?"
        text: |
          if — это как проверка.
          Представь, что мама говорит:
      - type: quote
        text: "«Если ты сделал уроки — можешь играть.»"
      - type: text
        text: |
          То есть:
          <ul>
            <li>условие: сделал уроки</li>
            <li>действие: играешь</li>
          </ul>
      - type: code
        language: lua
        code: |
          if условие then
              действие
          end
        text: "В программировании if делает то же самое:"

      - type: text
        title: "Зачем нужен IF?"
        text: "IF означает: если что-то произошло → сделать действие."
      - type: code
        language: lua
        title: "🍎 Простой пример"
        code: |
          local x = 5

          if x > 3 then
              print("x больше 3")
          end
        afterText:
          - "Компьютер проверяет условие и выполняет код, если оно истинно (правда)."
          - "Код выполнится только если условие (x > 3) — правда."

      - type: text
        title: "🧱 Используем if вместе с Touched"
        text: "Теперь сделаем разные реакции на прикосновения."

      - type: code
        language: lua
        title: "🟢 Пример 1: реагируем только на игрока"
        code: |
          local cube = game.Workspace.Part

          cube.Touched:Connect(function(hit)
              local char = hit.Parent
              local humanoid = char:FindFirstChild("Humanoid")

              if humanoid then
                  print("Это игрок!")
                  cube.Color = Color3.new(0, 1, 0) -- зелёный
              end
          end)
        afterText: "➡ if проверяет: коснулся именно игрок?"

      - type: code
        language: lua
        title: "🎨 Пример 2: меняем цвет в зависимости от имени прикоснувшегося объекта"
        code: |
          local cube = game.Workspace.Part

          cube.Touched:Connect(function(hit)
              if hit.Name == "LeftFoot" then
                  cube.Color = Color3.new(1, 0, 0) -- красный
              end

              if hit.Name == "RightFoot" then
                  cube.Color = Color3.new(0, 0, 1) -- синий
              end
          end)
        afterText:
          - "Левая нога тронула → красный"
          - "Правая нога → синий"
          - "Забавно, правда? 😊"

      - type: code
        language: lua
        title: "🚀 Пример 3: куб подбрасывает игрока, если куб — JumpPad"
        code: |
          local cube = script.Parent  -- скрипт внутри куба

          cube.Touched:Connect(function(hit)
              if cube.Name == "JumpPad" then
                  local char = hit.Parent
                  local root = char:FindFirstChild("HumanoidRootPart")

                  if root then
                      root.Velocity = Vector3.new(0, 80, 0)
                  end
              end
          end)
        afterText:
          - "➡ Куб работает как батут только если он называется <b>JumpPad</b>."

      - type: code
        language: lua
        title: "💥 Пример 4: куб исчезает, если его коснулся игрок"
        code: |
          llocal cube = game.Workspace.Part

          cube.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              if humanoid then
                  cube.Transparency = 1
                  cube.CanCollide = false
              end
          end)

      - type: code
        language: lua
        title: "🎮 Пример 5: разные действия при разных условиях"
        code: |
          local cube = game.Workspace.Part

          cube.Touched:Connect(function(hit)
              local char = hit.Parent
              local humanoid = char:FindFirstChild("Humanoid")

              if humanoid then
                  cube.Color = Color3.new(0, 1, 0) -- зелёный
                  print("Игрок коснулся!")
              else
                  cube.Color = Color3.new(1, 0, 0) -- красный
                  print("Это НЕ игрок!")
              end
          end
        afterText:
          - "<b>➡ if … else</b> позволяет выбрать одно из двух действий."

      - type: steps
        title: "Шаг 1. Создаём объект"
        items:
          - "Создай блок TriggerBlock."
          - "Добавь внутрь Script."

      - type: steps
        title: "Шаг 2. Код из урока 8"
        items:
          - "`local block = script.Parent`"
          - "`block.Touched:Connect(function(hit)`"
          - "    print(hit.Name)"
          - "end)`"

      - type: steps
        title: "Шаг 3. Добавляем условие"
        items:
          - '`if hit.Name == "LeftFoot" then`'
          - '    print("Игрок наступил на блок!")'
          - "end"
          - "Сообщение выводится только если касается нога."

      - type: steps
        title: "Шаг 4. Условие для игрока"
        items:
          - '`if hit.Parent:FindFirstChild("Humanoid") then`'
          - '    print("К блоку прикоснулся игрок!")'
          - "end"

      - type: text
        title: "Что важно запомнить"
        text:
          - "<b>Условия</b> позволяют делать умные объекты: кнопки, бонусы, ловушки."
      - type: text
        title: "Мини-задание"
        text: "Сделай: если игрок коснулся куба → показать 'Привет!'"

    quiz:
      - question: "Что делает конструкция if?"
        answers:
          - "Повторяет код много раз"
          - "Запускает код только если условие верно"
          - "Удаляет объект"
        correct: 1

      - question: "Как проверить, что блок коснулся игрок?"
        answers:
          - "if hit.Color == Red then"
          - 'if hit.Parent:FindFirstChild("Humanoid") then'
          - "if hit == Workspace then"
        correct: 1

  # ============================================================
  # УРОК 15 — ELSE — что делать, если НЕ сработало?
  # ============================================================

  - id: 15
    title: "📘 Урок 15: ELSE — что делать, если иначе?"
    shortDescription: " Учимся реагировать на разные ситуации."
    content:
      - type: text
        text: "В прошлом уроке мы познакомились с if — командой, которая говорит:"
      - type: quote
        text: "«Если условие верно — выполни этот код»."
      - type: text
        text: |
          Но что делать, если <b>условие НЕ выполнено</b>?
          Например:
            <ul>
              <li>Игрок НЕ коснулся куба</li>
              <li>Цвет НЕ красный</li>
              <li>Имя объекта НЕ "Coin"</li>
              <li>Число НЕ больше 10</li>
            </ul>
          Для таких случаев существует волшебное слово <b>else</b>.

      - type: text
        title: "🎯 Что такое else?"
        text: |
          Представь, ты говоришь роботу:
      - type: quote
        text:
          - "«Если ты увидишь яблоко — возьми его."
          - "<b>А если нет</b> — просто иди дальше.»"
      - type: text
        text: "Вот <b>если нет</b> — это и есть <b>else<b/>."

      - type: code
        language: lua
        title: "Пример структуры:"
        code: |
          if условие then
              действие_1
          else
              действие_2
          end
        afterText: |
          <ul>
            <li><b>if<b/> — что делать, когда условие <em>выполнено</em></li>
            <li><b>else</b> — что делать, <em>когда условие не выполнено</em></li>
          </ul>

      - type: code
        title: "🍪 Простой пример"
        code: |
          local number = 5

          if number > 10 then
              print("Число большое!")
          else
              print("Число маленькое!")
          end
        afterText: "Поскольку 5 НЕ больше 10 — запускается <b>else</b>."

      - type: text
        title: "🧱 Используем else вместе с Touched"
        text: "Теперь посмотрим в Roblox Studio, как else помогает отличать игрока от других объектов."

      - type: code
        title:
          - "🟢 Пример 1: если коснулся игрок — зелёный"
          - "🔴 Если НЕ игрок — красный"
        code: |
          local cube = game.Workspace.Part

          cube.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")

              if humanoid then
                  cube.Color = Color3.new(0, 1, 0)  -- зелёный
                  print("Игрок коснулся")
              else
                  cube.Color = Color3.new(1, 0, 0)  -- красный
                  print("Это не игрок")
              end
          end)
        afterText: "👉 Суперпонятная проверка: «игрок или не игрок?»"
      
      - type: code
        title: "💥 Пример 2: куб исчезает при прикосновении игрока, а если НЕ игрок — издаёт звук"
        code: |
          local cube = game.Workspace.Part
          local sound = cube.Sound

          cube.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              if humanoid then
                  cube.Transparency = 1
                  cube.CanCollide = false
              else
                  sound:Play()
              end
          end)
      - type: code
        title: "🎨 Пример 3: разные цвета для разных случаев"
        code: |
          local cube = game.Workspace.Part

          cube.Touched:Connect(function(hit)
              if hit.Name == "LeftFoot" then
                  cube.Color = Color3.new(1, 1, 0)  -- жёлтый
              else
                  cube.Color = Color3.new(0, 0, 1)  -- синий
              end
          end)
        afterText: 
          - "Если коснулась левая нога → жёлтый"
          - "Если что-то другое → синий"

      - type: code
        title: "🪙 Пример 4: монетка даёт очки, иначе — просто печатает сообщение"
        code: |
          local coin = game.Workspace.Coin

          coin.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              if humanoid then
                  print("Игрок получил монетку!")
                  coin:Destroy()
              else
                  print("Это не игрок, монетка остаётся.")
              end
          end)
      
      - type: text
        title: '🧩 Мини-задание (квест!)'
        text: |
          Сделай куб, который:
            <ol>
              <li>Если коснулся игрок → становится прозрачным </li>
              <li>Если НЕ игрок → меняет цвет на случайный 🎲 </li>


      - type: hint
        title: "Подсказка 👉"
        code: |
          local cube = game.Workspace.Part

          cube.Touched:Connect(function(hit)
              local humanoid = hit.Parent:FindFirstChild("Humanoid")

              if humanoid then
                  cube.Transparency = 1
              else
                  cube.Color = Color3.new(math.random(), math.random(), math.random())
              end
          end)

      - type: text
        title: "🎉 Итог урока"
        text: |
          Теперь ты умеешь:
          <ul>
            <li>использовать else </li>
            <li>делать разные реакции в зависимости от условий </li>
            <li>разделять действия: «если верно» и «если нет» </li>
            <li>создавать в игре более умную и интересную логику!</li>
          </ul>

  # ============================================================
  # УРОК 16 — Функции
  # ============================================================
  - id: 16
    title: "📘 Урок 16: Функции: создаём команды, которые можно вызывать"
    shortDescription: "Учимся создавать свои функции и понимать, зачем они нужны."

    content:
      - type: text
        title: "Цель урока"
        text:
          - "Понять, что такое функция в Lua и научиться её вызывать."

      - type: text
        text: |
          Представь, что ты каждый день говоришь роботу:
          <ul>
            <li>«Открой дверь» </li>
            <li>«Подними куб» </li>  
            <li>«Сделай свет ярче» </li>  
          </ul>
          И каждый раз тебе приходится объяснять всё заново 😩
          Это неудобно, правда?

          А функция — это когда ты один раз объяснил, и теперь можешь звать свою команду по имени.
          Функция — как кнопка, на которой написано:
      - type: quote
        text: "«Сделай вот это!»"

      - type: text
        title: "🎮 Что такое функция?"
        text: 
          - "Функция — это команда, которую ты создаёшь сам. Она выполняет действия, когда ты её вызываешь."
          - "Функция — это набор команд, который можно запускать когда угодно, сколько угодно раз."

      - type: code
        language: lua
        title: "Функция создаётся так:"
        code: |
          local function hello()
              print("Привет!")
          end

          hello()
      - type: code
        text: "А потом ты просто вызываешь её:"
        code: |
          имяФункции()
      - type: code
        title: "🍩 Простой пример"
        code: |
          local function sayHello()
              print("Привет!")
          end

          sayHello()  -- вызываем
        afterText: "В Output появится:"
      - type: quote
        text: "Привет!"
      - type: text
        title: "Ты как будто сказал компьютеру:"
        text: "«Эй, функция, выполняй!» 😄"

      

      - type: code
        title: "🧪 Пример: функция меняет цвет куба"
        code: |
          local cube = game.Workspace.Part

          local function makeRed()
              cube.Color = Color3.new(1, 0, 0)
          end

          makeRed()  -- куб стал красным

      - type: code
        title: "🎨 Пример: случайный цвет"
        code: |
          local cube = game.Workspace.Part

          local function randomColor()
              cube.Color = Color3.new(math.random(), math.random(), math.random())
          end

          randomColor()
          randomColor()
          randomColor()
        afterText: "Каждый вызов — новый цвет! 🌈"

      - type: code
        title: "🤖 Функции + Touched = магия реакции"
        text: "Ты можешь вынести реакцию на прикосновение в отдельную функцию:"
        code: |
          local cube = game.Workspace.Part

          local function onTouch()
              cube.Color = Color3.new(0, 1, 0) -- зелёный
              print("Коснулись!")
          end

          cube.Touched:Connect(function()
              onTouch()  -- вызываем нашу функцию
          end)
        afterText: "Функция делает игру аккуратнее и понятнее 🚀"
      
      - type: text
        title: "Функция с параметром"
        text: |
          (как передавать внутрь данные)

          Представь, что ты говоришь роботу:
        
      - type: quote
        text: 
          - "«Перекрась куб в красный!»"
          - "«Перекрась куб в синий!»"

      - type: code
        text: |
          Но это же одна и та же команда — просто цвет разный.
          Функция может принимать параметры:
        code: |
          local function paint(color)
              cube.Color = color
          end

          paint(Color3.new(1, 0, 0))  -- красный
          paint(Color3.new(0, 1, 0))  -- зелёный
          paint(Color3.new(0, 0, 1))  -- синий
        afterText: 
         - "Теперь одна функция — много возможностей 🎉"
         - "<b>Параметр</b> — это информация, которую функция получает."


      - type: code
        language: lua
        title: "Функция с параметром"
        code: |
          local function say(text)
              print(text)
          end

          say("Я учусь в Roblox!")
      
      - type: code
        title: "🦘 Пример функции, которая подбрасывает игрока"
        code: |
          local function launch(character)
              local root = character:FindFirstChild("HumanoidRootPart")
              if root then
                  root.Velocity = Vector3.new(0, 100, 0)
              end
          end

          cube.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")

              if humanoid then
                  launch(character) -- вызываем функцию
              end
          end)
        afterText: "Теперь подбрасывание — это всего лишь один вызов!"

      - type: steps
        title: "Шаг 1. Создаём Script"
        items:
          - "Создай блок FunctionBlock."
          - "Добавь внутрь Script."

      - type: steps
        title: "Шаг 2. Простая функция"
        items:
          - "`local function sayHello()`"
          - '    `print("Привет!")`'
          - "`end`"

      - type: steps
        title: "Шаг 3. Вызываем функцию"
        items:
          - "`sayHello()`"
          - "В Output появится 'Привет!'."

      - type: steps
        title: "Шаг 4. Функция с параметром"
        items:
          - "`local function say(text)`"
          - "    `print(text)`"
          - "`end`"
          - '`say("Это работает!")`'

      - type: steps
        title: "Шаг 5. Меняем объект через функцию"
        items:
          - "`local block = script.Parent`"
          - "`local function makeRed()`"
          - "    `block.Color = Color3.fromRGB(255,0,0)`"
          - "`end`"
          - "`makeRed()`"

      - type: text
        title: "Что важно запомнить"
        text:
          - "Функции помогают сокращать код и делают его понятным."

      - type: text
        title: "🧩 Мини-задание (квест!)"
        text: |
          Сделай:
          <ol>
            <li> Функцию flash(), которая:
              <ul>
                <li>красит куб в случайный цвет 🎲 </li>
                <li>двигает его на 1 студ вверх </li>
              </ul>
            </li>
            <li>Срабатывает при прикосновении игрока. </li>
          </ol>
      - type: hint
        title: '👉 Подсказка'
        code: |
          local cube = game.Workspace.Part

          local function flash()
              cube.Color = Color3.new(math.random(), math.random(), math.random())
              cube.Position += Vector3.new(0, 1, 0)
          end

          cube.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  flash()
              end
          end)


    quiz:
      - question: "Что такое функция?"
        answers:
          - "Команда, которая повторяется много раз"
          - "Команда, которую можно вызвать"
          - "Имя переменной"
        correct: 1

      - question: "Что делает параметр функции?"
        answers:
          - "Передаёт данные внутрь функции"
          - "Удаляет функцию"
          - "Запрещает запуск кода"
        correct: 0

  # ============================================================
  # УРОК 17 — Мини-проект "Волшебный куб"
  # ============================================================
  - id: 17
    title: "🎉 Урок 17: Мини-проект: Волшебный куб"
    shortDescription: "🟢 «Как всё это собрать в игру?». Создаём интерактивный куб, который реагирует на игрока: меняет цвет, размер и телепортируется."

    content:
      - type: text
        title: "Цель проекта"
        text:
          - "Создать объект, который реагирует на игрока: меняет цвет, увеличивается и телепортируется."

      - type: gallery
        title: "Примеры волшебных кубов"
        images:
          - "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module2/lesson13/magCube1.jpeg?raw=true"
          - "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module2/lesson13/magCube2.png?raw=true"

      - type: steps
        title: "Куб должен:"
        items:
          - "меняет цвет 🎨"
          - "увеличивается 📦"
          - "телепортируется ✨"
          - "говорит «Привет!» в Output 💬"

      - type: steps
        title: "🟦 Шаг 1. Создаём куб"
        items:
          - "В Roblox Studio создай Part → Block"
          - "Назови его Cube"
          - "Размер: 4×4×4."
          - "Добавь Script внутрь."
      - type: gallery
        images:
          - "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module2/lesson13/magCube3.png?raw=true"
          - "https://github.com/ksushatarasenko/roblox-course-assets/blob/main/module2/lesson13/magCube4.png?raw=true"

      - type: code
        title: "🧩 Шаг 2. Переменные"
        code: |
          local cube = script.Parent
        afterText: "Это связывает скрипт с объектом (кубом), чтобы мы могли им управлять."

      - type: code
        title: "🎨 Шаг 3. Функция случайного цвета"
        code: |
          local function changeColor()
              cube.Color = Color3.fromRGB(
                  math.random(0,255),
                  math.random(0,255),
                  math.random(0,255)
              )
          end
        afterText: "Каждый раз — новый цвет! 🌈"

      - type: code
        title: "📦 Шаг 4. Функция увеличения размера"
        code: |
          llocal function grow()
              cube.Size = cube.Size + Vector3.new(1,1,1)
          end
        afterText: Куб «пухнет», как будто вдохнул магию ✨

      - type: code
        title: "✨ Шаг 5. Функция телепорта"
        code: |
          local function teleport()
              cube.Position = cube.Position + Vector3.new(
                  math.random(-10,10),
                  0,
                  math.random(-10,10)
              )
          end
        afterText: "Куб прыгает на случайное место вокруг себя — забавно 😄"
     

      - type: code
        title: "🔮 Шаг 6. Реакция на прикосновение игрока"
        code: |
          cube.Touched:Connect(function(hit)
              if hit.Parent:FindFirstChild("Humanoid") then
                  print("Привет!")
                  changeColor()
                  grow()
                  teleport()
              end
          end)
        afterText: "Теперь куб — живой! Он чувствует игрока и делает магию 💫"

      - type: code
        language: lua
        title: "📘 Пример готового решения"
        code: |
          local block = script.Parent

          local function magic()
              print("Привет!")
              block.Color = Color3.fromRGB(0, 255, 0)
              block.Size = Vector3.new(6, 6, 6)
              wait(2)
              block.Size = Vector3.new(3, 3, 3)
          end

          block.Touched:Connect(magic)

      - type: text
        title: "🔧 Что можно улучшить? (Идеи апгрейдов!)"
        text:
          - "Вот крутые фишки, которые можно добавить:"

      - type: text        
        title: "🌟 1. Частицы"
        text: "Добавь <b>ParticleEmitter</b>, который включается при касании."
      - type: code
        language: lua
        title: "🔊 2. Звук"
        text: Сделай смешной «поп» или «магический звон»
        code: |
          cube.Sound:Play()
      - type: text
        title: "🏃 3. Куб убегает от игрока"
        text: "При прикосновении телепортируйся дальше, например на 20 студий."
      - type: code
        language: lua
        title: "🌀 4. Эффект «крутящегося куба»"
        text: "В цикле плавно поворачивай его:"
        code: |
          cube.Orientation += Vector3.new(0,5,0)
      - type: code
        language: lua
        title: "⏳ 5. Возвращение к нормальному размеру"
        text: "После роста:"
        code: |
          wait(2)
          cube.Size = Vector3.new(4,4,4)
      - type: text
        title: "💥 6. Прыгающий куб"
        text: "Добавь силу прыжка через BodyVelocity."
      

    quiz:
      - question: "Что делает функция changeColor?"
        answers:
          - "Уменьшает куб"
          - "Меняет цвет куба"
          - "Телепортирует куб"
        correct: 1

      - question: "Зачем проверяем Humanoid?"
        answers:
          - "Чтобы куб реагировал только на игрока"
          - "Чтобы изменить цвет игрока"
          - "Чтобы остановить игру"
        correct: 0
    end:
      - type: text
        title: "🎉 Молодец!"
        text:
          - "Ты создал первый настоящий игровой объект с поведением и логикой."
          - "Теперь ты не просто пользователь Roblox — ты создатель! 🚀"
    