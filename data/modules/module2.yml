 # ============================================================
  # УРОК 10 — script.Parent — кто я и где я живу
  # ============================================================
  - id: 10
    title: "📘 Урок 10: script.Parent — кто я и где я живу"
    shortDescription: "🟢 «Как код понимает, где он сам?»"

    content:
      - type: text
        title: "Цель урока"
        text:
          - "Понять, что такое script.Parent"
          - "Научиться находить объект, внутри которого лежит скрипт"
          - "Понять, как использовать script.Parent в коде"

      - type: text
        title: "🧠 Самое простое объяснение"
        text: |
          <span style="font-family: monospace;">script.Parent</span> — это объект, ВНУТРИ которого лежит скрипт
          <p>Если скрипт лежит в кубике (Part), то <b>script.Parent</b> — это тот самый кубик.</p>
          <p>Если скрипт лежит в кнопке (Button), то <b>script.Parent</b> — это та самая кнопка.</p>
          <p>Если скрипт лежит в доме (Model), то <b>script.Parent</b> — это тот самый дом.</p><br>
          <h4>Скрипт как будто говорит: «Я живу вот тут ⬆️ и хочу работать с этим объектом»</h4>

          
      - type: code
        title: "Пример использования script.Parent"
        code: |
          local block = script.Parent

          part.Transparency = 0.5
        afterText: |
          <h4>🧠 Что здесь происходит</h4>
          <ul>
            <li>скрипт смотрит вверх</li>
            <li>видит: «Я лежу в Part»</li>
            <li>получает этот Part</li>
            <li>меняет его прозрачность</li>
          </ul><br>
          <h4>🗣 Как объяснить одной фразой</h4>
          <p>«<span style="font-family: monospace;">script.Parent</span> — это предмет, в котором живёт скрипт»</p>

      

      - type: text
        title: " 🧩 Почему это очень удобно"
        text: |
          <h4>❌ Плохо (жёстко привязано)</h4>
          <code>local block = game.Workspace.MyBlock</code>
          <p>Если ты переименуешь MyBlock или переместишь его — код сломается.</p><br>
          <h4>✅ Хорошо (гибкое)</h4>
          <code>local block = script.Parent</code>
          <p>Код всегда будет работать, потому что скрипт всегда знает, где он живёт, работает с любым объектом, можно копировать скрипт в другие Parts</p>

      - type: text
        title: "🔄 Если скрипт переложить в другой объект"
        text: |
          <p>Если ты скопируешь скрипт в другой объект (например, в другой кубик),</p>
          <p>то <b>script.Parent</b> автоматически станет новым объектом.</p>
          <p>Это очень удобно для создания универсальных скриптов!</p>
          <p>Код менять не нужно 🎉</p>
      - type: text
        title: "🧠 Аналогия из жизни"
        text: |
          <p><em>Скрипт</em> — это: житель дома 🏠</p>
          <p><em>Parent</em> — это: дом, в котором он живёт</p>
          <p>Если житель переезжает в другой дом,</p>
          <p>то его дом автоматически меняется на новый.</p>  
          <p>Если житель переехал — он всё равно говорит: «Вот мой дом»</p>

      - type: text
        title: "⚠️ Важный момент"
        text: |
          <p><span style="font-family: monospace;">script.Parent</span> — это НЕ всегда Part</p>
          <p>Это может быть любой объект: Model, Folder, Tool и т.д.</p>
          <p>Важно понимать, в каком объекте лежит скрипт, чтобы правильно с ним работать.</p>
          <p>👉 Всё зависит от того, где лежит скрипт</p>
      - type: text
        title: "🎒 Мини-задание"
        text: |
          <ol>
            <li>Создай 2 Part</li>
            <li>Вставь один и тот же Script в оба</li>
            <li>В коде напиши:
              <pre>print(script.Parent.Name)</pre>
            </li>
            <li>Запусти игру и посмотри, что выведется в консоль</li>
            <li>Объясни, почему скрипт выводит разные имена</li>  
          </ol>


  # ============================================================
  # УРОК 11 — Переменные. Управляем объектами через код
  # ============================================================
  - id: 11
    title: "📘 Урок 11: Переменные. Управляем объектами через код"
    shortDescription: "🟢 «Как код запоминает объект?»"

    content:
      - type: text
        title: "Цель урока"
        text:
          - "Понять, что такое переменная, научиться менять свойства объектов через код."

      - type: text
        title: "Начнем!"
        text:
          - "Представь, что в игре у тебя есть сундук с сокровищами."
          - "Чтобы не писать каждый раз 'тот большой коричневый сундук возле дерева',"
          - "ты можешь дать ему короткое имя, например: <b>сундук</b>."
          - <br>
          - "Вот это короткое имя в программировании и называется <b>переменной</b>!"

      - type: text
        title: "🎒 Что такое переменная?"
        text:
          - "<b>Переменная — это коробочка, в которой хранится информация: число, текст, цвет.</b>"
          - "Ты даёшь коробочке имя → и потом можешь использовать это имя в коде."
          - "<b>W jednym pudełku może być:</b>"
          - "<ul><li>liczba (np. 5, 10, 100)</li><li>tekst (np. „Hello”)</li><li>informacja prawda / fałsz</li>"
      - type: text
        title: "🧠 Dlaczego to takie ważne?"
        text:
          - "Bo świat czyta informacje i robi dokładnie to, co one mówią"
          - "Bez pudełek świat nie ma pamięci, a bez pamięci nie ma myślenia"
          - "W programowaniu takie pudełko na informacje ma bardzo ważną nazwę: <b>variable</b>"
          - "Po polsku: <b>zmienna</b>"

      - type: code
        language: lua
        title: "Пример переменной"
        code: |
          local score = 10
          print(score)
      - type: text
        title: "Объяснение"
        text: 'Мы создали переменную <b style="color: rgba(9, 167, 4, 1);">score</b> и положили туда число 10. print(score) показывает её значение.'

      - type: code
        language: lua
        title: "Переменная-текст"
        code: |
          local money = "100"
        text: |
          Здесь:
          <ul>
              <li>money — имя коробочки,</li>
              <li>100 — что лежит внутри.</li>
          </ul> 
          Теперь, когда тебе нужно узнать, сколько у тебя денег,
          ты просто обращаешься к переменной money.

      - type: text
        title: "📦 Зачем нужны переменные?"
        text: |
          Чтобы:
          <ul>
            <li>хранить данные (очки, здоровье, скорость);</li>
            <li>управлять объектами;</li>
            <li>сокращать длинные команды;</li>
            <li>делать код понятным и красивым 🌟.</li>
          </ul>
      - type: text
        title: "🧱 Переменные + объекты Roblox = Магия!"
        text: |
          Теперь самое интересное!  
          Мы можем положить в переменную **целый объект**, например куб (Part).

      - type: text
        title: "✨ Пример:"
        text: |
          Допустим, у тебя в Workspace есть куб по имени **Part**.

          Создаём переменную, в которую положим куб:

      - type: code
        language: lua
        title: ""
        code: |
          local cube = game.Workspace.Part

      - type: text
        text: |
          Теперь **cube** — это тот самый куб.  
          И мы можем менять его свойства, как будто управляем им с пульта дистанционного управления 🎮.

      - type: codeBlock
        title: "🛠 Пример: меняем цвет куба"
        code: |
          local cube = game.Workspace.Part

          cube.Color = Color3.new(1, 0, 0)   -- красный цвет
        afterText: "Куб станет красным! ❤️"

      - type: codeBlock
        title: "🚀 Пример: двигаем куб"
        code: |
          local cube = game.Workspace.Part

          cube.Position = Vector3.new(0, 10, 0)
        afterText: "Теперь куб окажется высоко над землёй, будто прыгнул! 🦘"

      - type: text
        title: "💡 Что означают странные слова?"
        text: |
          <ul>
              <li><b>Color3.new(r, g, b)</b> — цвет в формате RGB (каждое число — это значение от 0 до 1).</li>
              <li><b>Vector3.new(x, y, z)</b> — позиция объекта в 3D-пространстве.</li>
          </ul>

          Это как координаты на карте, только для кубика.

      - type: code
        title: "🎮 Мини-задание"
        text: |
          Попробуй сам написать скрипт, который:
           <ol>
            <li>Находит куб в Workspace</li>
            <li>Красит его в зелёный 🌿</li>
            <li>Поднимает вверх</li>
          </ol>
           Подсказка:
        code: |
          local cube = game.Workspace.Part

          cube.Color = Color3.new(0, 1, 0)
          cube.Position = Vector3.new(0, 20, 0)

      - type: text
        title: "🎉 Итог урока"
        text: |
          Сегодня ты узнал(а): 
          <ul>
            <li>что такое переменные — «коробочки» для данных 📦</li>
            <li>как положить в них объект</li>
            <li>как менять свойства объекта через код</li>
            <li>что с помощью переменных ты становишься хозяином игры!</li>
          </ul>

    quiz:
      - question: "Что делает команда local block = script.Parent?"
        answers:
          - "Создаёт новый объект"
          - "Запоминает ссылку на объект, внутри которого находится Script"
          - "Удаляет блок"
        correct: 1

      - question: "Как изменить цвет объекта?"
        answers:
          - "block.Color = Color3.fromRGB(...)"
          - "block.Transparency = 0.5"
          - "print(block)"
        correct: 0

