# УРОК 58 — Двери и зоны, которые открываются за монеты
# ============================================================
  - id: 58
    title: "⭐ Урок 58. Двери и зоны, которые открываются за монеты"
    shortDescription: "Учимся использовать монеты как условие: открывать двери и зоны."
    # video: "https://www.youtube.com/embed/DOORS58"

    content:
      - type: "text"
        text: |
          Монеты становятся <b>настоящей силой</b>,<br>
          когда они что-то открывают 🚪✨<br><br>
          Игрок думает:<br>
          «Мне нужно ещё 2 монеты!»<br>
          «А что за этой дверью?»<br><br>
          Сегодня мы научимся делать<br>
          <b>двери и зоны, которые открываются за монеты</b>.

      - type: "text"
        title: "🎯 Игровая идея"
        text: |
          Монеты → это <b>условие</b>.<br><br>
          Если монет достаточно — путь открыт.<br>
          Если нет — нужно исследовать дальше.<br><br>
          Это делает игру:<br>
          🎮 осмысленной<br>
          🧠 логичной<br>
          🎯 мотивирующей

      - type: "steps"
        title: "🧱 Шаг 1. Создаём дверь"
        items:
          - "Создай <b>Part</b> → назови <b>CoinDoor</b>"
          - "Размер — как настоящая дверь"
          - "Anchored = true"
          - "CanCollide = true"
          - "Цвет — любой (например, синий)"

      - type: "text"
        title: "🪙 Шаг 2. Проверяем количество монет"
        text: |
          Нам нужно:<br>
          • узнать, сколько монет у игрока<br>
          • сравнить с нужным числом<br>
          • открыть дверь, если монет хватает

      - type: "code"
        title: "✨ Код двери за монеты"
        code: |
          local door = script.Parent
          local REQUIRED_COINS = 5

          door.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")

              if humanoid then
                  local player = game.Players:GetPlayerFromCharacter(character)
                  if player and player:FindFirstChild("Coins") then

                      if player.Coins.Value >= REQUIRED_COINS then
                          print("Дверь открыта!")
                          door.CanCollide = false
                          door.Transparency = 0.6
                      else
                          print("Недостаточно монет!")
                      end

                  end
              end
          end)
        afterText: |
          👉 Если монет хватает — дверь становится проходимой.<br>
          👉 Если нет — путь закрыт.

      - type: "text"
        title: "🚧 Зона вместо двери"
        text: |
          Вместо двери можно использовать зону:<br>
          • телепорт<br>
          • проход в новую комнату<br>
          • доступ к награде<br><br>
          Логика будет <b>точно такой же</b>.

      - type: "text"
        title: "🧪 Мини-квест"
        text: |
          Попробуй сделать:<br><br>
          1️⃣ Дверь, которая исчезает навсегда<br>
          2️⃣ Дверь, которая тратит монеты<br>
          3️⃣ Зону, которая телепортирует, если монет хватает<br>
          4️⃣ Дверь с подсказкой «Нужно 5 монет»

    quiz:
      - question: "Зачем использовать монеты как условие?"
        answers:
          - "Для красоты"
          - "Чтобы направлять игрока"
          - "Чтобы ускорить игру"
        correct: 1

      - question: "Что проверяет дверь перед открытием?"
        answers:
          - "Цвет игрока"
          - "Количество монет"
          - "Скорость игрока"
        correct: 1

      - question: "Что делает CanCollide = false?"
        answers:
          - "Удаляет дверь"
          - "Позволяет пройти сквозь дверь"
          - "Меняет цвет двери"
        correct: 1

      - question: "Где хранятся монеты игрока?"
        answers:
          - "В Workspace"
          - "В Player как IntValue"
          - "В монете"
        correct: 1

      - question: "Что чувствует игрок, открывая дверь за монеты?"
        answers:
          - "Скуку"
          - "Награду и прогресс"
          - "Случайность"
        correct: 1

    end:
      - type: "text"
        title: "🎉 Итог урока"
        text: |
          Теперь ты умеешь:<br>
          <ul>
            <li>использовать монеты как условие</li>
            <li>открывать двери и зоны</li>
            <li>направлять игрока по уровню</li>
          </ul>
          <h4>Монеты превратились в настоящий игровой ключ 🔑🪙</h4>

