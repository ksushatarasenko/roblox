id: 6
title: "🟩 МОДУЛЬ 6: Монеты, очки и награды"
description: "Ребёнок создаёт систему монет, очков, таймера появления предметов и награды за достижения. Это настоящие игровые механики!"

lessons:

# ============================================================
# ⭐ УРОК 54 — Зачем в играх нужны награды
# ============================================================
  - id: 54
    title: "⭐ Урок 54. Награды в играх: монеты, очки и ключи"
    shortDescription: "Разбираемся, зачем в играх нужны награды и как они мотивируют игрока."

    content:

      - type: "text"
        text: |
          Представь Obby, где: <br>

          ❌ нет монет  <br>
          ❌ нет ключей <br> 
          ❌ нет очков  <br>

          Ты просто бежишь к финишу…
          и всё 😐<br>

          Такая игра быстро становится скучной.<br>

          👉 Чтобы игроку было интересно,
          в играх существуют **награды**.

      - type: "note"
        text: |
          🧠 Награды — это причина,
          почему игрок хочет играть дальше.<br>

          Они:<br>
          🎯 мотивируют  <br>
          🧭 направляют  <br>
          🎮 делают игру интересной  
      
      - type: "text"
        title: "🪙 Монеты"
        text: |
          Монеты — это самая популярная награда в играх.<br>

          Они:<br>
          🪙 собираются <br> 
          🪙 считаются  <br>
          🪙 показываются в HUD  <br><br>

          Примеры:<br>
          • собери 10 монет <br> 
          • открой дверь за монеты  <br>
          • получи награду  
      
      - type: "hint"
        text: |
          📌 Монеты хорошо подходят
          для Obby и приключений.
      
      - type: "text"
        title: "⭐ Очки"
        text: |
          Очки показывают,
          насколько хорошо игрок справился.<br>

          Например:<br>
          ⭐ за скорость  <br>
          ⭐ за аккуратность  <br>
          ⭐ за сложность  <br>

          👉 Очки нужны,
          чтобы сравнивать результат.

      - type: "text"
        title: "🔑 Ключи"
        text: |
          Ключи — особая награда.<br>

          Они:<br>
          🔑 не считаются  <br>
          🔑 либо есть, либо нет  <br><br>

          Примеры:<br>
          • открыть дверь <br> 
          • активировать портал  <br>
          • попасть в секретную зону 
      
      - type: "text"
        title: "🧩 Чем отличаются награды?"
        text: |
          🪙 Монеты — количество <br> 
          ⭐ Очки — результат  <br>
          🔑 Ключи — доступ  <br><br>

          Хорошая игра
          часто использует несколько видов наград.
      
      - type: "text"
        title: "🎮 Как это работает в играх"
        text: |
          • Mario — монеты и очки  <br>
          • Roblox Obby — монеты и ключи  <br>
          • Аркады — очки и рекорды  <br><br>

          👉 Ты уже видел это,
          теперь будешь делать сам.
      
      - type: "note"
        text: |
          Награды — это не украшение.<br>

          Это:<br>
          🎯 цель для игрока <br> 
          🧭 направление движения <br> 
          🔁 причина продолжать игру  
      
      - type: "text"
        title: "🧪 Мини-практика: подумай как гейм-дизайнер"
        text: |
          Представь свою игру и ответь:<br>

          1️⃣ За что игрок будет получать монеты?  <br>
          2️⃣ Что он сможет открыть за ключ?  <br>
          3️⃣ Нужны ли в игре очки?  <br><br>

          ✏️ Можно просто обсудить идеи.
      
      - type: "note"
        text: |
          Мы уже умеем:<br><br>

          • показывать информацию в HUD <br> 
          • делать кнопки и меню  <br>
          • создавать Obby  <br><br>

          👉 Теперь мы наполним игру
          **наградами и смыслом**.

    
    quiz:
      - question: "Зачем в играх нужны награды?"
        answers:
          - "Чтобы усложнить игру"
          - "Чтобы мотивировать игрока играть дальше"
          - "Чтобы игра быстрее загружалась"
        correct: 1

      - question: "Какая награда чаще всего просто собирается и считается?"
        answers:
          - "Ключи"
          - "Монеты"
          - "Очки здоровья"
        correct: 1

      - question: "Для чего обычно используются очки в играх?"
        answers:
          - "Чтобы открыть дверь"
          - "Чтобы показать результат или рекорд игрока"
          - "Чтобы телепортироваться"
        correct: 1

      - question: "Чем ключ отличается от монет?"
        answers:
          - "Ключ можно тратить по одной штуке"
          - "Ключ либо есть, либо нет"
          - "Ключ всегда отображается как число"
        correct: 1

      - question: "Что может делать игра с помощью наград?"
        answers:
          - "Направлять игрока и задавать цели"
          - "Менять цвет интерфейса"
          - "Уменьшать размер карты"
        correct: 0



    end:
      - type: "text"
        title: "🎉 Итог урока"
        text: |
          Теперь ты понимаешь:<br><br>

          ✅ зачем в играх нужны награды <br> 
          ✅ чем отличаются монеты, очки и ключи <br> 
          ✅ как награды мотивируют игрока  <br><br>

          👉 В следующем уроке мы начнём
          **создавать настоящие монеты в игре**.

# ============================================================
# УРОК 55 — Создание монет и собираемых предметов
# ============================================================
  - id: 55
    title: "⭐ Урок 55. Создание монет и собираемых предметов"
    shortDescription: "Учимся создавать монеты, ключи и предметы, которые игрок может подбирать."
    # video: "https://www.youtube.com/embed/COINS55"

    content:
      - type: "text"
        text: |
          Представь игру без наград.<br>
          Ты бежишь… прыгаешь… и всё 😐<br><br>
          Монеты и предметы делают игру:<br>
          🪙 интересной<br>
          🎯 мотивирующей<br>
          🏆 награждающей за старания<br><br>
          Сегодня мы научимся создавать <b>собираемые предметы</b> — то, что игрок может подбирать во время игры.

      - type: "text"
        title: "🎯 Что такое собираемый предмет?"
        text: |
          <b>Собираемый предмет</b> — это обычный объект в мире, который:<br>
          <br>
          • реагирует на прикосновение игрока<br>
          • исчезает после подбора<br>
          • даёт награду или эффект<br><br>
          Примеры:<br>
          🪙 монета<br>
          🔑 ключ<br>
          ⭐ звезда<br>
          💎 кристалл<br>
          🗝️ секретный предмет

      - type: "text"
        title: "🧱 Шаг 1. Создаём монету"
        text:
          - "Создай <b>Part</b> → назови его <b>Coin</b>"
          - "Shape = <b>Cylinder</b>"
          - "Color = жёлтый / золотой"
          - "Material = <b>Neon</b>"
          - "Anchored = true"
          - "CanCollide = false"

      - type: "text"
        text: |
          👉 Уже выглядит как настоящая игровая монета 🪙<br>
          Она не мешает игроку и не толкает его.

      - type: "text"
        title: "🧠 Как понять, что монету тронул именно игрок?"
        text: |
          В игре много объектов, но нам важен только игрок.<br><br>
          У игрока всегда есть объект <b>Humanoid</b>.<br>
          Если он есть — значит это персонаж игрока.

      - type: "code"
        title: "✨ Код подбора монеты"
        code: |
          -- Получаем монету
          local coin = script.Parent

          -- Когда кто-то касается монеты
          coin.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")

              -- Проверяем: это игрок?
              if humanoid then
                  print("Игрок собрал монету!")

                  -- Удаляем монету из мира
                  coin:Destroy()
              end
          end)
        afterText: |
          👉 Игрок касается монеты → монета исчезает.<br>
          Это базовая, но <b>очень важная игровая механика</b>.

      - type: "text"
        title: "🪙 А где хранятся монеты игрока?"
        text: |
          Пока что мы только учимся <b>подбирать предметы</b>.<br><br>
          В следующих уроках мы:<br>
          • создадим счётчик монет<br>
          • покажем их в HUD<br>
          • будем открывать двери за монеты<br><br>
          Сейчас главное — понять сам принцип подбора.

      - type: "code"
        title: "🎨 Дополнение: вращающаяся монета (по желанию)"
        code: |
          local coin = script.Parent

          -- Постоянное вращение монеты
          task.spawn(function()
              while true do
                  coin.Orientation += Vector3.new(0, 5, 0)
                  task.wait(0.05)
              end
          end)
        afterText: |
          👉 Простое вращение делает монету заметнее и «живой».

      - type: "text"
        title: "🧪 Мини-квест — попробуй сам"
        text: |
          Попробуй усложнить механику:<br><br>
          1️⃣ Сделай <b>красную монету</b>, которая даёт бонус<br>
          2️⃣ Сделай <b>ключ</b>, который нельзя собрать дважды<br>
          3️⃣ Сделай предмет, который исчезает через 10 секунд, если его не подобрали<br>
          4️⃣ Сделай предмет, который появляется только после нажатия кнопки

    quiz:
      - question: "Что такое собираемый предмет?"
        answers:
          - "Украшение уровня"
          - "Объект, который игрок может подобрать"
          - "Часть интерфейса"
        correct: 1

      - question: "Как мы понимаем, что монету коснулся игрок?"
        answers:
          - "По цвету объекта"
          - "По наличию Humanoid"
          - "По названию Part"
        correct: 1

      - question: "Почему у монеты CanCollide = false?"
        answers:
          - "Чтобы она исчезала быстрее"
          - "Чтобы игрок не упирался в неё"
          - "Чтобы она вращалась"
        correct: 1

      - question: "Что происходит с монетой после подбора?"
        answers:
          - "Она меняет цвет"
          - "Она телепортируется"
          - "Она удаляется из мира"
        correct: 2

      - question: "Зачем в играх нужны монеты?"
        answers:
          - "Для красоты"
          - "Чтобы мотивировать игрока и задавать цели"
          - "Чтобы увеличить размер карты"
        correct: 1

    end:
      - type: "text"
        title: "🎉 Итог урока"
        text: |
          Теперь ты умеешь:<br>
          <ul>
            <li>создавать собираемые предметы</li>
            <li>определять игрока через Humanoid</li>
            <li>реагировать на касание</li>
            <li>удалять предмет после подбора</li>
            <li>делать первые игровые награды</li>
          </ul>
          <h4>Это основа экономики и прогресса в любой игре 🎮🪙</h4>


  # ============================================================
# УРОК 56 — Счётчик монет и очков (HUD + логика)
# ============================================================
  - id: 56
    title: "⭐ Урок 56. Счётчик монет и очков"
    shortDescription: "Учимся хранить монеты игрока и показывать их в HUD."
    # video: "https://www.youtube.com/embed/COINS56"

    content:
      - type: "text"
        text: |
          Монеты без счётчика — как копилка без числа 😄<br><br>
          Игроку важно видеть:<br>
          🪙 сколько он уже собрал<br>
          🎯 насколько он близок к цели<br><br>
          Сегодня мы соединим <b>логику</b> и <b>интерфейс</b>:<br>
          монеты будут считаться и отображаться в HUD.

      - type: "text"
        title: "🧠 Где хранить количество монет?"
        text: |
          Количество монет должно храниться <b>у игрока</b>.<br><br>
          Для этого мы используем:<br>
          <b>IntValue</b> — число, которое можно увеличивать.

      - type: "steps"
        title: "📦 Шаг 1. Создаём счётчик монет"
        items:
          - "Открой <b>ServerScriptService</b>"
          - "Создай <b>Script</b>"
          - "Он будет добавлять игроку значение Coins"

      - type: "code"
        title: "✨ Код: создаём Coins у игрока"
        code: |
          game.Players.PlayerAdded:Connect(function(player)
              local coins = Instance.new("IntValue")
              coins.Name = "Coins"
              coins.Value = 0
              coins.Parent = player
          end)

      - type: "text"
        title: "🪙 Шаг 2. Увеличиваем монеты при подборе"
        text: |
          Теперь вернёмся к монете из прошлого урока<br>
          и добавим увеличение счётчика.

      - type: "code"
        title: "✨ Обновлённый код монеты"
        code: |
          local coin = script.Parent

          coin.Touched:Connect(function(hit)
              local character = hit.Parent
              local humanoid = character:FindFirstChild("Humanoid")

              if humanoid then
                  local player = game.Players:GetPlayerFromCharacter(character)
                  if player and player:FindFirstChild("Coins") then
                      player.Coins.Value += 1
                  end

                  coin:Destroy()
              end
          end)
        afterText: |
          👉 Теперь монета не просто исчезает,<br>
          а реально увеличивает прогресс игрока.

      - type: "text"
        title: "🖥️ Шаг 3. Показываем монеты в HUD"
        text: |
          В <b>ScreenGui</b> добавь <b>TextLabel</b><br>
          с текстом, например: <b>Coins: 0</b>

      - type: "code"
        title: "✨ LocalScript для HUD (TextLabel)"
        code: |
          local player = game.Players.LocalPlayer
          local coins = player:WaitForChild("Coins")

          local label = script.Parent

          label.Text = "Coins: " .. coins.Value

          coins.Changed:Connect(function()
              label.Text = "Coins: " .. coins.Value
          end)
        afterText: |
          👉 HUD автоматически обновляется,<br>
          когда игрок собирает монеты.

    quiz:
      - question: "Где мы храним количество монет игрока?"
        answers:
          - "В монете"
          - "В Player через IntValue"
          - "В Workspace"
        correct: 1

      - question: "Какой объект подходит для хранения числа?"
        answers:
          - "BoolValue"
          - "StringValue"
          - "IntValue"
        correct: 2

      - question: "Почему HUD обновляется автоматически?"
        answers:
          - "Потому что мы используем событие Changed"
          - "Потому что монета исчезает"
          - "Потому что TextLabel обновляется сам"
        correct: 0

      - question: "Какой скрипт используется для HUD?"
        answers:
          - "Script"
          - "LocalScript"
          - "ModuleScript"
        correct: 1

      - question: "Что чувствует игрок, когда видит рост монет?"
        answers:
          - "Путаницу"
          - "Прогресс и награду"
          - "Замедление игры"
        correct: 1

    end:
      - type: "text"
        title: "🎉 Итог урока"
        text: |
          Теперь ты умеешь:<br>
          <ul>
            <li>хранить монеты у игрока</li>
            <li>увеличивать их при подборе</li>
            <li>отображать прогресс в HUD</li>
          </ul>
          <h4>Это основа любой игровой экономики 🎮🪙</h4>

  # ============================================================
# УРОК 57 — Появление монет по таймеру
# ============================================================
  - id: 57
    title: "⭐ Урок 57. Появление монет по таймеру"
    shortDescription: "Учимся автоматически создавать монеты через время."
    # video: "https://www.youtube.com/embed/COINS57"

    content:
      - type: "text"
        text: |
          Что если монеты не лежат вечно?<br><br>
          Они появляются… исчезают…<br>
          и игрок должен успеть их собрать ⏳<br><br>
          Сегодня мы научимся создавать монеты<br>
          <b>по таймеру</b>.

      - type: "text"
        title: "⏱️ Зачем нужен таймер?"
        text: |
          Таймер делает игру:<br>
          🎮 динамичной<br>
          🧠 напряжённой<br>
          🎯 интересной<br><br>
          Игрок думает:<br>
          «Успею или нет?»

      - type: "steps"
        title: "📦 Шаг 1. Точка появления монеты"
        items:
          - "Создай <b>Part</b> → назови <b>CoinSpawn</b>"
          - "Поставь его там, где должна появляться монета"
          - "Anchored = true"
          - "Transparency = 1"

      - type: "text"
        title: "🪙 Шаг 2. Шаблон монеты"
        text: |
          Создай одну монету <b>CoinTemplate</b><br>
          и помести её в <b>ServerStorage</b>.<br><br>
          Она будет использоваться как шаблон.

      - type: "code"
        title: "✨ Код появления монет по таймеру"
        code: |
          local ServerStorage = game:GetService("ServerStorage")
          local coinTemplate = ServerStorage:WaitForChild("CoinTemplate")
          local spawnPoint = workspace:WaitForChild("CoinSpawn")

          while true do
              task.wait(5) -- каждые 5 секунд

              local newCoin = coinTemplate:Clone()
              newCoin.Parent = workspace
              newCoin.Position = spawnPoint.Position
          end
        afterText: |
          👉 Каждые 5 секунд появляется новая монета.

      - type: "text"
        title: "🧪 Мини-квест"
        text: |
          Попробуй улучшить механику:<br><br>
          1️⃣ Сделай случайную позицию появления<br>
          2️⃣ Сделай ограничение: не больше 3 монет<br>
          3️⃣ Сделай редкую золотую монету<br>
          4️⃣ Сделай таймер быстрее со временем

    quiz:
      - question: "Зачем монеты появляются по таймеру?"
        answers:
          - "Чтобы замедлить игру"
          - "Чтобы сделать игру динамичнее"
          - "Чтобы убрать HUD"
        correct: 1

      - question: "Где лучше хранить шаблон монеты?"
        answers:
          - "В Workspace"
          - "В ServerStorage"
          - "В PlayerGui"
        correct: 1

      - question: "Что делает Clone()?"
        answers:
          - "Удаляет объект"
          - "Создаёт копию"
          - "Меняет цвет"
        correct: 1

      - question: "Какой инструмент мы используем для времени?"
        answers:
          - "if"
          - "while + wait"
          - "Touched"
        correct: 1

      - question: "Что чувствует игрок при ограниченном времени?"
        answers:
          - "Скуку"
          - "Напряжение и интерес"
          - "Потерю управления"
        correct: 1

    end:
      - type: "text"
        title: "🎉 Итог урока"
        text: |
          Теперь ты умеешь:<br>
          <ul>
            <li>создавать предметы по таймеру</li>
            <li>использовать шаблоны объектов</li>
            <li>делать игру динамичной</li>
          </ul>
